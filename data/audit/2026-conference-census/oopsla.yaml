- title: 'Prosecutor: Bayesian Counterfactual Fault Localization'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 431a8095-1de3-49e6-b183-f0cd5f952f5d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Bayesian reasoning has emerged as a promising approach to fault localization, where the introduction of errors
    and their subsequent propagation through faulty executions is treated as a stochastic process. One can then perform Bayesian
    inference on a probabilistic model encoding the program execution to associate individual statements and values with a
    posterior probability of being erroneous. In this paper, we propose a new graph representation that effectively models
    error propagation through failing program executions. This structure, which we call the Error Propagation Graph (EPG),
    extends prior probabilistic approaches by incorporating richer inter-procedural relationships and accounting for the influence
    of unexplored control-flow branches that may affect variable values. We also show how EPGs can be constructed efficiently
    and compactly, and how this structure enables the selection of a set of counterfactual experiments, each involving artificially
    flipping a suspicious branch predicate at runtime and observing its downstream effect on the test outcome. The results
    of these experiments provide additional evidence that can be incorporated into the EPG to confirm or refute the model’s
    initial suspiciousness estimates. We have implemented this technique in a tool named Prosecutor and evaluated it on 470
    buggy versions of 13 projects from the Defects4J benchmark suite. Our experimental evaluation shows that Prosecutor places
    40% of the true fault locations within its top-3 predictions. The technique also significantly outperforms a diverse set
    of baselines by identifying at least 10%, 11%, 15%, and 19% more buggy statements than each of the baselines in its top-1,
    top-3, top-5, and top-10 predictions, respectively.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/95/Prosecutor-Bayesian-Counterfactual-Fault-Localization
