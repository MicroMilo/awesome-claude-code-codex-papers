- title: 'Timeline: Adding the time dimension to spreadsheets'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 1b802e75-7951-457a-983e-ef750c073b9c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Spreadsheets make it easy to express computations over two-dimensional data, but two dimensions are not enough
    to express rich computations with time such as physics simulations, agent-based models, analyses of financial data, or
    interactive systems. We present Timeline, a system that adds discrete time to spreadsheets. The remarkable insight from
    our work is that a large number of advanced programming language concepts can be directly applied in the context of spreadsheets
    with time. Timeline draws from \emph{dataflow languages} to express computations over time, \emph{coeffect systems} to
    ensure bounded memory usage, \emph{functional reactive programming} to support interactivity, \emph{grammars of graphics}
    to support composable visualizations, and \emph{typed holes} for inserting cell references in the formula editor. In this
    paper, we provide an overview of the Timeline design and discuss how it adapts the aforementioned programming language
    innovations for the context of spreadsheets. We formalize the evaluation of spreadsheets with discrete time through a
    \emph{core calculus}, describe a coeffect-based static analysis that determines the required number of past values and
    prove that the optimization is sound. More broadly, this paper shows that established programming language ideas can often
    be productively used outside of their original domain.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/128/Timeline-Adding-the-time-dimension-to-spreadsheets
