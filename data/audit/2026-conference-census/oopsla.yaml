- title: 'InspectCoder: Dynamic Analysis-Driven Self Repair through interactive LLM-Debugger Collaboration'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 3cda72dc-0e38-4b8d-9736-faaad13abd69
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Models (LLMs) frequently generate buggy code with complex logic errors that are challenging to
    diagnose. While existing LLM-based self-repair approaches conduct intensive static semantic analysis or rely on superficial
    execution logs, they miss the in-depth runtime behaviors that often expose bug root causes—lacking the interactive dynamic
    analysis capabilities that make human debugging effective. We present InspectCoder, the first agentic program repair system
    that empowers LLMs to actively conduct dynamic analysis via interactive debugger control. Our dual-agent framework enables
    strategic breakpoint placement, targeted state inspection, and incremental runtime experimentation within stateful debugger
    sessions. Unlike existing methods that follow fixed log collection procedures, InspectCoder adaptively inspects and perturbs
    relevant intermediate states at runtime, and leverages immediate process rewards from debugger feedback to guide multi-step
    reasoning, transforming LLM debugging paradigm from blind trial-and-error into systematic root cause diagnosis. We conduct
    comprehensive experiments on two challenging self-repair benchmarks: BigCodeBench-R and LiveCodeBench-R. InspectCoder
    achieves 5.10%–60.37% relative improvements in repair accuracy over the strongest baseline, while delivering 1.67x-2.24x
    superior bug-fix efficiency respectively. We also contribute InspectWare, an open-source middleware that abstracts debugger
    complexities and maintains stateful debugging sessions across mainstream Python testing frameworks. Our work provides
    actionable insight into the interactive LLM-debugger systems, demonstrating the significant potential of LLM-driven dynamic
    analysis for automated software engineering.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/38/InspectCoder-Dynamic-Analysis-Driven-Self-Repair-through-interactive-LLM-Debugger-Co
