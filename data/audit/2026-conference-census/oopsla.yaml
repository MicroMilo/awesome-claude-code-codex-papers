- title: Transitive, Abstract, and Class Polymorphic Immutability
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 18b18816-b399-421e-bd4e-00a62227e590
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'State mutations can often lead to silent program errors, including broken invariants and security vulnerabilities.
    Object-oriented languages offer basic mechanisms to prevent mutation; however, enforcing desired guarantees remains challenging.
    Two such guarantees are transitive immutability, which disallows mutation along all reachable objects from a reference,
    and abstract immutability, which permits safe internal mutation of otherwise immutable objects. Furthermore, introducing
    readonly references to support subtype polymorphism often complicates the soundness of the type system. The integration
    of immutability into a class hierarchy introduces challenges, primarily manifesting as duplicated code between mutable
    and immutable variants. In this paper, we present Precise Immutability for Classes and Objects (PICO), a type system that
    enforces transitive abstract immutability with readonly references. PICO introduces novel viewpoint adaptation rules to
    achieve transitivity. These rules prevent unsoundness caused by mutable and immutable cross-type aliasing, a long-standing
    issue for systems combining immutability and assignability. Additionally, PICO formally defines the abstract state, which
    allows developers to exclude parts of the object graph from the immutability guarantee. PICO provides three immutability
    properties: abstract immutability, safe readonly, and concrete immutability within a single system, by selecting corresponding
    viewpoint adaptation rules. Finally, the system supports safe class mutability polymorphism: one class can express both
    mutable and immutable uses, avoiding duplicate mutable/immutable class variants while also enabling backward-compatible
    retrofitting of existing class hierarchies. We formalize PICO and prove its type soundness, along with its three immutability
    properties, in the Rocq proof assistant. We also implement a type checker for Java using the Checker Framework. We evaluate
    this implementation on the Java Collections Framework in OpenJDK 17 and other benchmarks, covering approximately 26,000
    non-comment lines of code. The results demonstrate that PICO effectively enforces immutability guarantees and can successfully
    retrofit existing libraries without duplicating code.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/117/Transitive-Abstract-and-Class-Polymorphic-Immutability
  abstract_sha256: f4741d7d30cbb78b0974f077cfddc8ada0e35988c368b03cac9a3f4757e00664
