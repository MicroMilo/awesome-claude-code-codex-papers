- title: Quantum Monte Carlo Estimation via Probabilistic Programming
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 987564c0-1f15-4461-8664-0b098797d7c5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Monte Carlo methods are fundamental to finance, system verification, and scientific simulation, but converge
    slowly: achieving an additive error of $\epsilon$ requires $O(1/\epsilon^2)$ samples. Quantum Amplitude Estimation (QAE)
    offers a quadratic speedup by encoding the target probabilistic model into a quantum circuit. However, constructing such
    a circuit demands low-level quantum expertise, and existing tools for this task all sacrifice at least one of generality,
    usability, or efficiency. To address these, we design QPPL (Quantum Probabilistic Programming Language), a simple imperative
    language, and a compiler that translates probabilistic programs into quantum circuits. The key insight is that the circuit
    construction amounts to specifying a probability distribution, precisely the task that \emph{probabilistic programming}
    addresses. QPPL achieves \emph{generality} by supporting joint distributions, conditional updates, dynamic probabilities,
    and real-valued expectations in a single language; \emph{usability} by offering a sequential, imperative syntax with named
    variables and direct arithmetic that hides all quantum details; and \emph{efficiency} by modularly compiling each construct
    into reversible circuit primitives, achieving scalable circuit synthesis. We prove that the compilation is semantics-preserving.
    On benchmarks spanning finance and probabilistic model checking, QPPL is the only tool that covers all benchmarks, while
    producing circuits with up to 8.8× fewer gates and 26× shallower depth than existing tools.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/89/Quantum-Monte-Carlo-Estimation-via-Probabilistic-Programming
  abstract_sha256: a0fbf751f33aeeb7a1e53275e657ea3522dfb6b93547d8555578e8e803f4abaa
