- title: Tracking Borrows with Regular Expressions
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0a1af5dd-a6ff-4ebc-9804-53016ccd4bd2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Safe systems languages such as Rust enforce an ownership discipline through types: every value has a unique owner,
    and the type systems tracks borrows—references that provide temporary access to values without transferring their ownership.
    Borrow checking is a static analysis ensuring that no borrow outlives its owner and that no two mutable borrows are aliases,
    preventing dangling references and data races at compile time. Move, a smart contract language deployed on Sui and Aptos
    blockchains, adopts this model but restricts references to structured access paths rooted in local variables, eliminating
    the need for complex lifetime tracking mechanisms such as lifetime annotations. We present a novel type system for Move’s
    borrow checker in which access paths are tracked by regular expressions. In this model, Brzozowski derivatives make it
    possible to express the reachability consequences of borrowing operations, Kleene star summarises borrow chains from function
    calls and loops, and the aliasing check reduces to the decidable regex emptiness. The design of the type system with regular
    expression-based borrow tracking extends naturally to vectors and enumeration types. We mechanised the type system in
    Lean with a machine-checked soundness proof and an executable algorithmic type checker tested against the production Move
    compiler. The proposed design of a borrow checker has been implemented in the Move bytecode verifier for Sui blockchain,
    where it superseded the original borrow analyser while maintaining full backwards compatibility.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/147/Tracking-Borrows-with-Regular-Expressions
