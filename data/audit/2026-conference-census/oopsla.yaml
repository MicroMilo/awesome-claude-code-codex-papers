- title: 'Mixtris: Mechanised Higher-Order Separation Logic for Mixed Choice Multiparty Message Passing'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fb25fe85-f23f-42f4-9b76-cee6a2e3e63c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Mixed choice multiparty message passing is an expressive concurrency programming paradigm where components use
    non-determinism to choose between concurrent options for sending and receiving messages. This flexibility makes it possible
    to program advanced algorithms, such as leader election protocols, succinctly. We present Mixtris, a mechanised higher-order
    separation logic for reasoning about functional correctness of higher-order imperative programs with mixed choice multiparty
    message passing. Mixtris builds upon recent work on separation logic for (non-mixed choice) multiparty message-passing
    programs, by drawing inspiration from session type systems for mixed choice multiparty message-passing programs. Mixtris
    is the first program logic for mixed choice multiparty message passing. We prove soundness of Mixtris using a novel model
    of our mixed choice multiparty protocols. We demonstrate how Mixtris can be used to formally reason about challenging
    examples, including some leader election protocols such as Chang and Roberts’ ring leader election protocol. All the results
    in the paper (both meta-theory and examples) have been formalised in the Rocq proof assistant on top of the Iris program
    logic framework.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/25/Mixtris-Mechanised-Higher-Order-Separation-Logic-for-Mixed-Choice-Multiparty-Message
