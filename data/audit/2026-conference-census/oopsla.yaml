- title: 'OBsmith: LLM-powered JavaScript Obfuscator Testing'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c09c4583-3d85-44c2-b3bf-4f50eab61ded
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'JavaScript obfuscators are widely deployed to protect intellectual property and resist reverse engineering, yet
    their correctness has been largely overlooked compared to performance and resilience. Existing evaluations typically measure
    resistance to deobfuscation, leaving the critical question of whether obfuscators preserve program semantics unanswered.
    Incorrect transformations can silently alter functionality, compromise reliability, and erode security—undermining the
    very purpose of obfuscation. To address this gap, we present OBsmith, a novel framework to systematically test JavaScript
    obfuscators using large language models (LLMs). OBsmith leverages LLMs to generate program sketches—abstract templates
    capturing diverse language constructs, idioms, and corner cases—which are instantiated into executable programs and subjected
    to obfuscation under different configurations. Besides LLM-powered sketching, OBsmith also employs a second source: automatic
    extraction of skeletons from real programs. This extraction path enables more focused testing of project-specific features
    and lets developers inject domain knowledge into the resulting test cases. OBsmith uses two techniques to derive test
    oracles: \textit{(i)} differential testing, which treats the original program as ground truth and instruments control-
    and data-flow to detect semantic divergences, failures, or crashes; and \textit{(ii)} metamorphic testing, which applies
    semantics-preserving transformations to the original program and checks if obfuscation violates expected behavior. We
    evaluate OBsmith on two widely used obfuscators, Obfuscator.IO and JS-Confuser, generating 600 sketches using six popular
    LLMs. OBsmith fills these sketches and generates over 3,000 candidate programs and obfuscates them across seven obfuscation
    configurations. OBsmith uncovers 11 previously unknown correctness bugs. Under an equal program budget, five general purpose
    state-of-the-art JavaScript fuzzers (FuzzJIT, Jsfunfuzz, Superion, DIE, Fuzzilli) failed to detect these issues, highlighting
    OBsmith’s complementary focus on obfuscation-induced misbehavior. An ablation shows that all components except our generic
    MRs contribute to at least one bug class; the negative MR result suggests the need for obfuscator-specific metamorphic
    relations. Our results also seed discussion on how to balance obfuscation presets and performance cost. We envision OBsmith
    as an important step towards automated testing and quality assurance of obfuscators and other semantic-preserving toolchains.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/5/OBsmith-LLM-powered-JavaScript-Obfuscator-Testing
