- title: Semi-Declarative Language for Combinatorial Search
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0fd27f67-9a92-4962-a157-b46bf1ece806
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Combinatorial search—finding solutions that meet constraints within an exponentially large space of candidates—underpins
    problems from hardware verification to scheduling and combinatorial design. The most successful approach in practice is
    Propositional Satisfiability (SAT) solving, but modelling a problem for a SAT solver requires manually translating high-level
    requirements into conjunctions of boolean clauses, a tedious step that sacrifices clarity and modularity. Answer Set Programming
    (ASP) offers a higher-level alternative, with a rule-based language whose variables and finite-domain reasoning yield
    more compact problem descriptions that can be automatically compiled into low-level solver input. Yet, ASP has its own
    shortcomings: its semantics, defined via a notion of stable models, is hard to build intuition for; it does not allow
    arbitrary first-order logic formulas as constraints; and its programs tend to be monolithic, making modular design and
    reuse difficult. We propose SetLaH!, a semi-declarative language for combinatorial search that addresses the shortcomings
    of both SAT and ASP. A SetLaH! program is a sequence of stratified blocks, each containing rules that define the search
    space and arbitrary first-order logic constraints that prune it. This block structure enables modular problem decomposition,
    allowing for an intuitive semantics: candidate solutions are generated and filtered block by block. We built a compiler
    from SetLaH! programs into ASP, allowing us to take full advantage of the existing efficient ASP solvers, while also automatically
    optimising the generated encodings. Our empirical evaluation demonstrates that SetLaH! offers substantially more concise
    and intuitive specifications for common combinatorial search problems, and its compiled ASP encodings can significantly
    outperform SAT-based tools.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/157/Semi-Declarative-Language-for-Combinatorial-Search
  abstract_sha256: af2154735d85927c8b1b9bd8774d14f98d33db466d3426ad0c8d6129601af7f5
