  full_text_scan: metadata-filtered
  official_record_id: 118dbb05-ab22-4e8b-af13-3e1cd74eb561
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Probabilistic programming languages (PPLs) are an expressive and intuitive means of representing complex probability
    distributions. In that realm, languages like Dice target an important class of probabilistic programs: those whose probability
    distributions are discrete. Discrete distributions are common in many fields, including text analysis, network verification,
    artificial intelligence, and graph analysis. Another important feature in the world of probabilistic modeling are nondeterministic
    choices as are, for instance, found in Markov Decision Processes (MDPs) which play a major role in reinforcement learning.
    Modern PPLs usually lack support for nondeterminism. We address this gap with the introduction of noDice, which extends
    the discrete probabilistic program inference engine Dice. noDice performs inference on loop-free programs by constructing
    an MDP so that the distributions modeled by the program correspond to schedulers in the MDP. Furthermore, decision diagrams
    are used as an intermediate step to exploit the program structure and drastically reduce the state space of the MDP, which
    can speed up inference.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/16/noDice-Inference-for-Discrete-Probabilistic-Programs-with-Nondeterminism-and-Conditi
