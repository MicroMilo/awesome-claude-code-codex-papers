- title: 'Real-to-Sim Generation: Synthesizing Scenario Programs from Real-World Data via Constraint Solving'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c7ec0dbd-4121-4821-9257-adb31a4592a0
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The demand for synthetic training data is hindered by the sim-to-real gap, as current data-driven and LLM-based
    generators often produce physically implausible scenarios. To address this, we propose R2SGEN, a Real-to-Sim framework
    that synthesizes structured scenario programs from real-world data. To overcome the combinatorial explosion and intractability
    of monolithic Satisfiability Modulo Theories (SMT) encoding, we introduce a decoupled synthesis strategy. This approach
    separates the discrete structural program search from continuous geometric resolution using lightweight, atomic SMT constraints.
    Furthermore, we significantly accelerate the search process by integrating two tailored pruning mechanisms: Common Prefix
    Abstraction-based pruning for Breadth-First Search and Branch-and-Bound for Depth-First Search. We evaluate R2SGEN on
    20 real-world scenes of varying complexity from the nuScenes dataset. Experimental results demonstrate that our method
    guarantees semantic correctness and structural realism, significantly outperforming existing baselines. Both proposed
    search paradigms exhibit complementary advantages, proving highly efficient and scalable for high-complexity synthetic
    data generation.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/153/Real-to-Sim-Generation-Synthesizing-Scenario-Programs-from-Real-World-Data-via-Const
