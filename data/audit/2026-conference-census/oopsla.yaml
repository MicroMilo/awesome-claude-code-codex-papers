  full_text_scan: metadata-filtered
  official_record_id: 9df95295-f1f4-4a94-8583-85038cd61633
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Decidable automation is a key feature of program verification tools, which makes them easier for non-expert developers
    to use and understand. Unfortunately, decidable fragments of logic are very restrictive, and not ideal for the expression
    of idiomatic programs. The decidable Extended EPR fragment, combined with an encoding technique called relational abstraction
    , has seen wide use for its ability to handle both quantifiers and uninterpreted functions. However, the complexity of
    the relational abstraction encoding, combined with its inherent incompleteness, still poses a significant obstacle to
    non-experts. In this paper, we show that Extended EPR and relational abstraction can be deployed to achieve decidable,
    quantified verification within a familiar, principled domain: a higher-order, purely-functional programming language.
    We observe that, by defining the semantics of our language in terms of partial functions, we obtain a well-behaved, three-valued
    logic that matches the behavior of the relational abstraction encoding while hiding its complexity. We demonstrate that
    our prototype implementation can ergonomically replicate EPR-based program verification benchmarks and verify recursive
    programs on inductive datatypes.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/59/Effectively-Propositional-Higher-Order-Functional-Programming
  abstract_sha256: af3f3b10b00546e42469d03288cab8c01778c131fc59fd0ac7260ce049695053
