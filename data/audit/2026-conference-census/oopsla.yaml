- title: 'When FPGA Meets Dataflow Analysis: An Explorative Step'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6e38898b-1879-4ab7-a531-759182929a30
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Set-based (a.k.a. bit-vector-based) dataflow analysis is a fundamental building block for many static analysis
    tasks, and significant effort has been devoted to accelerating it. Existing acceleration approaches address the problem
    from a software perspective, leveraging various general-purpose computing platforms, such as single- and multi-core CPUs,
    GPUs, and distributed systems. In contrast, a hardware-centric approach—designing specialized hardware that directly accelerates
    dataflow analysis—remains unexplored. Motivated by this gap and out of pure research curiosity, we conduct a preliminary
    exploration of designing specialized hardware for dataflow analysis using FPGAs, which are highly customizable and well
    suited for rapidly prototyping domain-specific hardware. As a first step toward hardware-accelerated dataflow analysis,
    we focus on the widely used intra-procedural dataflow analysis. However, we find that designing specialized hardware even
    for this setting is already challenging: a straightforward FPGA implementation of the classical worklist algorithm is
    infeasible, because its space complexity grows superlinearly with procedure size, quickly exhausting the FPGA’s limited
    high-speed on-chip memory when analyzing large procedures. To address this challenge, we introduce FpgaFlow, a specialized
    hardware design for dataflow analysis that (1) overcomes the spatial infeasibility challenge by leveraging the distributivity
    of set-based dataflow analysis to achieve linear spatial scalability, and (2) accelerates analysis through hardware-specific
    parallelism—pipelining with data forwarding and BRAM partitioning and replication. We evaluate FpgaFlow on diverse and
    popular real-world Java projects (averaging 32.5k+ GitHub stars) using two representative dataflow analyses—live variables
    and reaching definitions—and compare it against their software implementations in a state-of-the-art Java static analyzer
    Tai-e. In terms of correctness, FpgaFlow produces exactly the same analysis results as Tai-e, amounting to 75 billion
    bits. In terms of acceleration, even on a modest Xilinx Zynq-7020 FPGA (55 MHz), FpgaFlow achieves an average speedup
    of 15.45x for live variables and 12.32x for reaching definitions compared with Tai-e running on a server-grade CPU (2.20-3.00
    GHz). We hope this work offers useful insights toward future FPGA-accelerated static analysis.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/134/When-FPGA-Meets-Dataflow-Analysis-An-Explorative-Step
