- title: Metamorphic Testing for Infrastructure-as-Code Engines
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5d39c1f7-26a2-430c-a98e-dd430ff6a3aa
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Infrastructure-as-Code (IaC) engines, such as Terraform, OpenTofu, and Pulumi, automate the provisioning and
    management of cloud resources. They parse IaC specifications and orchestrate the required actions, making them the backbone
    of modern clouds, and critical to the reliability of both the underlying infrastructure and the software that depends
    on it. Despite this importance, this class of systems has received little attention: prior work largely targets the correctness
    of IaC programs rather than the IaC engines themselves. Existing test suites rely on manually written oracles and struggle
    to expose faults that manifest across multiple executions, leaving a significant reliability gap. We present EMIaC, a
    metamorphic testing framework for IaC engines. EMIaC defines metamorphic relations as graph-based transformations of IaC
    programs and checks invariants across executions of the original and transformed programs. A central novelty is our use
    of \emph{e-graphs} in software testing, as both a test-input generator and an equivalence oracle. E-graphs compactly represent
    program equivalences, enabling the systematic generation of large spaces of equivalent IaC programs. To ground these relations,
    we analyze 43,593 real-world Terraform programs and show that IaC dependency graphs are typically small and sparse, making
    e-graphs a natural fit. Evaluating EMIaC on Pulumi, Terraform, and OpenTofu, we show that it complements existing test
    suites by exercising engine-critical code paths and covering 98 previously untested statements in Terraform and 1,313
    in Pulumi. EMIaC also uncovers previously unknown issues in all three test suites, improving their adequacy. Three test
    cases have been merged into Terraform’s main branch, and Pulumi has merged a specification fix.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/27/Metamorphic-Testing-for-Infrastructure-as-Code-Engines
  abstract_sha256: 97bf7969c75d0179d4443f13fd9a02675470f25c427ed5f64a9ed54967e18094
