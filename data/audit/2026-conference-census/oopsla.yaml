- title: Handling Exceptions and Effects with Automatic Resource Analysis
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5560d7a0-0a78-4afc-888f-e101c4a33f96
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: There exist many techniques for automatically deriving parametric resource (or cost) bounds by analyzing the source
    code of a program. These techniques work effectively for a large class of programs and language features. However, non-local
    transfer of control as needed for exception handlers or algebraic effects has remained a challenge. This paper presents
    the first automatic resource bound analysis that supports non-local control transfer between exceptions or effects and
    their handlers. The analysis is an extension of type-based automatic amortized resource analysis (AARA), which automates
    the potential method of amortized analysis. It is presented for a simple functional language with lists and linear potential
    functions. However, the ideas are directly applicable to richer settings and implemented for SML and polynomial potential
    functions. Apart from the new type system for exceptions and algebraic effects, a main contribution is a novel syntactic
    type-soundness theorem that establishes the correctness of the derived bounds with respect to a stack-based abstract machine.
    An experimental evaluation shows that the new analysis is capable of analyzing programs that cannot be analyzed by existing
    methods and that the efficiency overhead of supporting exception and effect handlers is low.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/8/Handling-Exceptions-and-Effects-with-Automatic-Resource-Analysis
