- title: 'CapOpt: Capability-aware Superoptimization for Secure and Provably Faster Code'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5cf4c67b-ed19-4221-b940-def6d52cac28
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Superoptimization is a powerful code optimization technique that generates optimized instruction sequences by
    exploring the space of instruction-level transformations. However, existing superoptimizers assume that pointers and integers
    are interchangeable, an assumption that no longer holds in memory-security-enhanced architectures like CHERI, where pointers
    are represented as metadata-rich capabilities with enforced bounds, permissions, and provenance. This semantic change
    breaks many traditional optimizations and forces CHERI compilers to adopt conservative strategies that sacrifice performance
    for safety. We present CapOpt, the first superoptimization framework that explicitly incorporates capability semantics
    into both its search space and correctness model. CapOpt introduces Provenance-Guided Stratified Synthesis (PGSS), a synthesis
    strategy that structures the search space around capability-aware abstractions and uses provenance-based reasoning to
    eliminate unsafe transformations. We also define a capability-aware equivalence model that extends conventional functional
    correctness to include metadata integrity. We evaluated CapOpt on an ARM-based CHERI hardware platform and the CHERI-RISC-V
    simulator. Experimental results show that CapOpt improves performance by up to 4.1% over the existing CHERI-LLVM toolchain,
    while strengthening security by tightening pointer bounds and permissions.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/107/CapOpt-Capability-aware-Superoptimization-for-Secure-and-Provably-Faster-Code
