- title: 'SymGPT: Auditing Smart Contracts via Combining Symbolic Execution with Large Language Models'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d003fa97-b9c1-447f-9aec-36ebc2921ce6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: To govern smart contracts running on Ethereum, multiple Ethereum Request for Comment (ERC) standards have been
    developed, each defining a set of rules governing contract behavior. Violating these rules can cause serious security
    issues and financial losses, signifying the importance of verifying ERC compliance. Today’s practices of such verification
    include manual audits, expert-developed program-analysis tools, and large language models (LLMs), all of which remain
    ineffective at detecting ERC rule violations. This paper introduces SymGPT, a tool that combines LLMs with symbolic execution
    to automatically verify smart contracts’ compliance with ERC rules. We begin by empirically analyzing 132 ERC rules from
    three major ERC standards, examining their content, security implications, and natural language descriptions. Based on
    this study, SymGPT instructs an LLM to translate ERC rules into a defined EBNF grammar, synthesizes constraints from the
    translated rules to model potential rule violations, and performs symbolic execution for violation detection. Our evaluation
    shows that SymGPT identifies 5,783 ERC rule violations in 4,000 realworld contracts, including 1,375 violations with clear
    attack paths for financial theft. Furthermore, SymGPT outperforms six automated techniques and a security-expert auditing
    service, underscoring its superiority over current smart contract analysis methods.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/18/SymGPT-Auditing-Smart-Contracts-via-Combining-Symbolic-Execution-with-Large-Language
