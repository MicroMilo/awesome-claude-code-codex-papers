- title: Hunting CUDA Bugs at Scale with cuFuzz
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3798231
  official_record_id: cab68d7b-f82f-455a-a984-59fef2e82839
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'GPUs play an increasingly important role in modern software. However, the heterogeneous host-device execution
    model and expanding software stack make GPU programs prone to memory-safety and concurrency bugs that evade static analyses.
    While fuzz-testing, combined with dynamic error checking tools, offers a plausible solution, it remains underutilized
    for GPUs. In this work, we identify three main obstacles limiting prior GPU fuzzing efforts: (1) kernel-level fuzzing
    leading to false positives, (2) lack of device-side coverage-guided feedback, and (3) incompatibility between coverage
    and sanitization tools. We present cuFuzz, the first CUDA-oriented fuzzer that makes GPU fuzzing practical by addressing
    these obstacles. cuFuzz uses whole program fuzzing to avoid false positives from independently fuzzing device-side kernels.
    It leverages NVBit to instrument device-side instructions and merges the resultant coverage with compiler-based host coverage.
    Finally, cuFuzz decouples sanitization from coverage collection by executing host- and device-side sanitizers in separate
    processes. cuFuzz uncovers 43 previously unknown bugs (19 in commercial libraries) across 14 CUDA programs—including illegal
    memory accesses, uninitialized reads, and data races. cuFuzz achieves significantly more discovered edges and unique inputs
    compared to baseline approaches especially on closed-source targets. Moreover, we quantify the run time overheads of the
    different cuFuzz components and add persistent-mode support to improve the overall fuzzing throughput. Our results demonstrate
    that cuFuzz is an effective and deployable addition to the GPU testing toolbox. cuFuzz is publicly available at https://github.com/NVlabs/cuFuzz
    .'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/32/Hunting-CUDA-Bugs-at-Scale-with-cuFuzz
