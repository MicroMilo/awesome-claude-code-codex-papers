- title: 'SmartFuzz: Leveraging Large Language Models and Feature Composition to Generate High-Quality Seeds for Database
    Fuzzing'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f32f8073-e907-4d7f-aa38-9b7b799bca59
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Mutation-based fuzzing is one of the most effective techniques for uncovering bugs in Database Management Systems
    (DBMSs). However, its effectiveness critically depends on the quality of the initial seed queries. High-quality seeds
    should be syntactically and semantically valid, incorporate diverse SQL features, and encode behaviors that drive execution
    into bug-prone states. In practice, existing DBMS fuzzers primarily rely on SQL queries extracted from unit tests or regression
    suites as initial seeds, which are often limited in diversity and scale, leaving many DBMS features and execution paths
    unexplored. To address this limitation, we propose SmartFuzz, an automated framework for synthesizing high-quality initial
    SQL seeds for mutation-based DBMS fuzzing using Large Language Models (LLMs). The key insight behind SmartFuzz is that
    two underutilized sources—official DBMS documentation and historical crash-triggering inputs—capture complementary knowledge
    about DBMS feature usage and bug-relevant behaviors. SmartFuzz extracts structured features from these sources and leverages
    LLMs to synthesize executable, feature-rich SQL seeds that are biased toward bug-prone execution states. We integrate
    SmartFuzz into existing mutation-based DBMS fuzzing pipelines and evaluate it on 4 widely used DBMSs. The results demonstrate
    that SmartFuzz significantly improves bug discovery and code coverage compared to state-of-the-art mutation-based fuzzers.
    In total, SmartFuzz detects 61 previously unknown bugs, of which 53 have been confirmed and fixed by developers.
