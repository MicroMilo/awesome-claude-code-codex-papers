- title: Efficient Extraction for Effectful E-Graphs
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6336e912-8ef1-4205-945b-0adda8b3e82f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Egraphs have enabled recent advances in program optimization, synthesis, and verification, yet remain difficult
    to apply to effectful programs whose memory and I/O operations must respect execution order. Existing effect-aware extraction
    algorithms rely on integer linear programming (ILP) and dominate total runtime. We introduce Statewalk DP , a new extraction
    algorithm that enforces effect ordering efficiently without external solvers. We prove that finding any effect-safe extraction
    is NP-complete, but show that Statewalk DP is tractable in statewalk width , a parameter that measures the complexity
    of dataflow interactions among effects. In practice, statewalk width generally remains small, enabling Statewalk DP to
    achieve order-of-magnitude speedups over ILP extraction while producing programs comparable to LLVM across our benchmarks.
    We implement the algorithm in eqcc, a prototype egraph-based compiler for imperative Bril programs and demonstrate that
    effect-aware extraction is no longer a bottleneck.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/156/Efficient-Extraction-for-Effectful-E-Graphs
