- title: Revisiting Path Coverage Tracing from a Node-centric View
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5010951a-726d-475a-a716-78ca7d077468
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Path coverage tracing is one of the fundamental components for supporting a wide range of dynamic program analyses,
    such as testing, debugging, profiling, and many others. Since one needs to insert code into a program to trace its coverage,
    runtime overhead becomes the main bottleneck for scalability. As finding the minimum number of instrumentation points
    is NP-hard, extensive work exists on reducing the number of instrumented edges under diverse assumptions, and thus suffers
    from the trade-off between precision and efficiency. Departing from this \textit{edge-centric} view, we introduce, in
    this work, a novel perspective, namely the \textit{node-centric} view, where we aim to find the minimum number of \emph{blocks},
    rather than edges as in existing work, that can differentiate all edges and paths in the program. This new perspective
    allows us to design a \emph{linear-time algorithm} that is \emph{provably correct} and \emph{optimal}—it finds the minimum
    set of blocks for correctly differentiating edge/path coverage for \emph{arbitrary control-flow graphs}. Our key insight
    is that optimal node-level instrumentation only needs to distinguish undifferentiated paths at the block where they converge,
    enabling our algorithm to have linear time complexity regarding the number of basic blocks. We implement our algorithm
    as InsOpt and compare it with state-of-the-art edge coverage instrumentation techniques using the real-world vulnerability
    detection benchmark, Magma. Our evaluation results demonstrate significant improvements: InsOpt needs 3.2x less instrumentation
    with only 17% basic blocks instrumented. This reduced instrumentation yields a 1.4x speedup and a substantial 2.4x reduction
    in runtime overhead. Moreover, we also demonstrate substantial potential using InsOpt with other applications. Specifically,
    our integration of InsOpt with AFL++, a state-of-the-art fuzzer, shows a 4.9x speedup in vulnerability detection and a
    1.5x performance improvement. Notably, this efficiency gain further benefits InsOpt in detecting five previously unknown
    bugs in frequently evaluated projects by other state-of-the-art tools.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/90/Revisiting-Path-Coverage-Tracing-from-a-Node-centric-View
  abstract_sha256: 7fab31832aa9536f38aa6d78d234ee57252491d3608e6e2ab1a1df5351636889
