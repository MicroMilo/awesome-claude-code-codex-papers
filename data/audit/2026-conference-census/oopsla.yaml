- title: Sound and Complete Solving for Multi-Width Parametric Bitvectors via Principled Reductions
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c0bb1dac-2e15-41de-8df9-cf0be1694430
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Bitvectors are foundational for automated reasoning about programs, and fixed-width bitvector solvers (QF_BV)
    are fast and ubiquitous. However, the theory of parametric bitvectors (PBV), where widths are symbolic, is much less well
    understood. The theory of multi-width PBV, where expressions may involve $n$ distinct symbolic widths (PBV$_n$), is particularly
    challenging. The only existing complete approach for bounded PBV (where all widths have a concrete upper bound) is exhaustive
    enumeration, requiring one call to a QF_BV solver for each possible width assignment, of which there are exponentially
    many. This is a key bottleneck in state-of-the-art superoptimization tools such as Alive2 and Hydra. To address this,
    we first prove that any PBV$_n$ formula can be reduced to an equisatisfiable mono-width (PBV$_1$) formula with only a
    linear increase in formula size. The key idea is to encode symbolic widths as bitmasks. This reduction lets us create
    two solvers for flavors of multi-width PBV: (1) A sound and complete bounded PBV solver, which instantiates the width
    variable in the PBV$_1$ formula to a concrete bound, and therefore requires only a single QF_BV solver call. In practice,
    this solver proves LLVM rewrites in seconds that enumeration fails to prove in hours. (2) By composing our reduction with
    existing automata-theoretic decision procedures for PBV$_1$, we obtain a new sound and complete decision procedure for
    a fragment of PBV$_n$ with parametric widths. This new decidable fragment subsumes the prior state of the art fragment
    of linear and bitwise operations, by adding support for zero and sign extension. All our solvers are implemented in Lean,
    with mechanized proofs of soundness and completeness for the unbounded solver. Empirically, we find that our equisatisfiable
    reduction from PBV$_n$ to PBV$_1$ turns exponential enumeration into a single QF_BV query that nearly saturates standard
    PBV benchmarks (506 of 528 problems across all datasets), while our unbounded solvers solve 1.5$\times$ as many problems
    as the state-of-the-art CVC5-based solver for all bitwidths.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/137/Sound-and-Complete-Solving-for-Multi-Width-Parametric-Bitvectors-via-Principled-Reduc
