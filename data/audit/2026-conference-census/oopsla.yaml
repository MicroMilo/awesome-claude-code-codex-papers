- title: A Design Space Exploration of Async/Await
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 59881d50-57d7-4443-a159-16213711862b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Many modern programming languages include some form of asynchronous programming. In particular, a growing number
    now have what we call straight-line asychrony: attempts to provide asychronous functions that look similar to synchronous
    functions, thereby enabling asychrony without introducing complex control. These languages often share construct names
    like “async” and “await,” which suggests that they have deep semantic similarities. Yet, a close examination reveals that
    these languages are quite different along several dimensions, often subtly. These differences have real semantic consequences:
    similar-looking programs can exhibit divergent behavior, confusing developers and language designers alike. This paper
    therefore presents a design space exploration of straight-line asychrony. We dissect several existing languages, and show
    how no two of them agree as a whole on designs decisions which affect the presence and ordering of execution. We articulate
    a design space with nine dimensions covering the full lifecycle of an asynchronous computation, covering questions such
    as: What precise guarantees does a language give upon calling an asynchronous function? What happens at the end of a task’s
    life? How can a task handle being cancelled? We explore these questions through concrete examples, informal design discussion,
    and a formal semantics. Our ultimate goal is to help programmers, language designers, and language theorists all better
    understand the emerging landscape of straight-line asynchrony.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/145/A-Design-Space-Exploration-of-Async-Await
