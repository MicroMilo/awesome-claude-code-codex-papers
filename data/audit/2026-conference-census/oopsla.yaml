- title: 'Type, Ability, and Effect Systems: Perspectives on Purity, Semantics, and Expressiveness'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0b8022a4-a324-4cc9-a9ee-72237527922f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Programming benefits from a clear separation between pure, mathematical computation and impure, effectful interaction
    with the world. Existing approaches to enforce this separation include monads, type-and-effect systems, and capability
    systems. All share a tension between precision and usability, and each one has non-obvious strengths and weaknesses. This
    paper aims to raise the bar in assessing such systems. First, we propose a semantic definition of purity, inspired by
    contextual equivalence, as a baseline for effect soundness independent of any specific typing discipline. Second, we propose
    that expressiveness should be measured by the degree of completeness, i.e., how many semantically pure terms can be typed
    as pure. Using this measure, we focus on minimal meaningful effect and capability systems and show that they are incomparable,
    i.e., neither subsumes the other in terms of expressiveness. Based on this result, we propose a synthesis and show that
    \emph{type, ability, and effect systems} combine their respective strengths while avoiding their weaknesses. As part of
    our formal model, we provide a logical relation to facilitate proofs of purity and other properties for different effect
    typing disciplines.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/144/Type-Ability-and-Effect-Systems-Perspectives-on-Purity-Semantics-and-Expressiven
