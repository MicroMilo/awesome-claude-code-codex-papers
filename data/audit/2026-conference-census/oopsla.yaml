- title: Quantum Uncomputation of Clean and Dirty Ancilla Qubits
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 148e4bc8-0f82-4f61-8f0b-21558a0e013f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Automatic uncomputation aims to provide programming-language-level support to facilitate the correct and safe
    use of ancilla qubits in quantum computing, but efforts have only been made for clean ancillas, leaving dirty ancillas
    unexplored. We present a unified formalization of the uncomputation of both clean and dirty ancillas. For the first time,
    we prove that checking the existence of uncomputation is coNP-hard. We introduce two complementary synthesis-oriented
    existence-checking methods: a rewrite-based normalization algorithm (RwUn) and a template-based reasoning system (TpUn)
    that guarantees uncomputation through structured Store-Use patterns. We implement prototypes of both methods in Qiskit
    and Python. Compared to the state-of-the-art Reqomp~\cite{reqomp}, RwUn achieves 100% coverage on practical complex-dependency
    benchmarks, twice the coverage on random classical circuits, and about 50% coverage on random quantum circuits beyond
    the scope of existing methods, demonstrating broader applicability.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/154/Quantum-Uncomputation-of-Clean-and-Dirty-Ancilla-Qubits
