- title: 'Lawyer: Modular Obligations-Based Liveness Reasoning in Higher-Order Impredicative Concurrent Separation Logic'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 12d266df-73ee-4b70-8f94-961c3d946a5a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Higher-order concurrent separation logics, such as Iris, have been tremendously successful in verifying safety
    properties of concurrent programs. However, state-of-the-art attempts to verify liveness properties in such logics have
    so far either lacked modularity (the ability to compose specifications of independent modules), or they have been far
    too complex to mechanize in a proof assistant. In this work, we introduce Lawyer — a mechanized program logic for modular
    verification of (fair) termination of concurrent programs. Lawyer draws inspiration from state-of-the-art approaches which
    use obligations for specifying and proving termination. However, unlike these approaches which incorporate obligations
    by instrumenting the source code with erasable auxiliary code and state, Lawyer, avoids such instrumentations. Instead,
    Lawyer, incorporates obligations into the logic by embedding them into a purely logical labeled transition system that
    the program is shown to refine - this makes Lawyer far more amenable to mechanization. We demonstrate the expressivity
    of Lawyer by verifying termination of a range of examples, including modular verification of a client program whose termination
    relies on correctness of a fair lock library, and (separately) prove that a ticket lock implementation implements that
    library’s interface. To the best of our knowledge, Lawyer is the first mechanized program logic that supports modular
    higher-order impredicative liveness specifications of program modules. All the results that appear in the paper have been
    mechanized in the Rocq proof assistant on top of the Iris separation logic framework.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/40/Lawyer-Modular-Obligations-Based-Liveness-Reasoning-in-Higher-Order-Impredicative-Co
