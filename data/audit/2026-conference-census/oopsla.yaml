- title: Detecting Flaky Tests by Controlling Nondeterministic API Behavior
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 26e143ed-7a6f-4f46-86fb-4cddaeb73788
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Regression testing is an essential part of software development to ensure high-quality software, but the presence
    of flaky tests makes the testing outcomes unreliable. It is essential to proactively detect flaky tests, so developers
    are aware of them early on and can react appropriately in case they fail. While there has been prior work in detecting
    flaky tests, they either are developed to focus on specific types. We present ChaosAPI, a framework to support detecting
    a variety of different types of flaky tests. Our insight is that the most effective approach to detecting flaky tests
    is to target the nondeterministic component that the lead the tests to have the flaky behavior in the first place. In
    particular, we target specific APIs within the Java Standard Library that all Java code relies on and are known to exhibit
    nondeterministic behavior, such as those related to system time, concurrency, and environmental factors. During test execution,
    ChaosAPI modifies the behavior of these API calls, perturbing inputs and return values of these APIs in a systematic manner
    while still remaining compliant with the API specification. We can detect flaky tests by observing whether the test that
    previously passed would now fail when run through ChaosAPI. Our evaluation on a prior dataset of known flaky tests as
    well as running on test suites of other popular open-source projects demonstrates that ChaosAPI not only detects more
    flaky tests than simple rerunning across a wide range of projects but also detects them more efficiently, making ChaosAPI
    a practical addition to the toolbox of flaky test detection techniques
