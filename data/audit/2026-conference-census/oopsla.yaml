- title: LLM-Based Alarm Resolution Guided by Bayesian Program Analysis
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 2e749de4-a931-4458-8c40-9ad7a07a0146
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Abstract-interpretation-based static analyzers often report large numbers of alarms due to over-approximation.
    Although large language models (LLMs) can help filter alarms, per-alarm prompting is often inaccurate and expensive. Alarm
    validity may require long, fragile whole-program reasoning, and the repeated context wastes many tokens. We shift LLM
    judgment from end alarms to small, local intermediate facts (e.g., alias or flow edges), which are easier to validate.
    If a fact is judged false, all dependent facts and alarms can be pruned. We capture these dependencies in a derivation
    graph, enabling analyzer-agnostic pruning for any tool that exposes derivations. Under a token budget, we define the fact
    impact prioritization problem, which asks which facts to query first to maximize expected downstream pruning. We solve
    it with Bayesian program analysis by estimating each fact’s pruning impact from rule probabilities and fact posteriors.
    Building on these ideas, we present an LLM-based alarm resolution framework guided by Bayesian program analysis. It iteratively
    queries high-impact facts that LLMs can judge accurately, prunes downstream nodes when a fact is false, and feeds the
    judgments back to the Bayesian model as high-confidence evidence. We evaluate our approach on a Java datarace analysis
    and a C taint analysis, showing that it improves alarm-resolution quality while substantially reducing token consumption
    compared with both unfiltered static analysis and per-alarm LLM judging.
