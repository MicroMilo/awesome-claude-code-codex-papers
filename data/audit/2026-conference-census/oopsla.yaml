- title: 'P4-SpecTec: Integrating a Language Mechanization Framework into the Real-World P4 Specification'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6231764d-6e92-4f5f-801e-6b578cb55127
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Programming languages evolve over time, but often without a complete and unambiguous definition of their syntax
    and semantics. Ambiguities and inconsistencies are silently introduced into specifications, and manifest as divergences
    between the specification, implementations, and formalizations that constitute the language ecosystem. Even in rare cases
    when a normative specification exists, like JavaScript and WebAssembly (Wasm), keeping the ecosystem in sync is a daunting
    task. Language mechanization frameworks address this problem by treating a mechanized specification as the single source
    of truth , from which implementations and documents are generated. Recently, this approach has been integrated into the
    actual JavaScript and Wasm specifications with ESMeta and Wasm-SpecTec, respectively. However, despite these successes,
    it remains a question how to extrapolate ESMeta and Wasm-SpecTec to other language specifications. Both framework designs
    leverage the existence of JavaScript and Wasm’s normative specifications, which is not the case for many languages. As
    a first step towards addressing this question, we present P4-SpecTec, a language mechanization framework for the P4 programming
    language that is conditionally adopted as the official P4 specification authoring toolchain. P4 is a statically-typed
    domain-specific language for programming packet processors. It is evolving without a normative specification, thereby
    introducing inconsistencies and errors into the P4 ecosystem. From a mechanization framework perspective, P4 introduces
    unique challenges, in particular the requirement that its type system mechanization should be executable, which is not
    supported by either ESMeta or Wasm-SpecTec. To address this challenge, we introduce algorithmic inference rules as the
    primary instrument for mechanization, enabling the mechanized P4 static and dynamic semantics to be executed as a P4 type
    checker and interpreter, respectively. We mechanized the most recent P4 specification, and utilizing its executability,
    identified 23 bugs across the official P4 specification and the reference compiler. Furthermore, P4-SpecTec derives a
    specification document as prose algorithms, making it accessible to P4 language designers and users. We share the lessons
    learned from integrating P4-SpecTec into the P4 specification authoring process, with the aim of providing insights for
    integrating mechanization into real-world language specifications in the wild.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/161/P4-SpecTec-Integrating-a-Language-Mechanization-Framework-into-the-Real-World-P4-Spe
