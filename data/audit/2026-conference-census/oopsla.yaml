- title: First-Class Refinement Types for Scala
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2d98b531-267a-45d7-b187-18abdf7868d5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Refinement types—types qualified with logical predicates—have proven effective for lightweight verification in
    languages like Liquid Haskell, F*, and Dafny. However, in these systems refinements are either written in a separate specification
    language or treated as second-class annotations, disconnected from the host language’s type system. This disconnect creates
    usability barriers: programmers must maintain two mental models, and refinements cannot interact with features like type
    inference, subtyping, or overloading. We present the design of first-class refinement types for Scala 3, where refinements
    are ordinary types that participate in subtyping, inference, and pattern matching alongside existing language features.
    We prove type soundness of a core calculus mechanized in Rocq, combining dependent function types, bounded polymorphism,
    positive equi-recursive types, union and intersection types, and refinement types under a partial-correctness semantics
    using a fuel-bounded definitional interpreter and semantic typing. Finally, we implement our design as a prototype extension
    of the Scala 3 compiler with a lightweight e-graph-based solver for predicate entailment.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/167/First-Class-Refinement-Types-for-Scala
