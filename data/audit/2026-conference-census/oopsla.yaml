  abstract: Multi-stage programming (MSP) languages such as MetaML have subtle semantics, in which familiar properties often
    fail to hold and hazardous interactions with other language features such as state or polymorphism abound. The ongoing
    incorporation of MSP features into general purpose languages makes the need to establish confidence in their design increasingly
    pressing. Taking inspiration from existing MSP systems, we present a Coq mechanisation of a core calculus for compile-time
    and run-time MSP with effects, $\lambda_{\textsf{run}}^{$}$, formally establishing key properties such as type and elaboration
    soundness and phase distinction. We hope that our mechanised semantics will be a useful basis for formal study of other
    designs, easing the extension of existing languages with support for MSP.
