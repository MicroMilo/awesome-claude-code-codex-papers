- title: Class-Dictionary Specialization With Rank-2 Polymorphic Functions
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3798227
  official_record_id: ca89454a-ee3a-4e6b-b7b1-4b1700228745
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Rank-2 polymorphism, when combined with type-class-constrained arguments, enables powerful abstractions and code
    reuse by allowing functions to accept arguments that are themselves ad-hoc polymorphic. Optimizing compilers like the
    Glasgow Haskell Compiler (GHC) use techniques like class-dictionary specialization and inlining for optimization. However,
    these techniques can falter when the rank-2 polymorphic functions are recursive. Specializing the polymorphic arguments
    of recursive rank-2 polymorphic function applications requires inlining the applied function to expose type and dictionary
    applications to the arguments, but the compiler’s heuristic-driven inliner is reluctant to inline recursive functions,
    risking non-termination during compilation. This stalemate causes recursive rank-2 polymorphic functions to remain un-optimized
    and be left with a runtime penalty. Within the Haskell ecosystem, we identify this stalemate within three widely used
    libraries: the Scrap Your Boilerplate (SYB) and SYB With Class (SYB3) generic-programming libraries, and a fragment of
    the lens optics library. In these libraries, the combination of rank-2 polymorphism, type-class constraints and recursion
    is central to their implementation. In this paper, we present a new optimization technique that breaks this stalemate
    and enables class-dictionary specialization with recursive rank-2 polymorphic functions. We introduce a partial evaluator
    that strategically applies the standard transformations of inlining, $\beta$-reduction and memoization to applications
    of rank-2 polymorphic functions that are \emph{partially static}, i.e., whose arguments have some information known statically.
    This process exposes applications of its polymorphic arguments onto concrete types and dictionaries, which can be specialized
    by the standard compiler optimization pipeline. Additionally, we introduce type-constant folding to evaluate run-time
    type-equality tests statically, further leveraging static type information gained from partial evaluation. We implement
    our technique as a GHC plugin and demonstrate its effectiveness by resolving the performance bottlenecks in the aforementioned
    Haskell libraries. On SYB and SYB3 traversals, our technique achieves speedups of $43\times$ on average (up to $155\times$)
    and $6.1\times$ on average (up to $9.5\times$), respectively, matching the performance of their hand-written counterparts.
    On the fragment of the \texttt{lens} library containing the identified slowdowns, our technique achieves speedups of $1.6\times$
    on average (up to $2.1\times$).'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/28/Class-Dictionary-Specialization-With-Rank-2-Polymorphic-Functions
