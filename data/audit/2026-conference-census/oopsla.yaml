- title: A Type System for Optimizing Dynamic IFC
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 7403b5a0-8b51-4438-99aa-ef993ad5534e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Dynamic information-flow control (IFC) enforces confidentiality policies at runtime by tagging values with security
    labels and blocking policy-violating outputs. This incurs high runtime costs: pervasive label tracking and enforcement
    checks limit IFC to performance-insensitive workloads. We present a novel alternative called MinIF, a type-directed program
    transformation that statically eliminates this overhead. The central contribution of MinIF is a flow-sensitive type system
    that tracks which sensitive inputs influence a value and whether the enforcement mechanism would accept operations on
    it. From these types, MinIF statically predicts enforcement outcomes and removes redundant checks along with the label-tracking
    code that served them, provably preserving behavior and enforcement equivalence. Unresolved checks surface as warnings,
    and the absence of warnings gives developers a static guarantee against enforcement-induced crashes. For IFC systems with
    introspection, this optimization is fully automatic: existing introspection queries supply the permission information
    MinIF needs, requiring no additional programmer effort. We evaluate MinIF on Python programs running on the WebTTC dynamic
    IFC platform. On benchmarks, MinIF eliminates between 13% and 99% of the enforcement overhead, with previously intractable
    compute-intensive workloads completing in milliseconds.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/82/A-Type-System-for-Optimizing-Dynamic-IFC
