- title: 'Phaedrus: Predicting Dynamic Application Behavior with Lightweight Generative Models and LLMs'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 6e1d415a-ec67-4758-8696-8bb9f02f5438
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Application profiling is an indispensable technique for many software development tasks, such as code and memory
    layout optimizations, where optimization decisions are tailored to specific program profiles. Unfortunately, modern application
    codebases exhibit highly variant behavior across different inputs, creating challenges for conventional profiling approaches
    that rely on a single representative execution instance. In this paper, we propose \textbf{Phaedrus}, a new \textit{compiler-assisted
    deep learning framework} designed to predict dynamic program behaviors across varied execution instances, specifically
    focusing on dynamic function call prediction.Such predicted call sequences are then used for producing optimized code
    pertinent to a given input. Traditional profile-guided optimization methods struggle with the input-dependent variability
    of modern applications, where profiling on different inputs yields divergent application behaviors. To address this, Phaedrus
    proposes two new approaches: \textit{Application Behavior Synthesis}, a profile-less approach where Large Language Models
    (LLMs) directly infer dynamic functions based on source code & static compiler analysis, bypassing the need for traditional
    profiling, and \textit{Application Profile Generalization}, which uses generative models trained on compressed and augmented
    \textit{Whole Program Path} (WPP) based function profiles to predict application behavior under unseen inputs. Our experiments
    show that \textit{Phaedrus} can achieve upto $10^7X$ reduction in WPP function profile sizes, can predict most frequently
    executed functions that cover upto 85-99% of the execution time, along with an average of 13.19% (upto 65%) reduction
    in application binary size, and an average of 6.08% (upto 20%) performance improvement over the traditional profile-guided
    optimization, without any execution.'
