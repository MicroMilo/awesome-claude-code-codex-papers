- title: 'Peeling off the Cocoon: Unveiling Suppressed Golden Seeds for Mutational Greybox Fuzzing'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 89ee878e-7b8c-43d5-b2c2-926ede5deb8a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Mutational greybox fuzzing (MGF) is a powerful software testing technique. Initial seeds are critical for MGF
    since they define the space of possible inputs and fundamentally shape the effectiveness of MGF. Nevertheless, having
    more initial seeds is not always better. A bloated initial seed set can inhibit throughput, thereby degrading the effectiveness
    of MGF. To avoid bloating, modern fuzzing practices recommend performing seed selection to maintain golden seeds (i.e.,
    those identified as beneficial for MGF) while minimizing the size of the set. Typically, seed selection favors seeds that
    execute unique code regions and discards those that contribute stale coverage. This coverage-based strategy is straightforward
    and useful, and is widely adopted by the fuzzing community. However, coverage-based seed selection (CSS) is not flawless
    and has a notable blind spot: it fails to identify golden seeds suppressed by unpassed coverage guards, even if these
    seeds contain valuable data that can benefit MGF. As a result, this blind spot prevents suppressed golden seeds from realizing
    their true values, which can ultimately degrade the effectiveness of downstream MGF. In this paper, we propose a novel
    technique named PoCo to address the blind spot of traditional CSS. The basic idea behind PoCo is to manifest the true
    strengths of the suppressed golden seeds by gradually disabling obstacle conditional guards. To this end, we develop a
    lightweight program transformation to enable flexible disabling of guards and devise a novel guard hierarchy analysis
    to identify obstacle ones. An iterative seed selection algorithm is constructed to stepwise select suppressed golden seeds.
    We prototype PoCo on top of the AFL++ utilities (version 4.10c) and compare it to seven baselines, including two state-of-the-art
    tools afl-cmin and OptiMin. Compared to afl-cmin, PoCo selects 3–40 additional seeds within a practical time budget of
    two hours. To evaluate how effective the studied techniques are in seeding fuzzing, we further conduct extensive fuzzing
    (over 17,280 CPU hours) with eight different targets from a mature benchmark named Magma, adopting the most representative
    fuzzer AFL++ for MGF. The results show that the additional seeds selected by PoCo yield modest improvements in both code
    coverage and bug discovery. Although our evaluation reveals limitations of PoCo, it also demonstrates the presence and
    value of suppressed golden seeds. Based on the evaluation results, we distill lessons and insights that may inspire the
    fuzzing community.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/6/Peeling-off-the-Cocoon-Unveiling-Suppressed-Golden-Seeds-for-Mutational-Greybox-Fuzz
