- title: 'PRDTs: Composable Design and Verification of Consensus Protocols using Replicated Data Types'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0366fb19-ea99-4480-a12e-8633e1a44209
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Consensus protocols are fundamental in distributed systems as they enable services with strong consistency properties.
    However, designing protocols optimized for specific use-cases under certain system assumptions is typically an error-prone
    process requiring expert knowledge. Furthermore, while most recent optimized protocols are variations of well-known algorithms
    like Paxos or Raft, they often necessitate complete re-implementations, potentially introducing new bugs and complicating
    the application of existing verification results. This approach impedes application-specific consistency protocols that
    can easily be amended or swapped out, depending on the given application and deployment scenario. We propose \emph{Protocol
    Replicated Data Types} (PRDTs), a novel programming model for implementing consensus protocols using replicated data types
    (RDTs). Inspired by the knowledge-based view of consensus, PRDTs employ RDTs to monotonically accumulate \emph{knowledge}
    until \emph{agreement} is reached. This approach allows for implementations focusing on high-level protocol logic that
    abstracts away network details and facilitates automated verification. Moreover, by applying existing algebraic composition
    techniques for RDTs in the PRDT context, we enable composable protocol building-blocks for implementing complex protocols.
    We present a formal model of our approach and implement a proof procedure that allows automated reasoning about the consensus
    safety of concrete PRDT implementations. Additionally, we demonstrate the applicability of our model in verified PRDT-based
    implementations of existing consensus protocols, and report empirical performance evaluation results. Our findings indicate
    that the PRDT approach offers enhanced flexibility and composability in protocol design, facilitates reasoning about correctness,
    and is suited for real-world adoption without intrinsic performance drawbacks.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/148/PRDTs-Composable-Design-and-Verification-of-Consensus-Protocols-using-Replicated-Dat
