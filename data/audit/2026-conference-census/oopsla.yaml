- title: 'Floating-Point Usage on GitHub: a Large-Scale Study of Statically Typed Languages'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3798203
  official_record_id: 1731932d-de84-4b57-8c09-3350dc912b25
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Reasoning about floating-point arithmetic is notoriously hard. While static and dynamic analysis techniques or
    program repair have made significant progress, more work is still needed to make them relevant to real-world code. On
    the critical path to that goal is understanding what real-world floating-point code looks like. To close that knowledge
    gap, this paper presents the first large-scale empirical study of floating-point arithmetic usage across public GitHub
    repositories. We focus on statically typed languages to allow our study to scale to millions of repositories. We follow
    state-of the art mining practices including random sampling and filtering based on only intrinsic properties to avoid
    bias, and identify floating-point usage by searching for keywords in the source code, and programming language constructs
    (e.g., loops) by parsing the code. Our evaluation supports the claim often made in papers that floating-point arithmetic
    is widely used. Comparing statistics such as size and usage of certain constructs and functions, we find that benchmarks
    used in literature to evaluate automated reasoning techniques for floating-point arithmetic are in certain aspects representative
    of `real-world’ code, but not in all. We publish a dataset of 10 million real-world floating-point functions extracted
    from our study. We demonstrate in a case study how it may be used to identify new floating-point benchmarks and help future
    techniques for floating-point arithmetic to be designed and evaluated to match actual users’ expectations.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/4/Floating-Point-Usage-on-GitHub-a-Large-Scale-Study-of-Statically-Typed-Languages
