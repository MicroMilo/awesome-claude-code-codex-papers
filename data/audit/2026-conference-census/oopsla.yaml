  official_record_id: 082be025-8652-4e4a-8f5e-9ddbd171d998
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Levy’s call-by-push-value (CBPV) is a language that subsumes both call-by-name and call-by-value lambda calculi
    by syntactically distinguishing values from computations and explicitly specifying execution order. This low-level handling
    of computation suspension and resumption makes CBPV suitable as a compiler intermediate representation (IR), while its
    substitution evaluation semantics affords compositional reasoning about programs. In particular, βη-equivalences in CBPV
    have been used to justify compiler optimizations in low-level IRs. However, these equivalences do not validate commuting
    conversions , which are key transformations in compiler passes such as A-normalization. Such transformations syntactically
    rearrange computations without affecting evaluation order, and can reveal new opportunities for inlining. In this work,
    we identify the commuting conversions of CBPV, define a commuting conversion normal form (CCNF) for CBPV, present a single-pass
    transformation into CCNF based on A-normalization, and prove that well-typed, translated programs evaluate to the same
    result. To avoid the usual code duplication issues that also arise with ANF, we adapt the explicit join point constructs
    by Maurier et al. Our results are all mechanized in Lean 4.
