- title: 'A Tale of 1001 LoC: Potential Runtime Error-Guided Specification Synthesis for Verifying Large-Scale Programs'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 8f7f8da6-5e03-414d-af43-02de55237d6f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Fully automated verification of large-scale software and hardware systems is arguably the holy grail of formal
    methods. Large language models (LLMs) have recently demonstrated their potential for enhancing the degree of automation
    in formal verification by, e.g., generating formal specifications as essential to deductive verification, yet exhibit
    poor scalability due to context-length limitations and, more importantly, the difficulty of inferring complex, interprocedural
    specifications. This paper presents Preguss – a modular, fine-grained framework for automating the generation and refinement
    of formal specifications. Preguss synergizes between static analysis and deductive verification by steering two components
    in a divide-and-conquer fashion: (i) potential runtime error-guided construction and prioritization of verification units,
    and (ii) LLM-aided synthesis of interprocedural specifications at the unit level. We show that Preguss substantially outperforms
    state-of-the-art LLM-based approaches and, in particular, it enables highly automated RTE-freeness verification for real-world
    programs with over a thousand LoC, with a reduction of 80.6%~88.9% human verification effort.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/68/A-Tale-of-1001-LoC-Potential-Runtime-Error-Guided-Specification-Synthesis-for-Verify
