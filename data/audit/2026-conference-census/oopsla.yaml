- title: Automatic Propagation of Profile Information through the Optimization Pipeline
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 1b42543f-06bb-40b9-87aa-64d1a2df4616
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Profile-guided optimization (PGO) is a well-established technique for improving program performance, being integrated
    into major compilers such as GCC, LLVM/Clang, and Microsoft Visual C++. PGO collects information about a program’s execution
    and uses it to guide optimizations such as inlining, and code layout. However, these very transformations alter the program’s
    control flow, rendering the collected profiles stale or inaccurate. To deal with this problem, this paper investigates
    how to reuse profile data after optimization without re-executing the program. We study two complementary strategies:
    prediction, which estimates likely hot code paths in the optimized program, and projection, which transfers profile information
    from the original control-flow graph to its transformed version. We evaluate several techniques for reconstructing profile
    data, including a large language model (LLM)–based approach using GPT-4o, and a lightweight method that compares opcode
    histograms of code regions recursively to identify structural similarities. Our results show that the histogram-based
    method is not only simpler but also consistently more accurate than both the LLM-based approach and prior prediction and
    projection techniques, including those implemented in LLVM and the BOLT binary optimizer.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/47/Automatic-Propagation-of-Profile-Information-through-the-Optimization-Pipeline
