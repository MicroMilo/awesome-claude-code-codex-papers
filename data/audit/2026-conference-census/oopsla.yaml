- title: Sound State Encodings in Translational Separation Logic Verifiers
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 7950506d-b17b-4389-8c78-d1fff061c336
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Automated program verifiers are often organized into a front-end, which encodes an input program into an intermediate
    verification language (IVL), and a back-end, which proves that the IVL program is correct. Soundness of such translational
    verifiers requires that the back-end verification is sound and that correctness of the IVL program implies correctness
    of the input program. Existing formalizations for translational verifiers based on separation logic target the former,
    but support the latter only under the strong assumption that there exists a separation logic for the input program with
    the same state model as the IVL. This assumption is unrealistic in practice, especially since the state model also defines
    the supported separation logic resources. We present the first formal framework for proving the soundness of translational
    separation logic verifiers with non-trivial state encodings. To be applicable to various front-ends and IVLs, our framework
    only assumes the existence of a homomorphic encoding relation between the front-end and IVL state models. At the core
    of our framework is a novel condition, backward satisfiability, which is crucial to guarantee the soundness of the front-end
    translation. We formalize our framework for front-end verifiers based on concurrent separation logic and separation logic
    IVLs, such as Raven, VeriFast, and Viper. We demonstrate its expressiveness by proving soundness for three common state
    encodings. Our framework and all proofs are formalized in Isabelle/HOL.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/88/Sound-State-Encodings-in-Translational-Separation-Logic-Verifiers
