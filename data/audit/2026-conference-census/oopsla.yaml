  abstract_reason: Official abstract fetched.
  abstract: RGSep is a program logic for reasoning about the correctness of concurrent programs by combining separation logic
    and rely-guarantee reasoning. Although the logic was initially developed for sequential consistency, we show that in the
    absence of auxiliary variables, RGSep is also sound under the much weaker release-acquire (RA) consistency model, which
    is a well-behaved subset of the C++11 concurrency model. Our result provides another way to reason about RA programs,
    which is much simpler than using the state-of-the-art program logics that support weak memory consistency models.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/133/RGSep-under-Release-Acquire-Consistency
