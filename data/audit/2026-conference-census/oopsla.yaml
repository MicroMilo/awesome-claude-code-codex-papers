  abstract: \emph{Multiparty session types} (MPST) are a type discipline for concurrent and distributed systems, designed
    to ensure not only type-safety and deadlock-freedom, but also \emph{liveness} of typed communicating processes. Two main
    MPST methodologies, top-down and bottom-up, have been proposed and are integrated into a wide range of programming languages
    and tools. The \emph{top-down} strategy starts by specifying the overall choreography of the protocol (called a global
    type), from which a set of local types that satisfy safety and liveness are generated by end-point projection (EPP). Once
    each participant is type-checked against a generated local type, liveness of the set of typed processes is automatically
    ensured \emph{by construction}. The \emph{bottom-up} strategy directly checks whether local types inferred from processes
    satisfy liveness in order to enforce liveness of processes. Since the top-down strategy depends on global types and the
    EPP algorithms, it has often been considered that the top-down system offers \emph{strictly less typability} than the
    bottom-up system. Our paper negates this belief. We prove that, using the precise subtyping for the subsumption rule,
    the top-down strategy offers \emph{exactly the same typability} as the bottom-up system. More precisely, a multiparty
    session $M$ is typable and verified to be live by the bottom-up typing system if and only if $M$ is typable by the top-down
    typing system. The key for the proofs is to develop a \emph{principal global type inference algorithm} which builds a
    \emph{principal} global type from an arbitrary set of live local types. We have implemented the global type inference
    algorithm together with projection, process type checking and local type inference algorithms, and build a toolchain for
    the both top-down and bottom-up strategies. We evaluated our toolchain with representative examples from the literature,
    confirming that the top-down is more efficient than the bottom-up.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/164/Top-down-Bottom-up-Sound-and-Complete-Characterisations-of-Liveness-by-Multiparty-
