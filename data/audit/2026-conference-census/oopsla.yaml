- title: Systematic Design of Separation Logics
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 7b64a9ee-fa6b-449f-a81f-368dd2f29423
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Thanks to the locality principle, separation logics support modular, scalable analysis of large codebases by relying
    on local axioms and frame rules to focus only on the heap fragments required for verification. However, depending on the
    direction—forward vs. backward—and sense of approximation—over vs. under—of the analysis, designing the corresponding
    proof systems can require some ingenuity. In his work on the \emph{calculational design} of program logics, Patrick Cousot
    outlines a methodology for deriving proof systems directly from program semantics using abstract interpretation, covering
    both correctness and incorrectness analyses. Unfortunately, when applied to heap-manipulating programs, Cousot’s calculational
    approach cannot handle the locality principle, because it does not provide a calculational way to derive frame rules and
    produces axioms that refer to the global heap. In this paper, we propose a general methodology for systematically deriving
    local axioms in which the locality principle is embedded by construction. For heap-manipulating primitives, we can derive
    the minimal required heap and the corresponding pre- and postconditions, complemented by universal frame rules without
    additional syntactic side conditions. Our method is parametric w.r.t. a set of semantic closure properties that are exploited
    to design local axioms; it can deal with different memory models; it favors the reuse of many inference rules across over-
    and under-approximation; and it produces logical systems capable of deriving a broader range of triples w.r.t. existing,
    cleverly designed, program logics for (in)correctness, ranging from Separation Logic (SL) and Incorrectness Separation
    Logic (ISL) to Separation Sufficient Incorrectness Logic (SepSIL). Furthermore, we demonstrate the flexibility of our
    methodology by applying it to design a novel proof system for inferring necessary preconditions with separation logic.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/166/Systematic-Design-of-Separation-Logics
