- title: 'Deegen: A JIT-Capable VM Generator for Dynamic Languages'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: baecd5c0-b3c5-4a43-9f5d-ccc0a6f3a797
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Building a high-performance JIT-capable VM for a dynamic language has traditionally required a tremendous amount
    of time, money, and expertise. We present Deegen, a meta-compiler that allows users to generate a high-performance JIT-capable
    VM for their own language at an engineering cost similar to writing a simple interpreter. Deegen takes in the execution
    semantics of the bytecodes implemented as C++ functions, and automatically generates a two-tier VM execution engine with
    a state-of-the-art interpreter, a state-of-the-art baseline JIT, and the tier-switching logic that connects them into
    a self-adaptive system. We are the first to show how to automatically generate a baseline JIT compiler that rivals the
    current state of the art, and an interpreter that outperforms the current state of the art. Our performance comes from
    Deegen’s ability to automatically apply many state-of-the-art optimizations that previously had to be hand-implemented.
    These optimizations include bytecode specialization and quickening, register pinning, tag register optimization, call
    inline caching, generic inline caching, JIT polymorphic IC, JIT IC inline slab, type-check removal and strength reduction,
    type-based slow-path extraction and outlining, JIT hot-cold code splitting, and JIT OSR-entry. As a result, the performance
    of the Deegen-generated interpreter and baseline JITs matches or surpasses state-of-the-art interpreters and baseline
    JITs. To evaluate Deegen, we use it to implement two languages: a Lua 5.1 VM called LuaJIT Remake (LJR) and a SOM VM called
    DSOM. Across 44 benchmarks, LJR’s interpreter is on average 2.79x faster than the official PUC Lua interpreter, and 1.31x
    faster than LuaJIT’s interpreter. LJR’s baseline JIT has negligible startup delay, and its execution performance is on
    average 4.60x faster than PUC Lua and only 33% slower (but faster on 13/44 benchmarks) than LuaJIT’s optimizing JIT. Across
    13 benchmarks, DSOM’s interpreter is 4.28x-5.82x faster than the five existing SOM interpreters, and DSOM’s baseline JIT
    compiles 25.84x faster than 2SOM’s baseline JIT, while also generating code that runs 15.46x faster.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/46/Deegen-A-JIT-Capable-VM-Generator-for-Dynamic-Languages
