- title: 'Fail Faster: Staging and Fast Randomness for High-Performance PBT'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 97b9d073-c9e8-4545-af6c-05ac64695f92
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Property-based testing (PBT) relies on generators for random test cases, often constructed using embedded domain
    specific languages, which provide expressive combinators for building and composing generators. The effectiveness of PBT
    depends critically on the speed of these generators. However, careful measurements show that the generator performance
    of widely used PBT libraries falls well short of what is possible, due principally to (1) the abstraction overhead of
    their combinator-heavy style and (2) suboptimal sources of randomness. We characterize, quantify, and address these bottlenecks.
    To eliminate abstraction overheads, we propose a technique based on multi-stage programming, dubbed Allegro. We apply
    this technique to leading generator libraries in OCaml and Scala 3, significantly improving performance. To quantify the
    performance impact of the randomness source, we carry out a controlled experiment, replacing the randomness in the OCaml
    PBT library with an optimized version. Both interventions exactly preserve the semantics of generators, enabling precise,
    pointwise comparisons. Together, these improvements find bugs up to 13X faster.
