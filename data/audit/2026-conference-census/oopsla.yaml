- title: Agent-Based Automated Remediation for Vulnerabilities in Maven Projects
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c7a3ffc7-29e4-4806-9a74-6d4608262579
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Remediating vulnerabilities in open-source software (OSS) dependencies is vital to maintaining software sup- ply
    chain security. However, current automated approaches almost exclusively rely on dependency upgrades, which is limited
    by the nature of upgrades, i.e., the availability of secure versions, version pinning, and API incompatibilities. To address
    the limitation, this paper presents Remedius, an agent-based remediation frame- work for Maven projects that unifies dependency
    upgrading and patch porting within a holistic optimization workflow. Remedius dynamically clusters dependencies by usage,
    gathers project-specific evidence through autonomous LLM-driven agents, and formulates a cost-aware remediation optimization
    problem solved via Satisfiability Modulo Theory (SMT). The agents translate complex contextual factors—such as compatibility,
    reachability, and patch difficulty—into solver-ready constraints, enabling flexible and scalable decision-making beyond
    what static rules or LLM reasoning alone can achieve. By redefining optimization at the vulnerability level rather than
    the dependency level, Remedius maximizes vulnerability coverage while preserving build correctness and runtime compatibility.
    An evaluation of 301 real-world Maven projects demonstrates that Remedius outperforms state-of-the-art baselines, achieving
    the highest number of vulnerabilities fixed and the fewest build or test failures. These results highlight a new direction
    for automated OSS remediation—moving beyond upgrade-only solutions toward adaptive, agent-driven vulnerability management.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/121/Agent-Based-Automated-Remediation-for-Vulnerabilities-in-Maven-Projects
