- title: 'Diatom: Polylithic Binary Lifting with Data-flow Summaries and Type-aware IR Linking'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b457aeb0-272a-4e6d-a41f-88067ea715e5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Binary lifting, which translates binary code into LLVM intermediate representations (IRs) through iterative IR
    transformations for recovering high-level constructs from low-level machine features, is the cornerstone of many binary
    analysis systems. Therefore, the scalability and precision of the upper layer analysis could be greatly affected by the
    underlying binary lifting. However, all existing binary lifters still suffer from severe performance problems in that
    they require much time to handle extremely large binaries, which becomes a barrier to achieving the expected performance
    gains in various analyses and hinders them from meeting the requirement of quick response in modern continuous integration
    pipelines. We found that the root cause of the scalability issue is the inherent “monolithic” design that performs all
    lifting stages on a single LLVM module, which entails a global environment that enforces sequential dependences between
    any two transformations on IRs, thus limiting the parallelism. This paper presents Diatom, a novel parallel binary lifter
    powered by a new “polylithic” design, which decomposes the monolithic LLVM module into partitions to perform fully parallelized
    binary lifting. In the meantime, it leverages light-weight data-flow summaries and type-aware IR linking to avoid soundness
    loss caused by separating dependent code fragments. Large-scale experiments on 16 real-world benchmarks whose sizes range
    from dozens of megabytes (MBs) to several gigabytes (GBs) show that Diatom achieves an average speedup of 7.45× and a
    maximum speedup of 16.8× over a traditional monolithic binary lifter, while still maintaining the lifting soundness. Diatom
    can complete the translation for the Linux Kernel binary within only 10 minutes, which significantly accelerates the overall
    binary code analysis process.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/7/Diatom-Polylithic-Binary-Lifting-with-Data-flow-Summaries-and-Type-aware-IR-Linking
