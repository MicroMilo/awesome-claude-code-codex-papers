- title: Compiling WebAssembly Concolic Execution with Staging, Continuations, and Snapshots
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fd4bbdb3-d020-461a-9a71-4fe4179c0cbc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Concolic execution is a form of symbolic execution that runs a program simultaneously on concrete and symbolic
    inputs. By recording the symbolic constraints encountered along a concrete execution path, it can systematically explore
    new paths by solving those constraints to generate new concrete inputs. Existing implementations of concolic execution
    generally follow one of two paradigms: interpretation, which directly evaluates the program while collecting path conditions,
    and instrumentation, which transforms the program by inserting shadow code to collect path conditions. Each approach has
    trade-offs: Interpretation is comparatively easy to implement, but incurs substantial runtime overhead. On the other hand,
    instrumentation avoids interpretation overhead, but typically requires re-executing the program from the beginning for
    every new input. In this paper, we develop a new approach that achieves the best of both worlds. Starting from the concrete
    semantics of the target language, we first develop a definitional concolic interpreter using multi-stage programming,
    thereby compiling away interpretation overhead while retaining the implementation simplicity as an interpreter. By constructing
    the staged concolic interpreter in continuation-passing style (CPS), we can capture execution snapshots at branch points
    and efficiently resume from them when exploring new paths, rather than restarting execution from the beginning. We instantiate
    this approach for WebAssembly, motivated by its increasing importance as a target for both compilation and analysis. We
    implement our approach in a concolic-execution compiler GenWasym, and evaluate its performance against WASP, a prior state-of-the-art
    interpreter-based system. Across 180 benchmarks, GenWasym achieves an average speedup of 31.1x.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/124/Compiling-WebAssembly-Concolic-Execution-with-Staging-Continuations-and-Snapshots
