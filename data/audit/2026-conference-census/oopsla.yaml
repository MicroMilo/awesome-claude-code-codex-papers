- title: 'Relight: Simple User-Level Checkpointing and Fast-Forward Replay for Distributed Task-Based Systems'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b773eac2-d2cd-4a30-8d17-b8ef2d74101e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Checkpointing, or periodic saving of program state to storage, is the de facto standard technique used to mitigate
    risks of nondeterministic bugs, hardware faults, and job wall-time limits in long-running programs. Traditional approaches
    require users to manually manage the migration of data to and from storage when capturing checkpoints and when resuming
    execution. However, for task-based programs, where the user has already factored the computation into tasks and the program
    data into collections, sufficient information is available to automatically capture and resume from checkpoints with minimal
    code changes. We present Relight, the first framework for automatic, distributed checkpointing of task-based programs
    that provides an efficient fast-forward replay for full job recovery. On a set of already-optimized benchmarks, we demonstrate
    that Relight delivers checkpointing performance and scalability comparable to the original, unmodified codes when running
    on up to 512 nodes of the Piz Daint supercomputer.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/108/Relight-Simple-User-Level-Checkpointing-and-Fast-Forward-Replay-for-Distributed-Task
