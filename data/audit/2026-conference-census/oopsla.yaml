- title: Localizing Type Errors for Syntactic Sugar by Lifting
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: dc814b93-96e1-46ef-a2ad-62058de1abcb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Syntactic sugar enhances the usability of a core language by providing intuitive syntax in a surface language;
    however, its interaction with the core-language type checker often results in error messages that are unclear to surface
    programmers. Existing techniques, such as type lifting, can automatically infer typing rules for syntactic sugar, but
    they do not consider localizing type errors directly in the surface syntax. This paper studies the problem of localizing
    and reporting type errors for syntactic sugar, addressing two key challenges: precisely localizing errors and ensuring
    that they are fixable. Inspired by the recently proposed marked lambda calculus (MLC), we develop ℓMLC as our core language
    which tracks error provenance and locations via type annotations. Building on this, we propose the Stellar framework,
    which automatically lifts the core language’s typing rules to the surface language while enabling error localization in
    the surface syntax. Stellar also ensures that the reported errors are fixable by incorporating extra premises into the
    lifted typing rules. We implement Stellar and evaluate it across various surface languages with different type structures,
    demonstrating that our approach precisely localizes errors and avoids unhelpful references to core-language constructs.
    Our evaluation suggests that Stellar can help surface programmers address type errors more effectively, enhancing the
    practicality of syntactic sugar in language engineering.'
