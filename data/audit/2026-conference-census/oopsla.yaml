- title: Synthesizing Graph Queries from Demonstrations
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e9e1d1a1-0cdb-4a15-9cd1-e782d6fcb4a4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Writing graph queries is challenging for non-experts due to the complexity of graph data models and the need to
    identify proper graph patterns. While recent research has advanced query synthesis for relational and document databases,
    the problem of synthesizing graph queries remains under-explored. We present a novel approach for synthesizing graph queries
    from computation demonstrations, where users specify the desired output through expressions over properties of input graphs.
    Our method addresses the challenge of inferring meaningful graph patterns for matching and efficiently constructing the
    remaining components of the query. Specifically, we combine graph mining, which identifies candidate patterns across input
    graphs, with deduction-based pruning, which guides an efficient synthesis of the filtering predicate and return clause.
    We have implemented our approach in a tool called DMiner and evaluated it on 90 benchmarks. Experimental results show
    that DMiner successfully synthesizes desired queries for 87 benchmarks, with an average synthesis time of 0.7 seconds
    per query. This outperforms both enumerative search and LLM baselines. We also conducted a user study, which shows that
    users can provide demonstrations with modest effort and 87.5% of the provided demonstrations are sufficient for DMiner
    to synthesize the desired query.
