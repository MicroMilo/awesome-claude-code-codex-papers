- title: When Do Staging Annotations Preserve Semantics? Mechanizing the Metatheory of Automatic Let-Insertion in Typed Multi-Stage
    Programming
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fa83ca78-a3d3-4880-b307-1c00a16812c0
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Multi-stage programming with quotations has long provided a powerful way to generate and manipulate code. By
    treating code as data, programmers can write multi-stage programs in which earlier stages produce specialized code from
    inputs available at generation time. Modern typed multi-stage languages (e.g., MetaML, MetaOCaml, Template Haskell, and
    Scala 3) adopt quotation/splicing constructs while enforcing the well-typedness of generated code. However, manipulating
    code fragments syntactically can subtly change evaluation order, leading to semantic discrepancies between a staged program
    and its unstaged counterpart, which is intended to serve as a reference implementation in many cases. The inconsistency
    complicates reasoning about correctness, and prevents staged code from being a drop-in replacement for its unstaged counterpart.
    In this paper, we study the design of multi-stage languages with semantics preservation guarantees. We develop two statically
    typed two-stage calculi, $\lambda_{\mid\mathsf{2}|}$-calculus and $\lambda_{\mid\mathsf{2}|}^{\mathsf{ref}}$-calculus,
    the latter supporting mutable references in the second stage. Their dynamic semantics models automatic let-insertion,
    tracked as a control effect in a lightweight type-and-effect system, enabling type-safe and semantics-preserving manipulation
    of effectful code fragments. We develop binary logical relations to prove strong semantics-preservation theorems: if a
    well-typed two-stage program $t_1$ evaluates to a value $\mathsf{code}~{t_2}$, then $t_2$ is contextually equivalent to
    the stage-erasure of $t_1$. Our calculi and their mechanized metatheory provide a simple and definitive answer to the
    question posed by Inoue and Taha of when staging annotations preserve semantics, and lay a foundation for future work
    on semantics-preserving multi-stage programming.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/103/When-Do-Staging-Annotations-Preserve-Semantics-Mechanizing-the-Metatheory-of-Automat
