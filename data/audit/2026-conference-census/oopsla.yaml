- title: Sound Enforcement of Dynamic Release Information Flow Policy
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5a54458e-9025-4a11-bfec-c3376c25a3cb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Information flow analysis is the de facto method of assessing confidentiality and integrity issues. However,
    the widespread adoption of information flow analysis in real-world systems is still lacking, partly due to a fundamental
    gap between theory and practice: the dynamic nature of security concerns in real-world systems goes beyond the scope of
    existing techniques that assume a static policy (i.e., data secrecy does not change). Recognizing the fundamental gap,
    a substantial amount of research has studied various aspects of it (e.g., enabling declassification, endorsement, and
    invocation policies). A recent work takes a step further by formalizing a promising end-to-end policy called dynamic release
    that unifies prior formalizations by allowing information flow restrictions to downgrade and upgrade in arbitrary ways.
    However, how to soundly enforce the powerful dynamic release policy is still an open question. In this paper, we present
    the first type system that enforces dynamic release policy and formally prove its soundness. More specifically, we (1)
    formalize a core language that enables dynamic release policy, (2) develop a type system that checks dynamic release policy,
    (3) develop new proof techniques and formally prove that the type system enforces dynamic release policy, and (4) implement
    a prototype of the type system as an extension to the Rust language, along with case studies on conference reviewing system
    and Civitas.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/118/Sound-Enforcement-of-Dynamic-Release-Information-Flow-Policy
