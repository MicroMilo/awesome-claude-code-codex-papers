- title: 'Code–Test Co-Translation: Towards Practical and Effective Program Migration in the Wild'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 534bc92e-bb08-4bfc-8f6e-ec09181d925e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Program migration, which involves translating software systems from one programming language to another, is essential
    for modernizing legacy systems and improving maintainability. Recent large language models (LLMs) have demonstrated strong
    performance in code translation; however, existing methods and benchmarks still exhibit key limitations. (1) They primarily
    focus on simple, self-contained snippets that fail to capture the complexity of real-world programs, and (2) they often
    assume that target-language test cases are readily available for evaluation and feedback, an unrealistic assumption given
    the difficulty of manually creating equivalent tests across languages. In this paper, we argue for a more \textit{practical}
    setting, termed the Code–Test Co-Translation (CTCT) problem, where both the program and its associated test suite should
    be jointly translated to preserve semantic and functional consistency. Through an empirical study on real-world programs,
    we identify two major challenges in CTCT: (1) the difficulty of measuring test-case consistency in the absence of ground
    truth, and (2) the ineffectiveness of existing iterative translation–repair strategies, which suffer from state degradation
    and poor initialization traps when handling complex, real-world features. To address these issues, we propose CoTTrans,
    a state-quality–aware iterative translation–repair framework guided by a novel Test Case Consistency (TCC) metric. TCC
    quantifies both syntactic and semantic consistency between source and translated tests, enabling fine-grained feedback
    that drives LLM-based refinement. CoTTrans further integrates TCC with test pass rates to assess state quality and triggers
    adaptive backtracking when low-quality states are detected during the translation. Evaluated on the BigCodeBench dataset,
    CoTTrans improves the translation correctness score from 0.360 to 0.675 on DeepSeek-V3, substantially outperforming existing
    methods, while TCC demonstrates superior effectiveness in measuring test consistency compared with existing metrics. These
    results show that CoTTrans enhances translation stability and accuracy, establishing a practical foundation for reliable
    code–test co-evolution in real-world program migration.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/116/Code-Test-Co-Translation-Towards-Practical-and-Effective-Program-Migration-in-the-Wi
