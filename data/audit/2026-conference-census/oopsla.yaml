- title: Probabilistic Floating-Point Round-Off Analysis via Concentration Inequalities
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 3b7ad515-2850-44fa-8999-5afe353482ea
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Floating-point round-off errors are ubiquitous in numerically intensive programs arising in fields such as scientific
    computing and optimization. As floating-point errors potentially lead to unexpected and catastrophic program failures,
    one must derive guaranteed round-off thresholds to ensure the correctness of these programs. However, deterministic round-off
    thresholds tend to be too conservative to be usable in practice, since they often involve large round-off errors that
    occur with small probability. Probabilistic thresholds relax deterministic ones by specifying that the probability of
    the round-off error exceeding a threshold is below a given confidence. In this work, we propose a novel approach to probabilistic
    round-off analysis, by applying concentration inequalities over the Taylor expansion from FPTaylor (TOPLAS 2018). A major
    obstacle in applying concentration inequalities is that the Taylor expansion involves absolute values that make the calculation
    of the expected values of the first order partial differential terms difficult. Our first step to overcome this obstacle
    is a sound over-approximation that removes the absolute values in polynomial expressions. Then, we show how to handle
    fractional expressions by a transformation into polynomial case. Finally, we show how to improve our approach with range
    partitioning. Our approach is scalable since the key computational part is the calculation of expected values of polynomial
    expressions with independent variables, for which the linear and independence properties of expectation boost the computation.
    Experimental results show that our approach is orders of magnitude more time efficient, while producing thresholds with
    comparable precision against the state of the art.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/33/Probabilistic-Floating-Point-Round-Off-Analysis-via-Concentration-Inequalities
