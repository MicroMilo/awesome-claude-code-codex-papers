- title: 'Scylla: Translating an Applicative Subset of C to Safe Rust'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 284736f2-f184-49db-9dad-4078f06c8bc1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The popularity of the Rust language continues to explode; yet, many critical codebases remain authored in C.
    Automatically translating C to Rust is thus an appealing course of action. Several works have gone down this path, handling
    an ever-increasing subset of C through a variety of Rust features, such as unsafe. While the prospect of automation is
    appealing, producing code that relies on unsafe negates the memory safety guarantees offered by Rust, and therefore the
    main advantages of porting existing codebases to memory-safe languages. We instead advocate for a different approach,
    where the programmer iterates on the original C, gradually making the code more structured until it becomes eligible for
    compilation to safe Rust. This means that redesigns and rewrites can be evaluated incrementally for performance and correctness
    against existing test suites and production environments. Compiling structured C to safe Rust relies on the following
    contributions: a type-directed translation from (a subset of) C to safe Rust; a novel static analysis based on “split
    trees” which allows expressing C’s pointer arithmetic using Rust’s slices and splitting operations; an analysis that infers
    which borrows need to be mutable; and a compilation strategy for C pointer types that is compatible with Rust’s distinction
    between non-owned and owned allocations. We evaluate our approach on real-world cryptographic libraries, binary parsers
    and serializers, and a file compression library. We show that these can be rewritten to Rust with small refactors of the
    original C code, and that the resulting Rust code exhibits similar performance characteristics as the original C code.
    As part of our translation process, we also identify and report undefined behaviors in the bzip2 compression library and
    in Microsoft’s implementation of the FrodoKEM cryptographic primitive.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/30/Scylla-Translating-an-Applicative-Subset-of-C-to-Safe-Rust
