- title: Reducing Hallucinations in LLM-Generated Code via Semantic Triangulation
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 2b6653dc-4ce3-40d1-9879-99e637e2dfd1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) can generate executable code from natural language descriptions, but the resulting
    programs frequently contain bugs due to hallucinations. In the absence of formal specifications, existing approaches attempt
    to assess correctness using LLM-generated proxies such as tests or auto-formalized specifications. However, these proxies
    are produced by the same imperfect models and thus often corroborate rather than catch errors, especially when the model
    exhibits correlated errors. We introduce semantic triangulation, a theory-grounded framework that decorrelates model errors
    by transforming the original problem into a dissociative variant - one likely requiring a fundamentally different algorithm
    - and checks consistency between independently sampled solutions to both problems. We identify theoretical requirements
    for this framework, and we prove that under a formal model of LLM hallucinations, these properties confer higher confidence
    in program correctness. We instantiate the framework through four concrete triangulation methods based on problem inversion,
    decomposition, and solution enumeration. Evaluated on LiveCodeBench and CodeElo across GPT-4o, DeepSeek-V3, and Gemini
    2.5 Flash, our tool increases the probability of selecting a correct program by 24% over baselines (test generation, metamorphic
    testing, and auto-formalized specifications) and achieves 26% higher F1 score in selection-or-abstention scenarios, while
    being the only method that consistently handles inexact problems admitting multiple valid solutions.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/151/Reducing-Hallucinations-in-LLM-Generated-Code-via-Semantic-Triangulation
