- title: Incremental Program Synthesis from Event Logs
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: c5da02b5-752b-4231-8709-0b11f4171d97
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The goal of program synthesis is to enable non-expert users to write programs by providing a specification instead
    of an implementation. To truly realize this goal, the specification must require no expertise and no effort to generate.
    We consider the problem of synthesizing automation scripts from only the logs that are automatically collected by many
    systems. Using our approach, users can automate tasks they usually perform manually, without having to know how to program
    them. Because logs are collected automatically, the synthesis approach needs to scale to large sets of logs. We present
    a new algorithm to solve this task by \emph{incrementally} extending an API-calling script with behavior exemplified by
    a sequence of log events, adding one sequence at a time. By minimizing the program modifications at each step, we preserve
    user intent and synthesize a program as general as possible. We show that our approach, implemented in a tool LogLoom,
    scales to synthesis tasks with more traces and more complex programs than existing techniques. LogLoom synthesizes scripts
    that are identical to reference solutions for 60 out of 72 benchmarks, compared to 14 for an existing symbolic approach
    and 39 for an LLM.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/86/Incremental-Program-Synthesis-from-Event-Logs
