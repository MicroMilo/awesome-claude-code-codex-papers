- title: 'Geo: A Query Rewrite Framework for Graph Pattern Mining'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: af77c63a-d85a-4c12-a386-e9e633936374
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Graph pattern mining is an important task for analyzing graph datasets. Graph mining systems typically require
    answering pattern matching queries, which involve solving the NP-complete subgraph isomorphism problem. To address this,
    domain experts often develop custom pattern matching query optimization strategies based on exploiting substructural similarities
    across different patterns. While these optimizers can be effective, their development is challenging due to the complex
    structural properties of the patterns (e.g., subsymmetries), which are difficult to address. This complexity limits the
    exploration of interactions between different optimization strategies and restricts experts from continuously improving
    the optimizers—such as by incorporating additional custom or general pattern-based equivalences over time. In this paper,
    we present a programmable pattern matching query optimizer called Geo, which automatically manages the interactions between
    various equivalences, ensures the optimizations do not affect the results, and simplifies the management of substructure
    equivalences. Geo exposes a simple but flexible language for expressing pattern equivalences as rewrite rules. By maintaining
    canonical representations of generated patterns during equality saturation, Geo avoids issues arising from syntactic differences
    in isomorphic patterns. Additionally, it tracks provenance across equivalences to ensure the reconstructability of desired
    outputs. Our evaluation demonstrates that Geo can discover novel query equivalences through complex composition of various
    rewrite rules, enabling our optimized queries to achieve a cost reduction of up to 99% compared to the queries in prior
    work. We further test Geo’s effectiveness at speeding up practical graph mining problems by using it in two representative
    case studies – approximate pattern matching and quasi-clique mining, and find it is highly effective at optimizing these
    tasks, enabling cost reductions of up to 99%.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/39/Geo-A-Query-Rewrite-Framework-for-Graph-Pattern-Mining
