- title: Compiling Quantum Regular Language States
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: a6af10e9-e5a7-4e84-8d42-058b7be7754a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'State preparation compilers for quantum computers typically sit at two extremes: general-purpose routines that
    treat the target as an opaque amplitude vector, and bespoke constructions for a handful of well-known state families.
    We ask whether a compiler can instead accept simple, structure-aware specifications while providing predictable resource
    guarantees. We answer this by designing and implementing a quantum state-preparation compiler for regular language states
    (RLS): uniform superpositions over bitstrings accepted by a regular description, and their complements. Users describe
    the target state via (i) a finite set of bitstrings, (ii) a regular expression, or (iii) a deterministic finite automaton
    (DFA), optionally with a complement flag. By translating the input to a DFA, minimizing it, and mapping it to an optimal
    matrix product state (MPS), the compiler obtains an intermediate representation (IR) that exposes and compresses hidden
    structure. The efficient DFA representation and minimization offloads expensive linear algebra computation in exchange
    of simpler automata manipulations. The combination of the regular-language frontend and this IR gives concise specifications
    not only for RLS but also for their complements that might otherwise require exponentially large state descriptions. This
    enables state preparation of an RLS or its complement with the same asymptotic resources and compile time, which to our
    knowledge is not supported by existing compilers. We outline two hardware-aware backends: SeqRLSP, which yields linear-depth,
    ancilla-free circuits for linear nearest-neighbor architectures via sequential generation, and TreeRLSP, which achieves
    logarithmic depth on all-to-all connectivity via a tree tensor network. On the theory side, we prove circuit-depth and
    gate-count bounds that scale with the system size and the maximal Schmidt rank of the target state, and we give compile-time
    bounds that expose the benefit of the initial DFA representation. We implement the full pipeline and evaluate it on Dicke
    and W states, random uniform superpositions, and complement states, comparing against general-purpose, sparse-state, and
    specialized baselines.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/84/Compiling-Quantum-Regular-Language-States
  abstract_sha256: 47b035b6a6a891269a19a82d83ed5da26e68de97857b80d98b70222b642e0db5
