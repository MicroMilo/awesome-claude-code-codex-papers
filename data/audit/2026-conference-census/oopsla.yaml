  official_record_id: af71c34c-251f-4337-bff4-6538153c5ccc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Deep learning (DL) libraries are widely used in critical applications, where even subtle silent bugs can lead
    to serious consequences. While existing DL fuzzing techniques have made progress in detecting crashes, they inherently
    struggle to detect silent bugs due to the lack of effective test programs and corresponding oracles. Building on the observation
    that historical bug reports contain rich, underutilized information about silent bugs, we leverage large language models
    (LLMs) to perform \emph{versatile yet controlled} bug transfer for silent bug fuzzing. Specifically, our approach uses
    LLMs to extract context-aware bug patterns from historical issues, match semantically related APIs using functionality-based
    embeddings, and synthesize test cases with customized oracles. This enables proactive detection of silent bugs by transferring
    high-risk contexts and oracle designs from known buggy APIs to functionally similar target APIs. To ensure the reliability
    of our context-aware bug transfer, we introduce an LLM-powered self-validation module that systematically evaluates the
    validity of each transferred bug instance. We implement this methodology in a tool named TRANSFUZZ and evaluate it on
    three mainstream DL libraries: PyTorch, TensorFlow, and MindSpore. TRANSFUZZ successfully discovers 79 previously unknown
    bugs (12 confirmed as CVEs) in 10 bug types, demonstrating its effectiveness and generalizability in migrating DL library
    bug discovery capabilities.'
