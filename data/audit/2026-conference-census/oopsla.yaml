- title: Revisiting Row Polymorphism for Set-Theoretic Types
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: abcb1288-771a-434e-92a4-fc303f1f21f3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Set-theoretic types support expressive record types through unions, intersections, and negations, but they lack
    the row polymorphism needed to type operations that propagate unknown fields across records. Prior work addresses this
    by allowing Boolean combinations of rows in type substitutions, which complicates the formalism and prevents the tallying
    algorithm from being complete. We propose an alternative: instead of enriching substitutions, we allow Boolean combinations
    of row variables directly within record type constructors, where the tail of a record has the same shape as any field.
    This design keeps substitutions simple—a row variable maps to a single row—and yields a natural extension of the subtyping
    and tallying algorithms. Tallying is complete for all solutions whose rows are constant over labels not mentioned in the
    constraints. We implement our approach in the set-theoretic type library SSTT and the type checker MLsem, providing the
    first implementation of a type system that combines semantic subtyping with row polymorphism. We demonstrate the expressiveness
    of the system by encoding several data structures from the R programming language: heterogeneous lists, variadic function
    arguments, and class-based dispatch.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/131/Revisiting-Row-Polymorphism-for-Set-Theoretic-Types
  abstract_sha256: 73dc944792add4230e82d28a17877fa354de60c9fd0b3e3e846abb9578dda54a
