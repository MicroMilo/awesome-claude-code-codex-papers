  official_record_id: 974f3d09-f394-4105-a2e0-48c780e255d7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Data stores are widely used because they provide persistence, scalability, and fault tolerance with a simple interface.
    However, most data store applications configure the data store to use weak isolation to achieve scalable performance,
    resulting in sporadic unserializable executions that are incorrect or fail. Prior work uses dynamic predictive analysis
    to infer violations from execution traces, but it cannot handle relational (i.e., SQL) queries with complex predicates,
    and it predicts executions that do not violate View Serializability. This paper introduces Augur, the first dynamic predictive
    program analysis that (1) supports data store applications with complex relational queries and (2) reports only executions
    that violate View Serializability. The evaluation demonstrates that Augur finds feasible, unserializable executions in
    the widely used OLTP-Bench programs and in the widely used e-commerce application Spree.
