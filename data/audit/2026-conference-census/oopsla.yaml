  official_record_id: 2bc0e8f2-2202-403e-8b05-c7c392e9c858
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Invariant synthesis is a fundamental problem in program verification, yet existing learning-based approaches rarely
    exploit the inherent symmetry present in many programs, particularly parameterized and concurrent systems. Such symmetry
    induces a symmetric reachable state space, naturally yielding symmetric samples and admitting symmetric invariants, motivating
    the task of learning symmetric invariants from symmetric samples. To this end, we introduce symmetric decision trees (SDTs),
    a novel hypothesis class that enforces symmetry structurally, guaranteeing symmetric invariants by construction. Furthermore,
    we develop a learning algorithm to construct SDTs and integrate it as the learner within the Horn-ICE framework, yielding
    our approach, Horn-SDT. Empirical evaluation on parameterized programs demonstrates that Horn-SDT achieves faster convergence
    and constructs more compact trees compared to non-symmetric baselines.
