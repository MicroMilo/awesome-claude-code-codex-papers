- title: Understanding Accelerator Compilers via Performance Profiling
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f6e4e288-6e2b-4fbe-9ade-e8ba7df37a47
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Accelerator design languages (ADLs), high-level languages that compile to hardware units, help domain experts
    quickly design efficient application-specific hardware. ADL compilers optimize datapaths and convert software-like control
    flow constructs into control paths. Such compilers are necessarily complex and often unpredictable: they must bridge the
    wide semantic gap between high-level semantics and cycle-level schedules, and they typically rely on advanced heuristics
    to optimize circuits. The resulting performance can be difficult to control, requiring guesswork to find and resolve performance
    problems in the generated hardware. We conjecture that ADL compilers will never be perfect: some performance unpredictability
    is endemic to the problem they solve. In lieu of compiler perfection, we argue for compiler understanding tools that give
    ADL programmers insight into how the compiler’s decisions affect performance. We introduce Petal, a cycle-level profiler
    for ADLs that compile to the Calyx intermediate language (IL). Petal instruments the Calyx code with probes and then analyzes
    the trace from a register-transfer-level simulation. It then maps the events in the trace back to high-level control constructs
    in the Calyx code to determine when each construct was active. Petal processes that information into a trace of \emph{call
    trees}, each representing active events in a specific cycle and their relationships. Lastly, Petal uses metadata generated
    by the ADL compiler to construct an ADL-level profile. Using case studies, we demonstrate that Petal’s cycle-level profiles
    can identify performance problems in existing accelerator designs. We show that these insights can also guide developers
    toward optimizations that the compiler was unable to perform automatically, including a reduction by 46.9% of total cycles
    for one application.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/135/Understanding-Accelerator-Compilers-via-Performance-Profiling
