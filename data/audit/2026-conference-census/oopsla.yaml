- title: 'IRIDIUM: A Framework for Statically Optimizing JavaScript Programs'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 47f29dee-ad96-4eb6-83da-75cd44ba5bd6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Static analysis of JavaScript remains notoriously difficult due to the language’s dynamically typed nature, unconventional
    scoping rules, and pervasive side effects. Unlike mature infrastructures such as LLVM for C/C++ or Soot for Java, comparable
    frameworks for JavaScript are fragmented and limited in scope. In this paper, we introduce IRIDIUM, a first-of-its-kind
    framework to statically optimize JavaScript programs. IRIDIUM systematically lowers JavaScript into a structured intermediate
    representation (called IRI) that models bindings, environments, and control flow explicitly. The resultant expressiveness
    enables more predictable analyses and transformations, ranging from dataflow tracking to optimization passes to executable
    code generation for existing runtimes, that are otherwise hindered by the language’s complexity. By bridging the gap between
    JavaScript’s surface syntax and the requirements of static analysis, IRIDIUM, thus, lays the foundation for a new generation
    of tools that can reason effectively about modern JavaScript applications.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/71/IRIDIUM-A-Framework-for-Statically-Optimizing-JavaScript-Programs
