- title: Efficient Incremental GR(1) Synthesis via Monotonic Fixed-Point Reuse
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 9e7632a3-74cf-498b-acac-5389a62c3926
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Although reactive synthesis guarantees correct-by-construction implementations, its practical adoption is limited
    by a performance bottleneck in the iterative design-and-refinement cycle of formal specifications. GR(1) synthesizers
    perform redundant, from-scratch computations for each specification modification, severely slowing the development workflow.
    To address this inefficiency, we propose an incremental synthesis method that exploits the monotonicity of the underlying
    fixed-point computations. By reusing the system winning region from the preceding check, our method significantly accelerates
    realizability check. Our work provides a fundamental explanation for the failure of prior incremental approaches in the
    unrealizable core minimization algorithm \texttt{DDMin}, and successfully leverages this insight to accelerate iterative
    development, where specification changes are typically localized. We extend incremental analysis to the full GR(1) specification
    scope, encompassing both system guarantees and environment assumptions, and introduce two novel heuristics for early fixed-point
    detection. Evaluated on a large-scale benchmark of 8,282 specifications, our method exhibits a strong positive correlation
    between performance gain and specification complexity. For the most challenging specifications, which constitute the primary
    bottlenecks in development, our approach achieves speedups of several orders of magnitude, reducing computation times
    in some cases from nearly an hour to just seconds.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/36/Efficient-Incremental-GR-1-Synthesis-via-Monotonic-Fixed-Point-Reuse
