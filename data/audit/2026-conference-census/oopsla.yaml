- title: Static Factorisation of Probabilistic Programs With User-Labelled Sample Statements and While Loops
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 02bf0cf8-f4a0-4899-9eb5-fa8823c44050
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'It is commonly known that any Bayesian network can be implemented as a probabilistic program, but the reverse
    direction is not so clear. In this work, we address the open question to what extent a probabilistic program with user-labelled
    sample statements and while loops – features found in languages like Gen, Turing, and Pyro – can be represented graphically.
    To this end, we extend existing operational semantics to support these language features. By translating a program to
    its control-flow graph, we define a sound static analysis that approximates the dependency structure of the random variables
    in the program. As a result, we obtain a static factorisation of the implicitly defined program density, which is equivalent
    to the known Bayesian network factorisation for programs without loops and constant labels, but constitutes a novel graphical
    representation for programs that define an unbounded number of random variables via loops or dynamic labels. We further
    develop a sound program slicing technique to leverage this structure to statically enable three well-known optimisations
    for the considered program class: we reduce the variance of gradient estimates in variational inference and we speed up
    both single-site Metropolis Hastings and sequential Monte Carlo. These optimisations are proven correct and empirically
    shown to match or outperform existing techniques.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/24/Static-Factorisation-of-Probabilistic-Programs-With-User-Labelled-Sample-Statements-a
