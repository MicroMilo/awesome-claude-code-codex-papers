- title: 'Bonsai: Efficient and Optimal Automatic Tensor Rematerialization for Memory-Constrained DNN Training'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e679ccbc-5132-4ca2-b19a-253c6db4fed7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: GPU memory is increasingly the primary bottleneck in scaling deep neural network (DNN) training, where the activation
    tensor’s footprint of a model may exceed the memory capacity. Tensor recomputation is a powerful technique that trades
    additional computation for reduced peak memory usage. However, existing approaches face a fundamental tension between
    performance optimality and computational scalability. On the one hand, solvers leverage Integer Linear Programming (ILP)
    to provide mathematically optimal solutions but suffer from the combinatorial explosion of the search space and thus become
    intractable for modern DNN models. On the other hand, heuristics-based approaches achieve scalability but sacrifice optimality
    altogether, resulting in suboptimal execution schedules. The root cause of these inefficiencies in the state of the art
    is the mismatch in abstraction. This paper introduces Bonsai, a framework that tackles this scalability-granularity tension.
    At the heart of Bonsai is a novel abstraction of operator segmentation that breaks the computation graph into flexible,
    variable-sized units to enable a lightweight yet effective segment-based ILP formulation. By having segments, Bonsai collapses
    the search space and prunes redundant solutions that stall existing solvers. This abstraction enables Bonsai to maintain
    a holistic view of the entire model, ensuring that no optimization opportunity is lost while reducing the number of decision
    variables by orders of magnitude. The evaluation across a diverse set of DNN architectures and models demonstrates that
    Bonsai scales to real-world models, is up to 10.13$\times$ lower solver cost than state-of-the-art ILP solvers, and delivers
    up to 11% improvement in training throughput.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/136/Bonsai-Efficient-and-Optimal-Automatic-Tensor-Rematerialization-for-Memory-Constrain
