- title: Composing CRDTs Convergent by Construction
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3839478
  official_record_id: 1f44338d-e891-4413-a52a-5ff1c7d4002e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Conflict-Free Replicated Data Types (CRDTs) are abstract data types that ensure eventual convergence among data
    replicas in distributed systems. As they provide convergence out-of-the-box, CRDTs have become key building blocks for
    highly available, collaborative, and offline-capable systems, powering applications from real-time editors to distributed
    databases. Adopting an individual CRDT is straightforward, but real-world software routinely requires composing them.
    For example, an application might store a set of counters, combining a set CRDT with a counter CRDT. Unfortunately, classical
    CRDT theory does not guarantee that a composition of convergent CRDTs converges, forcing developers to reason about convergence
    again - the very burden CRDTs were introduced to remove. In this paper, we introduce a compositional framework for a broad
    class of operation-based CRDTs. It assembles CRDTs from five principal combinators – Product, MapState, Associate, Traverse,
    and MapInterpretation – each with built-in convergence guarantees. Any CRDT assembled from these combinators is itself
    a CRDT, preserving convergence by construction. This set is free of redundancy and subsumes previously proposed combinators.
    We develop the framework, its underlying theory, and its proofs entirely in Lean 4, producing a single artifact that serves
    as both the formal model and an executable, verified implementation. Our reusable library, Crdtlib, provides implementations
    and proofs for every combinator and CRDT in this paper. Our case studies (i) implement common CRDTs from Shapiro et al.,
    (ii) apply the combinators in a complete application, and (iii) encode a JSON-structured tree CRDT as expressive as Automerge,
    with competitive runtime and memory use. These case studies show that developers can compose CRDTs without re-proving
    convergence for each composite.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/104/Composing-CRDTs-Convergent-by-Construction
