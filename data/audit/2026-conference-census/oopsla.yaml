- title: Context-Free Language Reachability via Efficient Relation Chaining
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b51ce816-3462-4e83-8ed2-c1174de58d2d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Context-free language (CFL) reachability is a fundamental framework widely used to model a variety of program
    analysis tasks, though it often suffers from inherent inefficiency due to its (sub)cubic time complexity. In this paper,
    we propose a novel perspective, \emph{relation chaining}, which interprets CFL-reachability solving as the process of
    chaining labeled edges representing binary relations. This formulation exposes substantial derivation redundancy (in terms
    of frequent and repetitive chaining operations) arising from inefficient chaining strategies employed by existing approaches.
    To address this, we introduce SQUID, a new algorithm that incorporates two simple yet effective chaining techniques—\emph{adaptive
    chaining} and \emph{differential chaining}—built upon an enhanced graph representation. We have implemented SQUID as a
    standalone tool and evaluated it against two state-of-the-art CFL-reachability solvers and a leading Datalog solver across
    three key program analyses: field-sensitive alias analysis and context-sensitive value-flow analysis for C/C++, and field-sensitive
    points-to analysis for Java. Experimental results show that SQUID substantially improves the scalability of CFL-reachability
    solving by effectively reducing a large portion of redundant chaining operations.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/69/Context-Free-Language-Reachability-via-Efficient-Relation-Chaining
