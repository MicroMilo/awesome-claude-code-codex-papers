- title: Automatically Generating ML Compiler Backends from Tensor Accelerator ISA Descriptions
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 44e762b3-0b12-4a85-9b47-ce43bad26a4c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Machine learning (ML) compilers play a key role in enabling high-performance implementations of ML workloads.
    These compilers use existing CPU and GPU backends to generate device-specific code. In recent years, many tensor accelerators
    (or AI accelerators) have been designed to further accelerate these workloads, with commercial products like AWS Trainium
    publicly available. However, compared to commodity hardware, a majority of tensor accelerators do not have mature ML compiler
    backends with robust code generation support. Moreover, tensor accelerator designs are subject to fast iteration cycles,
    making it difficult to manually develop and maintain ML compiler backends. Therefore, to enable faster integration of
    novel tensor accelerator designs in ML infrastructure, we need to make the compiler backend construction process more
    agile. In this paper, we introduce ABG, a compiler backend generator that automatically generates compiler backends for
    tensor accelerators, given just the instruction set architecture (ISA) descriptions. These backends are integrated with
    XLA, a production ML compiler. ABG uses a novel ISA-parameterized compilation algorithm to generate a compiler backend
    with an equality-saturation-based instruction selection phase and a constraint-programming-based memory allocation phase.
    We generated compiler backends for 6 accelerator platforms from industry (e.g., AWS Trainium, Intel AMX) and academia
    (e.g., Gemmini). We showed that these generated backends match or outperform commercial compiler backends and expert-written
    kernel libraries, while maintaining low compilation overheads. Notably, ABG-generated backend for AWS NKI ISA improved
    the code generation coverage for AWS Trainium by 2.1x compared with AWS’s production compiler, neuronx-cc.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/83/Automatically-Generating-ML-Compiler-Backends-from-Tensor-Accelerator-ISA-Description
