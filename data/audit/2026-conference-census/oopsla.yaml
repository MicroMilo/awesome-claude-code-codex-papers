  official_record_id: 27b44979-aa1b-4f8a-a308-9c381a7ab2ce
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Refinement types often use SMT solvers to automate program verification. However, since SMT solvers are first-order,
    verification of properties that requires higher-order reasoning is not possible. Proof by Logical Evaluation (PLE) is
    an algorithm that provides a layer between refinement types and SMT solvers that permits symbolic evaluation of functions,
    but it lacks support for higher-order reasoning. We introduce PLEX, an extension to PLE, that supports $\eta$-expansions,
    $\beta$-reductions, and dependent pattern matching. We prove that PLEXis sound and terminating, describe its implementation
    in Liquid Haskell, and evaluate it on examples that make essential use of higher-order data, and as such cannot be handled
    by PLE. The new PLEX algorithm bridges the gap between higher-order languages and first-order SMT solvers via the practical
    technique of refinement types.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/48/PLEX-Normalization-for-Refinement-Types
