- title: 'CLower: Detecting Compiler Pessimization Bugs through Redundant Memory Accesses'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: de96066c-56e3-4fd1-8145-8f5ae7e566f6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Compilers are expected to generate optimized code, but they sometimes introduce pessimizations, quality-degrading
    redundant instructions. These bugs not only incur performance overhead but also, critically, expand the attack surface
    by introducing unexpected side effects (e.g., redundant memory accesses) without breaking compilation correctness. Existing
    bug-finding methods are neither designed for nor effective at identifying such security-sensitive pessimizations. This
    paper presents CLower, a novel, black-box approach for automatically detecting compiler pessimizations via redundant memory
    accesses. CLower’s core insight is that any extra global memory accesses in a fully optimized binary, compared to the
    source, indicate a pessimization. To reliably distinguish compiler-introduced redundancy from source-level redundancy,
    we generate random C programs in which each global variable has a predetermined, controlled number of memory accesses.
    CLower then executes the instrumented binary and verifies whether superfluous accesses have been introduced during compilation.
    We applied CLower to GCC and LLVM, reporting 23 unique bugs (21 in GCC, 2 in Clang), with 16 confirmed as new pessimization
    bugs. Our evaluation shows that CLower accurately detects diverse, impactful pessimization bugs, the majority of which
    (75%) also manifest for heap-allocated objects, demonstrating that the underlying compiler flaws are general and not limited
    to global memory. Furthermore, we identify a systematic conflict between compiler optimizations and pessimization bugs,
    which causes many such bugs to remain hidden in compiler versions. This study sheds light on the under-explored area of
    compiler pessimization and provides a practical tool for improving compiler quality.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/50/CLower-Detecting-Compiler-Pessimization-Bugs-through-Redundant-Memory-Accesses
