- title: 'Granthi: Higher-Order Quantum Programming via Unitary Wiring'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b9f7d7ed-6946-4261-a773-df7690332725
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Existing quantum programming languages confine higher-order structure to a classical host while restricting the
    quantum layer to first-order operations on qubits. This paper presents Granthi, a purely unitary higher-order quantum
    programming language built on three design commitments: quantum programs are first-class values that may be passed, returned,
    and coherently composed; additive structure is tag-preserving routing rather than observational branching, so control
    may remain in superposition; and programmer-facing finite label types with named reversible operations provide domain-level
    control spaces without exposing tag management. Every well-typed term—including at function type—denotes a unitary on
    its boundary interface, and the compiler realizes exactly its wiring as a quantum circuit on the physical qubit layout
    (assuming correctness of the pytket backend). Granthi is implemented end-to-end: an OCaml DSL elaborates surface programs
    through a binder-free core IR to executable quantum circuits via pytket. The language directly supports the quantum switch—the
    paper’s running example, compiled to a static circuit—as well as interference on control-flow history and structured finite
    control, all within the purely unitary fragment.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/122/Granthi-Higher-Order-Quantum-Programming-via-Unitary-Wiring
  abstract_sha256: f8e206625fe2248cfbdf2d5709d71927ff1d4e0608d38dd69f194c23d143e134
