- title: 'Seeking Evidence of Further Optimization: Detecting Missed Optimizations through Compiler''s Native Analyses'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 52083ebb-d92f-41df-8858-bb1d7c2438ce
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Compilers are central to software performance, yet even mature optimization pipelines such as LLVM’s and GCC’s
    often miss optimization opportunities. Existing approaches for detecting missed compiler optimizations are constrained
    by the challenge of reliably determining whether a specific optimization has been applied, leading to a fundamental weakness
    in their ability to generalize to real-world software. This paper presents a new paradigm for detecting missed compiler
    optimizations. The key idea is utilizing compiler’s native analyses to directly examine the compiler’s optimized output
    and identify code regions that remain further optimizable—evidence that some optimization opportunities were missed. We
    develop two strategies to realize this idea: one that queries analyses independent of the missed optimization, effectively
    leveraging their otherwise unused reasoning results, and another that rewrites code into semantically equivalent forms
    to activate otherwise incompatible analyses. We conduct an extensive evaluation of our approach on LLVM using all 219
    projects from LLVM Opt Benchmark, a suite used by LLVM developers to measure the performance impact of compiler updates
    on real-world software. Across these programs, our tool discovers 31,616 missed optimization opportunities with zero false
    positives. By analyzing them, we have identified and reported 25 issues to LLVM developers; 20 have already been patched
    or confirmed. Applying LLVM official patches to our reported issues consistently yielded runtime speedups of up to 12.96%
    for affected software and compile-time reductions of up to 7.55%.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/80/Seeking-Evidence-of-Further-Optimization-Detecting-Missed-Optimizations-through-Comp
