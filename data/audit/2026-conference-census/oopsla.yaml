  full_text_scan: metadata-filtered
  official_record_id: 2f97ae28-fa33-4e89-8fa3-34a2e31ad14b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Reasoning about the correctness of distributed systems is a significant challenge, with precise correctness specifications
    serving as an essential prerequisite to verification. However, identifying and formulating specifications remains a major
    hurdle for developers in practice. Specy addresses this challenge by automatically learning specifications from observable
    \emph{event traces} generated by message exchanges in distributed systems. The system employs a specialized grammar tailored
    for event-based specifications, incorporating support for quantifiers over events – a capability essential for capturing
    the complex behavioral patterns inherent in distributed protocols. Specy utilizes a novel learning procedure that combines
    grammar-based enumerative search with dynamic learning from event traces, providing effective control over the specification
    search. We evaluated Specy on established distributed protocols and industrial case studies, demonstrating its ability
    to successfully learn important protocol specifications. Specy can discover previously unidentified specifications overlooked
    by developers, automatically derive inductive invariants that were previously constructed manually for verification purposes,
    and, through run-time monitoring in production systems, reveal gaps in testing coverage – highlighting opportunities to
    leverage specifications in practice.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/10/Specy-Learning-Specifications-for-Distributed-Systems-from-Event-Traces
