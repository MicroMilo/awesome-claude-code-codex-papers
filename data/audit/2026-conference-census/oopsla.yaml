- title: Probabilistic Programming with Programmable Divide-Conquer-Combine Inference on Modern Hardware
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 97dd3ced-4322-4e5f-98b3-e572c7a8031a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Universal probabilistic programming languages (PPLs) enable the specification of models with stochastic support
    structure. Posterior inference is notoriously hard for this class of models and remains difficult to accelerate on modern
    hardware. In response to these challenges, we introduce Upix - the first probabilistic programming system that realises
    the divide-conquer-combine (DCC) inference algorithm as a framework. In Upix, a model expressed in a universal PPL is
    automatically split into multiple sub-models with static support structure, which are then compiled with JAX for execution
    on accelerator hardware. The system allows extensive customisation of inference algorithms by incorporating established
    concepts from programmable inference literature. To evaluate our system, we implemented two existing DCC algorithms in
    Upix and instantiated three novel algorithms. We show that our implementation can result in better approximation quality
    compared to existing approaches by achieving up to 960 times more computation within the same time budget. On machines
    with up to 64 CPU cores and 8 GPU devices, we demonstrate that Upix enables the scaling of inference algorithms to workloads
    that are impractically slow for CPUs and prior methods.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/159/Probabilistic-Programming-with-Programmable-Divide-Conquer-Combine-Inference-on-Moder
