- title: 'Beer: Interactive Alarm Resolution in Bayesian Program Analysis via Exploration-Exploitation'
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3798214
  official_record_id: c010f0c9-6c89-494f-b1d8-905039c9c8ca
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Interactive Bayesian program analysis enhances static analysis by modeling derivations as probabilistic dependencies,
    enabling ranking alarms by calculated confidences, proposing highly likely alarms for user inspection, and updating confidences
    with inspection results. Existing interactive approaches adopt a purely greedy, exploitation-only selection strategy that
    always inspects the highest-confidence alarm. However, such strategies are prone to local optima, leading to redundant
    inspections and delayed identification of true alarms. We propose BEER (Bayesian Exploration–Exploitation Ranker), a framework
    that systematically integrates the exploration–exploitation trade-off into Bayesian program analysis. BEER leverages structural
    correlations between alarms—derived from shared root causes in the Bayesian model—to estimate information gain and guide
    exploration. When repeated false alarms indicate model stagnation, BEER selects alarms from minimally explored, highly
    correlated clusters to accelerate learning. Implemented atop the Bingo framework, BEER achieves up to 38% effectiveness
    in ranking efficiency over the greedy baseline on data-race and thread-escape analyses, demonstrating the efficacy of
    exploration-guided alarm resolution.
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/15/Beer-Interactive-Alarm-Resolution-in-Bayesian-Program-Analysis-via-Exploration-Explo
