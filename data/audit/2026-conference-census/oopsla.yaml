- title: Type-Directed Discretization of Probabilistic Programs
  official_url: https://conf.researchr.org/track/splash-2026/oopsla-2026
  track: OOPSLA
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 9c1c950b-3935-4fd0-97dc-bf5d4544b10b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We study \emph{exact discretization} as a semantics-preserving transformation for recursive, higher-order probabilistic
    programs with continuous distributions. We target programs where continuous values are compared against finitely many
    constants, so exact inference reduces to a discrete problem. Our central technical contribution is a non-local, type-directed
    analysis that infers where continuous values can be partitioned into finitely many observationally relevant regions, then
    rewrites sampling and comparison behavior over those regions. We call this transformation Slice. Because this construction
    is global and type-directed, correctness is not a local syntactic argument: we formalize the transformation and prove
    soundness for boolean queries using a coupling-style logical-relations argument over operational semantics. As an application,
    transformed programs can be executed by discrete engines such as Dice, Roulette, and Storm. Our empirical evaluation shows
    two complementary strengths of Slice when paired with discrete backends: it enables \emph{exact inference} for challenging
    continuous programs that lie beyond the reach of previous exact systems, and, on benchmarks where direct comparison is
    possible, it is competitive with state-of-the-art exact inference systems for continuous programs.'
  abstract_source_url: https://2026.splashcon.org/details/oopsla-2026/160/Type-Directed-Discretization-of-Probabilistic-Programs
