- title: 'ScanCoder: Leveraging Human Attention Patterns to Enhance LLMs for Code'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: f0c88584-6789-4394-9996-a87b4b42058d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Code comprehension is a fundamental challenge in software engineering that impacts developer productivity and
    software quality. While Large Language Models (LLMs) demonstrate strong capabilities in code generation and summarization,
    they process code differently from human developers, who employ strategic attention patterns focused on semantically critical
    elements. Recent research has successfully integrated human attention patterns captured through eye-tracking into AI models
    for software engineering tasks, however, existing human-AI approaches face critical limitations that prevent widespread
    practical deployment, particularly for LLM enhancement. Existing approaches to incorporate human cognitive insights face
    scalability limitations due to resource-intensive eye-tracking studies and lack empirical validation for cross-language
    generalizability. We present \textit{ScanCoder}, a framework that integrates cognitive simulation with LLM enhancement
    through (1) generating human-like attention patterns at scale using minimal eye-tracking data via cognitive simulation
    with Adaptive Character of Thought-Rational (ACT-R) architecture, and (2) cognitively-guided fine-tuning that emphasizes
    tokens according to their cognitive salience and attention order. Our approach demonstrates cross-language transfer by
    applying C++-derived cognitive patterns to enhance Java programming tasks. Comprehensive evaluation on CodeXGLUE benchmarks
    shows consistent improvements across different LLM architectures, achieving gains of 39% for CrystalBLEU completion metrics
    and 22% for BERTScore summarization. Mechanistic analysis reveals that cognitive guidance reshapes model attention in
    task-dependent ways, increasing focus on semantically critical tokens by 2.5×. This work establishes the first scalable
    framework for integrating simulated human cognitive patterns into LLM training, enabling more interpretable and effective
    code understanding.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/85/ScanCoder-Leveraging-Human-Attention-Patterns-to-Enhance-LLMs-for-Code
