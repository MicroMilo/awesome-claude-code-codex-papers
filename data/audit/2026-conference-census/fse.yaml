  abstract: LLM-based mutation testing is rapidly emerging as a promising testing technology, but existing approaches typically
    rely on a fixed set of mutations as few-shot examples or none at all. This can result in generic low-quality mutations,
    missed context-specific mutation patterns, substantial numbers of redundant and uncompilable mutants, and limited semantic
    similarity to real bugs. To overcome these limitations, we introduce SMART. SMART integrates retrieval-augmented generation
    (RAG) on a vectorized dataset of real-world bugs, focused code chunking, and supervised fine-tuning using mutations coupled
    with real-world bugs. We conducted an extensive empirical study of SMART using 1,991 real-world Java bugs from the Defects4J
    and ConDefects datasets, comparing SMART to the state-of-the-art LLM-based approaches, LLMut and LLMorpheus. The results
    reveal that SMART substantially improves mutation validity, effectiveness, and efficiency (even enabling small-scale 7B-scale
    models to match/surpass large models like GPT-4o). We also demonstrate that SMART significantly impacts downstream Software
    Engineering applications to test case prioritization and fault localization. More specifically, SMART improves validity
    (weighted average generation rate) from 42.89% to 65.6%. It raises the non-duplicate rate from 87.38% to 95.62%, and the
    compilable rate from 88.85% to 90.21%. In terms of effectiveness, it achieves a real bug detection rate of 92.61% (vs.
    57.86% for LLMut) and improves the average Ochiai coefficient from 25.61% to 38.44%. For fault localization, it locates
    64 more bugs by MUSE and 57 bugs by Metallaxis as Top-1.
