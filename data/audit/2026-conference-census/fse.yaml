  abstract: Jailbreak attacks have been regarded as a crucial threat to LLM-powered software systems. Recent studies indicate
    the existence of a steering vector within models’ internal activations, which can adjust a model’s propensity to reject
    user requests, and thus is regarded as an effective approach for training-free defense. However, attackers may wrap their
    malicious intentions within a seemingly benign context, which shifts the distribution of harmful prompts toward benign
    inputs along the steering vector, effectively bypassing existing defense approaches. In this work, we propose a defense
    framework InDe-LLM based on intention disentangling. By projecting the embedding of inputs into a benign-invariant subspace,
    we could disentangle the harmful intentions of jailbreak prompts without affecting benign inputs. Next, such disentangled
    harmful intentions can be easily identified based on LLMs’ well-aligned concept of harmfulness, and rejected through activation
    steering. Our experiments show that InDe-LLM achieves high defense effectiveness, outperforming baselines by 27.2%–43.5%
    across three models and ten attacks while preserving high utility on benign inputs. Moreover, our evaluation demonstrates
    that it exhibits high transferability to unseen attacks.
