- title: 'MR-Coupler: Automated Metamorphic Test Generation via Functional Coupling Analysis'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: cf29cbf6-05f4-4e9c-a221-b0260ae5a3a1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Metamorphic testing (MT) is a widely recognized technique for alleviating the oracle problem in software testing.
    However, its adoption is hindered by the difficulty of constructing effective metamorphic relations (MRs), which often
    require domain-specific or hard-to-obtain knowledge. In this work, we propose a novel approach that leverages the functional
    coupling between methods, which is readily available in source code, to automatically construct MRs and generate metamorphic
    test cases (MTCs). Our technique, MR-Coupler, identifies functionally coupled method pairs, employs large language models
    to generate candidate MTCs, and validates them through test amplification and mutation analysis. In particular, we leverage
    three functional coupling patterns to avoid expensive enumeration of possible method pairs, and a novel validation mechanism
    to reduce false alarms. Our evaluation of MR-Coupler on 100 human-written MTCs and 50 real-world bugs shows that it generates
    valid MTCs for over 90% of tasks, improves valid MTC generation by 64.90%, and reduces false alarms by 36.56% compared
    to baselines. Furthermore, the MTCs generated by MR-Coupler detect 44% of the real bugs. Moreover, the code structures
    of these MTCs closely follow the human-written MR skeletons. Our results highlight the effectiveness of leveraging functional
    coupling for automated MR construction and the potential of MR-Coupler to facilitate the adoption of MT in practice. We
    also released the tool and experimental data to support future research.
