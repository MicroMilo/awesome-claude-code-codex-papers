  abstract_reason: Official abstract fetched.
  abstract: With the growing synergy between deep learning and quantum computing, Quantum Neural Networks (QNNs) have emerged
    as a promising paradigm by leveraging quantum parallelism and entanglement. However, testing QNNs remains underexplored
    due to their complex quantum dynamics and limited interpretability. Developing a mutation testing technique for QNNs further
    requires addressing stochastic factors, including the inherent randomness of mutation operators and quantum measurements.
    To tackle these challenges, we propose \textbf{QuanForge}, a mutation testing framework specifically designed for QNNs.
    We first introduce statistical mutation killing to provide a more reliable criterion. QuanForge incorporates nine post-training
    mutation operators at both gate and parameter levels, capable of simulating various potential errors in quantum circuits.
    Finally, a mutation generation algorithm is formalized, which systematically produces effective mutants, thereby enabling
    a robust and reliable mutation analysis. Through extensive experiments on benchmark datasets and QNN architectures, we
    show that QuanForge can effectively identify weak test suites and localize vulnerable circuit regions. We also analyze
    the generation capability of different operators, providing guidance for future mutant design and structural assessment
    of QNNs.
