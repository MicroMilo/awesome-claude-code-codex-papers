- title: 'SBridge: Identifying Source-to-Binary Function Similarity via Cross-Domain Control Block Matching'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: cb7600e5-06d4-4d1f-9cf9-584085f2a06f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We present SBridge, a precise approach for identifying functions in binaries that are similar to the given source
    code functions. Identifying reused code in binaries is critical for security, particularly for detecting propagated vulnerabilities.
    Although binary-to-binary comparison is feasible, leveraging source code as the reference is more practical because source
    code is easier to collect and analyze directly without compilation. However, significant gaps between source and binary
    representations, including function inlining, create challenges in cross-domain function detection. Existing approaches
    primarily rely on string literals or structural similarities between entire functions, failing to capture detailed code
    behavior and generating many false alarms. SBridge addresses these limitations through a key innovation: control block-based
    function matching, which encapsulates essential functional features by segmenting functions into meaningful units such
    as conditionals and loops. Leveraging control blocks as a cross-domain representation, SBridge enables precise measurement
    of function similarity between source and binary code, effectively overcoming challenges posed by function inlining and
    stripped binaries. For evaluation, we collected 3,904 real-world C/C++ binaries from BinKit. In experiments identifying
    binary functions identical to input source functions, despite approximately 40% of binary functions being inlined, SBridge
    achieved 75.13% recall@1 and 80.98% recall@5, outperforming existing approaches, which achieved up to 43.31% recall@1
    and 50.2% recall@5. Our further analysis confirmed that SBridge effectively identifies propagated vulnerabilities in binaries.'
