- title: 'AgentBound: Securing Execution Boundaries of AI Agents'
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/14/AgentBound-Securing-Execution-Boundaries-of-AI-Agents
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3808103
  official_record_id: b038d77b-df2a-4d71-bc79-978f06713376
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Models (LLMs) have evolved into AI agents that interact with external tools and environments to
    perform complex tasks. The Model Context Protocol (MCP) has become the de facto standard for connecting agents with such
    resources, but security has lagged behind: thousands of MCP servers execute with unrestricted access to host systems,
    creating a broad attack surface. In this paper, we introduce AgentBound, the first access control framework for MCP servers.
    AgentBound combines a declarative policy mechanism, inspired by the Android permission model, with a policy enforcement
    engine that contains malicious behavior without requiring MCP server modifications. We build a dataset containing the
    296 most popular MCP servers, and show that access control policies can be generated automatically from source code with
    80.9% accuracy. We also show that AgentBound blocks the majority of security threats in several malicious MCP servers,
    and that policy enforcement engine introduces negligible overhead. Our contributions provide developers and project managers
    with a practical foundation for securing MCP servers while maintaining productivity, enabling researchers and tool builders
    to explore new directions for declarative access control and MCP security.'
