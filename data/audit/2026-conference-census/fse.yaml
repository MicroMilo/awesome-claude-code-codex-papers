- title: 'Reward-Free Code Alignment from Pretrained or Fine-Tuned LLM: Unpacking the Trade-offs for Code Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: c8eeb71b-3924-4734-b3bb-c3c8ae6d4436
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Model (LLM) alignment trains an LLM using preference data to produce outputs that better reflect
    human values (e.g., to mitigate toxic or biased responses). While LLM alignment techniques are studied for non-coding
    tasks, we know little about their usefulness for coding tasks. Intuitively, for code generation tasks using LLMs, alignment
    techniques could help with coding solutions that better align with developer preferences, such as more secure code, supporting
    better coding practices, etc. However, it is unclear whether LLM code alignment could support both functional requirements
    (producing executable, correct code) and non-functional requirements (code readability, style, maintainability). It is
    also unknown whether alignment for a code LLM should begin with base pretrained version or the finetuned (i.e., instruction-tuned)
    version of the LLM. In this paper, we offer insights on the above two research questions by conducting an empirical study.
    We studied five state-of-the-art (SOTA) LLMs using two widely used LLM alignment techniques: Direct Preference Optimization
    (DPO) and BoNBoN. For each training record, we created a preference pair as accepted and rejected instances by using the
    SelfCodeAlign pipeline. DPO and BoNBoN are reward-free models, i.e., they eliminate the need for multiple reward scores
    for output preferences. We tuned each LLM using the two alignment techniques in two settings: pretrained and finetuned
    versions of an LLM. We evaluated functional requirements using four SOTA benchmarks (HumanEval+, MBPP+, EvalPerf, EvoEval)
    and non-functional requirements using the SOTA benchmark, CODAL. We find that pretrained-to-aligned pathways achieve larger
    improvements in the aligned variant over its pretrained variant (CodeLlama-7b: +75% non-functional, Llama3-8b: +42% functional).
    But the pretrained variant is generally less accurate than its finetuned variant. However, finetuned-to-aligned offers
    smaller performance improvements or, in some cases, degradation in the aligned variant than its finetuned variant. This
    means that while the base pretrained version is less accurate than its base finetuned variant, alignment reduces the performance
    gap between pretrained and finetuned variants. Non-functional requirements improve more consistently than functional requirements
    via alignment. Based on these findings, we provide nine recommendations to guide alignment for code LLMs.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/42/Reward-Free-Code-Alignment-from-Pretrained-or-Fine-Tuned-LLM-Unpacking-the-Trade-off
