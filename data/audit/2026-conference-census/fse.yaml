- title: Automated Detection of Configuration-Specific Security Vulnerabilities via Patch Analysis
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808126
  official_record_id: 967e989d-94ec-422e-9aa4-b30b61e4bd78
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We study how security patches in highly configurable C/C++ systems map onto the space of compile-time variants.
    We formalize the Vulnerability Impact Condition (VIC)—a Boolean predicate over configuration options that denotes all
    variants that contained the original flaw—and introduce PatchLens, a purely static technique that recovers VICs by aligning
    AST-level patch hunks with source-level presence conditions and resolving file inclusion via lightweight build system
    analysis. Evaluating PatchLens on 1,193 Linux kernel, 290 FFmpeg, and 99 PHP patches, we compute precise, human-readable
    VICs without the need to compile any system variant. The resulting predicates are compact (avg. 2.09 variables for Linux,
    3.30 for FFmpeg, 0.95 for PHP) and show that only a small fraction of vulnerabilities are system-wide, which carry higher
    CVSS scores; meanwhile, CVE texts almost never encode the required options (≈1% average recall), motivating automated
    enrichment of CVE descriptions with VICs. PatchLens and the accompanying dataset enable immediate applications in CI (variant-aware
    triage and test selection), targeted sampling and fuzzing, and feature risk scoring, offering a scalable, explainable
    path to vulnerability assessment in highly configurable software.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/49/Automated-Detection-of-Configuration-Specific-Security-Vulnerabilities-via-Patch-Anal
