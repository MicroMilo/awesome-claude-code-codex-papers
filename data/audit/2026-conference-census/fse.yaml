- title: 'Do Not Treat Code as Natural Language: Implications for Repository-Level Code Generation and Beyond'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3797144
  official_record_id: 880827c3-0c0d-4cab-8bbc-96c1f1d7d487
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models for code (CodeLLMs) have demonstrated remarkable success in standalone code completion and
    generation, sometimes even surpassing human performance, yet their effectiveness diminishes in repository-level settings
    where cross-file dependencies and structural context are essential. Existing Retrieval-Augmented Generation (RAG) approaches
    often borrow strategies from NLP, relying on chunking-based indexing and similarity-based retrieval. Chunking results
    in the loss of coherence between code units and overlooks structural relationships, while similarity-driven methods frequently
    miss functionally relevant dependencies such as helper functions, classes, or global variables. To address these limitations,
    we present Hydra, a repository-level code generation framework that treats code as structured code rather than natural
    language. Our approach introduces (i) a structure-aware indexing strategy that represents repositories as hierarchical
    trees of functions, classes, and variables, preserving code structure and dependencies, (ii) a lightweight dependency-aware
    retriever (DAR) that explicitly identifies and retrieves the true dependencies required by a target function, and (iii)
    a hybrid retrieval mechanism that combines DAR with similarity-based retrieval to provide both essential building blocks
    and practical usage examples. Extensive experiments on the challenging DevEval and RepoExec benchmarks, both requiring
    function implementation from real-world repositories with complex large repository context, show that Hydra achieves state-of-the-art
    performance across open- and closed-source CodeLLMs. Notably, our method establishes a new state of the art in repository-level
    code generation, surpassing strongest baseline by over 5% in Pass@1 and even enabling smaller models to match or exceed
    the performance of much larger ones that rely on existing retrievers.
