- title: 'Neuron-Guided Interpretation of Code LLMs: Where, Why, and How?'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 36a24289-61ee-4ecb-918c-062cdce43b8f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code language models have demonstrated strong capabilities across a wide range of code intelligence tasks. Nevertheless,
    the majority of existing research prioritizes performance improvements on benchmark datasets while overlooking the interpretability
    of model internals. They often treat code LLMs as black boxes, which results in limited transparency, reduced controllability,
    and uncertain reliability. In this work, we investigate the inner mechanisms of code LLMs at both neuron and layer levels,
    aiming to localize network regions that encode programming language-specific and language-agnostic semantic representations
    of code. Our study employs two state-of-the-art models, Llama-3.1-8B and Qwen2.5-Coder-32B, across five widely-used programming
    languages: C++, Java, Python, Go, and JavaScript. We analyze neuron activation patterns in response to multilingual code
    inputs and examine the contributions of different layers during output generation. Our empirical results indicate that:
    (1) code LLMs exhibit neurons specialized for individual programming languages as well as a universal set supporting general
    code generation; and (2) lower layers predominantly capture syntactic structures specific to each language, while higher
    layers abstract into semantic representations that generalize across languages. We further exploit these insights to enhance
    three downstream tasks: neuron-guided fine-tuning for code generation, clone detection using concept-layer embeddings,
    and transfer learning guided by concept-layer representations for code summarization. Experimental evaluations show that
    each strategy consistently improves the performance of multilingual code LLMs.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/135/Neuron-Guided-Interpretation-of-Code-LLMs-Where-Why-and-How-
