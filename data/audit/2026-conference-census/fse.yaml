- title: Rethinking the Evaluation of Microservice RCA with a Fault Propagation-Aware Benchmark
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: a57ff376-9283-4a1e-8f39-09dba09cc18c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'While cloud-native microservice architectures have revolutionized software development, their inherent operational
    complexity makes failure Root Cause Analysis (RCA) a critical yet challenging task. Numerous data-driven RCA models have
    been proposed to address this challenge. However, we find that the benchmarks used to evaluate these models are often
    too simple to reflect real-world scenarios. Our preliminary study reveals that simple rule-based methods can achieve performance
    comparable to or even surpassing state-of-the-art (SOTA) models on four widely used public benchmarks. This finding suggests
    that the oversimplification of existing benchmarks might lead to an overestimation of the performance of RCA methods.
    To further investigate the oversimplification issue, we conduct a systematic analysis of popular public RCA benchmarks,
    identifying key limitations in their fault infjection strategies, call graph structures, and telemetry signal patterns.
    Based on these insights, we propose an automated framework for generating more challenging and comprehensive benchmarks
    that include complex fault propagation scenarios. Our new dataset contains 1,430 validated failure cases from 9,152 fault
    injections, covering 25 fault types across 6 categories, dynamic workloads, and hierarchical ground-truth labels that
    map failures from services down to code-level causes. Crucially, to ensure the failure cases are relevant to IT operations,
    each case is validated to have a discernible impact on user-facing SLIs. Our re-evaluation of 11 SOTA models on this new
    benchmark shows that they achieve low Top@1 accuracies, averaging 0.21 with the best-performing model reaching merely
    0.37 and execution times escalating from seconds to hours. From this analysis, we identify three critical failure patterns
    common to current models: scalability issues, observability blind spots and modeling bottlenecks. Based on these findings,
    we provide actionable guidelines for future RCA research. We emphasize the need for robust algorithms and the co-development
    of challenging benchmarks. To facilitate further research, we publicly release our benchmark generation framework, the
    new dataset, and our implementations of the evaluated SOTA models.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/171/Rethinking-the-Evaluation-of-Microservice-RCA-with-a-Fault-Propagation-Aware-Benchmar
