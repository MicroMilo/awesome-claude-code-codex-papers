- title: 'Mining Long Tail Bugs: Identifying Rare and Overlooked Issues in Code'
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/115/Mining-Long-Tail-Bugs-Identifying-Rare-and-Overlooked-Issues-in-Code
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3797071
  official_record_id: 158cf9db-1baa-4f8e-86e8-4594299b307e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Using data mining to extract frequent code patterns for bug detection has proven effective. However, prior studies
    have overlooked the prevalence of infrequent (rare) patterns, even though violations of such patterns can also lead to
    bugs. In this paper, we present LTMiner, which mines rare patterns from large-scale projects and detects potential bugs
    by checking for violations of these patterns. In practice, rare patterns far outnumber frequent ones and lack strong statistical
    support. Consequently, we face a pattern explosion, and many rare patterns and their violations are uninteresting. LTMiner
    addresses this by using instance-based ranking and filtering to prioritize violations of rare patterns. It further employs
    a large language model (LLM) as a domain expert to audit top-ranked violations; mined information supports in-context
    learning, and task decomposition and self-reflection mitigate possible hallucinations. This pipeline effectively curbs
    pattern explosion and false positives, uncovering previously unknown bugs in large-scale projects at an acceptable cost.
    Applied to Linux 6.12.1, LTMiner identified 42 previously unknown bugs, 27 of which have been confirmed by developers.
    These results indicate that, although rare-pattern bugs are sparse, a considerable number remain and exhibit a non-negligible
    long tail. We believe that rare-pattern bugs constitute a promising blue ocean for bug detection.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/115/Mining-Long-Tail-Bugs-Identifying-Rare-and-Overlooked-Issues-in-Code
