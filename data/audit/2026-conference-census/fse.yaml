- title: Aligning with Human Coding Preferences for Improving Code Generation
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: bb9c4ab6-a785-4862-ba87-b6354a0e4ce5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) have demonstrated remarkable potential in automating software development tasks.
    While recent advances leverage Supervised Fine-Tuning (SFT) and Direct Preference Optimization (DPO) to align models with
    human preferences, the optimal training strategy remains unclear across diverse code preference scenarios. This paper
    systematically investigates the roles of SFT and DPO in aligning LLMs with different code preferences. Through both theoretical
    analysis and empirical observation, we hypothesize that SFT excels in scenarios with objectively verifiable optimal solutions,
    while applying SFT followed by DPO (S&D) enables models to explore superior solutions in scenarios without objectively
    verifiable optimal solutions. Based on the analysis and experimental evidence, we propose Adaptive Preference Optimization
    (APO), a dynamic integration approach that adaptively amplifies preferred responses, suppresses dispreferred ones, and
    encourages exploration of potentially superior solutions during training. Extensive experiments across six representative
    code preference tasks validate our theoretical hypotheses and demonstrate that APO consistently matches or surpasses the
    performance of existing SFT and S&D strategies. Our work provides both theoretical foundations and practical guidance
    for selecting appropriate training strategies in different code preference alignment scenarios.
