- title: 'Small is Beautiful: A Practical and Efficient Log Parsing Framework'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 000e4c35-9ac4-488b-9972-b535c6201b44
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Log parsing is a fundamental step in log analysis, partitioning raw logs into constant templates and dynamic variables.
    While recent semantic-based parsers leveraging Large Language Models (LLMs) exhibit superior generalizability over traditional
    syntax-based methods, their effectiveness is heavily contingent on model scale. This dependency leads to significant performance
    collapse when employing smaller, more resource-efficient LLMs. Such degradation creates a major barrier to real-world
    adoption, where data privacy requirements and computational constraints necessitate the use of succinct models. To bridge
    this gap, we propose EFParser, an unsupervised LLM-based log parser designed to enhance the capabilities of smaller models
    through systematic architectural innovation. EFParser introduces a dual-cache system with an adaptive updating mechanism
    that distinguishes between novel patterns and variations of existing templates. This allows the parser to merge redundant
    templates and rectify prior errors, maintaining cache consistency. Furthermore, a dedicated correction module acts as
    a gatekeeper, validating and refining every LLM-generated template before caching to prevent error injection. Empirical
    evaluations on public large-scale datasets demonstrate that EFParser outperforms state-of-the-art baselines by an average
    of 12.5% across all metrics when running on smaller LLMs, even surpassing some baselines utilizing large-scale models.
    Despite its additional validation steps, EFParser maintains high computational efficiency, offering a robust and practical
    solution for real-world log analysis deployment.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/48/Small-is-Beautiful-A-Practical-and-Efficient-Log-Parsing-Framework
