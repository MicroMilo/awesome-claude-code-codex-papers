- title: 'UNICS: Multilingual Code Search via Unified Pseudocode and Contrastive Transfer Learning'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3797067
  official_record_id: b02c781c-5127-4364-a0ef-ae2cec6c6f94
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: While pre-trained models have achieved remarkable success in code search, their multilingual capabilities remain
    a major hurdle, plagued by data imbalance, cross-lingual semantic interference, and the loss of critical information from
    existing unified representations like Abstract Syntax Trees (ASTs) or Intermediate Representations (IRs). Furthermore,
    conventional contrastive learning strategies often rely on simplistic hard negative sampling while overlooking the potential
    of mining hard positives to learn code’s intrinsic semantic invariance. To address these challenges, we introduce UNICS,
    a framework for multilingual code search built on a two-stage training strategy. In the first stage, UNICS is pre-trained
    on a novel dataset we constructed, which uses pseudo-code as a unified representation to learn a cross-lingual, algorithm-level
    logic that preserves full semantic fidelity. The second stage employs a multi-task transfer learning strategy that adapts
    this general knowledge to specific languages by decomposing code into semantic slices (e.g., API calls, function bodies)
    and incorporating tasks for hard positive mining and cross-lingual dynamic hard negative sampling. Experimental results
    demonstrate that UNICS achieves state-of-the-art performance across multiple multilingual and cross-lingual benchmarks,
    showcasing superior generalization and performance balance, especially in zero-shot transfer tasks to low-resource languages.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/12/UNICS-Multilingual-Code-Search-via-Unified-Pseudocode-and-Contrastive-Transfer-Learn
