  abstract: 'With over 60 percent of global Internet traffic originating from mobile devices, Responsive Web Design (RWD)
    has become essential for ensuring seamless user experiences across diverse screen sizes and resolutions. The Web Content
    Accessibility Guidelines require that both information and functionality remain accessible when reflow occurs. However,
    existing checkers or research tools have limitations: they either employ static analysis that fails to capture how content
    is actually displayed to users or focus on only one accessibility aspect, such as keyboard operation. Consequently, no
    prior study has comprehensively addressed both information and functionality loss during reflow for Graphical User Interfaces
    (GUIs). This paper introduces ReFLAIR (Reflow Fault Localization using AI-based Responsive analysis), a multimodal generative
    AI–driven approach for dynamically detecting reflow issues that cause loss of information or functionality in the GUI.
    ReFLAIR systematically extracts informative and actionable widgets, compares their presence and behavior across original
    and reflowed layouts, and employs both scrolling and large language model–guided expansion to uncover hidden interface
    widgets. We evaluate ReFLAIR on a dataset of 24 diverse webpages drawn from popular sites, prior benchmarks, and newly
    released websites. Results show that ReFLAIR outperforms five state-of-the-art techniques, improving precision by 20.91%
    and recall by 55.38%, while maintaining reasonable computational and runtime cost. An ablation study confirms that dynamic
    exploration (i.e., scrolling and expansion) is essential for high accuracy. In summary, our approach contributes to accessibility
    testing by providing an effective, scalable, and cost-efficient solution for identifying reflow issues in RWD.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/63/ReFLAIR-Detecting-Responsive-Layout-Reflow-Issues-using-Multimodal-Generative-AI
