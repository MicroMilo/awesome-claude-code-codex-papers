  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808165
  official_record_id: 40bbfbe3-a44b-4107-8e42-b57cea289cb7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Modern code review platforms increasingly embed suggested code revisions, including those generated by AI. While
    such features promise efficiency, they may also change how developers evaluate changes, particularly when code is complex
    or when suggestions are labeled by source. Prior studies have examined trust and automation bias in software engineering,
    but it remains unclear how code complexity and perceived authorship (human vs. AI) jointly shape developers’ review decisions.
    We present the results of a between-subjects experiment with 385 participants, who were asked to review a code revision.
    The study controlled for code complexity (low vs. high), provenance labels (human vs. AI), and revision correctness. We
    analyzed developers’ review decisions through compliance patterns: acceptance of correct or rejection of incorrect code
    revisions (appropriate-compliance), acceptance of incorrect code revisions (over-compliance), and rejection of correct
    code revisions (under-compliance). Our findings show that higher code complexity significantly (p<.05) increases over-compliance.
    While provenance alone had no main effect, its influence emerged in interaction: under high-complexity conditions, reviewers
    were substantially more likely to accept incorrect revisions labeled as AI-authored. This work contributes: (i) empirical
    evidence that higher code complexity increases the likelihood of accepting incorrect suggestions, (ii) analysis of provenance
    showing no main effect on overall acceptance but a trend toward higher over-compliance under AI labels, and (iii) evidence
    of a significant interaction where complex, AI-labeled revisions led to more frequent acceptance of incorrect suggestions—an
    effect absent under human labels. Together, these results highlight the need for review systems that surface complexity
    cues and promote more accurate evaluation of AI-labeled suggestions.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/111/The-Interaction-of-Complexity-and-Provenance-in-Code-Review-Decisions-Evidence-from-
