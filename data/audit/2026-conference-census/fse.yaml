- title: 'One Size Does Not Fit All: Revisiting Code Context Engineering for Repository-Level Code Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 68ec7afd-8e26-4664-96ab-95711f99beb6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Models (LLMs) have demonstrated remarkable capabilities in code generation at the function or
    file level. However, they achieve limited performance on repository-level code generation due to the complicated repository
    context where a substantial amount of files and functions exist. To address this challenge, code context engineering methods
    are proposed to accurately extract the relevant code context required by repository-level code generation. These methods
    belong to three dominant paradigms: 1) Similarity-based In-Context Learning (ICL), which retrieves similar code examples
    in the repository as demonstrations; 2) Static Analysis, which captures relevant code context based on structural dependencies
    in the repository; and 3) Navigation-based Paradigms, which invokes LLMs to dynamically explore repositories for context
    identification. Despite the prevalence of code context engineering approaches, their individual contributions are often
    coupled within complex agents in repository-level code generation, making it difficult to isolate and evaluate the effectiveness
    of three paradigms. This paper presents the first large-scale and systematic empirical study that compares three code
    context engineering paradigms independently. We evaluate seven representative code context engineering methods based on
    the three paradigms, with eight popular LLMs on repository-level code generation. We also propose a new metric named Dependency
    Collection Rate (DCR) and efficiency metrics to enable the direct comparison of code context engineering methods, rather
    than observing their impacts only on the final code generation performance. Our findings reveal fundamental trade-offs:
    static analysis provides the most reliable effectiveness-efficiency trade-off, while navigation-based approaches with
    powerful models achieve the highest performance ceiling but require powerful models and incur 10-20× higher computational
    costs. Based on these findings, we provide actionable implications for AI coding researchers and software developers to
    guide the design and deployment of context-aware coding tools.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/65/One-Size-Does-Not-Fit-All-Revisiting-Code-Context-Engineering-for-Repository-Level-C
