- title: 'Revealing Regressions: A Comparative Study of State-Capture Strategies in Validating Program Behavior'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3797107
  official_record_id: 63ddc4ee-0292-4f1d-925c-47fb1487f0e9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'A central challenge in software testing is deciding which parts of a program’s state to check as evidence of
    correct behavior to reveal regressions. These checks are embodied as test oracles, typically as assertions in test cases.
    State observation strategies play a decisive role in shaping how effectively regressions can be revealed. Such strategies
    range from exhaustive memory snapshots to selective attribute checks via getter methods and nullability checks. These
    strategies are deeply embedded in both research and practice: academic work has explored heuristic- and serialization-based
    oracles, while industry has widely adopted snapshot testing. Despite their importance, the effects of different state-capture
    choices remain poorly understood from a scientific perspective. In this work, we present an experimental framework for
    systematically analyzing these design choices along the dimensions of observation scope, extraction approach, and extraction
    depth. Using this framework, we conduct an empirical study across twelve real-world projects, measuring how state-capture
    strategies influence regression-revealing capability and the richness of oracle information. Our findings reveal that
    human-written assertions often under-utilize available program state, achieving well below the fault-revealing potential
    of systematic observation strategies. Simple design choices, such as exposing unchecked intermediate return values, carefully
    selecting getters, and deepening state extraction, can yield measurable improvements (avg. 35.7%) in regression detection
    without needing to observe an overwhelmingly large amount of program-state data. Additionally, we highlight the challenges
    of observability, assertion desirability, and the trade-offs of capturing richer program states. Such insights show how
    small design choices can yield major differences in regression detection and potentially offer concrete directions for
    both tool builders and practitioners.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/189/Revealing-Regressions-A-Comparative-Study-of-State-Capture-Strategies-in-Validating-
