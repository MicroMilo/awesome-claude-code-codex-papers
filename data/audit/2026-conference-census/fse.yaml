  official_record_id: 89ac9d4d-cd35-4641-8069-e43eb337632d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The development of complex software systems, such as cyber-physical systems (CPSs), involves the continuous evolution
    of both system implementations and their requirements. These two artifacts often proceed independently, creating a risk
    of misalignment between a system and its requirements. For example, a system may be updated due to implementation-level
    concerns, resulting in a new version that no longer satisfies its original requirements. Traditional compliance recovery
    techniques, such as automated program repair, address this problem by modifying the system while assuming that the requirements
    are correct. However, faulty or outdated requirements are a well-documented challenge in practice, motivating the complementary
    task of requirements repair. In this paper, we propose a framework that leverages system execution data to repair misaligned
    requirements of CPSs, thereby restoring requirement-to-system compliance. Our approach evaluates the correctness of declarative
    requirements expressed over time-based, real-valued signals using the MATLAB Simulink Requirement Tables language. We
    evaluate two implementations of our framework on six real-world case studies covering 12 requirements. The results confirm
    the effectiveness of the proposed framework in producing correct and useful repaired requirements.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/193/Automated-Repair-of-Requirements-for-Cyber-Physical-Systems-in-Simulink-Requirements-
