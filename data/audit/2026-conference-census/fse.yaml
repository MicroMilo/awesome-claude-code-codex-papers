- title: Natural Language-Focused Software Engineering via Code-Documentation Equivalence
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 9f833af4-0d1c-43a5-a0a2-33f9b8234a9e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Source code documentation is an integral part of software development and maintenance, as it helps in understanding
    the code and facilitates communication among developers. However, existing documentation is often incomplete, outdated,
    or inaccurate, which can lead to misunderstandings and errors. In the era of large language models (LLMs), which are being
    extensively used for software engineering tasks, the quality of documentation becomes even more critical, as documentation
    provides important context for the models. In this paper, we introduce the notion of documentation-to-code equivalence,
    a novel property that captures whether documentation accurately and completely describes the code it documents. We present
    a novel approach, called Documentary, to automatically generate equivalent documentation for a given code snippet. Our
    evaluation shows that Documentary can generate such documentation for 65.5% of the evaluated, function-level code snippets.
    To show the benefits of documentation-to-code equivalence, we describe and evaluate two software engineering tasks tasks:
    code understanding and code editing. Our results show document-to-code equivalence allows an LLM to predict the output
    of a function with 12.8–24.5% higher accuracy, when compared to human-written documentation and documentation generated
    by a baseline approach. Likewise, the property helps developers successfully perform code changes by modifying only the
    documentation, rather than the code itself, in 1.2–12.8% more cases than the baselines.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/198/Natural-Language-Focused-Software-Engineering-via-Code-Documentation-Equivalence
