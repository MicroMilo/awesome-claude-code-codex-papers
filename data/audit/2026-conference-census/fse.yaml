- title: Detecting Code-Comment Inconsistencies in Smart Contracts by Combining LLM and Program Analysis
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f360ec1a-25b9-482a-b502-46211fe74920
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Smart contracts have attracted rapid development and widespread application. Due to the complexity of real-world
    smart contracts, it is error-prone to correctly enforce all intended functionalities in code implementations, resulting
    in unintended functional behaviors and security issues in practice. Code-comment inconsistency detection has emerged as
    an important solution to these issues, which leverages the redundant functional specifications in comments to detect code
    implementations that violate developers’ intentions. However, existing inconsistency detection solutions are typically
    pattern-based and limited to fixed types of inconsistencies, which prevents them from detecting the diverse inconsistencies
    between real-world code implementations and casually written comments. To bridge the gap, this paper presents SmartComment,
    the first technique that combines LLMs with program analysis techniques for detecting code-comment inconsistencies in
    smart contracts. SmartComment introduces an LLM-driven workflow which simulates real-world interactions between code reviewers
    and developers to identify inconsistencies. It incorporates various program analysis techniques into the workflow, including
    comment propagation and code context extraction for generating input context for inconsistency detection, as well as program
    variant generation and differential analysis for inconsistency confirmation. Our evaluation results show that SmartComment
    detects 203 valid inconsistencies from a dataset of 1,000 real-world contracts with a precision of 79.9%, highlighting
    its effectiveness in detecting prevalent and diverse real-world inconsistencies. Compared to previous work, SmartComment
    achieves both higher precision and recall, detecting over 90% of inconsistencies that existing methods fail to identify.
    Furthermore, an ablation experiment demonstrates the effectiveness of incorporating program analysis techniques into SmartComment,
    improving the F1-score from 58.7% to 81.3%.
