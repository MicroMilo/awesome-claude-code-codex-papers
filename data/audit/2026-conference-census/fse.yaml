  abstract: Programmable Logic Controllers (PLCs) lack built-in security mechanisms, and their critical role in industrial
    control systems makes them prime targets for cyberattacks. Recent advances in next-generation PLCs have introduced embedded
    virtualization technologies that partition functional domains within a single hardware platform and integrate AI and edge
    computing to improve business performance. Nevertheless, many PLC vendors and researchers have largely overlooked the
    potential of virtualization to strengthen PLC security. To address this gap, we propose \emph{TriHaven}, an embedded virtualization-based
    security architecture for PLCs. TriHaven separates the PLC control loop and deploys its components in dedicated virtual
    machines, each with distinct design characteristics. By further implementing a redundancy-compare strategy for PLC control
    logic execution, TriHaven enables real-time attack detection and rapid emergency response through control switching, thereby
    mitigating diverse and previously unknown threats. Using the Jailhouse virtualization framework, our experiments on OpenPLC
    and Beremiz–two open-source PLC runtimes–demonstrate the feasibility of TriHaven while preserving essential security objectives.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/94/A-Wily-Hare-Has-Three-Havens-Combating-Programmable-Logic-Controller-Attacks-via-Vir
