  abstract: Memory management errors in C remain a leading source of software vulnerabilities due to the inherent complexity
    of manual memory handling. Traditional Automated Program Repair (APR) largely relies on rule- or template-based techniques,
    which require expert-crafted specifications and often struggle to generalize. Recently, Large Language Models (LLMs) have
    emerged as a complementary approach, leveraging broad exposure to codebases and programming idioms to synthesize fixes
    that can extend beyond existing templates and rules. This paper introduces TLR, a novel framework that augments LLM-based
    repair with typestate-guided context retrieval. By using a finite typestate automaton to track error-propagation paths
    and memory state transitions, our approach provides the LLM with focused, semantically rich context for codebase-level
    memory error repair, effectively addressing both interprocedural reasoning and LLM context window limitations. Our framework
    has successfully repaired 37 out of 49 real-world memory errors derived from 14 open-source projects that collectively
    comprise over a million lines of code. Compared to state-of-the-art memory error APR tools, SAVER and ProveNFix, our approach
    correctly fixes 14.50× and 2.36× more errors, respectively. Moreover, TLR outperforms current open-source state-of-the-art
    LLM-based SWE-agent 1.0 by repairing 94% more errors. We have also successfully repaired three critical zero-day memory
    errors, with fixes that have been accepted and implemented by the original developers. These results highlight a promising
    paradigm for codebase-level program repair through program analysis-guided, retrieval-augmented LLMs, combining formal
    verification strengths with neural model adaptability.
