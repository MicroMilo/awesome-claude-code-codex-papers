- title: 'GraphQLify: Automated and Type Safety-Preserving GraphQL API Adoption'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 050add49-4d6a-4978-a3b2-653cafa508e1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: This paper introduces GraphQLify, an automated framework for facilitating the migration of existing APIs to GraphQL.
    While prior works in this area targeted relational databases, resource description frameworks (RDF), or machine-parsable
    API specifications, GraphQLify takes a new approach by leveraging static source code analysis for type inference. This
    approach helps generate GraphQL schemas, maintaining end-to-end type safety, a key premise of using GraphQL over REST.
    Since the separate GraphQL servers generated by existing techniques work as adapters to existing APIs, they incur performance
    overhead due to dynamic request binding and network latency. On the other hand, \textit{GraphQLify} generates an embedded
    server to directly invoke existing API code, and therefore provides better performance. During our evaluation with 834
    APIs from nine popular OSS projects, GraphQLify successfully converted all while matching the types from the original
    APIs. While OASGraph, the current state-of-the-art, had 3.5% failure rates and 42% type mismatches in our evaluation,
    both numbers are at 0% for GraphQLify. Finally, our evaluation suggests that for application workflows requiring five
    sequential API calls, clients can reduce data fetching time by a factor of 2 to 4 by using the GraphQLify-generated APIs
    over REST counterparts.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/37/GraphQLify-Automated-and-Type-Safety-Preserving-GraphQL-API-Adoption
