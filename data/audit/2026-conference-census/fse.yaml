- title: Mitigating Prompt-Induced Cognitive Biases in General-Purpose AI for Software Engineering
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.48550/arXiv.2604.16756
  official_record_id: 137baab7-eb35-459f-93e5-aa96d1863b2f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Prompt-induced cognitive biases are changes in a general-purpose AI (GPAI) system’s decisions caused solely by
    biased wording in the input (e.g., framing, anchors), not task logic. In software engineering (SE) decision support (where
    problem statements and requirements are natural language) small phrasing shifts (e.g., popularity hints or outcome reveals)
    can push GPAI models toward suboptimal decisions. We study this with PROBE-SWE, a dynamic benchmark for SE that pairs
    biased and unbiased versions of the same SE dilemmas, controls for logic and difficulty, and targets eight SE-relevant
    biases (anchoring, availability, bandwagon, confirmation, framing, hindsight, hyperbolic discounting, overconfidence).
    We ask whether prompt engineering mitigates bias sensitivity in practice, focusing on actionable techniques that practitioners
    can apply off-the-shelf in real environments. Testing common strategies (e.g., chain-of-thought, self-debiasing) on popular
    GPAI systems, we find no statistically significant reductions in bias sensitivity. We then adopt a Prolog-style view of
    the reasoning process: solving SE dilemmas requires making explicit any background axioms and inference assumptions (i.e.,
    SE best practices) that are usually implicit in the prompt. So, we hypothesize that bias-inducing features short-circuit
    assumptions elicitation, pushing GPAI models toward biased shortcuts. Building on this, we introduce an end-to-end method
    that elicits best practices and injects axiomatic reasoning cues in a prompt before answering, reducing overall bias sensitivity
    by ≈51% on average (𝑝 < .001). Finally, we report a thematic analysis that surfaces linguistic patterns associated with
    heightened bias sensitivity, clarifying when GPAI use is less advisable for SE decision support and where to focus future
    countermeasures.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/30/Mitigating-Prompt-Induced-Cognitive-Biases-in-General-Purpose-AI-for-Software-Enginee
