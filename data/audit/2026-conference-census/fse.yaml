- title: Reducing Cost of LLM Agents with Trajectory Reduction
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 88f14287-8f56-4384-ac32-ea16d27905fb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Multi-turn agent systems based on Large Language Models (LLMs) have been increasingly popular for software engineering
    tasks. While LLM agents show decent effectiveness, the high computational cost of input tokens due to the ever-growing
    trajectory remains an efficiency concern for their applications. Efficiency is largely neglected in existing studies and
    agent products, and this paper fills the gap by introducing an inference-time trajectory reduction approach to reduce
    the cost of agents. Through analyzing existing agent trajectories, we demonstrate that useless, redundant, and expired
    information is widespread in all trajectories, which can be identified and reduced without harming the agent’s performance.
    We then design a simple yet effective trajectory reduction approach, AgentDiet, which automatically removes such waste
    information. We implement AgentDiet on a top-performing coding agent, and the evaluation on two LLMs and two benchmarks
    shows that AgentDiet can reduce input tokens by 39.9% ~ 59.7%, or the final computational cost by 21.1% ~ 35.9%, while
    maintaining the same agent performance. This indicates that trajectory reduction is a promising direction for agent systems.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/137/Reducing-Cost-of-LLM-Agents-with-Trajectory-Reduction
