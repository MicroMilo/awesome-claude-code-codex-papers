- title: 'Comment Traps: How Defective Commented-out Code Augment Defects in AI-Assisted Code Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 65608ea8-0459-4015-b2bf-8f93aa2139b1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: With the rapid development of large language models in code generation, AI-powered editors such as GitHub Copilot
    and Cursor are revolutionizing software development practices. At the same time, studies have identified potential defects
    in the generated code. Previous research has predominantly examined how code context influences the generation of defective
    code, often overlooking the impact of defects within commented-out code (CO code). AI coding assistants’ interpretation
    of CO code in prompts affects the code they generate. This study evaluates how AI coding assistants, GitHub Copilot and
    Cursor, are influenced by defective CO code. The experimental results show that defective CO code in the context causes
    AI coding assistants to generate more defective code, reaching up to 58.17 percent. Our findings further demonstrate that
    the tools do not simply copy the defective code from the context. Instead, they actively reason to complete incomplete
    defect patterns and continue to produce defective code despite distractions such as incorrect indentation or tags. Even
    with explicit instructions to ignore the defective CO code, the reduction in defects does not exceed 21.84 percent. These
    findings underscore the need for improved robustness and security measures in AI coding assistants.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/178/Comment-Traps-How-Defective-Commented-out-Code-Augment-Defects-in-AI-Assisted-Code-G
