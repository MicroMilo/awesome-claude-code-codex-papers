- title: Understanding and Predicting Accepted Code Suggestions in AI-Assisted Programming
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: f8e2175b-12e4-4e55-8260-ff8c0eb0646a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: AI-assisted programming tools are widely adopted, yet their practical utility is often undermined by undesired
    suggestions that interrupt developer workflows and cause frustration. While existing research has explored developer-AI
    interactions when programming qualitatively, a significant gap remains in quantitative analysis of developers’ acceptance
    of AI-generated code suggestions, partly because the necessary fine-grained interaction data is often proprietary. To
    bridge this gap, this paper conducts an empirical study using 66,329 industrial developer-AI interactions from a large
    technology company. We analyze features that are significantly different between accepted code suggestions and rejected
    ones. We find that accepted suggestions are characterized by significantly higher historical acceptance counts and ratios
    for both developers and projects, longer generation intervals, shorter preceding code context in the project, and older
    IDE versions. Based on these findings, we introduce \emph{CSAP} (Code Suggestion Acceptance Prediction) to predict whether
    a developer will accept the code suggestion before it is displayed. Our evaluation of \emph{CSAP} shows that it achieves
    the accuracy of 0.973 and 0.922 on imbalanced and balanced dataset respectively. Compared to a large language model baseline
    and an in-production industrial filter, \emph{CSAP} relatively improves the accuracy by 12.6% and 69.5% on imbalanced
    dataset, and improves the accuracy by 87.0% and 140.1% on balanced dataset. Our results demonstrate that targeted personalization
    is a powerful approach for filtering out code suggestions with predicted rejection and reduce developer interruption.
    To the best of our knowledge, it is the first quantitative study of code suggestion acceptance on large-scale industrial
    data, and this work also sheds light on an important research direction of AI-assisted programming.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/46/Understanding-and-Predicting-Accepted-Code-Suggestions-in-AI-Assisted-Programming
