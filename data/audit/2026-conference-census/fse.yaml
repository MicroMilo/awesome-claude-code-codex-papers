- title: Active Learning of Symbolic Automata for Reactive Programs via Dynamic Symbolic Mapper
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/92/Active-Learning-of-Symbolic-Automata-for-Reactive-Programs-via-Dynamic-Symbolic-Mappe
