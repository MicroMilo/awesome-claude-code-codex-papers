- title: 'CodeCureAgent: Automatic Classification and Repair of Static Analysis Warnings'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3808140
  official_record_id: 890e51c7-1bbd-4ec7-ad21-ac9df9a03d0d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Static analysis tools are widely used to detect bugs, vulnerabilities, and code smells. Traditionally, developers
    must resolve these warnings manually by analyzing the warning, deciding whether to fix or suppress it, and validating
    the correctness of the code change. Because this process is tedious, developers sometimes ignore warnings, leading to
    an accumulation of warnings and a degradation of code quality. Prior work suggests techniques to automatically repair
    static analysis warnings, but these are limited to specific analysis rules, cannot perform multi-file edits, and rely
    on weak validation mechanisms. This paper presents CodeCureAgent, an approach that harnesses LLM-based agents to automatically
    analyze, classify, and repair static analysis warnings. Unlike previous work, our method does not follow a predetermined
    algorithm. Instead, we adopt an agentic framework that iteratively invokes tools to gather additional information from
    the codebase (e.g., via code search) and edit the codebase to resolve the warning. CodeCureAgent detects and suppresses
    false positives, while fixing true positives when identified. We equip CodeCureAgent with a three-step heuristic to approve
    patches: (1) build the project, (2) verify that the warning disappears without introducing new warnings, and (3) run the
    test suite. We evaluate CodeCureAgent on a dataset of 1,000 SonarQube warnings found in 106 Java projects and covering
    291 distinct rules. Our approach produces plausible fixes for 96.8% of the warnings, outperforming state-of-the-art baseline
    approaches by 30.7% and 29.2% in plausible-fix rate, respectively. Manual inspection of 291 cases reveals a correct-fix
    rate of 86.3%, showing that CodeCureAgent can reliably repair static analysis warnings. The approach incurs LLM costs
    of about 2.9 cents (USD) and an end-to-end processing time of about four minutes per warning. We envision CodeCureAgent
    helping to clean existing codebases and being integrated into CI/CD pipelines to prevent the accumulation of static analysis
    warnings.'
