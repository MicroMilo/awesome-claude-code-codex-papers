- title: 'Exorcist: Enabling Atomic-Level Runtime Detection of Spectre Attacks Using Precise Event Based Sampling'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 111db682-2145-4ac6-915b-9cbdfb0f54e7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: While being key hardware techniques for improving the performance of modern processors, the speculative execution
    mechanisms also lead to side-channel attacks, which pose significant threats to the security of computer systems. While
    researchers have proposed various solutions to mitigate the threat posed by speculative attacks, most existing approaches
    have focused on offline static vulnerability analysis, which suffers from significant limitations of incompleteness and
    poor scalability. Based on Intel’s Precise Event Based Sampling (PEBS) technique, this paper proposes Exorcist, a novel
    runtime framework for detecting Spectre-PHT attacks at the atomic level. Leveraging the key observation that the atomic
    execution of a Spectre-PHT gadget triggers both a cache miss and a branch mis-precision in a fixed sequence, Exorcist
    uses carefully configured PEBS monitoring to efficiently capture all related fine-grained hardware performance events,
    then launches a kernel- and user-level collaborated taint analysis to effectively pinpoint Spectre-PHT gadgets that have
    actually exploited vulnerable speculative executions. Our approach significantly reduces the amount of native instructions
    needed to be processed to confirm actual Spectre exploitation, making it capable of achieving high accuracy and a negligible
    false positive rate with second-level response time. We have implemented a prototype of Exorcist and performed a comprehensive
    evaluation on it. Experimental results indicate that Exorcist can efficiently detect Spectre-PHT attacks at runtime with
    acceptable performance overhead, including JIT-compiled Spectre-PHT payloads written in JavaScript that are beyond the
    reach of existing offline analysis-based approaches.
