  abstract: Protocol reverse engineering infers the specification of proprietary or poorly documented protocols and serves
    as the foundation for security analysis such as fuzz testing. While many existing techniques achieve this by mining statistical
    features from network traces, they face increasing challenges due to incomplete field pattern information available in
    the traces. Although protocol development has accumulated rich prior knowledge about protocol design, this knowledge remains
    largely untapped in protocol reverse engineering. This paper introduces TransRE, a protocol reverse engineering tool that
    leverages prior syntax knowledge from standardized protocols through deep transfer learning to better understand proprietary
    protocols. TransRE first selects optimal source domains by analyzing inter-domain differences between the existing knowledge
    base and the target protocol. It then employs a neural network to extract representation features and applies domain adaptation
    techniques to optimize the syntax transfer model, enabling accurate inference of protocol formats. Our evaluation on 12
    widely used protocols shows that TransRE identifies fields with a perfection score of 0.43, which is 1.48×-3.07× the performance
    achieved by five state-of-the-art methods. Furthermore, to demonstrate practical applicability, we enhanced an existing
    protocol fuzzer with TransRE for testing proprietary protocols in real-world network cameras and discovered four bugs.
