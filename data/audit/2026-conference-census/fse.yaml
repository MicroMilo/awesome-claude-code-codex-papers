- title: 'DuCodeMark: Dual-Purpose Code Dataset Watermarking via Style-Aware Watermark–Poison Design'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: e7079207-5dab-4e1f-9b31-81a0c2adead4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The proliferation of large language models for code (CodeLLMs) and open-source contributions has heightened concerns
    over unauthorized use of source code datasets. While watermarking provides a viable protection mechanism by embedding
    ownership signals, existing methods rely on detectable trigger–target patterns and are limited to source-level tasks,
    overlooking binary-level scenarios such as decompilation. In this paper, we propose DuCodeMark, a stealthy and robust
    dual-purpose watermarking method for code datasets that generalizes across both source-level and binary-level code tasks.
    DuCodeMark parses each code sample into an abstract syntax tree (AST), applies language-specific style transformations
    to construct stealthy trigger–target pairs, and injects repressible poisoned features into a subset of return-typed samples
    to enhance robustness against watermark removal or evasion. These features remain inactive during normal training but
    are activated upon watermark removal, degrading model performance. For verification, DuCodeMark employs a black-box method
    based on the independent-samples $t$-test. We conduct a comprehensive evaluation of DuCodeMark across 72 settings spanning
    two code tasks, two programming languages, three CodeLLMs, and six decoding temperatures. The results demonstrate that
    it consistently achieves strong verifiability ($p < 0.05$), high stealthiness (suspicious rate $\leq$ 0.36), robustness
    against both watermark and poisoning attacks (recall $\leq$ 0.57), and a substantial drop in model performance upon watermark
    removal (Pass@1 drops by 28.6%), underscoring its practicality and resilience.
