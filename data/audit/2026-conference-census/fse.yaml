- title: GPU-Accelerated Flow-Sensitive Pointer Analysis for C/C++ Programs
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2c014a32-c8e9-4da3-ad00-7cc8e337af70
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Flow-sensitive pointer analysis offers highly precise results that are essential for various security analyses,
    bug detection tools, and compiler optimizations. However, its high computational cost often leads to prohibitively long
    analysis times, especially for large, real-world programs. Despite decades of research, state-of-the-art algorithms still
    struggle to achieve acceptable performance at industrial scale, forcing developers to choose less precise alternatives.
    To overcome these limitations, we present GPA a GPU-accelerated flow-sensitive pointer analysis for C/C++ programs. To
    maximize hardware utilization, GPA dynamically balances computation by combining the massive parallelism of GPUs with
    a graph neural network that predicts per-variable workloads. Compared to state-of-the-art CPU-based analyses, GPA improves
    runtime performance by a factor of $1.3\times$ to $14\times$ on large programs (i.e., ≥275~KLOC) without sacrificing precision.
    However, on most small programs (i.e., <100~KLOC) and some medium ones (i.e., 100–275~KLOC), traditional algorithms run
    faster due to the overhead of memory management on GPUs that GPA incurs. By making the computation of highly precise pointer
    information more tractable, GPA enables running analyses and developer tools that were previously infeasible on large
    codebases.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/80/GPU-Accelerated-Flow-Sensitive-Pointer-Analysis-for-C-C-Programs
