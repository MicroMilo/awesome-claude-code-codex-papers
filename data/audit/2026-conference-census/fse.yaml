- title: 'ReGA: Model-based Safeguard for LLMs via Representation-Guided Abstraction'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: e1755298-88db-4e47-a907-a2a797a3cad6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) have achieved tremendous success in various tasks, yet concerns about their safety
    and security have emerged. In particular, they pose risks in generating harmful content and vulnerability to jailbreaking
    attacks, creating unaddressed security issues regarding their deployments. In the context of software engineering for
    artificial intelligence (SE4AI) techniques, model-based analysis has demonstrated notable potential for analyzing and
    monitoring machine learning models, particularly in stateful deep neural networks. However, it suffers from scalability
    issues when extended to LLMs due to their vast feature spaces. In this paper, we aim to address the scalability issue
    of model-based analysis techniques for safeguarding LLM-scale models. Motivated by the recent discovery of low-dimensional
    safety-critical representations that emerged in LLMs, we propose ReGA, a model-based analysis framework with Representation-Guided
    Abstraction, to safeguard LLMs against harmful prompts and generations. By leveraging safety-critical representations,
    which are key directions in hidden states that indicate safety-related concepts, ReGA effectively narrows the scalability
    gap when developing the abstract model for safety modeling. Our comprehensive evaluation shows that ReGA performs sufficiently
    well in distinguishing between safe and harmful inputs, achieving an AUROC of 0.975 at the prompt level and 0.985 at the
    conversation level. Additionally, ReGA exhibits robustness to real-world attacks and generalization across different safety
    perspectives, outperforming existing safeguard paradigms in terms of interpretability and scalability. Overall, ReGA serves
    as an efficient and scalable solution to enhance LLM safety by integrating representation engineering with model-based
    abstraction, paving the way for new paradigms to utilize software insights for AI safety. Our code is available in the
    supplementary materials.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/138/ReGA-Model-based-Safeguard-for-LLMs-via-Representation-Guided-Abstraction
