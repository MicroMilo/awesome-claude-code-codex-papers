- title: 'CASCADE: Detecting Inconsistencies between Code and Documentation with Automatic Test Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 587c7752-2ae3-4e63-a921-466519422d59
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Maintaining consistency between code and documentation is a crucial yet frequently overlooked aspect of software
    development. Even minor mismatches can confuse API users, introduce new bugs, and increase overall maintenance effort.
    This creates demand for automated solutions that can assist developers in identifying code-documentation inconsistencies.
    However, since automatic reports still require human confirmation, false positives carry serious consequences: wasting
    developer time and discouraging practical adoption. We introduce CASCADE (Consistency Analysis for Source Code And Documentation
    through Execution), a novel tool for detecting inconsistencies with a strong emphasis on reducing false positives. CASCADE
    leverages Large Language Models (LLMs) to generate unit tests directly from natural-language documentation. Since these
    tests are derived from the documentation, any failure during execution indicates a potential mismatch between the documented
    and actual behavior of the code. To minimize false positives, CASCADE also generates code from the documentation to cross-check
    the generated tests. By design, an inconsistency is reported only when two conditions are met: the existing code fails
    the test, while the code generated from the documentation passes the same test. We evaluated CASCADE on a novel dataset
    of inconsistent and consistent code-documentation pairs drawn from open-source Java projects. Further, we applied CASCADE
    to additional Java, C#, and Rust repositories, where we uncovered 12 previously unknown inconsistencies, of which 8 have
    subsequently been fixed by maintainers, demonstrating both CASCADE’s precision and its applicability to real-world codebases.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/131/CASCADE-Detecting-Inconsistencies-between-Code-and-Documentation-with-Automatic-Test
