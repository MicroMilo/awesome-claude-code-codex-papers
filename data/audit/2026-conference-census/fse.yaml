- title: 'GREClue: Failure Indexing with Graph-based Failure Representation and Entropy-based Deep Clustering'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b9ee5892-8238-4c8e-8348-8c8f797205a7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Failure indexing aims to group multiple failures according to their root causes and is an essential step in parallel
    debugging. Failure indexing consists mainly of two steps: failure representation and failure clustering. While many research
    efforts have been devoted to these two steps, serious issues still exist. For failure representation, existing works use
    coverage or program memory information, which unfortunately can not capture deep failure semantic. For failure clustering,
    advanced failure indexing methods use clustering algorithms with preset cluster centers, but this kind of clustering algorithm
    can handle spherical clusters well but performs poorly when handling clusters of other shapes. To address these issues,
    this paper proposes GREClue, a novel failure indexing approach with Graph-based failure Representation and Entropy-based
    deep Clustering. GREClue overcomes the issues in order. For failure representation, GREClue designs the failure semantic
    graph (FSG), a new graph representation that effectively contains semantic information and runtime information of failures.
    Based on FSG, GREClue further consists of an entropy-based deep clustering component, which can accurately cluster failed
    tests without presetting cluster centers. An extensive evaluation of GREClue shows that compared to the state-of-the-art
    failure indexing method, GREClue improves both the performance of estimating the number of faults and the clustering effectiveness
    by 10% to 41%. Moreover, it has also been shown that GREClue can effectively facilitate parallel debugging.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/35/GREClue-Failure-Indexing-with-Graph-based-Failure-Representation-and-Entropy-based-D
