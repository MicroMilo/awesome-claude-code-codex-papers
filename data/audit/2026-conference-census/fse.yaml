- title: Coding in a Bubble? Evaluating LLMs in Resolving Context Adaptation Bugs During Code Adaptation
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 14ea93fe-ce1c-41ef-960a-632db870fc91
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code adaptation is a fundamental but challenging task in software development, requiring developers to modify
    existing code for new contexts. A key challenge is to resolve \textit{\textbf{Context Adaptation Bugs (CtxBugs)}}, which
    occurs when code correct in its original context violates constraints in the target environment. Unlike isolated bugs,
    \textit{CtxBugs} cannot be resolved through local fixes and require cross-context reasoning to identify semantic mismatches.
    Overlooking them may lead to critical failures in adaptation. Although Large Language Models (LLMs) show great potential
    in automating code-related tasks, their ability to resolve \textit{CtxBugs} remains a significant and unexplored obstacle
    to their practical use in code adaptation. To bridge this gap, we propose \textit{CtxBugGen}, a novel framework for generating
    \textit{CtxBugs} to evaluate LLMs. Its core idea is to leverage LLMs’ tendency to generate plausible but context-free
    code when contextual constraints are absent. The framework generates \textit{CtxBugs} through a four-step process to ensure
    their relevance and validity: (1) Selection of four established context-aware adaptation tasks from the literature, (2)
    Perturbation via task-specific rules to induce \textit{CtxBugs} from LLMs while ensuring their plausibility, (3) Generation
    of candidate variants by prompting LLMs without any context constraints and (4) Identification of valid \textit{CtxBugs}
    through syntactic differencing and test execution in the target context. Based on the benchmark constructed by \textit{CtxBugGen},
    we conduct an empirical study with four state-of-the-art LLMs. Our results reveal their unsatisfactory performance in
    \textit{CtxBug} resolution. The best performing LLM, Kimi-K2, achieves 55.93% on Pass@1 and resolves just 52.47% of \textit{CtxBugs}.
    The presence of \textit{CtxBugs} degrades LLMs’ adaptation performance by up to 30%. Failure analysis indicates that LLMs
    often overlook \textit{CtxBugs} and replicate them in their outputs. This suggests that LLMs overly focus on the local
    code correctness of the reused code while ignoring its compatibility in the target context. Our study highlights a critical
    weakness in LLMs’ cross-context reasoning and emphasize the need for new methods to enhance their context awareness for
    reliable code adaptation.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/32/Coding-in-a-Bubble-Evaluating-LLMs-in-Resolving-Context-Adaptation-Bugs-During-Code-
