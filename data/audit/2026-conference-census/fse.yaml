  abstract: 'Screen readers are essential for visually impaired users to access mobile apps, yet inadequate developer support
    often leads to ambiguous or missing content. While prior work has primarily focused on missing content, ambiguity remains
    underexplored. This paper categorizes screen reader accessibility issues into three types: semantics separation, semantics
    downshift, and semantics missing. We propose \textsf{AccessDroid}, a lightweight approach that automatically detects both
    ambiguity and missing content issues in Android apps and generates diagnostic reports. Evaluated on 361 screens from 50
    real-world Android apps, \textsf{AccessDroid} detects over 95% of screen reader accessibility issues with an average time
    of 15ms per page. \textsf{AccessDroid} improves precision by 97.5% over the \textsf{LLM} approach while incurring significantly
    lower time overhead. It also achieves 2.41% higher recall than the industrial-grade \textsf{Accessibility Scanner}, with
    comparable detection efficiency.'
