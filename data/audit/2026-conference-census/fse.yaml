- title: Adaptive Mutation Scheduling with Deep Reinforcement Learning for Smart Contract Fuzzing
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5cc43ac0-b53f-44e6-9ec5-364baba19ab8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Smart contracts underpin a wide range of decentralized applications—from financial services to supply-chain management—but
    their immutability and direct control of assets magnify the impact of any security bugs. Although many fuzz approaches
    have been proposed and have demonstrated their effectiveness in uncovering vulnerabilities, existing methods often rely
    on unguided random mutation scheduling, generate redundant inputs, and fail to adapt to smart contract-specific characteristics.
    To overcome these challenges, we present FuzzMaster, a feedback-driven fuzzing framework that combines deep reinforcement
    learning (DRL) with lightweight probabilistic scheduling to steer mutation selection at runtime intelligently. By continuously
    analyzing execution feedback—code coverage, function-call sequences, and vulnerability signals—FuzzMaster’s DRL agent
    and probabilistic tables prioritize high-impact mutations and avoid wasted effort on redundant seeds. On standard VeriSmart
    and SmartBugs benchmarks, FuzzMaster achieves a 66.2% detection rate with 100% precision (versus 46.9% for ItyFuzz and
    43.1% for Confuzzius) and uncovers most bugs within the first second of execution. Meanwhile, in real-world Ethereum contracts,
    FuzzMaster identified 97 vulnerabilities in 6 categories. These results demonstrate that dynamic, vulnerability-aware
    mutation scheduling can dramatically improve both the efficiency and effectiveness of smart contract fuzz testing.
