  official_record_id: 689c4280-cd4f-41a7-8973-56ed17920929
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Bug reports play a critical role in software maintenance by helping users convey encountered issues to developers.
    Recently, GUI screen capture videos have gained popularity as a bug reporting artifact due to their ease of use and ability
    to retain rich contextual information. However, automatically reproducing bugs from such recordings remains a significant
    challenge. Existing methods often rely on fragile image-processing heuristics, explicit touch indicators, or pre-constructed
    UI transition graphs, which require non-trivial instrumentation and app-specific setup. This paper presents ViBR, a lightweight
    and fully automated approach that reproduces bugs directly from GUI recordings. Specifically, ViBR combines CLIP-based
    embedding similarity for action segmentation with Vision-Language Models (VLMs) for region-aware GUI state comparison
    and guided bug replay. Experimental results show that ViBR successfully reproduces 73.7% of bug recordings, significantly
    outperforming state-of-the-art baselines and ablation variants.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/88/ViBR-Automated-Bug-Replay-from-Video-based-Reports-Using-Vision-Language-Models
