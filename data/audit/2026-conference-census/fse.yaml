- title: 'DualCodeDetect: Zero-Shot LLM-Generated Code Detection via Dual-Channel Perturbation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 445ca1b6-4210-468b-9df6-5f1077b11ee3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The rapid advancement of large language models (LLMs) in code generation has greatly improved software development
    efficiency, but it has also raised concerns about misuse, making the distinction between human-written and LLM-generated
    code an urgent task. However, existing detection methods for LLM-generated content, particularly perturbation-based zero-shot
    methods, are primarily designed for natural language scenarios and fail to transfer effectively to the task of detecting
    generated code. When directly applied to code, they face two major challenges: (1) the low-entropy nature of code restricts
    the perturbation space and weakens discriminative signals; and (2) prior perturbation methods often compromise semantic
    integrity or executability, leading to substantial performance degradation. To address these issues, we propose DualCodeDetect,
    a novel zero-shot detection framework that amplifies the differences between LLM-generated and human-written code through
    a dual-channel perturbation mechanism. In the semantic channel, we design an identifier perturbation strategy based on
    outside-nucleus sampling, which disrupts the strong consistency of LLMs in identifier selection. In the structural channel,
    empirical analysis reveals that LLM-generated code exhibits greater uniformity in stylistic features; leveraging this
    insight, we construct a rule-based library of semantics-preserving code transformations to introduce structural perturbations
    that further magnify statistical disparities. In experiments conducted across two datasets and six representative code
    LLMs, DualCodeDetect achieves an average AUROC of 0.8535 under both T=0.2 and T=1.0 temperature settings, demonstrating
    significant superiority over existing detection methods.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/112/DualCodeDetect-Zero-Shot-LLM-Generated-Code-Detection-via-Dual-Channel-Perturbation
