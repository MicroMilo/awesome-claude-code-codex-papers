- title: Failure-Based Testing for Deep Reinforcement Learning Agents
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808185
  official_record_id: 43d176ce-8933-40a4-9891-17ee3179d8bf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Deep Reinforcement Learning (DRL) agents have been widely adopted across diverse domains to address challenging
    decision-making problems, such as autonomous driving and robotic control. Given that many of these applications are safety-
    and security-critical, rigorous testing of DRL agents is indispensable. Existing testing methods are typically guided
    by reward signals to detect failures. However, for well-trained agents, whose performance approaches optimal levels in
    standard operating conditions, reward signals remain generally high, making current methods ineffective at uncovering
    critical failures. To address the challenges, we propose a novel failure-based method that leverages task-induced failure
    insights to improve the efficiency of DRL agent testing. Since DRL agents are inherently designed with human-defined tasks,
    they provide valuable cues about task difficulty. By intuition, a DRL agent is more likely to fail when confronted with
    a more difficult task, so we prioritize testing the most difficult task. Building on this foundation, we propose Prior
    Random Testing, a black-box failure-based testing method that enables targeted prioritization while preserving the diversity
    of generated test cases. Guided by task-induced failure insights, PRT prioritizes failure-prone regions of the input domain,
    thereby facilitating efficient failure detection. PRT is evaluated on three widely used benchmarks and compared with different
    state-of-the-art methods including fuzzing, search-based and generative-based methods. PRT ranks among the top performers
    in terms of both the cost for finding the first failure and the diversity of test cases.
