- title: 'VisionScratch: LLM-Based Automated Feedback Generation Using Code-Produced Videos for Scratch Programs'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 41e9b16c-f0b5-4950-b89d-94e989777592
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Block-based programming environments such as Scratch are increasingly popular in programming education, in particular
    for young learners. While the use of blocks helps prevent syntax errors, semantic bugs remain common and difficult to
    debug. Existing tools for Scratch debugging rely heavily on predefined rules or user manual inputs, and crucially, they
    ignore the platform’s inherently visual nature. We introduce VisionScratch, the first multimodal feedback generation system
    for Scratch that leverages both the project’s block code and its generated gameplay video to diagnose and repair bugs.
    VisionScratch uses a two-stage pipeline: a vision-language model first aligns visual symptoms with code structure to identify
    a single critical issue, then proposes minimal, abstract syntax tree level repairs that are verified via execution in
    the Scratch virtual machine. We evaluate VisionScratch on a set of real-world Scratch projects against state-of-the-art
    LLM-based tools and human testers. Results show that gameplay video is a crucial debugging signal: VisionScratch substantially
    outperforms prior tools in both bug identification and repair quality, even without access to project descriptions or
    goals. This work demonstrates that video can serve as a first-class specification in visual programming environments,
    opening new directions for LLM-based debugging beyond symbolic code alone.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/109/VisionScratch-LLM-Based-Automated-Feedback-Generation-Using-Code-Produced-Videos-for
