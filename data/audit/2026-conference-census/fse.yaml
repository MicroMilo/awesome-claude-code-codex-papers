  abstract_reason: Official abstract fetched.
  abstract: Recovering the modular architecture of software systems from source code is a longstanding challenge, especially
    when documentation is incomplete or outdated. Manual recovery is labor-intensive, error-prone, and does not scale to large
    systems. While automated approaches have been proposed, many rely on handcrafted heuristics or focus narrowly on either
    structural or semantic information, which limits their ability to capture the full range of architectural signals. We
    introduce GAER, an unsupervised architecture recovery approach based on graph auto-encoders (GAEs) that frames architecture
    recovery as a representation learning problem. Software systems are modeled as heterogeneous graphs with typed dependencies,
    while folder hierarchies and code semantics are incorporated as node features. We evaluate two encoder variants, GAT and
    GCN, and find that GAT generally yields more accurate and stable decompositions. Experiments on ten open-source systems
    with ground-truth architectures show that GAER improves recovery accuracy by about 30% on average across evaluation metrics
    compared to a state-of-the-art method. By automatically deriving architectural views that integrate multiple signals,
    GAER reduces the manual effort required to maintain architectural documentation and supports more effective system understanding.
