  abstract: Software-intensive systems, such as software product lines and robotics, utilise Markov decision processes (MDPs)
    to capture uncertainty and analyse sequential decision-making problems. Despite the usefulness of conventional policy
    synthesis methods, they fail to scale to large state spaces. Our approach addresses this issue and accelerates policy
    synthesis in large MDPs by dynamically refining the MDP and iteratively selecting the most fragile MDP regions for refinement.
    This iterative procedure offers a balance between accuracy and efficiency, as refinement occurs only when necessary. We
    formally show that the composed policy is near-optimal under standard assumptions, with error bounded by the local solver
    tolerance and boundary mismatch. Across diverse case studies and MDPs up to 1M states, we demonstrate that our approach
    achieves up to 2x speedup over PRISM, offering a competitive solution for real-world policy synthesis in large MDPs.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/185/Accelerating-Policy-Synthesis-in-Large-Scale-MDPs-via-Hierarchical-Adaptive-Refinemen
