- title: Automated Repair of TEE Partitioning Issues via DSL-Guided and LLM-Assisted Patching
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 8e815956-236d-471b-83b8-e859b4332077
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Trusted Execution Environments (TEEs) provide hardware-based isolation to protect sensitive data and computations
    from potentially compromised operating systems (OS). However, TEE applications inevitably interact with the untrusted
    OS through SDK interfaces, and improper partitioning can introduce severe vulnerabilities such as data leakage and code
    injection. While prior work has proposed static analysis tools to detect such issues, automated repair remains largely
    unexplored. This problem is particularly challenging due to three TEE-specific factors: the lack of standardized secure
    development guidelines, the difficulty of extracting semantic information from low-level C code, and the absence of mature
    testing and validation methods. In this work, we present TEERepair, a framework for automatically repairing bad partitioning
    issues in TEE applications. Our approach tackles the above challenges by introducing a domain-specific language (DSL)
    to encode repair rules that express and capture common TEE security patterns, which are instantiated as patch templates
    with placeholders for context-specific variables. We then leverage large language models (LLMs) to reason about code semantics
    and synthesize context-aware patches, and further generate test clients to validate the repairs. We evaluate TEERepair
    on the TEE Partitioning Errors Benchmark (PartitioningE-Bench), achieving an overall precision of 95.29% and recall of
    91.01%, with improvements of 37.04% in precision and 51.68% in recall over an LLM-only baseline. Furthermore, applying
    TEERepair to 20 real-world TEE projects, we submitted 5 repair pull requests, 2 of which have been confirmed and merged
    by project maintainers.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/192/Automated-Repair-of-TEE-Partitioning-Issues-via-DSL-Guided-and-LLM-Assisted-Patching
