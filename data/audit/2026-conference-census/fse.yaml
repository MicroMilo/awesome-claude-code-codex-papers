  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Delta debugging is a fundamental technique for automatically minimizing failure-inducing inputs. ProbDD augments
    ddmin by replacing its deterministic partitioning with a probability-guided search. Recently, Weighted Delta Debugging
    (WDD) augments ddmin (W_ddmin) or ProbDD (W_ProbDD) with token-based weighting to address size disparities, but it can
    conflate syntactic size with structural complexity: elements with similar token counts may differ substantially in syntactic
    structure or semantic significance. We introduce Structure-Aware Delta Debugging (SADD), which quantifies element importance
    using geometric and information-theoretic properties of program structure. SADD defines a unified weight function that
    combines three complementary signals—geometric volume, decision uniformity, and effective branch complexity. We instantiate
    SADD in two algorithms: SA_ddmin, which augments ddmin with structure-aware partitioning, and SA_ProbDD, which injects
    structural weights into ProbDD’s probabilistic selection. We evaluate SADD against ddmin, W_ddmin, W_ProbDD, and ProbDD
    within two state-of-the-art delta debugging frameworks, HDD and Perses, using 62 real-world C and XML benchmarks. Under
    HDD, our approach substantially reduces average delta debugging times: 57.12% (SA_ddmin vs. ddmin), 15.04% (SA_ddmin vs.
    W_ddmin), and 14.64% (SA_ProbDD vs. ProbDD) on C benchmarks, and 30.12% (SA_ddmin vs. ddmin) and 20.10% (SA_ProbDD vs.
    ProbDD) on XML benchmarks. On C under Perses, it achieves 7.02% (SA_ProbDD vs. ProbDD). In other cases—such as XML programs
    with simpler, flatter structures where WDD’s token counting suffices, or under Perses, which already applies structural
    transformations before ddmin—the gains are limited or absent. An ablation study shows that geometric volume provides the
    foundation, while information-theoretic metrics add complementary, context-sensitive refinements. Overall, modeling structural
    complexity improves delta debugging precisely when input hierarchies exhibit diversity that token counts alone cannot
    capture.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/173/Structure-Aware-Delta-Debugging-with-Geometric-Information-Weights
