  official_record_id: 11e4e988-08ee-49cd-a940-24687628ea2a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Smart contracts are a critical component of blockchain systems. Due to the large amount of digital assets carried
    by smart contracts, their security is of critical importance. Although numerous tools have been developed for detecting
    smart contract vulnerability, their effectiveness remains limited, particularly due to the high false positives included
    in the reported results. Therefore, developers and auditors are often overwhelmed with manually verifying the reported
    issues. A fundamental reason behind this is that while a reported vulnerability satisfies specific vulnerable patterns,
    it may not actually be exploitable, either because the vulnerable code cannot be triggered or it does not result in any
    financial loss. In this paper, we propose V2E, a new framework for validating whether a reported vulnerability is truly
    exploitable. The core idea of V2E is to automatically generate executable Proof-of-Concept Exploit (PoC for short), and
    then assess if the vulnerability could be triggered and incur any real damage (i.e., causing financial loss) by the PoC.
    While LLMs have shown proficiency in PoC generation, achieving our task is by no means trivial. In detail, it is difficult
    for LLM to: (1) generate and update PoC to trigger a specific vulnerability, (2) evaluate the PoC’s effectiveness to validate
    exploitable vulnerability. To this end, V2E automates the whole process through a novel combination of PoC generation,
    validation, and refinement: (1) Firstly, V2E generates targeted PoCs by analyzing potential vulnerability paths. (2) Then,
    V2E verifies the validity of PoCs through triggerability and profitability analysis. (3) In addition, V2E iteratively
    refines the generated PoC based on PoC execution feedback, therefore, increasing the chance to confirm the vulnerability.
    Evaluation on 264 manually labeled contracts shows that V2E outperforms the baseline approach. Particularly, V2E successfully
    identifies 102 out of 124 exploitable vulnerabilities, achieving a precision of 91.9% and a recall of 82.3%. In addition,
    it successfully eliminates 71 out of 140 false alarms (50.7%). Besides, V2E effectively enhances the performance of SOTA
    tools. It reduces the false positive rates of Slither by 76.9%, Mythril by 56.9% and Confuzzius by 65%.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/20/V2E-Validating-Smart-Contract-Vulnerabilities-through-Profit-driven-Exploit-Generati
