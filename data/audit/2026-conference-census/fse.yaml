- title: 'VulKey: Automated Vulnerability Repair Guided by Domain-Specific Repair Patterns'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: adc52707-b062-4a42-8f32-bcb35fd619d2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The increasing prevalence of software vulnerabilities highlights the need for effective Automatic Vulnerability
    Repair (AVR) tools. While LLM-based approaches are promising, they struggle to incorporate structured security knowledge
    from sources like CWE and NVD. Current methods either use this information superficially by concatenating the CWE-ID into
    the input prompt, yielding negligible benefits, or rely on few-shot learning with rigid, non-generalizable examples, which
    limits their effectiveness in real-world scenarios. To address this gap, we propose VulKey, an LLM-based AVR framework
    that leverages a hierarchical abstraction of expert knowledge to guide patch generation. Our novel three-level abstraction
    formulates repair strategies in terms of CWE type, syntactic actions, and semantic key elements. This approach captures
    the essence of a security fix with greater generality than concrete examples and more semantic richness than traditional
    syntax-based templates, overcoming the coverage limitations of prior methods. VulKey is implemented as a two-stage pipeline:
    first, expert knowledge matching predicts an appropriate repair pattern for the vulnerability; second, repair code generation
    uses a pattern-guided, fine-tuned LLM to produce secure patches. On the real-world C/C++ dataset PrimeVul, VulKey achieves
    31.5% repair accuracy, surpassing the best baseline by 7.6% and outperforming leading tools such as VulMaster and GPT-5.
    Moreover, VulKey demonstrates cross-language and cross-model generalizability, with state-of-the-art performance on the
    Java benchmark Vul4J. These results underscore the importance of structured expert knowledge in advancing AVR effectiveness.
    Our work demonstrates that explicitly modeling and integrating expert security knowledge through hierarchical patterns
    is a crucial step toward building more effective and reliable AVR tools.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/33/VulKey-Automated-Vulnerability-Repair-Guided-by-Domain-Specific-Repair-Patterns
