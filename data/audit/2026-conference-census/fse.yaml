  official_record_id: 4be4c7c7-c435-4294-8dde-48ff853a6e16
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: WebAssembly (Wasm) has emerged as a powerful bytecode format for running applications with near-native performance
    in portable and secure environments. However, while Wasm currently supports compiled languages like C, C++, and Rust,
    it lacks robust support for managed languages such as Python, Java, and JavaScript. This limitation hinders the deployment
    of applications in domains like machine learning and data processing that rely heavily on managed language ecosystems.
    To address this, we propose WALL-E, a novel framework to integrate managed languages into Wasm environments without complex
    runtime nesting or recompilation. WALL-E employs a unique external library linking strategy, using a client-server architecture
    to connect Wasm modules with managed language libraries running in their native runtimes. This approach preserves the
    native execution speed and language feature compatibility of managed languages by eliminating the overhead associated
    with double-layer virtual machines. Our evaluation shows that WALL-E supports ten managed languages without framework
    modifications and achieves a speedup of hundreds of times over the runtime nesting solution, with low communication overhead.
    WALL-E enhances the practicality of Wasm in cloud and edge computing, enabling efficient multi-language applications.
