  abstract: Modern software usually exposes a large number of configuration options to the user, which gives rise to enormous
    configuration spaces in practice. Appropriate choices for these options dramatically influence the performance of the
    software (throughput, memory consumption, execution time, etc.). However, due to the sheer size of the configuration space,
    systematically identifying the best or worst-performing configurations is computationally infeasible through exhaustive
    exploration. Instead, practitioners rely on budgeted sampling strategies, such as uniform random sampling or statistical
    recursive search, to explore the configuration space under fixed measurement budgets in an attempt to find the best or
    worst configuration. A fundamental limitation of existing sampling strategies is the lack of quantifiable guarantees that
    the selected configuration truly reflects best-case (or worst-case) performance. In this paper, we define the basic concepts
    of \emph{posterior risk} and \emph{posterior confidence} and present a probabilistic framework to evaluate how well sampling
    strategies identify the best- or worst-performing configuration of a software system. We evaluate our framework by comparing
    five representative sampling strategies on seven real-world configurable software systems. Using our framework, we find
    that statistical recursive search yields consistently tighter best-case guarantees—higher posterior confidence and lower
    posterior risk—than the alternatives at the same budget. Our results demonstrate the potential of our framework as a principled
    basis for reporting, comparing, and refining sampling strategies, and as a tool for practitioners to select strategies
    and budgets with quantified guarantees across systems and sample sizes. Extended ablations—including additional sampling
    strategies and per-system breakdowns—are available in the supplementary material.
