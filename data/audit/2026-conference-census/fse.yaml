- title: 'CuFuzz: An API-Knowledge-Graph Coverage-Driven Fuzzing Framework for CUDA Libraries'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 06111f38-5cd8-44d9-bc55-24658e19d4ec
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'In the AI-driven era, NVIDIA CUDA libraries have become indispensable for accelerating compute-intensive tasks,
    yet their security assessment remains critically understudied due to closed-source code and unique programming paradigms.
    Existing efforts primarily target CUDA compiler vulnerabilities (e.g., NVCC), but overlook broader library-specific risks.
    This paper addresses the challenges of fuzzing CUDA libraries: (1) the absence of guidance narrows the set of APIs that
    generated harnesses can reach; and (2) input mutation remains inefficient for LLM-generated harnesses. A new tool called
    CuFuzz has been proposed, aimed at uncovering potential vulnerabilities in the CUDA libraries. CuFuzz has the ability
    to generate testing harnesses for various CUDA library functions from scratch, perform efficient parameter mutation, and
    adapt to the needs of multiple CUDA libraries. First, LLMs are used to extract semantic relationships from CUDA documentation
    and sample codes, constructing a knowledge graph that prioritizes API interactions and contextual dependencies. The API
    coverage bitmap is proposed to guide the fuzzer to explore under-tested library functions. In addition to harness generation,
    the API knowledge graph is also combined with compiler diagnostics to repair erroneous harnesses, thereby improving compilation
    success rates. Subsequently, CuFuzz employs the LLMs to analyze and decouple parameter dependencies, separates out the
    mutable parameters, and performs parameter-isolated mutation on them to enhance mutation efficiency. Evaluated across
    three CUDA releases (12.4, 12.7, and 13.0) on eight widely adopted libraries (e.g., cuBLAS, cuFFT), CuFuzz achieves 2.97x
    higher API coverage and 4.0x superior API edge coverage relative to baseline (Fuzz4all), on average. The experiments uncovered
    4 unknown bugs, validated by NVIDIA’s security team and obtained 2 CVEs.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/120/CuFuzz-An-API-Knowledge-Graph-Coverage-Driven-Fuzzing-Framework-for-CUDA-Libraries
