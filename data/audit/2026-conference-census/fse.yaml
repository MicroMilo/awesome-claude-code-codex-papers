  official_record_id: f7f7a564-83a9-4e2b-a70c-43533347f0fb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Constructing and curating high-quality code datasets requires significant resources, making them valuable intellectual
    property. Unfortunately, these datasets currently face severe risks of unauthorized use. Although digital watermarking
    offers a post hoc mechanism for copyright authentication, existing methods are predominantly based on the co-occurrence
    pattern, which is not robust and is susceptible to watermark detection and removal attacks. In this paper, we propose
    PuzzleMark, a robust watermarking method for code datasets. To reduce the risk of watermark exposure, PuzzleMark introduces
    a carrier selection strategy that leverages code complexity to evaluate the suitability of code snippets as watermark
    carriers, and selects those with high suitability for watermarking. To enhance the robustness of the watermark, PuzzleMark
    proposes a novel concatenation pattern to replace the traditional co-occurrence pattern, and implements two watermarking
    strategies through variable name concatenation. PuzzleMark adaptively embeds watermarks based on the inherent characteristics
    of the code, making it more stealthy while maintaining design simplicity. For watermark verification, PuzzleMark employs
    an independent-samples $t$-test to verify suspicious models under a black-box setting. Experimental results demonstrate
    that PuzzleMark achieves a 100% verification success rate and a 0% false positive rate, with negligible impact on model
    performance. Both our human study and our evaluation using four state-of-the-art watermark detection methods show that
    PuzzleMark exhibits strong imperceptibility, with an average suspicious rate $\leq$ 0.24 and an average recall $\leq$
    30.41%, respectively. Furthermore, the consistent retention of verifiability under two attack scenarios further corroborates
    the robustness of PuzzleMark. As a practical digital watermarking method, PuzzleMark provides strong protection for the
    intellectual property of code datasets and offers new insights for future research.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/74/PuzzleMark-Implicit-Jigsaw-Learning-for-Robust-Code-Dataset-Watermarking-in-Neural-C
