- title: 'Co-Evolution of Types and Dependencies: Towards Repository-Level Type Inference for Python Code'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 917181cd-a5a0-4838-8676-bce8bd6b23bf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Python’s dynamic typing mechanism, while promoting flexibility, is a significant source of runtime type errors
    that plague large-scale software, which inspires the automatic type inference techniques. Existing type inference tools
    have achieved advances in type inference within isolated code snippets. However, repository-level type inference remains
    a significant challenge, primarily due to the complex inter-procedural dependencies that are difficult to model and resolve.
    To fill this gap, we present PyTIR, a novel approach based on LLMs that achieves repository-level type inference through
    the co-evolution of types and dependencies. PyTIR constructs an Entity Dependency Graph (EDG) to model the objects and
    type dependencies across the repository. During the inference process, it iteratively refines types and dependencies in
    EDG for accurate type inference. Our key innovations are: (1) an EDG model designed to capture repository-level type dependencies;
    (2) an iterative type inference approach where types and dependencies co-evolve in each iteration; and (3) a type-checker-in-the-loop
    strategy that validates and corrects inferences on-the-fly, thereby reducing error propagation. When evaluated on 12 complex
    Python repositories,PyTIR significantly outperformed prior works, achieving a \textit{TypeSim} score of 0.89 and a \textit{TypeExact}
    score of 0.84, representing a 27% and 40% relative improvement over the strongest baseline. More importantly, PyTIR removed
    new type errors introduced by the tool by 92.7%. This demonstrates a significant leap towards automated, reliable type
    annotation for real-world Python development.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/181/Co-Evolution-of-Types-and-Dependencies-Towards-Repository-Level-Type-Inference-for-P
