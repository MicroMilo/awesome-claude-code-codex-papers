  official_record_id: 614e3434-0c89-4170-83b7-60de1979efd7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Usability describes quality attributes of application user interfaces that determine how effectively users can
    interact with them. Traditional usability evaluation methods require considerable expertise and resources, which can be
    challenging, especially for small teams and organizations. Automating usability evaluation could make it more accessible
    and help to improve the user experience. The recent emergence of powerful multimodal large language models (MLLMs) has
    opened new opportunities for automating usability evaluation and recommendation of improvements. These models can process
    visual inputs such as images and videos alongside textual context, which enables the identification of usability issues
    and the generation of actionable suggestions to resolve these issues. In this paper, we present a novel automated approach
    that uses limited application context and screen recordings of user interactions as input to an MLLM. The model automatically
    identifies and describes usability issues based on Nielsen’s usability heuristics, and provides corresponding explanations
    and improvement recommendations. To reduce the developer effort of manual prioritization, the recommendations are ranked
    by severity. The quality and practical usefulness of the generated recommendations were evaluated based on a user study
    that involved software engineers as participants. The evaluation focused on the highest-ranked suggestions provided by
    the model. The results demonstrate the potential of our approach to provide low-effort usability improvement recommendations.
    This makes it a promising complement to traditional evaluation methods, especially in settings with limited access to
    usability experts. In this sense, the approach serves as a basis for future integration into development tools to enable
    automated usability evaluation within software engineering workflows.
