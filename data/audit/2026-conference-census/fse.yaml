- title: 'Clotho: Measuring Task-Specific Pre-Generation Test Adequacy for LLM Inputs'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0d1454e9-dfc1-4999-ac09-cfb99492e771
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Software increasingly relies on the emergent capabilities of Large Language Models (LLMs), from natural language
    understanding to program analysis and generation. Yet testing them on specific tasks remains difficult and costly: many
    prompts lack ground truth, forcing reliance on human judgment, while existing uncertainty and adequacy measures typically
    require full inference. A key challenge is to assess input adequacy in a way that reflects the demands of the task, ideally
    before even generating any output. We introduce Clotho, a task-specific, pre-generation adequacy measure that estimates
    input difficulty directly from hidden LLM states. Given a large pool of unlabelled inputs for a specific task, Clotho
    uses a Gaussian Mixture Model (GMM) to adaptively sample the most informative cases for human labelling. Based on this
    reference set the GMM can then rank unseen inputs by their likelihood of failure. In our empirical evaluation across eight
    benchmark tasks and three open-weight LLMs, Clotho can predict failures with a ROC-AUC of 0.716, after labelling reference
    sets that are on average only 5.4% of inputs. It does so without generating any outputs, thereby reducing costs compared
    to existing uncertainty measures. Comparison of Clotho and post-generation uncertainty measures shows that the two approaches
    complement each other. Crucially, we show that adequacy scores learned from open-weight LLMs transfer effectively to proprietary
    models, extending the applicability of the approach. When prioritising test inputs for proprietary models, Clotho reveals
    126.8% more failures, on average, in the top 100 inputs compared to random selection.'
