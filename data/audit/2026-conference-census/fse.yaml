- title: 'SmartIFSyn: Automated Information Flow Security Policy Synthesis for Smart Contracts'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5579508d-0f79-4ee0-9cab-b012345d9f7a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Smart contracts have achieved significant success, however, their security remains a long-standing challenge.
    The immutability and transparency of smart contracts require establishing a strong mechanism to prevent private leakage
    and trusted data tampering. Apart from traditional logic and code-level vulnerabilities arising from insufficient control
    over contract variables and function parameters, smart contracts may store private-dependent information in blockchain
    records, which is a critical type of vulnerability, but often overlooked in existing security analysis. In this paper,
    we present an automated approach for synthesizing security policies, named SmartIFSyn, to eliminate information flow vulnerabilities
    in smart contracts. We formalize the semantics of Solidity, the most widely used smart contract language, and analyze
    information flow security of Solidity smart contracts from two perspectives: local-variable security and global-interaction
    security. We present a type system to guide the elimination of local-variable vulnerabilities by inferring a policy and
    resort to constraint solving to synthesize a desired policy in case that the type system fails. The policy ensures both
    local-variable and global-interaction security while it is maximally aligned with user preference. Furthermore, the policy
    can be subsequently converted into enforceable specifications. We implement our approach in a tool and evaluate it on
    17,160 real-world Ethereum smart contracts. The experimental results demonstrate the efficacy of our approach, e.g., detected
    243 vulnerabilities in 223 real-world Ethereum smart contracts.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/75/SmartIFSyn-Automated-Information-Flow-Security-Policy-Synthesis-for-Smart-Contracts
