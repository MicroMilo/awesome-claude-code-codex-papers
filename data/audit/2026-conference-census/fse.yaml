- title: 'Property Refinement in Linear Temporal Logic: Formal Semantics and Algorithms for Software Verification'
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/50/Property-Refinement-in-Linear-Temporal-Logic-Formal-Semantics-and-Algorithms-for-Sof
