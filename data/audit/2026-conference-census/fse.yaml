- title: 'Building Software by Rolling the Dice: A Qualitative Study of Vibe Coding'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 3d4dffa9-52dd-4e6f-8195-6661b63f8d6f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) are reshaping software engineering by enabling vibe coding—building software primarily
    through prompts rather than writing code. Although widely publicized as a productivity breakthrough, little is known about
    how practitioners actually define and engage in these practices. To shed some light on this emerging phenomenon, we conducted
    a grounded theory study of 20 vibe-coding videos, including 7 live-streamed coding sessions (~16 hours, 254 prompts) and
    13 opinion videos (~5 hours), supported by additional analysis of activity durations and intents of prompts. Our findings
    reveal a spectrum of behaviors: some vibe coders rely almost entirely on AI without inspecting code, while others examine
    and adapt generated outputs. Across approaches, all must contend with the stochastic nature of code generation, with debugging
    and refinement described as “rolling the dice.” Further, divergent mental models, shaped by developers’ expertise and
    engagement with AI, influence prompting strategies, evaluation practices, and levels of trust. These findings open new
    directions for research on the future of software engineering and point to practical opportunities for tool design and
    education.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/184/Building-Software-by-Rolling-the-Dice-A-Qualitative-Study-of-Vibe-Coding
