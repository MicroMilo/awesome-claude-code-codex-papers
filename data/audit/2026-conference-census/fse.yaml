- title: Improving Data Leakage Detection in Machine Learning Notebooks through Static Slicing and Structured LLM Prompts
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 01cca042-1689-496b-801f-add63d97f241
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Data leakage remains a critical yet under-diagnosed issue in machine learning pipelines, leading to inflated results
    and unreliable deployments. Existing detection approaches rely on static rules that often miss open-coded manipulations
    and fail to capture the diversity of real-world notebooks. This paper introduces a novel methodology that integrates static
    slicing with large language models (LLMs) to improve leakage detection. We use a Datalog-based static analysis that isolates
    compact, provenance-aware slices corresponding to model training and evaluation pairs, and we pair these with structured
    LLM prompts that guide step-by-step reasoning about potential leakage for each isolated slice. Evaluated on a curated
    benchmark of Python notebooks from Kaggle and GitHub, our approach achieves state-of-the-art performance in both preprocessing
    and overlap leakage detection, substantially outperforming end-to-end prompting and the rule-based baseline. Our findings
    highlight the effectiveness of combining program slicing and prompt engineering for data leakage detection and establish
    the first systematic LLM-based solution for detecting data leakage in machine learning code.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/177/Improving-Data-Leakage-Detection-in-Machine-Learning-Notebooks-through-Static-Slicing
