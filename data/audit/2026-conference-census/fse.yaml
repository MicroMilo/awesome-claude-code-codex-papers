- title: 'iCoRe: An Iterative Correlation-Aware Retriever for Bug Reproduction Test Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 15f12a9d-8a7e-4bdd-90b4-033295eace68
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Automatically generating bug reproduction tests (BRT) from issue descriptions is crucial for facilitating software
    maintenance. Large Language Model (LLM)-based approaches have shown great potential for this task. Their effectiveness
    heavily relies on retrieving high-quality context from the codebase. The retrieval phase of existing approaches relies
    on either traditional methods like BM25 or modern LLM-driven strategies. The LLM-based retrieval strategies typically
    involve equipping an LLM with tools to autonomously explore the code repository or having it select the most relevant
    files and code snippets from a provided list as context. However, these retrieval methods suffer from three key limitations:
    (1) They often employ a unified strategy for retrieving both source code and test cases, overlooking their distinct retrieval
    requirements. (2) They focus solely on semantic similarity, ignoring function call relationships that reflect behavioral
    relevance, which often leads to the retrieval of irrelevant context. (3) The retrieval lacks a feedback loop from the
    generation phase, preventing it from refining the context based on execution results. These limitations collectively result
    in low-quality context, thereby hindering the accuracy of bug reproduction. To address these challenges, we propose iCoRe,
    an iterative, correlation-aware context retrieval approach. iCoRe is explicitly designed to be aware of three key correlations:
    1) the correlation between source code and test cases, which requires differentiated retrieval, 2) the correlation between
    textual semantics and function call structures for accurate relevance assessment, and 3) the correlation between the retrieval
    and generation phases, which enables iterative feedback and refinement. To evaluate iCoRe, we integrate it with an LLM-based
    BRT generator and conduct a comprehensive evaluation on the SWT-bench Lite benchmark. Experimental results show that our
    method achieves a Fail-to-Pass rate of 42.0%, representing a significant 31.7% relative improvement over existing retrieval
    methods.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/169/iCoRe-An-Iterative-Correlation-Aware-Retriever-for-Bug-Reproduction-Test-Generation
