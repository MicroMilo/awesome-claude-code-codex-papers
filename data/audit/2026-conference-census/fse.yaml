- title: 'Towards Secure Logging: Characterizing and Benchmarking Logging Code Security Issues with LLMs'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 3a94c929-baf0-41e2-8e83-0dd71c724b2f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Logging code plays an important role in software systems by recording key events and behaviors, which are essential
    for debugging and monitoring. However, insecure logging practices can inadvertently expose sensitive information or enable
    attacks such as log injection, posing serious threats to system security and privacy. Prior research has examined general
    defects in logging code, but systematic analysis of logging code security issues remains limited, particularly in leveraging
    LLMs for detection and repair. In this paper, we derive a comprehensive taxonomy of logging code security issues, encompassing
    four common issue categories and 10 corresponding patterns. We further construct a benchmark dataset with 101 real-world
    logging security issue reports that have been manually reviewed and annotated. We then propose an automated framework
    that incorporates various contextual knowledge to evaluate LLMs’ capabilities in detecting and repairing logging security
    issues. Our experimental results reveal a notable disparity in performance: while LLMs are moderately effective at detecting
    security issues (e.g., the accuracy ranges from 12.9% to 52.5% on average), they face noticeable challenges in reliably
    generating correct code repairs. We also find that the issue description alone improves the LLMs’ detection accuracy more
    than the security pattern explanation or a combination of both. Overall, our findings provide actionable insights for
    practitioners and highlight the potential and limitations of current LLMs for secure logging.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/93/Towards-Secure-Logging-Characterizing-and-Benchmarking-Logging-Code-Security-Issues-
