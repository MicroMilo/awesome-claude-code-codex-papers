  official_record_id: 54709c1b-a115-4e22-a3e9-c3b63cf26862
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Constructing large-scale datasets for the GitHub issue resolution task is crucial for both training and evaluating
    the software engineering capabilities of Large Language Models (LLMs). However, the existing GitHub issue resolution data
    construction pipeline is challenging and labor-intensive. We identify three key limitations in existing pipelines: (1)
    test patches collected often omit binary file changes; (2) the manual construction of evaluation environments is labor-intensive;
    and (3) the fail2pass validation phase requires manual inspection of test logs and writing custom parsing code to extract
    test status from logs. In this paper, we propose SWE-Factory, a fully automated issue resolution data construction pipeline,
    to resolve these limitations. First, our pipeline automatically recovers missing binary test files and ensures the correctness
    of test patches. Second, we introduce SWE-Builder, a LLM-based multi-agent system that automates evaluation environment
    construction. Third, we introduce a standardized, exit-code-based log parsing method to automatically extract test status,
    enabling a fully automated fail2pass validation. Experiments on 671 real-world GitHub issues across four programming languages
    show that our method can effectively construct valid evaluation environments for GitHub issues at a reasonable cost. For
    example, with GPT-4.1 mini, our SWE-Builder constructs 337 valid task instances out of 671 issues, at $0.047 per instance.
    Our ablation study further shows the effectiveness of different components of SWE-Builder. We also demonstrate through
    manual inspection that our exit-code- based fail2pass validation method is highly accurate, achieving an F1 score of 0.99.
    Additionally, we conduct an exploratory experiment to investigate whether we can use SWE-Factory to enhance models’ software
    engineering ability. After training five models on 2,809 Python task instances collected by our method, all models show
    improved software engineering ability. For example, the resolve rate of a trained Qwen2.5-Coder-14B-Instruct on SWE-bench
    Verified increases from 5.8% to 21.0%. We hope our method can accelerate the construction of large-scale, high-quality
    GitHub issue resolution datasets for both training and evaluation.'
