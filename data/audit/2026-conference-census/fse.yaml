  abstract: Code obfuscation is a process that complicates reverse engineering, protects intellectual property, and conceals
    malware. However, traditional deobfuscation methods are not universally applicable and can be easily circumvented. It
    is evident that advanced techniques, such as symbolic execution and SMT solvers, encounter difficulties when confronted
    with out-of-distribution code and particular obfuscation strategies. This hinders their efficacy to a considerable extent.
    This paper proposes a novel approach that integrates Large Language Models (LLMs) with decompiled code analysis to enhance
    understanding of control flow structures. Contributions include the formalisation of control flow deobfuscation tasks
    with new evaluation metrics and the proposal of a general predicate relationship inference method that adapts to diverse
    obfuscation techniques. The innovative model architecture combines linear LLM access with non-linear execution path expansion,
    thereby generating security-expert-friendly C pseudocode. Comprehensive evaluation on 780 binaries employing 13 distinct
    obfuscation techniques demonstrates that our method reduces average cyclomatic complexity by 52.4%, achieves full deobfuscation
    in 53.8% of cases, and suppresses Topological Feasible Path Set (TFPS) inflation caused by bogus control flow by over
    99%. The framework demonstrates superiority over existing state-of-the-art tools in terms of both generality and semantic
    consistency, thus evidencing the transformative potential of LLMs in facilitating scalable malware reverse engineering.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/7/Large-Language-Models-for-Opaque-Predicate-Resolution-A-Universal-Control-Flow-Deobf
