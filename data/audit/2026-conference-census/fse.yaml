- title: 'TSGuard: Automated User-Centric Incident Diagnosis for AI Workloads in the Cloud'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 3c6440b9-341d-468b-bb45-5e4aab9d23c1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'AI workloads incur frequent failures and incidents from the underlying infrastructure. The current incident management
    workflow follows a provider-centric paradigm, where users report incidents to the infrastructure provider who then conducts
    troubleshooting. Due to the large number of incidents and the manual nature of the troubleshooting process, the provider
    often takes several days to resolve an incident, resulting in operational delays and productivity loss. To address these
    challenges, we present TSGuard, a user-centric multi-agent system that delivers immediate incident diagnosis to users
    who deploy the workloads. The core innovation of TSGuard is twofold: (1) constructing domain-specific knowledge bases
    by mining historical on-call experiences in the offline phase, and (2) mimicking human expert diagnosis via structured
    reasoning and iterative trial-and-error in the online phase. Evaluation using production incident records from public
    cloud A demonstrates that TSGuard significantly outperforms state-of-the-art baselines, improving diagnostic accuracy
    by 19.8%. Furthermore, TSGuard reduces the average verification time by 63.4% compared to sequential benchmark execution
    baseline.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/34/TSGuard-Automated-User-Centric-Incident-Diagnosis-for-AI-Workloads-in-the-Cloud
