  abstract_reason: Official abstract fetched.
  abstract: Interactive theorem proving (ITP) is a powerful approach to ensuring the correctness of complex software systems.
    However, it often requires substantial manual effort, which makes it costly to use in practice. Recently, neural network
    based approaches have shown promise in automatically generating proof tactics. Nevertheless, existing methods suffer from
    a long-tailed distribution in tactic usage within the training data. A few frequent tactics dominate the probability distribution,
    while many rare yet crucial ones are consistently suppressed in the model’s candidate ranking. This distributional bias
    can cause potentially provable goals to be prematurely abandoned during proof search. In addition, the decision making
    process of neural networks when generating tactics lacks explicit reasoning traces, making it difficult for humans to
    explain or verify the underlying logic. To address these limitations, we propose ProofFusion, an adaptive retrieval-augmented
    reasoning framework that improves the proving capability of neural theorem provers without requiring retraining. Our key
    insight is inspired by the way human provers tackle a new theorem by consulting similar previously proven theorems to
    guide their own reasoning. Specifically, we develop a proof semantic-aware retriever that searches a knowledge base for
    semantically similar historical proof goals together with their tactic, producing a traceable set of reference decisions.
    We then employ a dual-track reranking fusion mechanism to integrate both the original predictions of the neural model
    and the retrieved reference tactics. Furthermore, to mitigate potential noise introduced by retrieval, we design a capability-adaptive
    retrieval mechanism that dynamically determines when retrieval should be applied. We conduct a systematic evaluation on
    10,782 theorems from 26 Coq projects in a real ITP environment. Experimental results show that ProofFusion increases the
    number of theorems proved by four state-of-the-art neural theorem provers by an average of 6.89%, and increases the number
    of previously unprovable theorems solved by an average of 17.50%. In addition, it substantially improves the explainability
    of proof steps, achieving an average explainable proof goal proportion of 82.1% across the four provers. Together, these
    results demonstrate that ProofFusion is a practical and effective complement to existing neural theorem proving systems,
    enhancing both performance and explainability.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/57/ProofFusion-Improving-Neural-Theorem-Proving-via-Adaptive-Retrieval-Augmented-Reason
