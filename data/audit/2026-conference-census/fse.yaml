  abstract: 'Binary analysis plays an essential role in cybersecurity, facilitating reverse engineering to reveal the inner
    workings of programs in the absence of source code. Traditional approaches, such as static and dynamic analysis, extract
    valuable insights from stripped binaries, but often demand substantial expertise and manual effort. Recent advances in
    deep learning have opened promising opportunities to enhance binary analysis by capturing latent features and disclosing
    underlying code semantics. Despite the growing number of binary analysis models based on machine learning, their robustness
    to adversarial code transformations remains underexplored. In this work, we evaluate the robustness of deep learning models
    for the task of binary code similarity detection (BCSD) under semantics-preserving transformations. The unique nature
    of machine instructions presents distinct challenges compared to the typical input perturbations found in other domains.
    To achieve our goal, we introduce asmFooler, a system that evaluates the resilience of BCSD models using a diverse set
    of adversarial code transformations that preserve functional semantics. We construct a dataset of 9,565 binary variants
    from 620 baseline samples by applying eight semantics-preserving transformations across six representative BCSD models.
    Our major findings highlight several key insights: i) model robustness highly relies on the design of the processing pipeline,
    including code pre-processing, model architecture, and internal feature selection, which collectively determine how code
    semantics are captured; ii) the effectiveness of adversarial transformations is bounded by a transformation budget, shaped
    by model-specific constraints such as input size limits and the expressive capacity of semantically equivalent instructions;
    iii) well-crafted adversarial transformations can be highly effective, even when introducing minimal perturbations; and
    iv) such transformations disrupt the model’s ability to recognize and focus on semantically significant instructions.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/208/Fool-Me-If-You-Can-On-the-Robustness-of-Binary-Code-Similarity-Detection-Models-agai
