- title: 'AdaDec: A Uncertainty-Guided Lookahead Decoding Framework for LLM-based Code Generation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3808142
  official_record_id: 70b19293-1f5e-458b-87e3-8a47c845d466
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Code generation with large language models (LLMs) is highly sensitive to token selection during decoding, particularly
    at uncertain decision points that influence program logic. While standard strategies such as greedy decoding treat all
    tokens uniformly, they overlook code-specific uncertainty patterns, leading to suboptimal performance. This paper presents
    an empirical study revealing that many generation errors stem from token ranking mistakes at high-uncertainty steps, where
    the correct token is present but not top-ranked. Motivated by these findings, we propose AdaDec, a lookahead-based uncertainty-guided
    adaptive decoding framework that integrates a token-level \textit{pause-then-rerank} mechanism driven by token uncertainty.
    AdaDec learns model-specific uncertainty thresholds and applies a lookahead-based reranking strategy when uncertainty
    is high. Experiments on HumanEval+, MBPP+, and DevEval benchmarks show that AdaDec improves Pass@1 accuracy by up to 20.9%
    in absolute terms over greedy decoding, and consistently outperforms state-of-the-art adaptive decoding methods such as
    AdapT, while reducing computational cost and latency through efficient, selective pausing. Our results highlight the promise
    of uncertainty-aware adaptive decoding for improving both the reliability and efficiency of LLM-based code generation.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/71/AdaDec-A-Uncertainty-Guided-Lookahead-Decoding-Framework-for-LLM-based-Code-Generati
