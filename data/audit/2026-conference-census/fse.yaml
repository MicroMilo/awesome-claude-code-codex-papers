  abstract: Large language models (LLMs) have been adopted for text-to-SQL tasks, utilizing their in-context learning (ICL)
    capability to translate natural language questions into SQL queries. However, such a technique faces correctness problems.
    In this paper, we conduct the first comprehensive study of text-to-SQL errors of ICL-based techniques. Our study covers
    four representative ICL-based techniques, five basic repairing methods, two benchmarks, and two LLM settings. We find
    that text-to-SQL errors are widespread and summarize 27 error types of 7 categories. We also find that existing repairing
    attempts have limited correctness improvement while having high computational overhead and many mis-repairs. Based on
    these findings, we propose MapleDoctor, a novel text-to-SQL error detection and repairing framework. The evaluation demonstrates
    that MapleDoctor outperforms existing solutions by repairing 13.8% more queries with neglectable mis-repairs and reducing
    67.4% overhead. The artifact is publicly available at GitHub.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/122/Understanding-Detecting-and-Repairing-Real-World-In-Context-Learning-Based-Text-to-
