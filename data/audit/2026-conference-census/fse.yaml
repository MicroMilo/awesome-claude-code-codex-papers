  abstract_reason: Official abstract fetched.
  abstract: Large Language Model Powered Multi-Agent Systems (MASs) are increasingly employed to automate complex real-world
    problems, such as programming and scientific discovery. Despite their promising, MASs are not without their flaws. However,
    failure attribution in MASs—pinpointing the specific agent actions responsible for failures—remains underexplored and
    labor-intensive, posing significant challenges for debugging and system improvement. To bridge this gap, we propose FAMAS,
    the first spectrum-based failure attribution approach for MASs, which operates through systematic trajectory replay and
    abstraction, followed by spectrum analysis. The core idea of FAMAS is to estimate, from variations across repeated MAS
    executions, the likelihood that each agent action is responsible for the failure. In particular, we propose a novel suspiciousness
    formula tailored to MASs, which integrates two key factor groups, namely the agent behavior group and the action behavior
    group, to account for the agent activation patterns and the action activation patterns within the execution trajectories
    of MASs. Through expensive evaluations against 12 baselines on the Who&When benchmark, FAMAS demonstrates superior performance
    by outperforming all the methods in comparison.
