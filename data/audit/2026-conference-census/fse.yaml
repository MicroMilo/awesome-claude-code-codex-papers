- title: 'LinkAnchor: An Autonomous LLM-Based Agent for Issue-to-Commit Link Recovery'
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/164/LinkAnchor-An-Autonomous-LLM-Based-Agent-for-Issue-to-Commit-Link-Recovery
