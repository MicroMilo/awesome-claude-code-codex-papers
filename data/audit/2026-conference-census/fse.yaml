  abstract: Software interacts with hardware through Instruction Set Architectures (ISAs), such as x86, ARM, and RISC-V. Although
    many developers may be unaware of ISA heterogeneity, ISA-specific code is pervasive in foundational software systems that
    underpin the digital infrastructure of human society. Maintaining separate implementations is common when supporting multiple
    ISAs in such a foundational software project. This may introduce substantial additional effort. Meanwhile, separate ISA-specific
    implementations frequently exhibit code similarities across ISAs. To understand ISA-specific code and their similarities,
    and to gain insights for better management, we conducted an empirical study of 20 open-source foundational projects that
    support multiple ISAs. We confirmed the need for separate ISA-specific implementations, yet our analysis revealed a weighted
    average similarity of 21.7% across ISAs. We also observed cross-ISA co-change and cross-ISA participation patterns in
    the development and maintenance of ISA-specific code. This study offers the first systematic investigation of ISA-specific
    code similarities, yielding evidence that can be leveraged by practitioners and researchers working on ISA-related software
    engineering.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/38/Understanding-Code-Similarity-across-Instruction-Set-Architectures-An-Empirical-Stud
