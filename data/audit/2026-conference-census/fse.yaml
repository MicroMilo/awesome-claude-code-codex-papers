- title: 'PlayCoder: Making LLM-Generated GUI Code Playable'
  official_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/4/PlayCoder-Making-LLM-Generated-GUI-Code-Playable
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 811daa74-b3f0-4928-9620-301d841c7de8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) have transformed code generation, but their ability to generate code for applications
    with graphical user interfaces (GUIs), particularly games, remains underexplored. To explore their performance on applications
    with GUI, we construct a repository-aware evaluation dataset from 35 GUI applications. Prior code-generation benchmarks
    assess correctness using test cases, but this is insufficient for GUI applications. These applications are interactive
    and event-driven, and their correctness depends on stateful behavior over sequences of user actions. Consequently, evaluation
    should account for interaction flows and UI state transitions rather than relying solely on pass or fail test outcomes.
    To enable more reliable assessment beyond simple execution and unit tests, we propose Play@k, which measures whether at
    least one of k generated candidates yields an application that can be played end-to-end without logical errors. We further
    develop an LLM-based agent, PlayTester, that automates interactive evaluation by driving the GUI through task-oriented
    playthroughs and checking for logic violations. Through systematic evaluation, we demonstrate that 10 state-of-the-art
    code LLMs struggle to generate logically correct GUI applications, achieving near-zero Play@3 scores despite high compilation
    rates. To address these challenges, we introduce PlayCoder, a multi-agent, repository-aware framework that writes, evaluates
    and refines GUI application code via closed-loop control. PlayCoder substantially improves functional correctness and
    semantic alignment for both open-source and closed-source models, achieving up to 37.5% Exec@3 and 17.2% Play@3. Case
    studies show that it detects silent logic flaws missed by traditional metrics and repairs them through targeted edits.
    These results indicate that coupling an end-to-end GUI testing agent with repository-aware automated program repair is
    an effective path toward reliable GUI code generation.
