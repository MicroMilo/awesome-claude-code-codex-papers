- title: Satisfiability Solving with LLMs
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d45d6deb-66ff-4d3c-b88c-8c9a2f94b4ca
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) are increasingly used for tasks that implicitly reduce to Boolean satisfiability
    (SAT), yet their reasoning ability on SAT remains unclear. We present a systematic study of LLMs on 2-SAT and 3-SAT, together
    with two canonical reductions—Vertex Cover and a discrete 3D-packing formulation—designed to probe representation-invariant
    reasoning. Our evaluation begins with the conventional lens (accuracy/precision/recall/F1) and the phase-transition setting.
    We find that traditional metrics are frequently misleading: models exhibit a strong SAT bias, fail to reproduce the classical
    easy–hard–easy signature around the 3-SAT threshold, and degrade sharply as the number of variables N grows. To address
    this, we introduce a distribution-agnostic paired-formula protocol (minimally different SAT/UNSAT instances) and a new
    measure, Accurate Differentiation Rate (ADR), which requires getting both members of each pair correct. ADR cleanly separates
    reasoning-oriented models from heuristic ones and correlates with witness validity (truth assignments that actually satisfy
    the formula). Extending beyond CNF, we test cross-representation consistency via standard reductions: (i) CNF → Vertex
    Cover and (ii) 3-SAT → discrete 3D packing with verifiable placement constraints. Decisions made on CNF and on their graph/packing
    counterparts agree for most models on >80% of instances, revealing stable decision rules across representations. A leading
    model (e.g., GPT-5) achieves both high invariance and correctness at small N, but still suffers scale-induced degradation.
    Taken together, our results support the thesis that SAT is a foundational probe for LLM reasoning: performance on SAT
    predicts transfer to other NP-style reductions, while paired evaluation with ADR provides a faithful, representation-robust
    assessment beyond conventional metrics.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/194/Satisfiability-Solving-with-LLMs
