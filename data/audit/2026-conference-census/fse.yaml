  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'In Google’s FuzzBench platform, we find that the outcome of coverage-based evaluation more strongly agrees with
    the outcome of a bug-based evaluation than an independent bug-based evaluation itself. Recently, Böhme et al. found that
    despite a very strong correlation between coverage achieved and bugs found, there is no strong agreement between the outcome
    of a coverage- and a bug-based evaluation: The fuzzer best at achieving coverage may be the worst at finding bugs. However,
    in trying to explain this moderate agreement, we wondered whether the outcome of bug-based benchmarking itself is perhaps
    much more “noisy” and turned to applied statistics to develop the tools necessary to investigate our hypothesis. In this
    paper, we call this degree of “noisyness” of a benchmarking outcome as the \emph{concordance} of the benchmarking procedure
    and quantify it using a measure of statistical reliability widely-used in psychology, called \emph{mean split-half reliability},
    i.e., the expected agreement on benchmark outcome between two random halfs of the benchmark set. In our experiments with
    FuzzBench and Magma, we find that the concordance of coverage-based benchmarking is consistently strong while that of
    bug-based benchmarking is weak on FuzzBench and moderate on Magma. In contrast to FuzzBench, for the Magma benchmark set,
    which was designed for bug-based evaluation, a coverage-based evaluation does \emph{not} predict the outcome of a bug-based
    evaluation better than an independent bug-based evaluation. We investigate concordance as a measure of benchmarking efficiency,
    as in green fuzzer benchmarking. We empirically confirm, the resources of a procedure with higher concordance can be reduced
    more substantially (in terms of campaign length or benchmark set size) while maintaining a similar benchmark outcome than
    a procedure with lower concordance. We report the corresonding savings in terms of carbon emissions.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/202/In-Bugs-We-Trust-On-Measuring-the-Randomness-of-a-Fuzzer-Benchmarking-Outcome
