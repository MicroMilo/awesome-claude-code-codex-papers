- title: 'CertiCoder: Towards MISRA-Compliant C Code Generation with LLMs'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: cbb61bc1-af13-448f-8372-42545321ef60
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) are increasingly applied to code generation in IDEs, CI pipelines, and automated
    workflows. Existing evaluations, however, have largely focused on functionality, with comparatively limited attention
    to compliance with established safety standards. This gap is particularly critical for \texttt{C}, where programmes may
    compile and pass unit tests yet still violate MISRA C:2012, a widely adopted guideline in safety-critical domains. We
    present \textbf{CertiCoder}, a post-training framework with \emph{rule-aware optimization} that transforms tool-verified
    outcomes into per-rule contrasts and trains models through three stages: rule tuning, cold-start supervised fine-tuning,
    and rule-aware preference optimization. This design helps models not only distinguish compliant from violating outputs
    but also associate violations with specific rules. To support reproducible assessment, we construct a Codeforces-derived
    \texttt{C} benchmark with frozen splits, multi-level decontamination, and metrics that jointly measure MISRA compliance
    ($S_{1}$), functional correctness ($F_{1}$), and their conjunction ($J_{1}$). On Qwen2.5-Coder backbones (3B–14B), CertiCoder
    substantially improves compliance from near-zero to measurable $J_{1}$ levels and generally preserves functional correctness,
    outperforming non–rule-aware baselines such as SFT and SafeCoder. To our knowledge, this makes CertiCoder among the first
    post-training frameworks to explicitly optimize both compliance and correctness, offering a practical step toward more
    auditable and extensible use of LLMs in safety-critical software systems.'
