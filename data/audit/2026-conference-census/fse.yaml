- title: Compiling Code LLMs into Lightweight Executables
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: c32fbb26-37fd-465e-a13e-38a443d8f93c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The demand for better prediction accuracy and higher execution performance in neural networks continues to grow.
    The emergence and success of Large Language Models (LLMs) have led to the development of many cloud-based tools for software
    engineering tasks such as code suggestion. While effective, cloud deployment raises concerns over privacy, latency, and
    reliance on connectivity. Running LLMs locally on personal devices such as laptops would address these issues by enabling
    offline use and reducing response time. However, local deployment is challenging: commodity devices lack high-performance
    accelerators like GPUs and are constrained by limited memory and compute capacity, making it difficult to execute large
    models efficiently. We present Ditto, a novel method for optimizing both the model size of Code LLMs and their inference
    programs, particularly for statically-typed programming languages such as C. Our approach integrates two key components:
    (1) a model compression technique inspired by product quantization, which clusters model parameters into codebooks and
    quantizes them to lower bit widths while ensuring that outputs remain within a bounded error, as well as synthesizing
    the inference program for the quantized model; and (2) a compilation pass integrated into LLVM that automatically detects
    and replaces unoptimized General Matrix-Vector Multiplication (GEMV) operations—the most computationally intensive component
    in code models—with implementations from Basic Linear Algebra Subprograms (BLAS) libraries, which are highly optimized
    for runtime performance. The output of Ditto is an optimized and compiled executable for running selected Code LLMs. We
    evaluate Ditto on three popular Code LLMs—Code Llama, MagicCoder, and OpenCodeInterpreter, achieving up to 10.5× faster
    inference and 6.4× lower memory usage compared with their original inference pipeline, while maintaining accuracy close
    to that of the full-precision models (with an average loss of only 0.27% in pass@1). Furthermore, Ditto outperforms the
    state-of-the-art int8 quantization baseline, achieving up to 6.61% higher pass@1 accuracy, 2.2× speedup, and 1.6× memory
    usage reduction, which demonstrates the effectiveness of our approach.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/174/Compiling-Code-LLMs-into-Lightweight-Executables
