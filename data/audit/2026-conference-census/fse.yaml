- title: Automated Knowledge-Aware Test Reuse
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: bddd309e-5346-4737-a8ab-29bb908a216a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The quality of foundational libraries is critical for the reliability of modern software ecosystems. However,
    developers often have insufficient time for testing due to various reasons. Recent studies show that 68% of deep learning
    libraries lack unit tests, and their absence negatively impacts libraries health. While automated test generation techniques
    have been proposed, they frequently produce invalid inputs or semantically inconsistent assertions due to missing domain
    knowledge. An alternative is cross-library test reuse, as many libraries in scientific computing and machine learning
    expose functionally similar APIs. Nevertheless, effective test reuse requires careful semantic alignment rather than naive
    “copy-and-paste”, as subtle API mismatches and incomplete domain knowledge often yield invalid tests. To address these
    challenges, we present KATRER, a knowledge-aware framework for automated test reuse. KATRER models each library as a heterogeneous
    graph that integrates semantic and structural information and introduces a Test Fingerprint representation for tests,
    which captures code, docstrings, usage examples, pre-/post-conditions, and invoked APIs. This enables accurate API alignment
    and prevents invalid calls. KATRER further employs a collaborative LLM pipeline that verifies semantic compatibility,
    performs stepwise API substitution, and validates test correctness. We evaluate KATRER among five libraries in two domains,
    generating 13,191 sub-tests from 1,484 source tests, with 7,257 retained after filtering. KATRER improves syntactic correctness
    and execution success by 17.46% compared to baselines, while uncovering 22 previously unknown defects in CuPy and cuML,
    8 of which have already been fixed. These results demonstrate that knowledge-aware test reuse substantially reduces manual
    adaptation effort and enhances the robustness of widely used libraries.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/81/Automated-Knowledge-Aware-Test-Reuse
