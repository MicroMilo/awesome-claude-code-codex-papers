- title: Feature Slice Matching for Precise Bug Detection
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3797080
  official_record_id: 17a3d7b9-50a5-4fbd-8ec2-4de599424e11
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Measuring the function similarity to detect bugs is effective, but the statements unrelated to the bugs can impede
    the performance due to the noise interference. Suppressing the noise interference in existing works does not manage the
    tough job, i.e., eliminating the noise in the targets. In this paper, we propose MATUS to mitigate the target noise for
    precise bug detection based on similarity measurement. Feature slices are extracted from both the buggy query and the
    targets to represent the semantic feature of (potential) bug logics. In particular, MATUS guides the target slicing with
    the prior knowledge from the buggy code, in an end-to-end way to pinpoint the slicing criterion in the targets. All feature
    slices are embedded and compared based on the vector similarity. Buggy candidates are audited to confirm unknown bugs
    in the targets. Experiments show that MATUS holds advantages in bug detection for real-world projects with acceptable
    efficiency. In total, MATUS has spotted 31 unknown bugs in the Linux kernel. All of them have been confirmed by the kernel
    developers, and 11 have been assigned CVEs.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/132/Feature-Slice-Matching-for-Precise-Bug-Detection
