  abstract_reason: Official abstract fetched.
  abstract: Building software that is correct by construction is a long-standing goal in software engineering, as it ensures
    that reliability is achieved during design rather than after deployment. Formal methods realize this vision by allowing
    system behavior and requirements to be expressed in mathematics, enabling correctness to be guaranteed through proofs
    and verification. However, the steep learning curve and demand for mathematical expertise hinder its widespread adoption.
    Large language models (LLMs) have recently shown promise in bridging this gap through autoformalization, but existing
    approaches often address isolated tasks, such as theorem proving or model synthesis verified by model checking. While
    valuable, these single-perspective efforts do not fully exploit the potential of a more comprehensive framework where
    models and proofs evolve together. To address this gap, we propose \textbf{Event-B Agent}, a novel framework inspired
    by the interleaved nature of software design. From natural language requirements, Event-B Agent constructs an initial
    model and iteratively adjusts it using feedback from model checking and theorem proving. Adjusting and refining the model,
    in turn, simplifies proof discharge that ensures correctness with respect to requirements. Evaluation across systems of
    varying complexity shows that Event-B Agent substantially outperforms baselines in end-to-end model synthesis and repair.
    These results show a promising direction into achieving correctness-by-construction through probabilistic approaches like
    LLM agents.
