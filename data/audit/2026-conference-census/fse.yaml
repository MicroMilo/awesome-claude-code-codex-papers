  official_record_id: 8fe010cf-cb04-4b0b-8318-66a4f407c0bf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'SQL injection (SQLi) is one of the most critical and prevalent security vulnerabilities, as it enables attackers
    to manipulate backend databases, bypass authentication, and even gain complete control of the underlying system. Since
    web applications are the primary target for SQL injection, the web developers must test to ensure the applications are
    robust to this attack. Recently, there have been several advanced solutions using fuzzing approaches to test SQL injection
    vulnerability; however, our preliminary analysis reveals key limitations that reduce their effectiveness: they primarily
    focus on GUI-based inputs while neglecting API endpoints, rely on less effective request selection strategies, and require
    complex configurations to deploy. To address these gaps, we propose SQLiFuzz, a universal and simple-to-deploy SQL injection
    fuzzer that operates across both GUI (web pages) and API entry points. SQLiFuzz introduces three key innovations: (i)
    a reverse proxy that unifies request collection and fuzzing and integrates seamlessly with existing crawlers and API scanners,
    (ii) a database proxy that enables request–query matching and serves as a reliable oracle, and (iii) a feedback-driven
    fuzzer that prioritizes potentially vulnerable requests and parameters and validates exploitability through database responses.
    We evaluate SQLiFuzz on six security benchmarks and ten real-world applications. SQLiFuzz successfully detected the majority
    of known SQLi cases in the benchmarks and uncovered nine new vulnerabilities, which had been overlooked by state-of-the-art
    tools, in the real-world applications. These results highlight SQLiFuzz’s ability to reveal SQLi across diverse architectures
    while maintaining practicality and ease of deployment.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/84/SQLiFuzz-Uncovering-SQL-Injection-in-Any-Web-Applications
