- title: Automating Dockerfile Refactoring to Multi-Stage Builds
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e84fc2d6-b444-4837-83bc-a91909980c5f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Containerization has become a cornerstone of modern software deployment, yet many projects still ship single-stage
    Dockerfiles that bundle compilers, build tools, and temporary files into production images, thereby hurting performance
    and security. Multi-stage builds are recommended, yet uptake appears uneven, plausibly because refactoring legacy Dockerfiles
    demands nontrivial reasoning about build lifecycles and dependency separation. This paper presents \tool, an automated
    refactoring approach that converts single-stage Dockerfiles into optimized multi-stage builds. \tool first performs static
    analysis to identify the technology stack and to infer build-time and runtime dependencies. It then applies a lightweight
    gate that estimates refactoring benefit from a composite of image bloat, structural inefficiency, and security risk, proceeding
    only when refactoring is warranted. Finally, it synthesizes a multi-stage Dockerfile that isolates build tooling, copies
    only the artifacts needed at runtime, and applies production hardening. Evaluated on 521 real-world single-stage projects,
    \tool successfully produced working multi-stage Dockerfiles for 60.3% of targets. The resulting images were, on average,
    52.2% smaller and contained 50.0% fewer high-risk vulnerabilities than the originals, outperforming baselines. \tool lowers
    the barrier to multi-stage adoption at scale, yielding leaner images with reduced attack surface and improved maintainability.
    We release the tool, its knowledge assets, and the evaluation dataset to support reproducibility and future research.
