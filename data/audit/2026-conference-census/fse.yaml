- title: 'CrypFormBench: Benchmarking Formal Analysis Capability of Large Language Models for Cryptographic schemes'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3808184
  official_record_id: 6c0e66c6-be5d-4a3a-b8de-a39022a92b70
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Manual formal analysis of cryptographic schemes is a labor-intensive and expertise-demanding task. While model-checking
    tools (e.g., Scyther and Tamarin) and computational-security tools (e.g., CryptoVerif and EasyCrypt) significantly enhance
    the automation of security proofs, they still require experts to abstract schemes and write formal descriptions in specialized
    languages. Large language models (LLMs) can offer a promising alternative, while their effectiveness in this domain remains
    unexplored, and the absence of standardized evaluation methodologies makes their capabilities difficult to assess. To
    address the gaps, we introduce CrypFormBench (C.F.B for short), a comprehensive benchmark supporting both symbolic and
    computational security, designed to systematically evaluate 5 core capabilities of LLMs in formal analysis of cryptographic
    schemes, including formal code interpretation, generation, completion, transformation, and correction. It comprises 700
    instances covering 7 mainstream formal languages and 677 schemes, supporting the verification of 160 security properties.
    The evaluation of 9 state-of-the-art LLMs reveals that most of them perform well in code interpretation and completion
    due to their code-awareness advantages, but struggle to achieve code generation, cross-language transformation, and false-positive
    correction. Overall, LLMs exhibit limited effectiveness in formal analysis of cryptographic schemes, with only Claude-3.5
    scoring above 50 out of 100. Based on our findings, we propose practical recommendations for the model design and usage,
    such as fine-tuning and few-shot mechanisms, to bolster LLMs’ effectiveness in securing cryptographic schemes. Taken together,
    our analysis of LLMs’ formal analysis capabilities in cryptographic schemes highlights current progress and outlines directions
    for future improvements.
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/151/CrypFormBench-Benchmarking-Formal-Analysis-Capability-of-Large-Language-Models-for-C
