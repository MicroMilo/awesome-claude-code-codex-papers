- title: An Empirical Study of Fuzz Harness Degradation
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 76ca802d-6dff-4f82-8d87-ae9829eaa3ad
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Fuzzing is a widely used technique to automatically test software for potential faults. To fuzz software projects
    efficiently and effectively, they must use fuzz harnesses , i.e., small programs that connect the fuzzer to the project’s
    code under test. However, as projects evolve, it is unclear whether fuzz harnesses are maintained in lockstep or left
    to stagnate, and whether unmaintained fuzz harnesses gradually degrade in terms of code coverage and bug-finding effectiveness.
    In this paper, we focus on OSS-Fuzz, the largest continuous fuzzing platform in practice, which provides harnesses for
    510 open-source C/C++ projects, many of them security-critical. These harnesses are usually contributed by project maintainers
    or external developers, yet their ongoing maintenance is not always ensured. Our analysis shows that, overall, harnesses
    exhibit only a small reduction in coverage and retain surprising longevity in their ability to uncover bugs. This holds
    even without explicit updates, as long as they continue to build. At the same time, we identify specific cases where harnesses
    degrade, analyze their root causes, and categorize them systematically. Finally, we extend OSS-Fuzz and Fuzz Introspector,
    a companion project to investigate fuzzer performance, with new metrics to automatically detect harness degradation, enabling
    more effective monitoring of fuzzing quality in evolving projects.
