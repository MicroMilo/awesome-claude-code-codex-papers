- title: 'ExpeRepair: Dual-Memory Enhanced LLM-based Repository-Level Program Repair'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: bb2a4436-8f5d-482c-97c7-bd578a376420
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Automatically repairing software issues remains a fundamental challenge at the intersection of software engineering
    and AI. Although recent advancements in Large Language Models (LLMs) have demonstrated potential for repository-level
    repair tasks, current methodologies exhibit two notable limitations: (1) they often address issues in isolation, neglecting
    to incorporate insights from previously resolved issues, and (2) they rely on static, rigid prompting strategies that
    constrain their ability to generalize across diverse and evolving issue scenarios. We propose ExpeRepair, a novel LLM-based
    program repair framework inspired by the dual memory systems of human cognition, where episodic and semantic memory synergistically
    support learning and decision-making. Unlike existing methods, ExpeRepair continuously learns from historical repair experiences
    via dual-channel knowledge accumulation, enabling it to adaptively reuse past knowledge during inference. Specifically,
    ExpeRepair organizes prior repair knowledge into two complementary memories: an episodic memory that stores concrete repair
    demonstrations, and a semantic memory that encodes abstract, reflective insights. At inference time, ExpeRepair activates
    both memory systems by retrieving relevant demonstrations from episodic memory and recalling high-level repair insights
    from semantic memory. It further enhances adaptability through dynamic prompt composition, synergistically integrating
    both memory types to replace static prompts with context-aware, experience-driven prompts. We evaluate ExpeRepair on two
    benchmarks: SWE-Bench Lite and SWE-Bench Verified. Experimental results show that ExpeRepair achieves Pass@1 scores of
    60.3% and 74.6% on the two benchmarks, respectively, establishing new state-of-the-art performance among open-source methods.
    We have open-sourced ExpeRepair at https://github.com/ExpeRepair/ExpeRepair .'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/147/ExpeRepair-Dual-Memory-Enhanced-LLM-based-Repository-Level-Program-Repair
