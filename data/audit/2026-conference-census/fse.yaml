  abstract_reason: Official abstract fetched.
  abstract: 'Anomaly detection and localization (ADL) is critical for maintaining high reliability and availability in cloud-based
    systems. Recent ADL developments focus on metric and log data, leaving event data relatively unexplored. To address this
    gap, we propose EventADL, the first open-box ADL framework for events in cloud-based service systems. To motivate the
    design of our framework, we conduct a systematic analysis on 520 real-world incidents, and provide several important insights
    into how anomalies and their root causes manifest through event data. The EventADL framework has three phases: offline
    training, online anomaly detection, and anomaly localization. During the training phase, EventADL learns Event Semantic
    Patterns (ESPs) for pointwise anomaly detection and Event Frequency Patterns (EFPs) for frequency-based anomaly detection
    using unlabelled historical data. In the online anomaly detection phase, any data in the event stream that deviates significantly
    from these patterns is identified as anomalous. In the localization phase, EventADL constructs an Intervention Graph that
    models the relationships between recent interventions (i.e., system changes visible through events) and the detected anomalies
    for automatic root cause localization. The framework is designed to operate efficiently without labeled data , and to
    produce interpretable results. Our evaluation on three real cloud-based service systems and two real-world incidents,
    compared against ten state-of-the-art baselines, demonstrates that EventADL outperforms existing methods, achieving F1-scores
    of at least 90% for anomaly detection and 100% top-3 accuracy in anomaly localization.'
