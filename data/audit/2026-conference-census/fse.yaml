  abstract_reason: Official abstract fetched.
  abstract: Refactoring engines are an essential part of modern IDEs, supporting automated or semi-automated software refactorings.
    However, these refactoring engines suffer from software defects, just like other complex software systems, and buggy refactoring
    engines may silently inject fatal errors into software projects. Consequently, thorough testing of refactoring engines
    is highly desirable. To this end, this paper proposes an automated approach called \textit{EngineTest} to test Java refactoring
    engines. Unlike existing approaches, it is the first in this line to leverage both LLMs and bug reports of refactoring
    types other than the targeted refactoring type. The key rationale is that the same mistake, e.g., ignoring the potential
    \textit{name shadowing}, may result in similar errors in multiple refactoring types. Consequently, we may retrieve a bug
    report for a refactoring type, leverage LLMs to figure out the underlying reason, and request LLMs to generate test programs
    for other types of refactorings. Finally, we run the test cases and validate them with differential testing and LLM-based
    inconsistent checking. We evaluate the proposed approach with widely used state-of-the-practice refactoring engines in
    Eclipse, NetBeans, and IntelliJ IDEA. Our evaluation results demonstrate that a total of 77 previously unknown bugs have
    been identified, and 30 of them have been manually confirmed by the tool vendors.
