- title: 'Multi-LLM Persona Generation for Virtual Focus Groups in Software Engineering: A Controlled, Multi-Domain Study
    of Emotional Requirements Elicitation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: c0bfe791-c25a-4976-b16a-51b89a791da3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'This paper presents a controlled, multi-domain evaluation of using multiple Large Language Models (LLMs) to automate
    and augment the elicitation of emotional requirements in software engineering. We study an anchor domain (mental-health
    journaling) alongside personal finance and fitness, and disentangle gains from iterative workflow versus true model plurality
    by comparing four AI configurations (one-shot vs. iterative; single-, two-, and three-model pipelines) against two human
    baselines: a standard human focus group and Emotional Goal Modeling (EGM). Outputs are assessed with blind human ratings
    (relevance, clarity, feasibility, innovation) and group-dynamics coding that includes productive, resolution-oriented
    conflict and empathy events. Across domains, heterogeneous-provider plurality increases persona dispersion and fosters
    productive conflict in AI-mediated focus groups, yielding more AI-only requirements that pass blind validation than single-model
    workflows (pooled C3–C1 uplift: +14.7%). To isolate plurality from provider capability, we add two same-model ablation
    controls in the anchor domain: (i) C1-MV (same-model multi-voice) and (ii) C3-SM (same-model three-step). In a small-sample
    evaluation (two seeds each), the resulting difference-in-differences on validated share indicating that a substantial
    portion (~55%) of the C3 uplift persists net of provider heterogeneity. EGM consistently improves clarity and feasibility
    through explicit goal tracing, while human groups contribute authenticity and language fit; together they form a complementary,
    auditable pipeline in which supportive reframing (empathy) and productive disagreement help convert dialog into implementable
    requirements.'
  abstract_source_url: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/5/Multi-LLM-Persona-Generation-for-Virtual-Focus-Groups-in-Software-Engineering-A-Cont
