- title: 'Eidolon: Perform Noise-Aware Fuzzing on FHE Libraries via Equivalence Expression Transformation'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 311d361b-2f41-4f4c-93ac-233635b34aaa
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Ensuring data privacy during computation is a critical challenge in many security systems. Fully Homomorphic Encryption
    (FHE) addresses this gap by enabling multiple operations on encrypted data without decryption, thus ensuring privacy is
    preserved throughout computation. However, existing cryptographic testing tools are unable to test the core functionality
    of FHE, which is the execution of computations on encrypted data. They are expertly designed to generate structured data
    for testing cryptographic algorithms. This structural mismatch, combined with a lack of awareness of FHE-specific noise
    management, leads them to generate invalid test inputs that fail to probe FHE libraries’ core logic. To address this gap,
    we propose Eidolon, a noise-aware fuzzer. It directs mutations toward arithmetic expressions that explore the computational
    space defined by the noise budget. As its test oracle, Eidolon leverages Equivalence Expressions Transformation, which
    transforms a standard arithmetic expression into two mathematically identical but structurally different forms (e.g.,
    Factored, Horner) to detect inconsistencies in their outputs. We evaluated Eidolon on SEAL, OpenFHE, HELib, and TFHE.
    Compared with existing cryptographic fuzzers, Eidolon achieves 39.2%, 61.0%, and 99.0% higher final code coverage than
    CLFuzz, Cryptofuzz, and CDF, respectively. In total, Eidolon uncovered 20 previously unknown bugs, 10 of which have been
    fixed and 12 assigned CVEs.
