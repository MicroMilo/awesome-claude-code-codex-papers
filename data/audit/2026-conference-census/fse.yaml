- title: 'GUIMigrator: Semantics-Preserving Transpilation from Android XML to Compose and SwiftUI'
  official_url: https://conf.researchr.org/track/fse-2026/fse-2026-research-papers
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c458b220-2452-4996-9864-50e4d3f2cdf1
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Constructing user interfaces (UIs) is one of the most resource-intensive tasks in mobile development, often consuming
    more than half of overall effort. Although declarative frameworks such as Jetpack Compose (Android) and SwiftUI (iOS)
    have become mainstream, the majority of existing Android apps still rely on legacy XML-based layouts. Migrating these
    UIs to declarative paradigms is essential for maintainability and cross-platform reuse, but manual migration is costly,
    error-prone, and difficult to scale. We present GUIMigrator, a semantics-preserving framework that automates the migration
    of Android XML-based UIs to Jetpack Compose and SwiftUI. We design the Semantic UI Transpiler, which abstracts layout
    structures and resource semantics from legacy XML and systematically re-expresses them using the component abstractions
    and idioms of modern declarative frameworks. This design ensures that migrated UIs preserve both visual fidelity and functional
    equivalence, while generating idiomatic, compilable code that maintains cross-platform consistency with minimal manual
    intervention. By separating semantic interpretation from platform-specific realization, GUIMigrator provides a deterministic
    yet extensible basis for cross-platform modernization, avoiding the unpredictability of purely generative approaches.
    We evaluate GUIMigrator on 31 open-source applications across ten domains. Results show that GUIMigrator achieves high
    migration completeness and visual similarity (Compose average 82%, SwiftUI 78%), outperforms a GPT-4 baseline in structural
    fidelity, and reduces manual development effort by over 90%. These findings demonstrate that GUIMigrator provides an effective
    and practical solution for reusing Android UIs across modern declarative frameworks, advancing automated cross-platform
    UI development.
