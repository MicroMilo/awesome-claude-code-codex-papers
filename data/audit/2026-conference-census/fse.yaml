  abstract_reason: Official abstract fetched.
  abstract: Binary code similarity detection (BCSD) serves as a fundamental technique for various software engineering tasks,
    e.g., vulnerability detection and classification. Attacks against such BCSD models have therefore drawn extensive attention,
    aiming at misleading the models to generate erroneous predictions. Prior works have explored various approaches to generating
    semantic-preserving variants, i.e., adversarial samples, to evaluate the robustness of the models against adversarial
    attacks. However, they have mainly relied on heuristic criteria or iterative greedy algorithms to locate salient code
    influencing the model output, failing to operate on a solid theoretical basis. Moreover, when processing programs with
    high complexities, such attacks tend to be time-consuming. In this work, we unveil the fragility of BCSD models through
    a novel attack framework guided by model explanations. In particular, we focus on targeted attacks where the attack goal
    is to mislead the model’s predictions to a specific target. Our attack leverages the superior capability of black-box,
    model-agnostic explainers in interpreting the model decision boundaries, thereby pinpointing the critical code snippet
    to apply semantic-preserving perturbations. The evaluation results demonstrate that compared with the state-of-the-art
    attacks, the proposed attacks achieve higher attack success rate in almost all scenarios, while also improving the efficiency
    and transferability. Our real-world case studies on vulnerability detection and classification further demonstrate the
    security implications of our attacks, highlighting fundamental vulnerabilities in current BCSD models, and the urgent
    need for more robust designs.
