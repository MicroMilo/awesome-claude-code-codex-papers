  abstract: Program termination and non-termination analysis is a foundational problem in formal verification with important
    implications for software safety and reliability. Despite extensive research, existing techniques struggle with real-world
    C programs that manipulate complex data types such as pointers, arrays, and structures, or that perform low-level operations
    such as bitwise arithmetic and bounded integer computations. This paper introduces Athena, a framework for sound termination
    and non-termination analysis of C programs that faithfully captures concrete C semantics and supports advanced constructs.
    Athena combines pointer-to-array rewriting, bounded integer semantics via modulo arithmetic or bit-vector semantics, and
    an extended translation to Labeled Transition Systems (LTS), yielding structured, analyzable representations suitable
    for logic-based reasoning. Our analysis engine builds on MuVal, a modular verification engine based on the first-order
    fixpoint logic μCLP with background theories, and extends it with support for array, tuple, and bit-vector theories in
    ranking function synthesis and recurrent set detection. We evaluate Athena on the 2024 Termination Competition (TermCOMP)
    and on 117 real-world benchmarks featuring 445 non-termination bugs. On real-world benchmarks, it achieves the highest
    correctness (62.39%), surpassing the well-established tools UAutomizer and AProVE. On TermCOMP, it attains 75.60%, outperforming
    AProVE, while producing zero wrong results across both suites. These results demonstrate that Athena advances the state
    of the art by providing a strong combination of precision and soundness in the analysis of complex C programs.
