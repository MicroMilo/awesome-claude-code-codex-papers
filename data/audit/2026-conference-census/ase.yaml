- title: 'Translation Tag Team: Formal Rules and LLMs Translate More Macros Together Than Apart'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 4a323f88-d341-4260-b518-5c5fcf614b8b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Modern critical software infrastructure is largely written in C. Since C lacks memory safety, researchers are
    investigating automatic translation of C to safer languages like Rust. But real-world C software consists of more than
    just C code, often using named code fragments called macros which are not part of the C language proper. State-of-the-art
    techniques avoid translating macros by preprocessing C code first before translating it. But this approach produces translations
    that are dissimilar to the original C code, because preprocessing inlines all macro definitions. To preserve macro usage
    in translated code, we study the language features that macros and C share and distill them into the first formally-specified
    translator, MerC. To evaluate MerC, we introduce the first macro translation benchmark, MacroBench, with test cases based
    on macros randomly sampled from real-world C programs. We find that MerC supports 50% of MacroBench’s macro test cases.
    We also use MacroBench to evaluate how effective large language models (LLMs) are at performing the previously-unstudied
    task of macro translation. LLMs translate 22% to 77% more of MacroBench than MerC, but with 8% and 28% of these translations
    being incorrect translations requiring additional validation by developers. In contrast, MerC only produces correct translations.
    Our key insight is that running MerC first then using LLMs on the remainder reaps greater benefits than using either technique
    alone. This tag team approach has an average failure rate 32% lower than that of LLMs, while also translating an average
    of 51% more test cases than MerC.
