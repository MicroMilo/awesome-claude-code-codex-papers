- title: 'Every Scenario Matters: Scenario-Guided White-Box Testing for Static Code Checkers Powered by LLMs'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: fbb942cb-4f38-4460-8322-4ef31709ba58
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In static analysis tools, each detection rule corresponds to a dedicated code checker. The checker’s quality directly
    determines the validity of reported defects. Thus, comprehensive testing of these checkers is crucial. Existing checker
    testing approaches usually generate test cases from high-level rule descriptions while treating checkers as black boxes.
    However, these descriptions usually omit implementation-level conditions and checking scenarios. To bridge this gap, our
    key insight is that the rule description and checker implementation provide complementary information for comprehensive
    testing. The implementation supplies concrete checking logic, while the rule anchors the intended semantics. Building
    on this, we propose ScenSCT, a novel scenario-guided white-box checker testing approach powered by LLMs. ScenSCT first
    translates the checker’s source code into a unified logic-based representation (CheckerIR) and applies both logic-decomposition
    and scenario-validation strategies to extract concrete checking scenarios. It then converts these scenarios into test
    cases through execution-feedback-guided test alignment to instantiate scenario constraints and scenario-invariant test
    augmentation to generate variants that preserve the target scenario. We evaluate ScenSCT on real-world Java checkers from
    five mainstream static analysis tools. In single-tool evaluation, ScenSCT extracts an average of ~9 scenarios and generates
    ~39 tests per checker, uncovering 270 potential issues (58 false positives and 212 false negatives) with an overall precision
    of 86.4%. Furthermore, cross-tool evaluation reveals 177 capability differences among shared checkers. Overall, ScenSCT
    offers a systematic testing method to improve the reliability of static analysis tools.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/51/Every-Scenario-Matters-Scenario-Guided-White-Box-Testing-for-Static-Code-Checkers-Po
