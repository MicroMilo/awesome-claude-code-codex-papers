- title: 'When Knowledge Changes: Metamorphic Testing of RAG Systems with Mutations'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 8a4ab9f2-4b47-4656-80af-292817422ceb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Retrieval-Augmented Generation (RAG)-based LLM systems rely on external document corpora that can evolve and change
    over time. However, current evaluation methodologies (e.g., RAGAS) assess correctness against static snapshots, failing
    to detect faults when routine updates, factual changes, or noise alter the underlying data. We introduce a metamorphic
    testing framework that evaluates the consistency of RAG systems under corpus evolution. We formalise a fault taxonomy
    and 11 mutation operators that systematically perturb the system at both the pre-chunk (retrieval index) and post-chunk
    (retrieved context) levels. An empirical evaluation across five datasets and over 28k mutants reveals metamorphic violation
    rates of 4.9-10.2%. In a meta-evaluation against ground truth, our metamorphic oracle achieves F1 scores of 0.927-1.000,
    while the best RAGAS metric reaches only 0.570. Finally, we provide actionable insights into mitigating these faults through
    retrieval re-configuration, generator upgrades, and LLM-based reranking.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/247/When-Knowledge-Changes-Metamorphic-Testing-of-RAG-Systems-with-Mutations
