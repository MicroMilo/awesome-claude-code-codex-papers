- title: 'When Ambiguity Meets Atypicality: Dual-Perspective Test Input Prioritization for DNNs'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c051ff5e-6f8a-474c-98f8-88b742a1780b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: While Deep Neural Networks (DNNs) have achieved remarkable progress in cutting-edge domains, their inherent brittleness
    has become a growing concern. To ensure the reliability and safety of DNN-enabled software, DNN testing has emerged as
    an indispensable practice. Within this context, test input prioritization is essential for early fault detection and reducing
    labeling costs. However, it remains challenging to accurately identify failure-inducing inputs. Although decision ambiguity
    and distributional atypicality are two widely adopted perspectives for characterizing inter-class competition and intra-class
    typicality respectively, relying on either perspective in isolation inevitably introduces blind spots. In this paper,
    we propose \textsc{DuFP} (\textbf{Du}al perspective \textbf{F}eature space \textbf{P}rioritization), a KNN density-based
    test input prioritization approach for DNNs that jointly incorporates both inter-class and intra-class perspectives. The
    prioritization framework of \textsc{DuFP} is built upon class-conditional density estimation. Based on the estimation
    results, prediction correctness is characterized by an ambiguity score and an atypicality score, with the former reflecting
    decision ambiguity and the latter quantifying distributional atypicality. A hybrid uncertainty score is then constructed
    by integrating both scores to guide the final prioritization. We evaluate \textsc{DuFP} on prioritization and selection
    tasks across image and text datasets under clean, corrupted, and adversarial scenarios. Experimental results demonstrate
    that \textsc{DuFP} effectively and efficiently prioritizes fault-inducing inputs and outperforms state-of-the-art approaches.
