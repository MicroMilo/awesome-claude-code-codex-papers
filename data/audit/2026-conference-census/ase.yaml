- title: 'Think Before You Code: Dual Reasoning for the NLSafety–Utility Trade-Off in LLM Code Generation'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: b56ff02c-c4c6-429b-916b-044ac542772a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) for code generation are typically evaluated on functional correctness alone, overlooking
    whether generated code propagates harmful content embedded in the prompt. Prior work has shown that most Code LLMs reproduce
    offensive identifiers from injected renaming instructions without warning, yet existing approaches focus on detecting
    harmful content, neglecting functional correctness. Grounded in the Theory of Dual Channel Constraints (which states that
    code is a dual-channel medium combining an algorithmic (AL) channel for machine execution and a natural language (NL)
    channel for human communication, creating a unique safety-utility trade-off where a model must balance functional execution
    with responsible communication), we propose NLSafety-Utility Duality Score (SUDS), a metric that unifies code utility,
    safety adherence, and warning awareness into a single score across 12 ranked response scenarios, and Dual Reasoning (DR),
    a structured inference-time technique that requires an explicit safety audit and task-grounded code review before code
    generation. Evaluated on five LLMs across two benchmarks augmented with harmful keyword injections (820 and 2,135 samples),
    DR consistently achieves the highest SUDS across all models, improving mean SUDS by 1.32× to 3.42× over the baseline,
    while chain-of-thought prompting yields negligible safety gains and a safety-aware prompt provides only partial improvement.
    Further analysis reveals that DR's effectiveness scales with model capacity, that the one-shot exemplar primarily stabilizes
    output format for smaller models, and that structured reasoning cannot compensate for models with limited safety vocabularies.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/55/Think-Before-You-Code-Dual-Reasoning-for-the-NLSafety-Utility-Trade-Off-in-LLM-Code-
