- title: 'Same Scrutiny, More Time: Eye Tracking Insights into Reviewing LLM-Labelled Code'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c2e73533-170f-45bb-8612-cc96512a079d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Modern software development increasingly involves the use of large language models (LLMs) to generate code. Despite
    their rapid advancement, LLMs remain prone to errors and hallucinations, emphasizing the importance of careful code inspection.
    However, in practice, developers' trust in LLM-generated code and their willingness to review it thoroughly may not align
    with these recommendations, which is a gap that remains largely unexplored. In this study, we conduct a Wizard-of-Oz experiment
    to examine how software engineers behave when code is explicitly labelled as LLM-generated during a code review task.
    We collect both behavioral data and participant feedback through eye-tracking and exit interviews. Combining Bayesian
    data analysis with qualitative analysis, we found that while the thoroughness of code review did not change for participants,
    they spent more time fixating on LLM-labelled code, indicating that the label itself influences attention. Practitioners
    also adapted their review strategy for LLM-labelled code by assessing the code based on specific criteria (e.g., logical
    correctness), or using the prompt to guide their review. These findings inform LLM-based tool design on labelling while
    incorporating the prompt as a software artifact. Our study reveals a gap between reviewers' intentions and actual reviewing
    behaviour, highlighting the need for software companies to revisit their AI policies (particularly regarding LLM-assisted
    development) to better support developers in reviewing LLM-generated code.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/93/Same-Scrutiny-More-Time-Eye-Tracking-Insights-into-Reviewing-LLM-Labelled-Code
