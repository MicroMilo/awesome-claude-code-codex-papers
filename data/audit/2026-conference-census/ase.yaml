- title: 'When Compression Becomes an Attack Surface: Black-Box Attacks on Prompt-Compressed LLM Agents'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fda8e13a-f3b6-4828-9765-cbb844f3e487
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Prompt compression is increasingly deployed in LLM agents to reduce latency and cost. It determines what the backend
    LLM ultimately sees, thereby unexpectedly changing the security boundary of the agent pipeline. We show that, when trusted
    and untrusted inputs are compressed under a shared budget, this lossy transformation exposes a new attack surface in the
    LLM agents. By perturbing only untrusted inputs before compression, an adversary can cause the compressor to discard task-critical
    evidence or safety guardrails before LLM inference. Unlike prompt injection, jailbreaks, or RAG poisoning, our attack
    target is the compressor rather than the backend LLM. The perturbation need not encode a meaningful instruction or even
    survive compression. We formalize this vulnerability as adversarial information loss (AIL), the excess downstream behavioral
    distortion caused by adversarially steering a lossy compressor beyond benign compression alone. To exploit AIL, we present
    COMA, a transfer-based black-box attack that uses attacker-side surrogate compressors and backend LLMs to optimize pre-compression
    perturbations. COMA first selects a misbehavior-inducing target in compressed space, then searches for a perturbation
    whose surrogate compression matches that target. Across three tasks (agent tool selection, question answering, and system
    prompt corruption) and six widely used compressors, COMA achieves an average attack success rate of 0.71, versus 0.21
    for the strongest non-compression-based baseline. COMA further generalizes across compression budgets, backend LLMs, and
    surrogate compressors, transfers to two case studies of real-world agents. We also show that isolating trusted inputs
    from untrusted inputs during compression improves robustness, especially for system prompt corruption.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/64/When-Compression-Becomes-an-Attack-Surface-Black-Box-Attacks-on-Prompt-Compressed-LL
