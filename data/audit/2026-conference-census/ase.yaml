- title: '“We Must Have Missed This Comment”: Detecting and Repairing Stale Function References in Linux Kernel Comments'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 2297c24f-bf31-4912-9c21-5b128076bb21
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'As the Linux kernel evolves, code comments may become outdated, as the functions they reference can be refactored
    or removed independently without corresponding updates to the comments. Such stale function references can mislead maintainers
    and thus hinder code comprehension. Prior work on detecting code-comment inconsistency mainly focused on addressing semantic
    misalignment between Javadoc comments and their directly annotated functions, making them inapplicable to this type of
    externally induced staleness in the Linux kernel. Therefore, we propose ReCite, a three-stage approach to identify and
    repair such stale references: (1) detecting unresolved function-form symbols—symbols in comments that appear to reference
    functions but for which no matching function can be found in the current codebase, (2) tracing the evolution history of
    each unresolved symbol through the Git history, and (3) generating LLM-based repair suggestions grounded in the evolution
    history and current code context. On Linux kernel v6.18-rc1, ReCite detects 869 stale references with generated repair
    suggestions. A manual evaluation on 200 sampled repairs shows that 178 (89.0%) provide useful repair guidance, with 85
    (42.5%) directly applicable. Of our 75 submitted patches, 50 have been accepted. We also empirically study all unresolved
    function-form symbols.'
