- title: Automated Lemma Discovery in Agentic Program Verification
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 7792fd4b-9d4e-4386-84d1-25a5eec166e8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Deductive verification provides strong correctness guarantees for code by extracting verification conditions (VCs)
    and writing formal proofs for them. The expertise-intensive task of VC proving is the main bottleneck in this process,
    and has been partly automated owing to recent advances in Large Language Model (LLM) agents. However, existing proof agents
    are not able to discover helper lemmas – auxiliary lemmas that aid in proving – and thus fall short as programs grow in
    size and complexity. In this paper, we argue that VC proving for program verification is more than a purely mathematical
    task, and benefits considerably from program comprehension. Our key insight is that human proof engineers often discover
    and apply helper lemmas based on their understanding of the program semantics, which are \emph{not} directly reflected
    in the VCs produced by VC generators. Inspired by this insight, we propose an LLM agent, \textsc{LemmaNet}, that discovers
    helper lemmas in two ways. Specifically, the agent first synthesizes lemmas \emph{offline} by directly analyzing the source
    code and specifications and then relating this semantic understanding to the mechanical, verbose encoding produced by
    VC generators. As the proof unfolds, \textsc{LemmaNet} then adapts existing helper lemmas \emph{online} to accommodate
    evolving proof states, enabling the agent to effectively discharge complex VCs on-the-fly. We implement \textsc{LemmaNet}
    on top of an existing proof agent \textsc{AutoRocq} for \textsc{Rocq} and the \textsc{Frama-C} ecosystem, and evaluate
    it on SV-COMP and established real-world subjects, including modules of the Linux kernel, Contiki OS, standard C++ library,
    and X.509 parser. Our experimental results demonstrate that \textsc{LemmaNet} significantly outperforms state-of-the-art
    approaches, highlighting the importance of program comprehension-aided lemma discovery in agentic program verification.
