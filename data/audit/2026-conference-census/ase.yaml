- title: 'Bifrost: Empowering Pretrained Language Model with Fallibility Representation for Log-Based Fault Diagnosis'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: ebd416b7-4dcd-4727-b318-65c1c438edd7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Log-based fault diagnosis is crucial for runtime debugging and maintenance. Existing fault diagnosis methods use
    language models pre-trained on natural language (PLMs) for log representation. However, system faults are reflected in
    the multi-level structure of system logs. PLMs pre-trained on natural language struggle to comprehensively capture multi-level
    fault information, failing to meet the requirements of fault diagnosis. We refer to this information as fallibility representations.
    To address this problem, we propose a novel log representation learning method, Bifrost. It draws inspiration from the
    log analysis experience of Site Reliability Engineers and meticulously designs strategies based on self-supervised contrastive
    learning to learn the fallibility representations of logs. Across three public systems and one industrial ML-as-a-Service
    system, the log representations produced by Bifrost outperform existing PLMs by average margins of 9.83% in F1 for anomaly
    detection, 18.28% in HR@k for root cause localization, and 20.88% in Macro-F1 for fault identification.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/103/Bifrost-Empowering-Pretrained-Language-Model-with-Fallibility-Representation-for-Log
