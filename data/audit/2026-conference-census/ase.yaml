- title: 'Spec2V: Planning-Guided Specification-to-Verilog Generation Framework with Verification-Driven Debugging'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 4271094e-60ea-42c1-aa44-4bcc6bfbcc88
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Field Programmable Gate Array (FPGA) is essential in mission-critical fields like aerospace. It offers high flexibility
    and deterministic real-time response. With the increase in development demands and system complexity, the traditional
    design paradigm that relies on manual expertise has become inefficient. Although large language models (LLMs) provide
    a potential pathway for automated code generation, a significant semantic gap remains between the linear reasoning patterns
    of LLMs and the inherent parallelism of FPGA hardware logic. Current methods encounter difficulties in decomposing complex
    tasks, low-resource code generation, and resolving simulation errors. To address these issues, we present Spec2V, an agent
    framework for the generation of Verilog code. Spec2V incorporates two key complementary components: (i) we propose a task
    planning method based on a dual-layer Tree of Thought. It decouples complex specifications into macro-topology and micro-logic
    structures to mitigate logical drift from linear reasoning and to improve the accuracy of initial solutions. (ii) During
    validation and debugging, Spec2V reformulates failure analysis as a structured attribution task with an LLM-as-a-Judge
    paradigm. It utilizes the reasoning capabilities of LLMs and multi-source evidence to localize the sources of simulation
    errors. Furthermore, the framework introduces a multi-temperature hedged sampling strategy and a waveform mismatch rate
    filtering mechanism to identify correct implementations efficiently from extensive candidate spaces. On the public VerilogEval
    Machine and Human benchmarks, Spec2V achieves Pass@1 accuracies of up to 99.8% and 99.4%, respectively. Case studies on
    representative RTL design tasks further demonstrate that Spec2V significantly reduces the manual effort required for implementation
    and mitigates the overhead of iterative engineering through closed-loop planning, validation, and debugging.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/12/Spec2V-Planning-Guided-Specification-to-Verilog-Generation-Framework-with-Verificati
