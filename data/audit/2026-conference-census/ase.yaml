- title: 'TasmScan: Continuation-Aware Taint Analysis for TVM Bytecode with Savelist Abstraction'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: Full-text scan found no Claude Code/Codex CLI product string; generic coding-agent or model/API mentions
    do not qualify for the main catalog.
  full_text_scan: scanned
  official_record_id: db4a9515-3aac-4495-b75d-38f7dac84678
  scan:
    disposition: excluded
    extraction_method: pdftotext
    generic_coding_agent_matches: []
    model_candidates: []
    page_count: 13
    product_matches: {}
    reason: Full-text scan found no Claude Code/Codex CLI product string; generic coding-agent or model/API mentions do not
      qualify for the main catalog.
    status: scanned
    text_chars: 95711
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The Open Network (TON) has over 175 million activated on-chain addresses and relies on the TVM (TON Virtual Machine)
    to execute smart contracts. TVM uses first-class continuations with savelists to manage control flow and register state
    across continuation invocations. Since savelist-captured registers allow data to flow across continuation boundaries without
    passing through the operand stack, bytecode-level analyses cannot construct complete data flow tracking without explicitly
    modeling savelist semantics. We present TasmScan, the first bytecode-level static analysis framework for TVM that enables
    cross-continuation data flow reasoning without requiring source code. TasmScan models savelist semantics via forward register
    analysis with a formal over-approximation guarantee for exact-resolved save sites and locally tracked register definitions,
    then lifts bytecode into TASIR, a typed intermediate representation, and performs path-sensitive taint analysis with context-aware
    sources to detect defects. We evaluate TasmScan on 2,921 contracts from the TON verifier registry and a labeled benchmark
    of 208 contracts with human-confirmed ground truth. On the full corpus, TasmScan resolves all 294,546 dynamic continuation
    targets with 100% precision; ablation confirms that savelist propagation is essential for resolving indirect register
    calls that depend on cross-continuation register passing. On the benchmark, TasmScan detects 95.3% of defects across five
    classes with 96.8% precision. A 366-pair stratified sample from the full corpus estimates 85.8% overall precision. TasmScan
    offers a 17x median speedup over the state-of-the-art symbolic-execution baseline, and in the path-analysis comparison
    completes 100% of analyses with zero crashes or timeouts.
