- title: 'Fragmented Markers, Mixed Results: A Systematic Review of AI Coding Assistants and Developer Productivity'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d2b6786f-b73e-47e7-989c-dee1b15360d3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'AI coding assistants are increasingly embedded in software engineering practice, yet the literature still offers
    no cumulative, easily interpretable picture of their effects on software developer productivity. The central problem is
    not a lack of studies, but a lack of comparability: prior work operationalizes productivity through heterogeneous markers,
    settings, and reporting styles, making cross-study conclusions difficult. To address this, we conduct a staged systematic
    literature review. In the first stage, we synthesize studies that explicitly examine developer productivity. In the second,
    we extend the scope to productivity-related developer outcomes using SPACE as a theory-informed lens, capturing human-centered
    evidence that explicit productivity studies often omit. Across both stages, we analyze how productivity is operationalized,
    which confounding factors are discussed, and how reported effects are distributed. We identify 187 unique productivity
    and productivity-related markers, while individual studies typically only use five, revealing a broad but highly fragmented
    evidence base. Explicit productivity research is dominated by time-, output-, and artifact-oriented proxies, whereas the
    broader SPACE-aligned corpus makes satisfaction, psychological aspects, and well-being substantially more visible. Reported
    effects are often positive, but this pattern is stronger in perceived and tendency-based findings than in objective or
    statistically evaluated ones. Overall, the literature suggests that AI coding assistants can support productivity, but
    current evidence does not yet support simple, context-independent conclusions. The key contribution of this review is
    therefore a structured basis for making productivity evidence more interpretable, multidimensional, and comparable across
    studies.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/56/Fragmented-Markers-Mixed-Results-A-Systematic-Review-of-AI-Coding-Assistants-and-De
