- title: 'PSearch: Search-Based Patch Generation in the Era of LLM-Based Automated Program Repair'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: a53a2676-64ec-40db-b131-adad64a7e13d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) have substantially advanced Automated Program Repair (APR), yet most existing LLM-based
    APR methods still rely on trial-and-error to generate patches. Such a strategy explores candidate patches in a weakly
    structured manner, making it difficult to assess the future potential of search directions and allocate search budget
    effectively. To address this limitation, we propose Psearch, a search-based patch generation framework for LLM-based APR
    centered on iterative patch evaluation and refinement. Instead of treating patch generation as repeated independent sampling,
    Psearch maintains a structured search state over intermediate patches, continuously evaluates the promise of explored
    search paths, and prioritizes the most promising ones for further refinement. This design enables Psearch to abandon weak
    directions early and progressively approach correct fixes through long-horizon search. Importantly, Psearch can be integrated
    with different search algorithms, while our current implementation adopts Monte Carlo Tree Search as one effective instantiation.
    We evaluate Psearch on five widely used bug and vulnerability benchmarks. Experimental results show that Psearch correctly
    repairs 201 out of 835 bugs in Defects4J, outperforming all 12 state-of-the-art baselines. Psearch also fixes 27 of 79
    vulnerabilities in VUL4J and resolves 164 of 300 issues in SWE-Bench-Lite. Moreover, with a patch size of 16, Psearch
    reduces monetary cost to roughly 50% of strong baselines while maintaining superior repair effectiveness. These results
    highlight the effectiveness of Psearch for improving LLM-based APR.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/92/PSearch-Search-Based-Patch-Generation-in-the-Era-of-LLM-Based-Automated-Program-Repa
