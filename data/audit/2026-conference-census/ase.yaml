- title: Where Does Balance Break? Boundary Discovery for Game Balance Testing under a Finite Simulation Budget
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f8c948ec-429d-487b-99a3-03d37345ad84
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Software testing often relies on assumptions such as reproducible executions and stable correctness criteria.
    However, many modern software systems exhibit non-deterministic executions and large behavior spaces, making exhaustive
    exploration impractical and single-run judgments unreliable. These characteristics make it difficult to identify where
    acceptable behavior ends and problematic behavior begins. Competitive multiplayer games represent a challenging instance
    of such systems, where balance must be maintained so that no single strategy dominates. Even small parameter changes can
    trigger abrupt balance disruption, yet detecting such failures requires repeated simulations under non-deterministic outcomes
    and high-dimensional parameter spaces. In this paper, we formulate game balance regression testing as a boundary-discovery
    problem under a finite simulation budget. The objective is to efficiently identify inputs near the boundary that separates
    balanced and unbalanced regions. To address this problem, we propose BBExplorer, which combines multi-directional candidate
    generation, budget-aware two-stage screening, and adaptive step-size shrinkage for boundary refinement. Experimental results
    on two games with different levels of complexity show that the approach is strong in low-dimensional settings and remains
    effective in higher-dimensional ones. It also exhibits stable boundary behavior across unseen random seeds and threshold
    settings. These results indicate that BBExplorer is effective for practical balance regression testing and, more broadly,
    for boundary-oriented testing in non-deterministic, budget-constrained systems.
