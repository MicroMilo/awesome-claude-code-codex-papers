- title: Characterizing the Landscape of Open-Source Satellite Software
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 13fdda08-d534-449d-8b37-fa15146e53a4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Satellites have become fundamental components of modern technological systems, supporting critical infrastructure
    in communication, navigation, Earth observation, and scientific research. As space exploration advances and demand for
    satellite-enabled services grows, reliance on complex, heterogeneous satellite software continues to increase. A systematic
    understanding of the satellite software landscape is therefore increasingly important, yet existing studies still lack
    a comprehensive empirical examination. To address this gap, we present the first characterization study of open-source
    satellite software, examining its ecosystem and development practices. We mine and analyze 22,286 satellite-related GitHub
    projects through three research questions on popularity trends (RQ1), software goals (RQ2), and development practices
    (RQ3). First, we characterize the temporal evolution of projects and active developers, revealing increasing popularity.
    Second, through manual inspection of 646 projects, we construct a taxonomy of 43 software-goal categories spanning conceptual
    design, datasets, system implementation, simulation, testing, and tools. Third, we conduct an in-depth analysis of projects
    with source code, revealing a highly heterogeneous and task-specialized ecosystem with 66 programming languages and diverse
    implementation strategies. Finally, we summarize key findings and derive actionable implications for satellite developers
    and researchers.
