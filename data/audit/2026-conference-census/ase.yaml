- title: 'Orbis: Guiding Symbolic Execution Techniques to Maximize Option-Related Branch Coverage'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3832783.3837526
  official_record_id: 638e87af-c0b8-4597-ab9c-738f24f545ab
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We present Orbis, a complementary approach that guides symbolic execution techniques toward maximizing option-related
    branch (OB) coverage. Although state-of-the-art symbolic execution techniques have substantially improved code coverage
    and bug detection, existing techniques often fail to exercise core program functionalities, which are frequently exposed
    as program options. To quantify this limitation, we evaluate how effectively current techniques cover option-related branches
    and find that they reach only 8.0% of the targeted OBs, which are accessible only through specific options. Orbis overcomes
    this challenge by systematically guiding symbolic execution to improve OB coverage. For a given program, Orbis automatically
    identifies all defined options and determines their associated branches by analyzing dynamic execution traces. It then
    iteratively constructs target option arguments by stochastically combining identified options according to their estimated
    potential, directs symbolic execution to explore states influenced by these arguments, and refines their potential while
    simultaneously reducing SMT-solver invocations using data accumulated during symbolic execution. Experimental results
    on 15 open-source C programs show that integrating Orbis with four independent state-of-the-art techniques significantly
    increases OB coverage to 323.0%, boosts total branch coverage by 112.1%, and detects five additional unique bugs on average
    compared to the standalone techniques.
