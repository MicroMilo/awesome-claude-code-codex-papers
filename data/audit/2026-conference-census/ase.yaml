- title: How Do LLMs Read Bug Reports? An Empirical Study of Attention in LLMs for Automated Program Repair
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: e93c77df-993d-4798-9b47-8193bbd1e9d7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Model (LLM)-based Automated Program Repair systems are advancing rapidly, yet their performance
    remains inconsistent. Even when provided with the same contextual information, an LLM may generate a correct patch for
    one bug but fail on another closely related bug. Why this happens remains poorly understood, and it is unclear how LLMs
    prioritize the diverse information in bug reports and whether model attention affects repair success. In this paper, we
    present the first empirical study of attention patterns in LLM-based program repair, providing interpretable insights
    into how models process bug reports and where their attention is concentrated during repair. We analyze 319 real-world
    Python and Java bugs from SWE-bench Verified and Multi-SWE-bench to study (RQ1) how model attention is distributed across
    bug report sections, (RQ2) how attention patterns within each section differ between successful and unsuccessful repairs,
    and (RQ3) how these patterns compare to information developers consider important for bug fixing. We find that successful
    repairs are characterized by diffused attention across multiple diagnostic components such as bug descriptions, stacktraces,
    and test cases, while failures often exhibit over-localized attention toward metadata such as version information. We
    further observe that stronger alignment between model attention and developer-identified key sections and phrases is associated
    with higher repair success. Our results provide the first empirical evidence that attention misallocation is a key factor
    in LLM-based APR failures, and offer actionable insights for designing more interpretable and reliable future APR systems.
