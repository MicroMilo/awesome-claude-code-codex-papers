- title: 'Less Is More: Tuning Configurable Systems with Imperfect Fidelity'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3832783.3834376
  official_record_id: 99e4c4be-d566-4dd0-bec3-40614cbb4a6b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Configuration tuning is essential for optimizing the performance of highly configurable systems, e.g., throughput
    or runtime, under a given environment. Yet, this is a challenging process as there can be many options to tune, and configuration
    measurement is often highly expensive. In this paper, we demonstrate the phenomenon of ``less can be more'''': system
    configuration tuning can be greatly improved with much superior budget utilization by partially tuning under the imperfect-fidelity—an
    environment that is similar, but cheaper to measure, compared with the concerned perfect-fidelity of environment under
    which the system should be tuned. We codify a conceptual framework of fidelity for configurable systems, drawing on which
    allows us to propose MFTune, a tuner that proactively explores in the space of $>10^4$ possible imperfect-fidelity settings
    to approximate a useful one, which strikes for the wideness of tuning. This creates high-quality seeds for the perfect-fidelity,
    which in turn ensures the tuning depth. Experiment results against $10$ state-of-the-art tuners, obtained from running
    diverse real-world systems for $19$ months $24 \times 7$, show that MFTune performs considerably better on $83.33$% cases
    with up to $19.34%$ improvement while achieving hours of budget saving in general.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/46/Less-Is-More-Tuning-Configurable-Systems-with-Imperfect-Fidelity
