- title: 'Evaluating the Maintainability of ViewModel Tests using Multi-modal DSLs: An Industrial Mixed-Methods Study'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e5fcf9a8-3b05-41ee-ac6a-641d4ea7d7e0
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: As in many modern software engineering domains, the quality of an application's Graphical User Interface (GUI)
    is fundamentally verified by automated testing. One established approach to mitigate testing challenges is to leverage
    architectural patterns, such as Model-View-ViewModel (MVVM), to decouple presentation logic and test it in isolation.
    However, developing these ViewModel tests in general-purpose programming languages (GPLs) often forces engineers to write
    excessive boilerplate code for test setup and complex assertion chains. While multi-modal domain-specific languages (DSLs)
    show promise in mitigating these GPL-related issues, empirical evidence of their impact on test maintainability in practice
    is lacking. To address this gap, we present an industrial mixed-methods study evaluating how abstracting GUI tests to
    the ViewModel level via multi-modal DSLs impacts maintenance overhead in practice, using the ViMoTest method as our representative
    realization. After establishing industrial applicability via a pre-study comprising action research and a case study,
    we conducted a task-based evaluation with industry experts, triangulated with semi-structured interviews and a questionnaire.
    Quantitative results indicate that the ViMoTest method shows a strong tendency to reduce test specification effort and
    size compared to a C++ engineering baseline. Furthermore, qualitative expert feedback indicates that visual assertions
    and robust refactoring capabilities reduce cognitive load during structural test evolution. Overall, this study provides
    empirical evidence that multi-modal DSLs positively impact the maintainability of ViewModel tests.
