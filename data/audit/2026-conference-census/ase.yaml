- title: 'EMERGE: Checking Implementation Equivalence for LLMs via Rule Synthesis'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d64dec3c-3c1b-4cb8-ac25-231199f3e9cb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Verifying whether two implementations of the same large language model are equivalent across frameworks is difficult
    in practice. Even when they implement the same computation, the graphs may differ in operator decomposition, tensor layout,
    and the use of fused or opaque kernels, making manual rewrite rules hard to build and maintain. We present Emerge, a framework
    for checking Implementation Equivalence over computation graphs extracted from model implementations. Instead of writing
    rules manually, Emerge infers candidate relations from execution values, and synthesizes rewrite rules on demand when
    existing rules are insufficient. Each synthesized rule is then validated using SMT solving when possible and constraint-aware
    randomized testing for opaque kernels. As these local equivalences accumulate, Emerge eventually establishes whether the
    two implementations are equivalent. Our implementation targets inference computation graphs captured from HuggingFace
    Transformers and vLLM. Our evaluation shows that Emerge establishes equivalence for correct implementation pairs at practical
    cost. It also detects 10 of 13 known implementation bugs, uncovers 8 previously unknown implementation issues that were
    later confirmed by developers, and localizes the first mismatch when equivalence cannot be established.
