  abstract_reason: Official abstract fetched.
  abstract: Finite state machines (FSMs) are a fundamental abstraction for modeling dynamic system behavior and are widely
    used in protocol analysis. However, automatically extracting FSMs from natural-language specifications remains challenging.
    Protocol documents are often lengthy and structurally complex, with state-transition descriptions scattered across the
    text. As a result, large language models (LLMs) operating under incomplete context are prone to generating spurious transitions
    and logically flawed FSMs. In this paper, we propose SpecFSM, a framework for the automatic extraction and repair of protocol
    FSMs from natural-language specifications. SpecFSM combines state completion, evidence tracing, and formal verification
    into a unified pipeline that infers missing states, constrains incorrect transitions, and repairs logical defects in the
    extracted models. Experiments on multiple protocol documents show that SpecFSM improves the average number of correctly
    extracted state transitions by 54.7% over existing methods, while producing FSMs with stronger logical validity and better
    interpretability.
