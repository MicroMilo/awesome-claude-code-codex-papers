- title: A Low-Cost Human-in-the-Loop Investigation of Toxicity on GitHub at Scale
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5ff411ef-a379-4f7e-b33f-019799e6f165
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Toxic interactions in open source discussions can alienate contributors and threaten project sustainability, yet
    prior empirical studies of GitHub toxicity have been limited in scale, raising questions about their generalizability.
    Scaling up is difficult because toxicity on GitHub is often implicit and context-dependent, making both fully manual annotation
    and LLM-based labeling unreliable. We present a human-in-the-loop (HITL) annotation methodology that makes large-scale,
    domain-calibrated toxicity labeling practical. A single call to a small, local LLM produces both a toxicity prediction
    and a set of interpretable event category scores. A lightweight Random Forest validator then uses those scores to flag
    the small subset of conversations most likely to be mislabeled, directing human review only where it is needed. The validator
    outperforms confidence-based and multi-LLM baselines while adding low annotation cost. We apply this pipeline to over
    124,000 GitHub issue and pull request conversations. Using the resulting dataset, we evaluate key findings from prior
    small-scale research, confirming some and qualifying others, and present new insights into the prevalence, characteristics,
    and dynamics of toxicity across diverse open source projects.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/209/A-Low-Cost-Human-in-the-Loop-Investigation-of-Toxicity-on-GitHub-at-Scale
