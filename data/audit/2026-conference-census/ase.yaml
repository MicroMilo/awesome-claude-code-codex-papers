- title: 'Beyond Text Matching: Towards Reference-Free Evaluation for Human-Oriented Binary Reverse Engineering'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: ce4b34cb-7d85-438f-863d-d797ce443358
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Human-Oriented Binary Reverse Engineering (HOBRE) aims to transform decompiled pseudocode into a more human-friendly
    representation, thereby reducing the cognitive burden of reverse analysis and improving efficiency. However, reliably
    evaluating HOBRE outputs remains a fundamental challenge. On one hand, human evaluation is costly, time-consuming, as
    well as difficult to scale. On the other hand, existing automated metrics either rely on executable test cases and runtime
    environments, which are often unavailable for real-world binaries, or depend on high-quality source code references that
    are typically inaccessible and fail to capture semantically equivalent but lexically diverse outputs. Although the emerging
    LLM-as-a-Judge paradigm is naturally well-suited to HOBRE evaluation, its effectiveness has not yet been fully studied.
    This paper presents the first systematic investigation of the LLM-as-a-Judge paradigm for HOBRE, covering three representative
    tasks: function name recovery, binary code summarization, and decompilation optimization. We introduce BinJudgeBench,
    the first expert-annotated, reference-free evaluation benchmark based on multi-dimensional human judgment. Our empirical
    study reveals that LLM-as-a-Judge achieves an average correlation of 63.20% with human judgment, significantly outperforming
    traditional automated metrics at 35.04%. By analyzing the impact of various judge configurations, including backbone LLMs,
    prompting strategies, and decoding temperatures, on both correlation and cost, we find that no ``one-size-fits-all''''
    configuration exists, as the optimal setup varies across tasks and individual samples. To address this, we propose BinJudge,
    which employs a lightweight routing mechanism to adaptively select the optimal judge configuration for each specific task
    and sample. BinJudge improves correlation with human experts by 4.5%-24.7% and reduces API cost to 0.06×-0.84× of that
    of static best configurations, providing a scalable, cost-effective, and high-fidelity automated evaluation scheme for
    HOBRE.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/9/Beyond-Text-Matching-Towards-Reference-Free-Evaluation-for-Human-Oriented-Binary-Rev
