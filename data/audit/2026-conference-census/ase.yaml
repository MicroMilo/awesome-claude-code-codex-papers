- title: To Ban or Not to Ban? How Open Source Projects Govern GenAI Contributions
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 9c0fe213-6281-481c-8266-58ee12880bde
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Generative AI (GenAI) is playing an increasingly important role in open source software (OSS). Beyond completing
    code and documentation, GenAI is increasingly involved in issues, pull requests, code reviews, and security reports. Yet,
    cheaper generation does not mean cheaper review - and the resulting maintenance burden has pushed OSS projects to experiment
    with GenAI-specific rules in contribution guidelines, security policies, and repository instructions, even including a
    total ban on AI-assisted contributions. However, governing GenAI in OSS is far more than a ban-or-not question. The responses
    remain scattered, with neither a shared governance framework in practice nor a systematic understanding in research. Therefore,
    in this paper, we conduct a multi-stage analysis on various qualitative materials related to GenAI governance retrieved
    from 67 highly visible OSS projects. Our analysis identifies recurring concerns across contribution workflows, derives
    three governance orientations, and maps out 12 governance strategies and their policy instruments. We show that governing
    GenAI in OSS extends well beyond banning - it requires coordinated responses across accountability, verification, review
    capacity, code provenance, and platform infrastructure. Overall, our work distills dispersed community practices into
    a structured overview, providing a conceptual baseline for researchers and a practical reference for maintainers and platform
    designers.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/152/To-Ban-or-Not-to-Ban-How-Open-Source-Projects-Govern-GenAI-Contributions
