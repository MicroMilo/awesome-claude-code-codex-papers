- title: A Unified Model for Cross-Domain Clone Detection via Model Merging
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 9873882b-a168-4699-9a24-38ad37fbf485
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The growing diversity of code clone types, from syntactic copies to cross-language semantic clones and AI-generated
    duplicates, has created a fragmentation crisis in clone detection. Current deep learning detectors behave as domain specialists
    and degrade significantly outside their training distributions. In our evaluation, F1 drops exceed 70% across domains.
    Deploying multiple specialized models is impractical, while training a single cross-domain detector requires simultaneous
    access to all training data. To address this limitation, we investigate model merging , a family of post-hoc techniques
    that operate solely on trained checkpoints. We systematically evaluate parameter merging using five task-vector methods,
    namely Task Arithmetic, TIES, DARE-TIES, WUDI, and PCB, as well as architecture merging through greedy layer stitching
    and cross-tokenizer alignment. Our study spans four pretrained code models, three benchmarks, and twelve merging configurations.
    Same-base TIES merging creates effective cross-domain detectors, as validated across two model families and three random
    seeds. On UniXcoder, it achieves 0.865 combined F1 , corresponding to 93% of multi-task training performance , without
    requiring training data during the merging step. WUDI achieves the highest in-distribution combined F1 at 0.899 , but
    TIES generalizes better to unseen AI-generated clones. We therefore recommend TIES as the practical merging strategy.
    Cross-base merging produces only marginal and high-variance gains across all five methods, indicating that task-vector
    compatibility through a shared pretrained base is the binding factor for effective merging in our setting. Merged encoder-based
    detectors also outperform zero-shot instruction-tuned code LLMs on GPTCloneBench, achieving 0.609 F1 compared with 0.454
    F1 for the strongest LLM baseline, while incurring substantially lower per-pair inference costs. They also generalize
    up to 4× better than multi-task training to unseen AI-generated clones, revealing a trade-off between in-domain performance
    and out-of-distribution robustness. This work provides one of the first systematic empirical studies of model merging
    for software engineering and offers a practical recipe for building cross-domain code clone detectors.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/119/A-Unified-Model-for-Cross-Domain-Clone-Detection-via-Model-Merging
