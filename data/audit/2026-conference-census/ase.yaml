- title: 'IntOAgent: A Practical Framework for Automated Detection and Triggering of Integer Overflow Vulnerabilities'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 1fa012a9-6bfa-4edd-a61a-98864db2119d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Integer overflows remain a long-standing yet often underestimated class of vulnerabilities in C/C++ software,
    often leading to logic errors and severe downstream security consequences. Despite their simple arithmetic nature, accurately
    detecting integer overflows in real-world codebases remains challenging. Existing approaches suffer from poor scalability
    due to the large search space of arithmetic operations, and often fail to generate triggerable proof-of-concept (PoCs)
    because jointly satisfying statement reachability and overflow-triggering constraints is inherently difficult. In this
    paper, we propose IntOAgent, a scalable agent-based framework for automated detection and triggering of integer overflow
    vulnerabilities. IntOAgent is built on the key insight that reachability and overflow triggering should be treated as
    distinct yet coordinated tasks. To improve scalability, IntOAgent employs a two-stage filtering strategy to prune provably
    safe operations and a boundary-aware path prioritization to focus on overflow-prone executions. To enable effective PoC
    generation, IntOAgent infers input structures and integrates overflow-guided range analysis to drive inputs toward boundary
    violations while preserving path feasibility. We evaluate IntOAgent on established benchmarks Juliet c and five widely-used
    real-world projects (SQLite, Libxml2, Libplist, V8, and Libpng) against state-of-the-art directed fuzzing and LLM-based
    techniques. IntOAgent outperforms existing approaches in both effectiveness and efficiency, discovering all existing vulnerabilities
    and 117 previously unknown integer overflow vulnerabilities (68 assigned CVEs). These results demonstrate that IntOAgent
    enables scalable generation of triggerable PoCs, significantly improving the practical detection of integer overflow vulnerabilities.
