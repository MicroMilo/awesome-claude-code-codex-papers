- title: 'ReCodeAgent: A Multi-agent Workflow for Language-Agnostic Translation and Validation of Large-Scale Repositories'
  official_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/190/ReCodeAgent-A-Multi-agent-Workflow-for-Language-Agnostic-Translation-and-Validation-
  track: Research Papers
  disposition: pending
  disposition_reason: Official record and first-party full-text URL found; full-text product/model scan is pending.
  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3832783.3837486
  official_record_id: 7ef09424-eece-47b3-8556-70a3e017b506
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Most repository-level code translation and validation techniques have been evaluated on a single source-target
    programming language (PL) pair, owing to the complex engineering effort required to adapt new PL pairs. Programming agents
    can enable PL-agnosticism in repository-level code translation and validation: they can synthesize code across many PLs
    and autonomously use existing tools specific to each PL’s analysis. However, state-of-the-art has yet to offer a fully
    autonomous agentic approach for repository-level code translation and validation of large-scale programs. This paper proposes
    ReCodeAgent, an autonomous multi-agent approach for language-agnostic repository-level code translation and validation.
    Users only need to provide the project in the source PL and specify the target PL for ReCodeAgent to automatically translate
    and validate the entire repository. ReCodeAgent is the first technique to achieve high translation success rates across
    many PLs. We compare the effectiveness of ReCodeAgent with four alternative neuro-symbolic and agentic approaches to translate
    118 real-world projects, with 1,975 LoC and 43 translation units for each project, on average. The projects cover 6 PLs
    and 4 PL pairs. Our results demonstrate that ReCodeAgent consistently outperforms prior techniques on translation correctness,
    improving test pass rate by 60.8% on ground-truth tests, with an average cost of $15.3. We also perform process-centric
    analysis of ReCodeAgent trajectories to confirm its procedural efficiency. Finally, we investigate how the design choices
    (a multi-agent vs. single-agent architecture) influence ReCodeAgent performance: on average, the test pass rate drops
    by 40.4%, and trajectories become 28% longer and persistently inefficient.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/190/ReCodeAgent-A-Multi-agent-Workflow-for-Language-Agnostic-Translation-and-Validation-
