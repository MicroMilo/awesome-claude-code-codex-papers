- title: Mining Tactics for Automated Theorem Proving
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: High-priority product candidate from the official title/abstract. The official conference record does
    not yet expose a first-party full-text PDF URL. Remains pending until first-party full text can be reviewed; arXiv is
    not used as a substitute.
  full_text_scan: pending
  official_record_id: 2a04ccf3-ed8a-4cbc-a0a0-b07bb3b475c3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Automated theorem proving is essential for the formal verification of safety-critical systems. As the corpus of
    formal proofs grows, a natural paradigm is to learn from existing proofs. However, current learning-based approaches predominantly
    train Large Language Models (LLMs) as end-to-end provers, which yields resource-intensive, opaque systems. Conversely,
    while traditional symbolic provers are computationally efficient, how to automatically improve these solvers from data
    remains an open challenge. This paper bridges this gap by proposing LLM2Ltac, a novel approach that leverages the reasoning
    power of LLMs not as end-to-end provers, but as intelligent synthesizers to mine purely symbolic tactics from data. Given
    a corpus of formal proofs, LLM2Ltac asks an LLM to identify latent proof strategies and formalize them into reusable tactics.
    These tactics are verified for validity and generalizability, and finally integrated into symbolic provers to enhance
    their automated proving capabilities without the runtime cost of LLMs. We implement LLM2Ltac on Rocq 8.20.0 and mine tactics
    from 11,725 theorems in the standard library. We evaluate our approach on 6,199 theorems from four large real-world verification
    projects, namely, compcert, Coq-Art, Ext-Lib, and VFA. Results show that the mined tactics improve CoqHammer to prove
    23.87% more theorems, and when integrating the improved CoqHammer with Claude Code, the overall proved theorems increases
    by 9.90%, indicating the effectiveness of LLM2Ltac.
