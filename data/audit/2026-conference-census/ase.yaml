- title: Safe Multi-site Binary Instrumentation of Running x86-64 Programs
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2e0ae0a5-8a9d-4b8c-90e1-35ece9e0861c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Applying binary instrumentation to a running x86-64 process is difficult because variable-length instructions
    and weak alignment guarantees prevent safe in-place code modification under concurrent execution. Existing run-time approaches
    either trap concurrent threads on every overwrite or require global synchronization, limiting scalability. This paper
    presents DIBE, a run-time binary editing framework that safely instruments running x86-64 programs without trapping in
    the common case. An admin process resolves all instrumentation decisions, including multi-site patching tactics and trampoline
    placement, and exports them as metadata. A lightweight runtime inside the target process replays these edits, safely activating
    E9Patch's multi-site rewriting tactics on the live process by applying their dependent overwrites in an order that keeps
    every intermediate program state correct under concurrent execution, a guarantee that single-site punning and offline
    rewriting do not provide. It applies 77-90% of overwrites using hardware atomic primitives invisible to concurrent threads,
    with a trap-based fallback only for the remaining cross-boundary cases. We evaluate DIBE on 28 SPEC CPU2006 benchmarks
    and a multi-process Nginx server, and demonstrate it at browser scale on a running Chrome renderer and as a live memory-safety
    checker. DIBE matches static E9Patch on both instrumentation coverage (near-complete) and execution time overhead (within
    0.5% at the geometric mean), keeps per-instruction overwrite latency sub-microsecond, and records zero trap hits across
    all Nginx configurations under sustained load.
