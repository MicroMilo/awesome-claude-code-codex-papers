- title: Property-Based Testing of Wafer Handling Robots via Model-Based Planning and Fuzzing
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e98c81e4-25b5-4233-b348-ce956bfa2111
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Wafer handling robots (WHRs) in semiconductor manufacturing require ultra-precise control software, where bugs
    can cause severe mechanical damage and costly downtime, making reliability validation critical. Yet no existing work addresses
    WHR validation. In this experience paper, we introduce a property-based testing approach for WHRs. Our key observation
    is that the system requirements of WHRs could be used as the properties for bug detection.However, applying property-based
    testing to WHR systems is challenging due to the input generation challenge. Complex action dependencies make it difficult
    to generate valid test inputs, while enormous state spaces hinder achieving adequate test coverage. To address this, we
    propose model-based planning and fuzzing. Our insight is that the WHR can be represented as a state-based model. Based
    on this model, we systematically generate valid test inputs through backward planning, then explore diverse scenarios
    through parameter and environment mutation. We implemented our approach as the ArmGo tool and evaluated it on a production
    WHR deployed in industrial lithography equipment. ArmGo discovered 21 previously unknown bugs (all confirmed, 15 fixed),
    including axis limit violations, entanglement issues, and missing interlock checks. ArmGo has been deployed in the continuous
    integration (CI) pipeline of our industrial partner and is actively used for validating WHRs. We also have distilled a
    number of practical lessons learned based on our investigation.
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/30/Property-Based-Testing-of-Wafer-Handling-Robots-via-Model-Based-Planning-and-Fuzzing
