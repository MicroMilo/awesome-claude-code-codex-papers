- title: Towards Fully Automated Medical Imaging Code Generation via Validation-Based Context Engineering
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 6854352d-ae2a-43cf-ac78-8bd29b7faaeb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) have demonstrated considerable promise in program generation for small-scale and
    conventional application development; however, they remain limited when applied to complex, domain-specific tasks such
    as medical image processing. General-purpose models lack explicit domain knowledge and robust validation mechanisms to
    ensure correctness, often requiring substantial human intervention to produce reliable processing pipelines. To address
    these limitations, we propose AutoMedImg, a multi-agent framework for fully automated medical image processing code generation.
    AutoMedImg orchestrates specialised agents across two phases: a Planning Phase that performs dataset analysis and architecture
    design with semantic and formal verification, and a Coding Phase that generates modules in parallel with static checking,
    execution testing, and assembly validation. This multi-stage validation mitigates error propagation throughout generation,
    while comprehensive auto-context engineering combining domain-specific knowledge bases, shared memory, and validation
    feedback automates context construction without manual prompting. A cross-project adaptive pipeline synthesis mechanism
    further accumulates validated pipelines and retrieves proven components for new tasks based on project similarity, enhancing
    generation efficiency through cross-project learning. Extensive evaluation across six diverse and well-established medical
    imaging datasets with five backbone LLMs demonstrates that AutoMedImg achieves zero human intervention, with Dice scores
    of up to 0.90 for segmentation tasks and 99% accuracy for classification.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/69/Towards-Fully-Automated-Medical-Imaging-Code-Generation-via-Validation-Based-Context-
