- title: Formal Verification-Integrated Reinforcement Learning for Automated ORM Schema Synthesis
  official_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/205/Formal-Verification-Integrated-Reinforcement-Learning-for-Automated-ORM-Schema-Synthe
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e077e871-36b1-4e15-b56a-1336a4a5532c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Object-relational mapping (ORM) frameworks are widely used to bridge object-oriented models and relational databases,
    but conventional tools generate only single point solutions and often miss optimal trade-offs between performance and
    storage consumption. Exhaustive tradespace analysis can discover Pareto-optimal database designs, but it is computationally
    prohibitive for realistic systems. This paper introduces ReinforceORM, an automated and scalable framework that formulates
    ORM schema synthesis as a multi-objective optimization problem solved via reinforcement learning with formal verification.
    Our approach integrates multiple RL algorithms to efficiently search the vast space of mapping strategies, balancing insertion
    time, query performance, and storage consumption, while employing Alloy-based formal analysis to provide bounded verification
    of structural and semantic correctness in generated schemas. Evaluation across fifteen diverse, real-world software systems
    shows that ReinforceORM identifies over 80% of ground-truth Pareto-optimal ORM configurations—an 18-fold improvement over
    leading ORM frameworks such as Hibernate, Django ORM, SQLAlchemy, and Entity Framework. Compared to state-of-the-art specification-driven
    search, ReinforceORM reduces analysis runtime and memory usage by four and five orders of magnitude, respectively, while
    maintaining near-optimal solution quality.
