- title: Real-World Perturbation Testing of Autonomous Driving Systems
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e73bbf29-e4ba-4bd9-b373-d943f67b963d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Autonomous Driving Systems (ADS) must operate reliably under diverse conditions, yet representative data for
    rare or adverse scenarios is difficult to obtain. Perturbation-based testing is widely used to assess robustness, but
    most studies focus on offline datasets or simulation, leaving open questions about how such results translate to real-world
    driving. We present a large-scale study of 72 camera and LiDAR perturbations, evaluated across three testing modalities:
    offline model-level analysis, hardware-in-the-loop execution, and closed-loop system-level testing on a full-scale autonomous
    vehicle. The study covers both an end-to-end vision-based driving model and a modular LiDAR-based perception and planning
    stack. Our results reveal a clear gap between testing levels. For camera-based systems, perturbations with limited offline
    impact can still induce unstable control and failures in real-world driving. For LiDAR-based systems, degradation is more
    consistent at the perception level but weakly predictive of system-level failures. Across both modalities, model-level
    metrics alone are insufficient to identify the most harmful perturbations. We further show that real-time feasibility
    is a key constraint in real-world testing, and that robustness observations obtained from recorded data do not consistently
    transfer to closed-loop behavior on a physical vehicle, highlighting the importance of complementary real-world, system-level
    evaluation.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/88/Real-World-Perturbation-Testing-of-Autonomous-Driving-Systems
