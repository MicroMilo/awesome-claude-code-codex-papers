- title: 'How Quantum Bugs Live and Die: A Lifecycle-Based Empirical Study of Bugs in Quantum Software'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: e025f5ab-3511-4106-8af2-6710a52e21d4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Despite growing evidence that bugs in quantum software exhibit distinctive characteristics, existing studies
    are typically scoped to individual frameworks or single quality attributes and do not examine how quantum-specific bugs
    behave across the broader software lifecycle. To address this gap, we construct QBugsSet, a lifecycle-based benchmark
    containing 2,429 bugs and 1,793 realistic negative samples, mined from real GitHub bug-fixing commits in the Qiskit, Cirq,
    and PennyLane ecosystems, and use it to conduct a comprehensive empirical study comparing quantum-specific and classical
    bugs across lifecycle distribution, bug-fix latency and pre-fix spatial propagation, repair burden, and LLM-based debugging
    effectiveness. We find that quantum-specific bugs are more concentrated in semantically critical stages, tend to persist
    longer before repair (median 17 vs. 7 days), and more often require coordinated multi-hunk repairs (37.8% vs. 27.3%).
    These lifecycle characteristics highlight a practical limitation of current automation: even the best frontier LLM achieves
    an end-to-end full repair rate of only 3.82% on quantum-specific bugs, compared with 8.51% on classical bugs. Overall,
    these findings provide evidence-based guidance for future debugging support that integrates stronger quantum-aware semantic
    reasoning with broader repository context.'
  abstract_source_url: https://conf.researchr.org/details/ase-2026/ase-2026-research-track/109/How-Quantum-Bugs-Live-and-Die-A-Lifecycle-Based-Empirical-Study-of-Bugs-in-Quantum-S
