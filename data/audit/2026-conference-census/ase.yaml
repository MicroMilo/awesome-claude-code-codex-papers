- title: 'Quantum Squeeziness: An Information Theoretical Metric for Quantum Software Testability'
  official_url: https://conf.researchr.org/track/ase-2026/ase-2026-research-track
  track: Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 37075cd1-3f35-4078-ac39-d6240cf279b7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Testability—the degree to which faults can be revealed and diagnosed—has long been fundamental in software engineering
    but remains largely unexplored for quantum software. This work presents the first formalisation of testability for quantum
    programs, adapting classical concepts to quantum computation. We introduce Quantum Squeeziness, an information-theoretic
    metric inspired by classical squeeziness, to quantify how faults are masked and prevented from propagating to observable
    outcomes. We treat it as an inverse measure of testability: higher squeeziness implies stronger fault masking and reduced
    detectability. We propose an efficient method to compute Quantum Squeeziness and validate it through large-scale quantum
    mutation analysis. Across more than 50k mutants, we observe a strong negative correlation between squeeziness and mutation
    score, showing that higher squeeziness predicts lower testability. We further introduce a technique that constrains where
    and how perturbations are injected, reducing cost while preserving accuracy. The computation is 15% faster than a standard
    error-propagation baseline, while the optimised variant, FastSqueeziness, reduces mean runtime from 3200s to 189s (16.9
    times speedup) with 95% accuracy. By establishing a rigorous foundation of testability for quantum software, this work
    opens new directions at the intersection of software engineering, quantum information theory, and testing. Beyond testing
    and debugging, it also supports applications in quantum error mitigation and correction, enabling principled assessment
    and improvement of program robustness.'
