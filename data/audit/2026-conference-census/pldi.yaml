  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808312
  official_record_id: ef5558be-68db-41c2-98fe-f802f3b78f98
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Predicate pushdown is a long-standing performance optimization that filters data as early as possible in a computational
    workflow. In modern data pipelines, this transformation is especially important because much of the computation occurs
    inside \emph{user-defined functions (UDFs)} written in general-purpose languages such as Python and Scala. These UDFs
    capture rich domain logic and complex aggregations and are among the most expensive operations in a pipeline. Moving filters
    ahead of such UDFs can yield substantial performance gains, but doing so requires \emph{semantic} reasoning. This paper
    introduces a general semantic foundation for predicate pushdown over stateful fold-based computations. We view pushdown
    as a correspondence between two programs that process different subsets of input data, with correctness witnessed by a
    \emph{bisimulation invariant} relating their internal states. Building on this foundation, we develop a sound and relatively
    complete framework for verification, alongside a synthesis algorithm that automatically constructs \emph{optimal pushdown
    decompositions} by finding the strongest admissible pre-filters and weakest residual post-filters. We implement this approach
    in a tool called Pusharoo and evaluate it on 150 real-world pandas and Spark data-processing pipelines. Our evaluation
    shows that Pusharoo is significantly more expressive than prior work, producing optimal pushdown transformations with
    a median synthesis time of 1.6 seconds per benchmark. Furthermore, our experiments demonstrate that the discovered pushdown
    optimizations speed up end-to-end execution by an average of 2.4$\times$ and up to two orders of magnitude.
