  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808255
  official_record_id: 99e226fe-40c5-4715-876d-d2ad2105dfc9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Quantum algorithms for computational linear algebra promise up to exponential speedups for applications such as
    simulation and regression, making them prime candidates for hardware realization. But these algorithms execute in a model
    that cannot efficiently store matrices in memory like a classical algorithm does, instead requiring developers to implement
    complex expressions for matrix arithmetic in terms of correct and efficient quantum circuits. Among the challenges for
    the developer is navigating a cost model in which conventional optimizations for linear algebra, such as subexpression
    reuse, can be inapplicable or unprofitable. In this work, we present Cobble, a language for programming with quantum computational
    linear algebra. Cobble enables developers to express and manipulate the quantum representations of matrices, known as
    block encodings, using high-level notation that automatically compiles to correct quantum circuits. Cobble features analyses
    that compute the time and space usage of programs, as well as optimizations that reduce overhead and generate efficient
    circuits using state-of-the-art techniques such as the quantum singular value transformation. We evaluate Cobble on benchmark
    kernels for simulation, regression, search, and other applications, showing 2.6x-25.4x speedups on these benchmarks compared
    to the unoptimized baseline.
