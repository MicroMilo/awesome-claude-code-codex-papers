- title: Equality Saturation for Quantum Circuit Optimization
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808254
  official_record_id: 69c1c1bc-f7cb-4586-b5ff-a50f9fd3fe6b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Optimizing a quantum circuit is hard because it requires exploring a vast space of functionally equivalent circuits,
    produced by applying local circuit rewrites such as gate cancellation and commutation. Each additional rewrite can exponentially
    expand the space of equivalent circuits, so existing optimizers can only explore a tiny fraction of this space and often
    produce suboptimal results. We present \textsc{Quasar}, a new quantum circuit optimizer that can generate a \emph{step-limited
    optimal} circuit: given a bound on rewrite iterations, it returns the lowest-cost circuit reachable within that bound.
    To achieve this, \textsc{Quasar} constructs two complementary e-graphs for the quantum circuit''s graph and sequence representations.
    \textsc{Quasar} then infers an atomic rewrite set for application on both e-graphs, which improves optimization performance
    by orders of magnitude. Finally, \textsc{Quasar} employs a series of new optimization techniques to ensure both soundness
    and scalability of equality saturation on quantum circuits. Across standard benchmarks, \textsc{Quasar} achieves geometric-mean
    reductions of 20.2% in 2-qubit gate count, 33.5% in total gate count, and 24.2% in circuit depth, and a 21.4% fidelity
    improvement over unoptimized circuits, outperforming or matching state-of-the-art rewrite-based optimizers on 75%, 92%,
    62%, and 80% of circuits, respectively.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/11/Equality-Saturation-for-Quantum-Circuit-Optimization
