  doi_url: https://doi.org/10.1145/3808265
  official_record_id: 4ae9bd06-75ab-42b6-b6ed-fde6e0157194
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We present Foxtrot, the first higher-order separation logic for proving contextual refinement of higher-order
    concurrent probabilistic programs with higher-order local state. From a high level, Foxtrot inherits various concurrency
    reasoning principles from standard concurrent separation logic, e.g. invariants and ghost resources, and supports advanced
    probabilistic reasoning principles for reasoning about complex probability distributions induced by concurrent threads,
    e.g. tape presampling and induction by error amplification. The integration of these strong reasoning principles is highly
    \emph{non-trivial} due to the combination of probability and concurrency in the language and the complexity of the Foxtrot
    model; the soundness of the logic relies on a version of the axiom of choice within the Iris logic, which is not used
    in earlier work on Iris-based logics. We demonstrate the expressiveness of Foxtrot on a wide range of examples, including
    the adversarial von Neumann coin and the $\mathsf{randombytes_uniform}$ function of the Sodium cryptography software library.
    All results have been mechanized in the Rocq proof assistant and the Iris separation logic framework.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/22/Contextual-Refinement-of-Higher-Order-Concurrent-Probabilistic-Programs
