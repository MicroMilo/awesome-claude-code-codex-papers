  official_record_id: ab9c9684-cd4f-4365-9919-edd2386135a4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: How to construct globally sound abstract interpreters to safely approximate program behaviors remains a bottleneck
    in abstract interpretation. In this paper, we show the potential of using state-of-the-art LLMs to automate this tedious
    process. Focusing on the neural network verification area, we synthesize non-trivial sound abstract transformers across
    diverse abstract domains using LLMs to search within infinite space from scratch. We formalize the synthesis task as a
    constrained optimization problem, for which we design a novel mathematically grounded cost function that measures the
    degree of unsoundness of each generated candidate transformer, while enforcing hard syntactic and semantic validity constraints.
    Building on this formulation, we introduce SAIL, a novel unified framework that combines model generation, syntactic and
    semantic validation, and cost-function-based refinement to synthesize globally sound abstract transformers. Evaluation
    results show that SAIL not only matches the performance of manually designed transformers, but also is able to synthesize
    sound and high-precision transformers that do not exist in the literature for complex non-linear operators.
