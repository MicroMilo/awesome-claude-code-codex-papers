- title: A Hierarchy of Supermartingales for ω-Regular Verification
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808257
  official_record_id: 64fb9ddf-7662-46f3-81ce-ecfe6964add4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We propose new supermartingale-based certificates for verifying almost sure satisfaction of $\omega$-regular
    properties: (1) \emph{generalised Streett supermartingales} (GSSMs) and their lexicographic extension (LexGSSMs), (2)
    \emph{distribution-valued Streett supermartingales} (DVSSMs), and (3) \emph{progress-measure supermartingales} (PMSMs)
    and their lexicographic extension (LexPMSMs). GSSMs, LexGSSMs, and DVSSMs are derived from least-fixed point characterisations
    of positive recurrence and null recurrence of Markov chains with respect to given Streett conditions; and PMSMs and LexPMSMs
    are probabilistic extensions of parity progress measures. We study the hierarchy among these certificates and existing
    certificates, namely Streett supermartingales, by comparing the classes of problems that can be verified by each type
    of certificates. Notably, we show that our certificates are strictly more powerful than Streett supermartingales. We also
    prove completeness of GSSMs for positive recurrence and of DVSSMs for null recurrence: DVSSMs are, in theory, the most
    powerful certificates in the sense that for any Markov chain that almost surely satisfies a given $\omega$-regular property,
    there exists a DVSSM certifying it. We provide a sound and relatively complete algorithm for synthesising LexPMSMs, the
    second most powerful certificates in the hierarchy. We have implemented a prototype tool based on this algorithm, and
    our experiments show that our tool can successfully synthesise certificates for various examples including those that
    cannot be certified by existing supermartingales.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/14/A-Hierarchy-of-Supermartingales-for-Regular-Verification
