- title: Fixed Parameter Tractable Linearizability Monitoring
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808315
  official_record_id: 65eb7fff-44f1-4455-85b5-7dd1cfcfe08b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We study the linearizability monitoring problem, which asks whether a given concurrent history of a data structure
    is equivalent to some sequential execution of the same data structure. In general, this problem is $\mathsf{NP}$-hard,
    even for simple objects such as registers. Recent work has identified tractable cases for restricted classes of histories,
    notably unambiguous and differentiated histories. We revisit the tractability boundary from a fine-grained, parameterized
    perspective. We show that for a broad class of data structures — including stacks, queues, priority queues, and maps—linearizability
    monitoring is fixed-parameter tractable when parameterized by the number of processes. Concretely, we give an algorithm
    running in time $O(c^{k} \cdot \mathsf{poly}(n))$, where $n$ is the history size, $k$ is the number of processes, and
    $c$ is a constant, yielding efficient performance when $k$ is small. % Our approach reduces linearizability monitoring
    to a language reachability problem on graphs, which asks whether a labeled graph admits a path whose label sequence belongs
    to a fixed language $L$. We identify classes of languages that capture the sequential specifications of the above data
    structures and show that language reachability is efficiently solvable on the graph structures induced by concurrent histories.
    Our results complement prior hardness results and existing tractable subclasses, and provide a unified algorithmic framework.
    We implement our approach and demonstrate significant runtime improvements over existing algorithms, which exhibit exponential
    worst-case behavior.
