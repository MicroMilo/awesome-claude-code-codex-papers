- title: Responsive Parallelism with Dynamic and First-Class Priorities
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808334
  official_record_id: eb68db82-2ae3-4d04-8a1d-2265e9dd6352
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'PriML, a language developed in recent work on {\em responsive parallelism}, extends traditional fine-grained
    parallel languages such as Cilk by allowing programmers to annotate threads with {\em priorities}. Programmers thus get
    the substantial throughput benefits of lightweight threads scheduled by a user-level runtime, while retaining the ability
    to use threads for responsive applications typically programmed with lower-level threading systems. PriML''s type system
    guarantees the absence of {\em priority inversions}, costly performance errors in which high-priority threads are delayed
    by low-priority threads, enabling formal bounds on throughput and responsiveness, but at the cost of expressiveness: threads
    may not change priority once spawned and the priority of a thread is specified as a priority literal in the code (i.e.,
    priorities are not {\em first-class}). This work relaxes the two assumptions above by tracking {\em sets of priorities}
    using techniques drawn from the literature on refinement types. We extend the graph-based cost models of responsive parallelism
    to incorporate first-class and changing priorities, and prove bounds on the throughput and responsiveness of well-typed
    programs in our extended language. We implement our type system extensions in the PriML compiler, and demonstrate the
    benefits of the extension using a concurrent web server as a case study.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/91/Responsive-Parallelism-with-Dynamic-and-First-Class-Priorities
