  official_record_id: 513f3c27-af07-4e0f-9d52-d56da8f2b68d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Binary size reduction is an increasingly important optimization objective for compilers, especially in the context
    of mobile applications and resource-constrained embedded devices. In such domains, binary size often takes precedence
    over compilation time. One emerging technique that has been shown effective is function merging , where multiple similar
    functions are merged into one, thereby eliminating redundancy. The state-of-the-art approach to perform the merging, due
    to Rocha et al. [CGO 2019, PLDI 2020], is based on sequence alignment , where functions are viewed as linear sequences
    of instructions that are then matched in a way maximizing their alignment. In this paper, we consider a significantly
    generalized formulation of the problem by allowing reordering of branches within each function, subsequently allowing
    for more flexible matching and better merging. We show that this makes the problem NP -hard, and thus we study it through
    the lens of parameterized algorithms and complexity , where we identify certain parameters of the input that govern its
    complexity. We look at two natural parameters: the branching factor and nesting depth of input functions. Concretely,
    our input consists of two functions F_1 , F_2 where each F_i has size n_i , branching factor b_i , and nesting depth d_i
    . Our task is to reorder the branches of F_1 and F_2 in a way that yields linearizations achieving the maximum sequence
    alignment. Let n = max( n_1 , n_2 ), and define b , d similarly. Our results are as follows: To the best of our knowledge,
    this is the first systematic study of function merging with branch reordering from an algorithmic or complexity-theoretic
    perspective.'
