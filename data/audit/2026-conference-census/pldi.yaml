- title: Uniformity Analysis in the WebGPU Shading Language
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808331
  official_record_id: e0c200fe-41e8-4750-a18f-7cb6e85494c9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The WebGPU programming model brings general-purpose GPU programming to the web, allowing untrusted JavaScript
    to issue parallel workloads to client GPUs. To ensure reliability, WebGPU mandates \emph{uniformity analysis}—a static
    check that rejects programs that could cause \emph{barrier divergence}, a GPU control-flow error that can hang execution
    and require OS-level recovery. While traditional GPU models treat barrier divergence as undefined behaviour, WebGPU''s
    need for safety and reliability makes this unacceptable. % We present the first comprehensive formal and practical study
    of uniformity analysis in WebGPU, identifying four key issues and making corresponding contributions: % (1) \emph{Lack
    of definition:} The analysis currently defines non-uniform programs only as those it rejects, without an independent notion
    of barrier divergence. We provide an operational semantics for TinyWGSL, a core calculus of the WebGPU Shading Language
    (WGSL), developed in consultation with WGSL specification editors and implementers. This semantics rigorously defines
    barrier divergence in the context of WGSL for the first time. % (2) \emph{Complex specification:} The current description
    of uniformity analysis in WGSL is lengthy and imprecise. We reformulate it via concise formal rules for TinyWGSL and argue
    their soundness with respect to our semantics. % (3) \emph{Lack of soundness and precision:} Using our semantics, we expose
    soundness and precision flaws in the analysis as presented in the WGSL specification. In response, we have proposed four
    significant changes to the specification (all accepted). % (4) \emph{Testing difficulty:} The complex, semi-formal definition
    of uniformity in the WGSL specification makes it hard to test implementations. We mechanise uniformity analysis in Alloy
    and use Alloy''s test generation to stress-test the Chromium implementation, revealing specification–implementation discrepancies
    and a bug in the Chromium implementation. % Overall, our work resolves an important GPU programming problem (rigorously
    defining barrier divergence), brings an interesting new analysis to the attention of the PL community, and demonstrates
    the impact of applying formal PL techniques to an important industrial language specification.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/88/Uniformity-Analysis-in-the-WebGPU-Shading-Language
