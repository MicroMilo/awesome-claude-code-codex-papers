- title: Decoupling Data Layouts from Bounding Volume Hierarchies
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808253
  official_record_id: 7b0c8c3b-36b0-4b16-a47d-f1028846edd3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Bounding volume hierarchies are ubiquitous acceleration structures in graphics, scientific computing, and data
    analytics. Their performance depends critically on data layout choices that affect cache utilization, memory bandwidth,
    and vectorization—increasingly dominant factors in modern computing. Yet, in most programming systems, these layout choices
    are hopelessly entangled with the traversal logic. This entanglement prevents developers from independently optimizing
    data layouts and algorithms across different contexts, perpetuating a false dichotomy between performance and portability.
    We introduce Scion, a domain-specific language and compiler for specifying the data layouts of bounding volume hierarchies
    independent of tree traversal algorithms. We show that Scion can express a broad spectrum of layout optimizations used
    in high-performance computing while remaining architecture-agnostic. We demonstrate empirically that Pareto-optimal layouts
    (along performance and memory footprint axes) vary across algorithms, architectures, and workload characteristics. Through
    systematic design exploration, we also identify a novel ray tracing layout that combines optimization techniques from
    prior work, achieving Pareto-optimality across diverse architectures and scenes.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/10/Decoupling-Data-Layouts-from-Bounding-Volume-Hierarchies
