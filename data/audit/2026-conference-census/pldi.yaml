- title: 'Hayroll: A Modular Wrapper for Translating C Macros and Conditional Compilation to Rust'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808276
  official_record_id: 6da8f881-5c8c-4e73-b89b-a97e40011672
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Previous C-to-Rust translators run the C preprocessor cpp on their input before translation. This discards configurability,
    and it loses programmer-defined abstractions expressed as C macros. We present Hayroll, a modular wrapper that makes C-to-Rust
    translation preprocessor-aware without modifying the underlying translator. Hayroll consists of two cooperating layers.
    The conditional compilation translation layer uses symbolic execution to derive activation conditions for each line of
    the source code. It splits the program into a set of configuration-specific translation tasks that together cover every
    line of code. These tasks are then passed independently to the macro translation layer. The macro translation layer classifies
    macros, annotates macro-expanded nodes with tags, and sends the code through the underlying translator. It then reconstructs
    C macros as Rust functions or macros by retrieving these tags from the translator’s output. Because the layers communicate
    only through task partitioning and source-code annotations, the underlying translator remains a black box; no invasive
    changes are required. Our implementation uses C2Rust, but the design is translator-agnostic. We evaluated Hayroll on CRUST-Bench,
    LibmCS, and zlib. Hayroll successfully reconstructs most syntactical macros and avoids configuration explosion through
    symbolic execution. Hayroll's output passes the same tests as the underlying C-to-Rust transpiler. These results show
    that decoupled preprocessor analysis can restore configurability and abstraction to C-to-Rust translation in a practical
