- title: Fungible Memories for Automated Technology Mapping and Retargeting
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808294
  official_record_id: ce8a3d66-c535-42cf-97f0-b22e63e4317a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: During chip development, engineers must target different technologies, such as simulation and various ASIC and
    FPGA technologies. Conventionally, they split parts of the code (e.g., memories) into separate technology-specialized
    blocks implementing the same high-level behavior. This leads to brittle code, with multiple but subtly different blocks
    describing the same semantic behavior, harming verification, agility, and extensibility. We propose fungible memories,
    an HDL-level "write once, map anywhere" memory abstraction with rich enough semantics to automatically target all relevant
    technologies using a single generic interface. We incorporate fungible memories into a compiler called Memo. For designs
    without a specific technology mapping, we also present a memory decompiler which lifts memories from an existing gate-level
    design to Memo, enabling automated technology re-targeting, which is a holy grail for digital designers. We present a
    structure-aware equality saturation technique which scales to netlists with millions of cells and identifies memories
    that the state of the art cannot. We demonstrate that Memo effectively targets backends across different technology platforms
    (simulation, ASIC, and FPGA) over a suite of representative designs, including a RISC-V multicore SoC.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/51/Fungible-Memories-for-Automated-Technology-Mapping-and-Retargeting
