- title: The Search for Constrained Random Generators
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808329
  official_record_id: 486c9dcd-9453-40e4-9686-9bd54dde7dbf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Among the biggest challenges in property-based testing (PBT) is the constrained random generation problem: given
    a predicate on program values, randomly sample from the set of all values, and only values, satisfying that predicate.
    Efficient solutions to this problem are critical, since the executable specifications used by PBT often have preconditions
    that input values must satisfy in order to be valid test cases, and satisfying values are often sparsely distributed.
    We propose a novel approach to this problem using deductive program synthesis. We present a set of synthesis rules, based
    on a denotational semantics of generators, that give rise to an automatic procedure for synthesizing correct generators.
    Our system handles recursive predicates by rewriting them as catamorphisms and then matching with appropriate anamorphisms;
    this is theoretically simpler than other approaches to synthesis for recursive functions, yet still extremely expressive.
    Our implementation, Palamedes, is an extensible library for the Lean theorem prover. The synthesis algorithm itself is
    built out of standard proof-search tactics, reducing implementation burden and allowing the algorithm to benefit from
    further advances in Lean proof automation.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/86/The-Search-for-Constrained-Random-Generators
