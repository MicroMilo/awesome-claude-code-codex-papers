  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808279
  official_record_id: 4aae5bd3-e0cc-4e1a-8679-4793e3b61b7a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: High-level specifications of code are inherently ambiguous, and prior systems have explored interactive techniques
    to help users clarify their intent and resolve such ambiguities. However, most existing approaches elicit supervision
    through labeled examples, which are often error-prone and may fail to capture user intent. This paper introduces a new
    active learning paradigm for program disambiguation based on multiple-choice queries. In this paradigm, the system presents
    a small set of high-level behaviors as multiple-choice options, and the user simply selects the intended one. Technically,
    each answer option corresponds to a Hoare triple that characterizes a cluster of semantically similar candidate programs.
    This formulation enables formal reasoning about the informativeness and interpretability of queries, and supports systematic
    construction of optimal queries. Building on this insight, we develop a new active learning algorithm and implement it
    in a tool called Socrates, which automatically synthesizes informative multiple-choice queries for program disambiguation.
    We evaluate Socrates across four domains spanning both symbolic and neurosymbolic settings and show that it produces intuitive,
    easy-to-answer queries and achieves efficient convergence. Most importantly, Socrates identifies the intended program
    more reliably than existing methods, while maintaining competitive runtime performance.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/36/Choose-Don-t-Label-Multiple-Choice-Query-Synthesis-for-Program-Disambiguation
