- title: Exploiting Sophisticated Static Analysis for Verilog
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808300
  official_record_id: 09df828f-a4b3-4ca4-b8e6-79d06d9346a9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Static analysis has profoundly improved software quality over the past decades, evolving from compiler-integrated
    optimizations and simple linting to sophisticated analyses for bug detection, security, and program understanding. In
    contrast, static analysis for hardware remains underexploited, resembling the early state of software analysis. Most existing
    hardware static analyses are confined to compiler optimizations and linting, lacking the sophistication needed to uncover
    complex design flaws. Furthermore, we observe that many hardware bugs reported in recent literature could have been identified
    by sophisticated static analyses that account for hardware-specific semantics and data flow; however, such bug detection
    analyses are absent today. To exploit the untapped potential of sophisticated hardware analysis, we present a series of
    bug detection analyses for Verilog, the predominant hardware description language (HDL). Moreover, these analyses are
    built upon our fundamental analyses that capture essential hardware-specific characteristics—such as bit-vector arithmetic,
    register synchronization, and digital component concurrency—and enable the examination of hardware data and control flows.
    Together, these analyses form a well-organized analysis suite with a modular design, in which diverse fundamental analyses
    combine to support bug detection, hardware understanding, and other potential clients. To implement these analyses, we
    further offer dedicated infrastructure, including a Verilog front end, an intermediate representation (IR) for analysis,
    and an analysis manager. To validate the utility of our analyses, we applied them to real-world hardware projects. Unlike
    software, real-world hardware projects tend to contain fewer but harder-to-detect bugs, as they typically undergo extensive
    simulation and rigorous verification to prevent the prohibitive costs of hardware defects. Despite this, our preliminary
    experimental results are highly promising: applying these proposed analyses to popular real-world Verilog projects (averaging
    1.5K+ GitHub stars) uncovered nine previously unknown bugs, all confirmed by developers; moreover, we successfully identified
    a total of 18 bugs beyond the capabilities of existing static analyses for Verilog bug detection (i.e., linters). These
    results underscore the transformative potential of sophisticated static analysis in hardware design. Our analysis suite
    and infrastructure are also highly reusable: on average, each bug-detection client built on our analysis suite requires
    about 270 LoC, compared to 5,700 LoC when developed from scratch. By open-sourcing the entire system, involving substantial
    engineering effort (100K+ LoC), we aim to encourage further innovation and applications of sophisticated static analysis
    for hardware, hopefully fostering a similarly vibrant ecosystem that software analysis enjoys.'
