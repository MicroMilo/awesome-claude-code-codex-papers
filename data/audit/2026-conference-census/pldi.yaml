  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808309
  official_record_id: ccd74d76-0324-44ac-abd1-3c98ae2344f9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Recursive coalgebras provide an elegant categorical tool for modelling recursive algorithms and analysing their
    termination and correctness. By considering coalgebras over categories of suitably indexed families, the correctness of
    the corresponding algorithms follows \emph{intrinsically} just from the type of the computed maps. However, proving recursivity
    of the underlying coalgebras is non-trivial, and proofs are typically ad hoc. This layer of complexity impedes the formalization
    of coalgebraically defined recursive algorithms in proof assistants. We introduce a framework for constructing coalgebras
    which are \emph{intrinsically} recursive in the sense that the type of the coalgebra guarantees recursivity from the outset.
    Our approach is based on the novel concept of a \emph{well-founded functor} on a category of families indexed by a well-founded
    relation. We show as our main result that every coalgebra for a well-founded functor is recursive, and demonstrate that
    well-known techniques for proving recursivity and termination such as ranking functions are subsumed by this abstract
    setup. We present a number of case studies, including Quicksort, the Euclidian algorithm, and CYK parsing. Both the main
    theoretical result and selected case studies have been formalized in Cubical Agda.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/66/Intrinsically-Correct-Algorithms-and-Recursive-Coalgebras
