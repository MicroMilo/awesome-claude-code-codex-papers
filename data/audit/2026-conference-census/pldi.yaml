- title: 'Analyzing Bytes: Pre-Disassembly Static Binary Analysis'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808292
  official_record_id: abd95109-bdc6-489d-937d-708ee67a3d24
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Binary code analysis plays a central role in numerous applications in software security, performance optimization,
    reverse engineering, and so on. Existing techniques need to first disassemble binaries into functions in assembly code
    before an analysis can be performed. However, disassembly and function identification have proven to be major challenges
    for complex variable-length instruction sets such as the x86. A recent trend has been to use static analysis to improve
    the accuracy of these tasks. This raises a chicken-and-egg problem: a disassembly is needed for static analysis, but a
    static analysis is needed for accurate disassembly! We overcome this problem by developing a novel static analysis approach
    that can operate before committing to a disassembly. Our analysis operates on the output of exhaustive disassembly that
    considers each possible offset in a binary as an instruction, and constructs what is known as a super-set control-flow
    graph (CFG). The central technical challenge in analyzing this CFG is that it mixes legitimate instructions with unintended
    ones, causing analysis results from invalid code paths to pollute legitimate ones. To overcome this challenge, we begin
    with a key new insight that if we focus on backward analyses, we can ensure accuracy of analysis results at intended instructions
    even though we have no idea where these intended instructions are! Moreover, our analysis operates in time that is linear
    in the size of the binary. Specifically, in O(n) total time, it yields analysis results for every one of the n offsets
    in an n-byte binary. For this task, it is orders of magnitude faster than previous techniques, as the previous techniques
    typically need to repeat the analysis many times.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/49/Analyzing-Bytes-Pre-Disassembly-Static-Binary-Analysis
  abstract_sha256: 0de72943590a223a6e1b8097c340d372c8e544a6f5fa8c0f04780442a486ee7d
