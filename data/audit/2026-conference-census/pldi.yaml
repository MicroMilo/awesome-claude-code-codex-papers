  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808341
  official_record_id: ac1ea610-8da5-4fd7-80b9-740aa169ab50
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We propose an incremental approach for safety proofs that decomposes a proof with a complex inductive invariant
    into a sequence of simpler proof steps. Our proof system combines rules for (i) forward reasoning using inductive invariants,
    (ii) backward reasoning using inductive invariants of a time-reversed system, and (iii) prophecy steps that add witnesses
    for existentially quantified properties. We prove each rule sound and give a construction that recovers a single safe
    inductive invariant from an incremental proof. The construction of the invariant demonstrates the increased complexity
    of a single inductive invariant compared to the invariant formulas used in an incremental proof, which may have simpler
    Boolean structures and fewer quantifiers and quantifier alternations. Under natural restrictions on the available invariant
    formulas, each proof rule strictly increases proof power. That is, each rule allows to prove more safety problems with
    the same set of formulas. Thus, the incremental approach is able to reduce the search space of invariant formulas needed
    to prove safety of a given system. A case study on Paxos, several of its variants, and Raft demonstrates that forward-backward
    steps can remove complex Boolean structure while prophecy eliminates quantifiers and quantifier alternations.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/98/Simplifying-Safety-Proofs-with-Forward-Backward-Reasoning-and-Prophecy
