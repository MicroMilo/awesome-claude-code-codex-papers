  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808307
  official_record_id: 2d23a91c-c7b4-41f2-b3fa-3782f99bd51a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Users of program analyses expect that results change predictably in response to changes in their programs, but
    many analyses do not ensure such robustness. This paper introduces a theoretical framework that provides a unified language
    to articulate robustness properties. We adopt a categorical view in which programs and their properties form a category,
    and robust analyses are characterized as structure-preserving functors. A diverse range of robustness properties—e.g.,
    invariance under variable renaming and monotonicity—arise from instantiating the category's arrows accordingly. Beyond
    formulating the meaning of robustness, this paper provides methods for achieving it. The first is a general recipe for
    designing robust analyses, by lifting a sound and robust analysis from a restricted (sub-Turing) model of computation
    to a sound and robust analysis for general programs. This recipe demystifies the design of several existing loop summarization
    and termination analyses by showing they are instantiations of this general recipe, and furthermore elucidates their robustness
    properties. The second is a characterization of a sense in which an algebraic program analysis is robust, provided that
    it is comprised of robust operators. In particular, we show that such analyses behave predictably under common refactoring
    patterns, such as variable renaming and loop unrolling.
