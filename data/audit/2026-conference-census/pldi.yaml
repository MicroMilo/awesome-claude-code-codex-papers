- title: 'Escape with Your Self: Sound and Expressive Bidirectional Typing with Avoidance for Reachability Types'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808335
  official_record_id: d04f5e96-01bd-4758-8599-77b0bf818692
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Reasoning about programs in the presence of mutation and aliasing is notoriously difficult. Rust has popularized
    lifetime-based ownership tracking in systems programming, but its ``shared XOR mutable'''' model is fundamentally at odds
    with higher-level functional programming. Reachability types offer an alternative: they enable safe sharing and escape
    of mutable data by tracking which resources each expression can reach. To track internal reachability within complex object
    graphs, reachability types adopt \emph{self-references} that let components refer to enclosing resources from inside,
    just like \texttt{this} pointers in OO languages. While natural for \emph{declaratively} typing escaping data, self-references
    complicate subtyping and furthermore type inference: variance restricts where self-references may appear, yet useful type
    conversions must allow them to vary in controlled ways, which in turn imposes constraints on inference. As an undesirable
    result, prior works require programmers to insert term-level coercions for even just \emph{avoidance}—avoiding ill-scoped
    names in types. With all prior works being declarative, we investigate \emph{algorithmic} reachability types in this work.
    We introduce a refined subtyping relation that permits more flexible usages of self-references. We further develop a sound
    and decidable bidirectional typing algorithm, implemented and verified in Lean. The algorithm automatically avoids ill-scoped
    names in types, and infers qualifiers via a lightweight unification mechanism. As a step towards practical reachability
    programming, we show that the system is capable of tracking diverse reachability patterns without explicit coercions in
    complex Church-encoded datatypes.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/92/Escape-with-Your-Self-Sound-and-Expressive-Bidirectional-Typing-with-Avoidance-for-R
