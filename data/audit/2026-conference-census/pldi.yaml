  official_record_id: bbf009a4-2460-4b62-b201-59533af6b402
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We introduce a type system that provides strong types for exception tracking in ML-style languages. Our type system
    employs a rich notion of row polymorphism and subtyping to ensure backwards compatibility, making sure that code without
    exception tracking continues to work and can be generalized gracefully to support exception tracking. We study the safety
    and abstraction guarantees of our type system, in particular the role of local exceptions for data abstraction. We formulate
    these claims using binary logical relations in a novel relational separation logic for exceptions, an independent contribution
    of this paper. We support a realistic subset of features from ML-style languages, such as extensible variant types, local
    exceptions, and concurrency. We exercise our type system and logic on a number of challenging examples taken from the
    OCaml standard library, from one of Jane Street's OCaml libraries, and from Filinski's PhD thesis. All our results are
    mechanized in the Rocq prover using Iris.
