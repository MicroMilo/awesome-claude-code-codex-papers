- title: Syntactic Implicit Parameters with Static Overloading
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808336
  official_record_id: 8f981cd5-8f9a-4470-a32f-fa5ae7e29992
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Implicits provide a powerful mechanism for term-based inference, where “obvious” arguments can be omitted and
    inferred by the type checker. This can greatly reduce the programmer’s burden and improve the clarity of expression. As
    such, many languages support a form of implicits in practice, such as type classes in Haskell or Lean, or implicits in
    Scala. Unfortunately, many of these systems have become increasingly complex and often require significant implementation
    effort. In this paper we take a fresh look at the design space with an arguably simpler approach based on two orthogonal
    features: syntactic implicit parameters and static overloading . Each of these features is limited in scope and has a
    straightforward implementation. Taken together though, they are surprisingly expressive and we believe they can cover
    many of the common usage scenarios of implicits in practice. We formalize our system and provide various examples, and
    prove our elaboration is coherent. We also give an inference algorithm and show it is sound and complete. Our system is
    fully implemented in the Koka language, and we describe our experience with these features at scale, and discuss further
    extensions.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/93/Syntactic-Implicit-Parameters-with-Static-Overloading
