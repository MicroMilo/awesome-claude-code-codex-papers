  doi_url: https://doi.org/10.1145/3808283
  official_record_id: 8e028376-b6a0-4320-bd14-5c05f541b9b5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We describe a comprehensive compilation approach for relational algebra, centered on an abstract loop-based intermediate
    representation (IR) that can express fused implementations of relational algebra operators on both sets and multisets.
    The loops are abstracted away from physical data structures thus making it easier to optimize. We show how to lower relational
    algebra query plan trees to the IR, including the complex operators that are used in production database systems, such
    as outer joins, non-equi joins, and differences. We then show how to compile this IR to efficient C++ code that co-iterates
    over the physical data structures present in relational algebra expressions. Finally, we show that our approach is portable
    across data structures. Since our approach can fuse across disparate operators, it achieves a 3.8x speedup (0.8–12.1x)
    compared to Hyper on selected LSQB benchmarks and worst-case optimal triangle queries. Our compiler also generates code
    of high quality: it has similar sequential performance to Hyper on TPC-H with a 1.0x speedup (0.4–4.3x) and is approaching
    their parallel performance with a 0.6x speedup (0.2–1.8x).'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/40/A-Compiler-for-Fused-Relational-Operations-on-Multisets
