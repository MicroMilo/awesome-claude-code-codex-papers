  full_text_scan: pending
  doi_url: https://doi.org/10.1145/3808347
  official_record_id: 0ec73699-426c-4b81-982e-1e40f9a37c70
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) have shown remarkable ability to generate code, yet their outputs often violate syntactic
    or semantic constraints when guided only through natural language prompts. We introduce \textsc{TreeCoder}, the most general
    and flexible framework to date for exploring decoding strategies, constraints, and hyperparameters in LLMs, and use it
    in code generation to enforce correctness and structure \emph{during decoding} rather than relying on prompt engineering.
    \textsc{TreeCoder} represents decoding as a tree search over candidate programs, where both decoding strategies and constraint
    functions–such as style, syntax, execution–are treated as first-class, optimisable components. This design enables systematic
    exploration and automatic tuning of decoding configurations using standard optimisation techniques. Experiments on Python,
    SQL and Rust show that \textsc{TreeCoder} consistently improves accuracy across open-source models such as CodeLlama,
    Mistral, DeepSeek and Qwen, often significantly outperforming their unconstrained baselines.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/104/TreeCoder-Systematic-Exploration-and-Optimisation-of-Decoding-and-Constraints-for-LL
