- title: Implementability of Global Distributed Protocols Modulo Network Architectures
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808319
  official_record_id: 04c4441d-265a-4830-81a9-867287c12680
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Global protocols specify distributed, message-passing protocols from a birds-eye view, and are used as a specification
    for synthesizing local implementations. Implementability asks whether a given global protocol admits a distributed implementation.
    We present the first comprehensive investigation of global protocol implementability modulo network architectures. We
    propose a set of network-parametric Coherence Conditions, and exhibit sufficient assumptions under which it precisely
    characterizes implementability. We further reduce these assumptions to a minimal set of operational axioms describing
    insert and remove behavior of individual message buffers. Our reduction immediately establishes that five commonly studied
    asynchronous network architectures, namely peer-to-peer FIFO, mailbox, senderbox, monobox and bag, are instances of our
    network-parametric result. We use our characterization to derive optimal complexity results for implementability modulo
    networks, relationships between classes of implementable global protocols, and symbolic algorithms for deciding implementability
    modulo networks. We implement the latter in the first network-parametric tool Sprout(A), and show that it achieves network
    generality without sacrificing performance and modularity.
