- title: 'SIMT-Step Execution: A Flexible Operational Semantics For GPU Subgroup Behavior'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808297
  official_record_id: f3eebead-54af-4d08-81a1-95c41d527568
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: GPU hardware implements a SIMT execution model, where small groups of threads, called subgroups (or warps in CUDA),
    execute synchronously. Languages expose this through high-performance subgroup-level APIs. However, providing precise
    subgroup semantics in languages is challenging, as compilers may transform the program, potentially disrupting source-level
    synchronous behavior even if the hardware is synchronous. As a result, no GPU programming language provides rigorous semantics
    for subgroup execution. In this work, we present SIMT-Step, a formal and flexible operational semantics for subgroup execution.
    At its core is a new semantic object, dynamic basic blocks, which enables precise specification of converged subgroup
    execution. SIMT-Step then provides flexibility for the execution of instructions, which can be collective, synchronous,
    or independent. We propose several candidate instantiations of SIMT-Step and design a suite of idiomatic tests to distinguish
    them, highlighting counter-intuitive behavior that arises under relaxed variants. We implement SIMT-Step in TLA+ and validate
    the behavior of the idiomatic tests, all of which can be verified in under one second. Finally, to investigate how closely
    SIMT-Step models real-world GPU behavior, we conduct a large fuzzing campaign, spanning nine GPUs and seven vendors. Our
    results show that, despite hesitancy to provide guarantees in official specifications, most GPUs exhibit strongly synchronous
    behavior. Combined, these contributions provide both a theoretical foundation and practical tools for reasoning about
    subgroup semantics in GPU programming languages.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/54/SIMT-Step-Execution-A-Flexible-Operational-Semantics-For-GPU-Subgroup-Behavior
