- title: Versioned E-Graphs Distinguished Artifact
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808249
  official_record_id: 7dc2dc19-ec7f-4423-90dd-a2befc2b6ee2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: E-Graphs are an efficient encoding for discovering and maintaining sets of equalities, commonly adopted in the
    context of formal proofs, program analysis, and optimization. In several scenarios, equalities may hold only conditionally,
    i.e., under certain assumptions. For example, in automated provers the proof is often split into multiple branches, such
    that each branch considers a different set of equalities. A limitation of traditional e-graphs is that they can only encode
    a single set of equalities at a time. Conditional equalities are then handled by maintaining multiple e-graphs, e.g.,
    one for each branch in the proof, which is inefficient as equalities shared among branches are simply replicated many
    times. In this paper, we introduce versioned e-graphs, which efficiently encode multiple equivalence sets at the same
    time, maximizing shared information among them. We formalize for versioned e-graphs and prove their correctness. We evaluate
    our solution against widely-adopted solutions which maintain multiple e-graphs and show that versioned e-graphs are up
    to 5-30% more memory efficient and up to 4x faster depending on the case study, especially when solution spaces are large
    both in explored program terms and number of branches.
