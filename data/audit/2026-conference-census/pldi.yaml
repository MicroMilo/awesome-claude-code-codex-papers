  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808318
  official_record_id: 534b8984-69f9-427d-8573-a9d4d03fab3b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We introduce weighted NetKAT, a domain-specific language for modeling and verifying quantitative network properties.
    The language is parametric on a semiring, enabling the treatment of a wide range of quantities in a uniform way. We provide
    a denotational semantics and an equivalent operational semantics, the latter based on a novel model of weighted NetKAT
    automata (WNKA) capturing the stateful behavior of our language. With WNKA, we obtain a class of generic decision procedures
    for reasoning about quantitative safety and reachability in a fully automatic way, even in the presence of possibly unbounded
    iteration. We demonstrate the applicability of our framework in a case study using Internet2's Abilene network as the
    underlying topology.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/75/Weighted-NetKAT-A-Programming-Language-For-Quantitative-Network-Verification
