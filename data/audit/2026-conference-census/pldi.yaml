- title: Persistent Iterators with Value Semantics
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808324
  official_record_id: e96431c6-227d-4fb1-99d6-caf52a50f632
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Iterators are a fundamental programming abstraction for traversing and modifying elements in containers in mainstream
    imperative languages such as C++. Iterators provide a uniform access mechanism that hides low-level implementation details
    of the underlying data structure. However, iterators over mutable containers suffer from well-known hazards including
    invalidation, aliasing, data races, and subtle side effects. Immutable data structures, as used in functional programming
    languages, avoid the pitfalls of mutation but rely on a very different programming model based on recursion and higher-order
    combinators (map, foldl, traverse, etc.) rather than iteration. However, these combinators are not always well-suited
    to expressing certain algorithms, and recursion can expose implementation details of the underlying data structure. In
    this paper, we propose persistent iterators—a new abstraction that reconciles the familiar iterator-based programming
    style of imperative languages with the semantics of persistent data structures. A persistent iterator snapshots the version
    of its underlying container at creation, ensuring safety against invalidation and aliasing. Iterator operations (++, erase,
    etc.) operate on the iterator-local copy of the container, giving true value semantics: variables can be rebound to new
    persistent values while previous versions remain accessible. We implement our approach in the form of LibFpp—a C++ container
    library providing persistent vectors, maps, sets, strings, and other abstractions as persistent counterparts to the Standard
    Template Library (STL). Our evaluation shows that LibFpp retains the expressiveness of iterator-based programming, eliminates
    iterator-invalidation, and achieves asymptotic complexities comparable to STL implementations—albeit with the higher constant-factor
    overheads of persistence. Our design targets use cases where persistence and safety are desired, while allowing developers
    to retain familiar iterator-based programming patterns.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/81/Persistent-Iterators-with-Value-Semantics
  abstract_sha256: aa2143d471e19aeed8c1dd37d27125232fdc96a06121a64c10e15801c5394ff0
