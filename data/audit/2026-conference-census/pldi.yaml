  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808251
  official_record_id: 63026faf-ea0a-4224-bb28-a6208feae5a5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Hardware-software contracts are abstract specifications of a CPU's leakage behavior. They enable verifying the
    security of high-level programs against side-channel attacks without having to explicitly reason about the microarchitectural
    details of the CPU. Using the abstraction powers of a contract requires proving that the targeted CPU satisfies the contract
    in the sense that the contract over-approximates the CPU's leakage. Besides pen-and-paper reasoning, proving contract
    satisfaction has been approached mostly from the model-checking perspective, with approaches based on a (semi-)automated
    search for the necessary invariants. As an alternative, this paper explores how such proofs can be conducted in interactive
    proof assistants. We start by observing that contract satisfaction is an instance of a more general problem we call relative
    trace equality, and we introduce relative bisimulation as an associated proof technique. Leveraging recent advances in
    the field of coinductive proofs, we develop a deductive proof system for relative trace equality. Our system is provably
    sound and complete, and it enables a modular and incremental proof style. It also features several reasoning principles
    to simplify proofs by exploiting symmetries and transitivity properties. We formalized our deductive system in the Rocq
    proof assistant and applied it to two challenging contract satisfaction proofs.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/8/A-Deductive-System-for-Contract-Satisfaction-Proofs
