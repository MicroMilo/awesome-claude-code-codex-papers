- title: Enumerating Ill-Typed Programs for Testing Type Analyzers Distinguished Paper
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808320
  official_record_id: 2297a0c1-3412-482a-b43b-a299e51126ac
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We propose error enumeration, a method that aims to discover soundness defects in type analyzers by generating
    ill-typed programs by construction. Given a well-typed program $P$, it systematically injects type mismatches at all possible
    program locations to explore ill-typed programs that differ from $P$ by replacing one expression with incompatible ones.
    The core contributions of our work are: (1) soundly injecting type mismatches even in the presence of type inference and
    refinements, and (2) enabling practical exploration of large seed programs by pruning the search space. Incomplete type
    information complicates the injection of type mismatches, as type inference can silently "repair" the injected error by
    adjusting inferred types in the surrounding context so that the program still type-checks. We address this by introducing
    a lightweight, usage-based reasoning technique that recovers missing types of program elements by leveraging the existing
    type annotations at each element’s use site. This enables the injection of errors that guarantee type incompatibilities
    at the use sites of variables and other expressions. Finally, to prune the search space, we enumerate only those errors
    that ultimately lead to comparisons between types with distinct shape characteristics. We evaluated our implementation,
    Eris, on (1) three type analyzers integrated into the compilers of Kotlin, Scala, and Groovy, and (2) the Checker Framework,
    widely used to identify null-related errors in Java programs. Eris has uncovered 64 bugs caused by ill-typed programs:
    51 leading to unsoundness, and 13 to compile-time crashes. Further investigation reveals that the majority of the soundness
    bugs discovered by Eris are triggered under highly complex conditions, where error injection requires (1) specific combinations
    of actual vs. expected type pairs at deeply-nested program locations, or (2) reasoning about control flow and missing
    type information, capabilities that lie beyond the scope of existing work.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/77/Enumerating-Ill-Typed-Programs-for-Testing-Type-Analyzers
