  official_record_id: e4f179f8-6a1c-4b38-926f-1d8eb1d3bf74
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'A key feature in trusted computing is attestation, which allows encapsulated components (enclaves) to prove their
    identity to (local or remote) distrusting components. Reasoning about software that uses the technique requires tracking
    how trust evolves after successful attestation. This process is security-critical and non-trivial, but no existing formal
    verification technique supports modular reasoning about attestation of enclaves and their clients, or proving end-to-end
    properties for systems combining trusted, untrusted and attested code. We contribute Cerisier, the first program logic
    for modular reasoning about trusted, untrusted and attested code, fully mechanized in the Iris separation logic and the
    Rocq Prover. We formalize a recent proposal, CHERI-TrEE, to extend capability machines with enclave primitives, as an
    extension to the Cerise capability machine and program logic. Our program logic comes with a universal contract for untrusted
    code, which captures both capability safety and local enclave attestation. Like Cerise, this universal contract is phrased
    in terms of a logical relation defining capabilities'' authority. We demonstrate Cerisier by proving end-to-end properties
    for three representative applications of trusted computing: secure outsourced computation, mutual attestation and a modeled
    trusted sensor component.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/44/Cerisier-A-Program-Logic-for-Attestation-in-a-Capability-Machine
