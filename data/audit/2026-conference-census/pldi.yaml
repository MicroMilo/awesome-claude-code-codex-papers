- title: 'GradInf: Gradient Estimation as Probabilistic Inference'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808321
  official_record_id: ba82d847-0e37-40ba-a259-8a75730fc162
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: \textit{Gradient estimation}—the task of computing the gradient of the expected value of a probabilistic program—has
    diverse applications in scientific computing, but is notoriously difficult because of issues such as high-dimensional
    integration, discrete random choices, and complex stochastic dependencies. This article introduces \textit{gradient inference},
    a new approach to developing sound and efficient gradient estimators for probabilistic programs. Gradient inference rests
    on a formal reduction from a gradient estimation problem to a closely related probabilistic inference problem, whose solution
    can be differentiated to obtain a gradient estimator. This inference problem is obtained by applying two powerful statistical
    operations—\textit{coupling} and \textit{factorization}—to the input probabilistic program. Our reduction lets us leverage
    the rich toolkit of probabilistic inference algorithms to design novel gradient estimators that extend and improve upon
    existing methods. We introduce GradInf, a probabilistic programming system that facilitates the sound and automated implementation
    of gradient inference. GradInf is centered around programmable source-to-source transformations for coupling and factorizing
    higher-order probabilistic programs, whose soundness is proven in terms of a denotational semantics. Key to our development
    is the use of information-flow typing to allow random choices in a probabilistic program to be factored out and \emph{partially
    evaluated}, which improves our ability to deploy sophisticated probabilistic inference algorithms. The resulting system
    offers practitioners a principled framework for designing gradient estimators. We apply GradInf to several challenging
    case studies, showing that it can express prominent gradient estimators from the literature and enables the construction
    of new state-of-the-art estimators that outperform the best existing baselines.
