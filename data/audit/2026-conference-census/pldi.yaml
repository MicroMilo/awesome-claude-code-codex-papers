- title: 'Bonsai: Compiling Queries to Pruned Tree Traversals Distinguished Paper'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808256
  official_record_id: 4b3d1381-560f-4d55-859c-12e84484cc04
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Trees can accelerate queries that search or aggregate values over large collections. They achieve this by storing
    metadata that enables quick pruning (or inclusion) of subtrees when predicates on that metadata can prove that none (or
    all) of the data in a subtree affect the query result. Existing systems implement this pruning logic manually for each
    query predicate and data structure. We generalize and mechanize this class of optimization. Our method derives conditions
    for when subtrees can be pruned (or included wholesale), expressed in terms of the metadata available at each node. We
    efficiently generate these conditions using symbolic interval analysis, extended with new rules to handle geometric predicates
    (e.g., intersection, containment). Additionally, our compiler fuses compound queries (e.g., reductions on filters) into
    a single tree traversal. These techniques enable the automatic derivation of generalized single-index and dual-index tree
    joins that support a wide class of join predicates beyond standard equality and range predicates. The generated traversals
    match the behavior of expert-written code that implements query-specific traversals, and can asymptotically outperform
    the linear scans and nested-loop joins that existing systems fall back to when hand-written cases do not apply.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/13/Bonsai-Compiling-Queries-to-Pruned-Tree-Traversals
