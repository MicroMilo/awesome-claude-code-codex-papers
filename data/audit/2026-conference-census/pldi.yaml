- title: 'SuperCollider: Scalable and Effective Data Race Detection for CUDA'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808339
  official_record_id: 98f8b563-113a-432a-98da-25bfd44b33e8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Data races, which occur when two or more threads incorrectly access the same memory location without appropriate
    synchronization, cause CUDA programmers considerable pain. Even experts struggle to reason about extreme parallelism,
    multiple memory spaces and scopes, and diverse synchronization mechanisms. Races can manifest as subtle data corruption,
    deadlock, or livelock, which are difficult to reproduce in a debugging environment. To date, there is no generally reliable
    tool for identifying races in GPU programs at scale. State-of-the-art dynamic GPU race detectors attempt to detect data
    races by faithfully tracking the memory operations, barriers, and memory fences executed by tens of thousands of threads.
    While this complexity enables the detection of subtle races, it comes with a cost: existing tools incur substantial memory-footprint
    overheads (e.g., greater than 9x) and/or runtime overheads (e.g., 1000x), and tend to report false positives. This paper
    introduces SuperCollider, a simple race detector for CUDA that tracks only thread-level state, is agnostic to synchronization
    protocols, introduces no memory-footprint overhead, seamlessly handles shared, global, and tensor memory spaces, does
    not produce false positives, and is relatively fast. Although SuperCollider cannot detect all races, we demonstrate that
    it effectively catches many data races in professionally authored CUDA programs, including races that prior art cannot.
    Our approach exposed over 90 data races across libraries and CUDA benchmarks, and even found a race in the CUDA Programming
    Guide. Unlike prior art, SuperCollider can operate at the extreme scales required by modern GPU workloads.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/96/SuperCollider-Scalable-and-Effective-Data-Race-Detection-for-CUDA
