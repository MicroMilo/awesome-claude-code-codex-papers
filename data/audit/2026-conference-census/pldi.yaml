- title: Towards Removing Undef Values from LLVM IR Distinguished Paper
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808250
  official_record_id: 6a385e6f-a6ca-4dd5-a38e-d89105d5bfa8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'LLVM’s intermediate representation (IR) has two deferred undefined behavior (UB) values: undef and poison. The
    existence of these two values has been a persistent source of bugs. Reasoning about the correctness of analyses and optimizations
    for the regular cases is already tricky; ensuring that these are sound for all UB cases is highly non-trivial. Undef values,
    in particular, are one of the most misunderstood concepts of LLVM IR. On paper, the definition is simple: they represent
    an arbitrary value of the underlying type, and can yield a different value each time they are observed. However, this
    property makes even simple algebraic rewrites, such as replacing 2 × y with y + y, unsound in LLVM. Because reasoning
    about undef is hard, and the benefits of having it are limited, we have set a roadmap to eliminate it altogether from
    LLVM IR. The last remaining use of undef is the value of uninitialized memory, which has implications on the lowering
    of bitfields, as well as raw data copies and comparisons. In this paper, we propose an extension to LLVM IR that includes
    a raw memory value type and a freezing load. We show that these two constructs are sufficient to replace the remaining
    uses of undef in LLVM. Our implementation shows that these changes have minimal impact on both run-time and compile-time
    performance. By removing the final hurdle to eliminating undef from LLVM IR, this work paves the way for a simpler semantic
    model and easier reasoning about the soundness of IR analyses and optimizations.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/7/Towards-Removing-Undef-Values-from-LLVM-IR
  abstract_sha256: 128c060d1918ee7d66d314ae3490c7f901a34513a4affb7f479ec45e185ab37c
