- title: 'Presynthesis: Towards Scaling Up Program Synthesis with Finer-Grained Abstract Semantics'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808288
  official_record_id: 60498ec4-df1b-4975-be9c-3511950a3c24
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Abstract semantics has proven to be instrumental for accelerating search-based program synthesis, by enabling
    the sound pruning of a set of incorrect programs (without enumerating them). One may expect faster synthesis with increasingly
    finer-grained abstract semantics. Unfortunately, to the best of our knowledge, this is not the case, yet. The reason is
    because, as abstraction granularity increases—while fewer programs are enumerated—pruning becomes more costly. This imposes
    a fundamental limit on the overall synthesis performance, which we aim to address in this work. Our key idea is to introduce
    an offline presynthesis phase, which consists of two steps. Given a DSL with abstract semantics, the first semantics modeling
    step constructs a tree automaton A for a space of inputs—such that, for any program P and for any considered input I,
    A has a run that corresponds to P's execution on I under abstract semantics. Then, the second step builds an oracle O
    for A. This O enables fast pruning during synthesis, by allowing us to efficiently find exactly those DSL programs that
    satisfy a given input-output example under abstract semantics. We have implemented this presynthesis-based synthesis paradigm
    in a framework, Foresighter. On top of it, we have developed three instantiations for SQL, string transformation, and
    matrix manipulation. All of them significantly outperform prior work in the respective domains.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/45/Presynthesis-Towards-Scaling-Up-Program-Synthesis-with-Finer-Grained-Abstract-Semant
