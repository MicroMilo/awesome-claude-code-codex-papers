- title: State Space Estimation for DPOR-Based Model Checkers
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808291
  official_record_id: a20c9c09-2bc4-422c-ba13-f5de693383d2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We study the estimation problem for concurrent programs: given a bounded program $P$, estimate the number of
    maximal Mazurkiewicz trace–equivalence classes induced by its interleavings. This quantity informs two practical questions
    for enumeration-based model checking: how long a model checking run is likely to take, and what fraction of the search
    space has been covered so far. We first show the counting problem is #P-hard even for restricted programs and, unless
    P = NP, inapproximable within any subexponential factor in polynomial time. Thus, we cannot expect efficient exact or
    randomized approximation algorithms. We give a Monte Carlo approach to find a polynomial-time unbiased estimator: we convert
    a stateless optimal DPOR algorithm into an unbiased estimator by viewing its exploration as a bounded-depth, bounded-width,
    tree whose leaves are the maximal Mazurkiewicz traces. A classical estimator by Knuth, when run on this tree, gives an
    unbiased estimation. In order to control the variance of the estimation, we apply stochastic enumeration by maintaining
    a small population of partial paths per depth whose evolution is coupled. We have implemented our estimator in the JMC
    model checker and evaluated it on shared-memory benchmarks. We find that with modest budgets, our estimator yields stable
    estimates—typically within a 20$%$ band—within a few hundred trials, even when the state space has $10^5–10^6$ classes.
    We also show how the same machinery estimates model-checking cost by weighting all explored traces, not only the maximal
    ones. Our algorithms provide the first provable poly-time unbiased estimators for counting Mazurkiewicz traces.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/48/State-Space-Estimation-for-DPOR-Based-Model-Checkers
