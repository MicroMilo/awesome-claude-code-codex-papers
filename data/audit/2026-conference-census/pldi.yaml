- title: 'EREQ: Regular Expressions with Quantifiers and Incremental Quantifier Elimination'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808349
  official_record_id: 4470ec60-a515-4819-a43e-841c71fc05a9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Weak monadic second-order logic (wMSO) is a foundational tool for specifying regular properties. Traditional decision
    procedures for this logic typically translate wMSO formulas into finite automata. Although the logic is decidable, this
    approach incurs non-elementary complexity in the worst-case. Nearly thirty years ago, the state-of-the-art MONA tool showed
    that, despite these theoretical limits, wMSO can be decided efficiently in practice through carefully optimized automata
    constructions. We revisit wMSO from an algebraic perspective by introducing Extended Regular Expressions with Quantifiers
    (EREQ). Instead of relying on automata determinization, EREQ employs symbolic derivatives to perform incremental quantifier
    elimination, providing a compositional and symbolic alternative to classical automata-based approaches. We present a linear-time
    translation of wMSO into EREQ and a derivative-based decision procedure for EREQ. We prove the correctness of the translation
    and of the derivative construction in the Lean proof assistant. We implement our approach in Rust and evaluate it on a
    set of established MONA benchmarks, demonstrating competitive performance with state-of-the-art tools. Our results demonstrate
    the potential of derivative-based methods, opening new avenues for efficient decision procedures in EREQ.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/106/EREQ-Regular-Expressions-with-Quantifiers-and-Incremental-Quantifier-Elimination
