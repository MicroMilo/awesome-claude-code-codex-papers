- title: Evolving Abstract Transformers for Gradient-Guided, Adaptable Abstract Interpretation
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808346
  official_record_id: 4d7ea72f-9fc3-4d96-865a-076ac01b3417
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Current numerical abstract interpretation relies on fixed, hand-crafted, instruction-specific transformers tailored
    to each domain, giving rise to three significant limitations. First, extensibility is limited because transformers cannot
    be reused across domains and new transformers need to be designed for each new domain or operator. Second, precise compositional
    reasoning over instruction sequences is difficult as transformers are defined only at the instruction level. Third, all
    downstream tasks are forced to use the same fixed transformer, irrespective of their precision, efficiency, or task-specific
    requirements. To address these limitations, we propose the Evolving Abstract Transformer, a general transformer that replaces
    the fixed single-output design of traditional transformers with an adaptable search over a parametric space of sound outputs.
    This is achieved through two underlying algorithms we develop. First, the Universal Parametric Output Space Encoder (UPOSE)
    constructs a compact parametric space of sound outputs for any polyhedral numerical domain and any operator in the Quadratic-Bounded
    Guarded Operators (QGO) class which includes both individual instructions and structured sequences. Next, the Adaptive
    Gradient Guidance (AGG) algorithm leverages the differentiable structure of the space generated by UPOSE and uses gradient-based
    updates to efficiently search it according to downstream analysis objectives and available runtime, continually evolving
    the output as more time is provided. We implement these ideas in the AbsEvolve framework and evaluate their effectiveness
    across three numerical abstract domains: Zones, Octagons, and Polyhedra. Our results demonstrate that the evolving transformer
    works across domains and handles diverse instructions and sequences, allowing efficient adaptability in the precision–efficiency
    tradeoff by adjusting the number of gradient steps in the search, while also reaching the most precise invariants up to
    3.2× faster than existing baselines.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/103/Evolving-Abstract-Transformers-for-Gradient-Guided-Adaptable-Abstract-Interpretation
