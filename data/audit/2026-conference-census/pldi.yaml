- title: 'Cpp2Rust: Automatic Translation of C++ to Safe Rust'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808266
  official_record_id: c79c83af-6b0e-409e-8028-974cfcb14bfd
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'About 70% of security vulnerabilities in widely deployed software originate from memory-safety bugs in languages
    such as C and C++. Despite decades of investment in mitigations, from static analysis and sanitizers to hardware isolation,
    attackers continue to exploit unsafe memory operations. A promising long-term solution is to migrate existing C++ codebases
    to memory-safe languages such as Rust, but doing so manually is prohibitively expensive and error-prone. In this paper,
    we present Cpp2Rust, the first system capable of translating C++ programs into functionally equivalent and memory-safe
    Rust code automatically. By trading some performance for security, Cpp2Rust addresses the fundamental mismatch between
    C++’s unrestricted aliasing and Rust’s ownership model by inserting runtime-enforced ownership and mutability checks,
    ensuring safety while preserving semantics. To mitigate the performance overhead of dynamic checks, we developed a suite
    of source-to-source optimizations for Rust code that eliminate redundant ownership operations and recover much of the
    lost performance. We evaluate Cpp2Rust on two real-world C++ programs, totaling 13k lines of code: WOFF2, a font compression
    library, and Brunsli, a JPEG lossless compression library. Cpp2Rust achieves full memory safety with only a 2% performance
    penalty on WOFF2 compression, while being 6$\times$ slower on Brunsli due to heavy usage of pointer arithmetic. These
    results demonstrate that automated, semantics-preserving translation from C++ to safe Rust is practical for some safety-critical
    applications, offering a viable path toward eliminating memory-safety vulnerabilities in legacy systems.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/23/Cpp2Rust-Automatic-Translation-of-C-to-Safe-Rust
