- title: 'FlexHeap: Dynamic I/O-Aware Heap Resizing for Managed Applications'
  official_url: https://pldi26.sigplan.org/details/pldi-2026-papers/4/FlexHeap-Dynamic-I-O-Aware-Heap-Resizing-for-Managed-Applications
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808247
  official_record_id: a1933f39-6fff-45db-8b7d-5f6c085bc025
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Popular JVM-based search and analytics systems, such as Elasticsearch and Spark, rely on the OS page cache (I/O
    cache) to accelerate storage access. However, dividing memory between the JVM heap and the I/O cache creates a trade-off:
    enlarging the heap reduces garbage collection (GC) overhead but starves the I/O cache, while shrinking it improves I/O
    performance but raises GC cost. Existing heap resizing mechanisms ignore I/O and thus fail to address this trade-off,
    resulting in inefficient memory utilization and degraded performance. In this paper, we propose FlexHeap, a heap resizing
    mechanism for Garbage First (G1), the default OpenJDK garbage collector, that dynamically partitions a fixed DRAM budget
    between the JVM heap and the I/O cache. Between GC intervals, it estimates the CPU time lost to GC and to I/O stalls and
    repartitions DRAM to reduce their combined cost. FlexHeap relies on three concepts: (1) It makes resizing decisions using
    G1 collection boundaries. (2) It uses a history-based approach to estimate the cost of GC and I/O stalls for the future
    intervals. (3) It uses an adaptive resizing step that scales with changes in the combined cost. We implement FlexHeap
    in OpenJDK 21’s G1 garbage collector and evaluate it on two widely used systems: the Elasticsearch search engine and the
    Spark analytic framework. Compared to the G1 heap resizing mechanism, FlexHeap improves performance by an average of 30%
    in Elasticsearch and by an average of 33% in Spark. It outperforms Vertical G1, a state-of-the-art enhancement to the
    default G1 heap resizing mechanism, that returns unused memory to the OS eagerly, by 50% on average in throughput, demonstrating
    that JVM heap resizing needs to consider I/O overhead in search and analytics applications.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/4/FlexHeap-Dynamic-I-O-Aware-Heap-Resizing-for-Managed-Applications
