- title: Modular GPU Programming with Typed Perspectives Distinguished Paper
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808290
  official_record_id: c9840d07-ff9b-4708-9b97-6d7236e5a5f2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'To achieve peak performance on modern GPUs, one must balance two frames of mind: issuing instructions to individual
    threads to control their behavior, while simultaneously tracking the convergence of many threads acting in concert to
    perform collective operations like Tensor Core instructions. The tension between these two mindsets makes modular programming
    error prone. Functions that encapsulate collective operations, despite being called per-thread, must be executed cooperatively
    by groups of threads. In this work, we introduce Prism, a new GPU language that restores modularity while still giving
    programmers the low-level control over collective operations necessary for high performance. Our core idea is typed perspectives,
    which materialize, at the type level, the granularity at which the programmer is controlling the behavior of threads.
    We describe the design of Prism, implement a compiler for it, and lay its theoretical foundations in a core calculus called
    Bundl. We implement state-of-the-art GPU kernels in Prism and find that it offers programmers the safety guarantees needed
    to confidently write modular code without sacrificing performance.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/47/Modular-GPU-Programming-with-Typed-Perspectives
