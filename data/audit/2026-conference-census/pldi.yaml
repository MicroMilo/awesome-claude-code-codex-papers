- title: 'Pantomime: Constructive Leakage Proofs via Simulation'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808340
  official_record_id: 59d998a0-67f5-40f6-a194-64cb852ad557
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Tools for verifying leakage descriptions of hardware aim to ensure that a given hardware design doesn’t leak secrets
    via its microarchitecture, when executing programs with appropriate countermeasures. However, existing techniques for
    proving correctness of leakage descriptions are based on non-constructive proofs via non-interference. As a result, they
    often rely on expensive solvers that offer little help when verification fails or require handwritten invariants, which
    are difficult to come up with and even harder to debug. In this paper, we present a new approach to leakage verification
    which we call simulation-based leakage proofs. To show that a leakage description correctly captures a hardware design
    using a simulation-based proof, the user constructs a simulator—another hardware design that must faithfully replicate
    all attacker-observable behavior from explicitly leaked secrets. Simulation-based proofs therefore offer a constructive
    alternative to classic non-interference proofs, exposing a proof object—the simulator, witnessing the correctness claim.
    As simulators are just programs, we can write, execute and debug them like any other program, making them easy to use.
    We also show that they can be checked locally, which makes proof checking fast. We implement simulation-based leakage
    proofs in Pantomime, a tool that supports writing processors and their leakage proofs in Haskell; we report on using Pantomime
    to write and verify AIMCore, a 5-stage in-order processor, its leakage description, and simulator, as well as a side-channel
    hardened version of the core. We show that Pantomime verifies them efficiently (it checks AIMCore in under 40s), and use
    AIMCore’s leakage description to check for leakages in crypto libraries which uncovered two new vulnerabilities in wolfSSL
    that have both been assigned CVE’s.
