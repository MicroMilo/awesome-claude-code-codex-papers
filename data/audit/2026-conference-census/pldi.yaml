- title: 'Semantic Reification: A New Paradigm for Random Program Generation'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808268
  official_record_id: c7048106-00b5-4534-842f-986bc00c361f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We introduce semantic reification, a novel paradigm for random program generation that centers on program semantics
    rather than syntax. Our key insight is to reformulate random program generation to capture two types of program semantics:
    (1) compile-time semantics (what a program can do), represented by the control flow graph (CFG), and (2) runtime semantics
    (what a program actually does), represented by execution paths within the CFG. For any CFG and any execution path on it,
    semantic reification constructs a program guaranteed to be well-behaved with respect to a specific input and output. This
    means that when executed with this input, the program deterministically follows the designated execution path to produce
    the expected output. This paradigm differs from existing work by supporting arbitrary control flow such as unbounded loops
    and irreducible regions, while still ensuring that the generated programs are semantically correct and terminating. We
    develop a practical realization of this paradigm. First, we introduce symbolic function reification that integrates a
    lightweight form of symbolic execution into the generation process to generate an individual, leaf function (i.e., a function
    that is free of function calls). Each leaf function satisfies the constraints of a given CFG and a selected execution
    path. Second, we compose multiple leaf functions into a larger, more complex program via semantics-preserving peephole
    rewriting, guided by an arbitrary call graph. Over five months, our implementation for C compilers, Reify, has uncovered
    59 bugs in GCC and LLVM (57 confirmed, 27 fixed), 24 of which are long-latent. Among them, 36 are wrong-code bugs, many
    are high-priority issues, and most of them involve semantic characteristics overlooked by existing tools. We believe semantic
    reification opens new directions for research beyond compilers, such as validating debuggers, analyzers, and verifiers.'
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/25/Semantic-Reification-A-New-Paradigm-for-Random-Program-Generation
  abstract_sha256: c24e8f8048412ef90d32d8ecff93d123f22a62b629e8a5a7c92bc3be903d44bd
