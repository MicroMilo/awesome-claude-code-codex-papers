- title: 'Pure Borrow: Linear Haskell Meets Rust-Style Borrowing'
  official_url: https://pldi26.sigplan.org/track/pldi-2026-papers
  track: PLDI Research Papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3808259
  official_record_id: b2907557-3e26-4b4a-b3d4-b8fc597da3ce
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: A promising approach to unifying functional and imperative programming paradigms is to localize mutation using
    linear or affine types. Haskell, a purely functional language, was recently extended with linear types by Bernardy et
    al., in the name of Linear Haskell. However, it remained unknown whether such a pure language could safely support non-local
    borrowing in the style of Rust, where each borrower can be freely split and dropped without direct communication of ownership
    back to the lender. We answer this question affirmatively with Pure Borrow , a novel framework that realizes Rust-style
    borrowing in Linear Haskell with purity. Notably, it features parallel state mutation with affine mutable references inside
    pure computation, unlike the IO and ST monads and existing Linear Haskell APIs. It also enjoys purity, lazy evaluation,
    first-class polymorphism and leak freedom, unlike Rust. We implement Pure Borrow simply as a library in Linear Haskell
    and demonstrate its power with a case study in parallel computing. We formalize the core of Pure Borrow and build a metatheory
    that works toward establishing safety, leak freedom and confluence, with a new, history-based model of borrowing.
  abstract_source_url: https://pldi26.sigplan.org/details/pldi-2026-papers/16/Pure-Borrow-Linear-Haskell-Meets-Rust-Style-Borrowing
