  official_record_id: 54f2d437-3d86-4d28-bcac-0c466eb50f75
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Representing bound variables in embedded languages is a challenging problem, often requiring painful trade-offs
    between expressivity and usability. On the one hand, first-order representations using de Bruijn indices have many nice
    properties, but quickly become difficult to read and write. On the other hand, higher-order representations can piggy-back
    on the host language's binders to offer a more ergonomic interface, at a variety of costs depending on the technique.
    The current state-of-the-art is unembedding, i.e. a translation from the higher-order representation to the first-order
    and back again to get the best of both worlds. Unfortunately, the fact that this translation is type-safe relies on external
    metatheoretic arguments, holding unembedding back from its true potential. We solve this problem with a new embedding
    technique that uses instance resolution to define a context-directed isomorphism between an ergonomic higher-order interface
    and a first-order representation. Unlike previous techniques, this also applies to embedded languages with modal and substructural
    (e.g. linear) type systems, making unembedding relevant for modern languages.
