- title: Steering Tree-of-Thought Reasoning via Deductive Verification
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 414ba45a-a835-4761-9da5-c41ce1487080
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) have demonstrated great potential in code reasoning tasks, but their reasoning processes
    lack reliable verification mechanisms, making it difficult to ensure logical correctness. The Tree of Thoughts (ToT) framework
    improves reasoning by exploring multiple paths and employing backtracking, yet its path selection relies entirely on LLM-based
    self-evaluation—a heuristic and error-prone mechanism—leading to frequent erroneous pruning and unproductive exploration.
    We identify a key insight: LLMs’ encoding capability is stronger than their reasoning capability—translating code semantics
    into formal constraints is a pattern-matching task that LLMs can perform reliably, while verification should be delegated
    to SMT solvers. Based on this insight, we propose Deductive Steering, a mechanism that integrates SMT solver verification
    into Tree of Thoughts exploration. It consists of four core components: (1) \emph{Candidate Generator} produces candidate
    reasoning steps, each comprising a natural language thought $t$ and its SMT constraint encoding $\varphi$; (2) \emph{Deductive
    Evaluator} verifies whether a candidate constraint $\varphi$ is a logical consequence of the accumulated constraint $\Phi$
    by checking the unsatisfiability of $\Phi \land \neg \varphi$; (3) \emph{Counterexample Refinement} uses counterexample
    to guide the LLM in correcting its reasoning when verification fails; (4) \emph{Exploration and Backtracking Strategy}
    manages path exploration and backtracks to alternative candidates when verification fails. Experiments on five benchmarks
    covering fault localization, program synthesis, and loop invariant generation show that Deductive Steering improves accuracy
    by 11.4–17.2 percentage points while reducing token consumption by 27–45%. The method generalizes across different LLMs
    and extends to mathematical reasoning, demonstrating broad applicability to domains where reasoning can be encoded as
    formal constraints.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/109/Steering-Tree-of-Thought-Reasoning-via-Deductive-Verification
