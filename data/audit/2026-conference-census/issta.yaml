- title: 'DocPrism: Multi-Lingual Detection of Incorrectness Inconsistencies Between Code and Documentation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: cb8e095b-15ec-439c-8dad-6afea792bf19
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code-documentation inconsistencies are common and undesirable: they can lead to developer misunderstandings and
    software defects. This paper introduces DocCo, a lightweight multi-language, code-documentation inconsistency detection
    tool. DocCo uses a standard large language model (LLM) to analyze and explain inconsistencies, and focuses on outputting
    incorrectness inconsistencies. Plain use of LLMs for this task yields unacceptably high inconsistency flag rates—i.e.,
    over 90% of functions are flagged as inconsistent with their documentation. One substantial reason is that LLMs identify
    natural gaps between high-level documentation and code as incompleteness inconsistencies. We introduce and apply the Local
    Categorization, External Filtering (LCEF) methodology: LCEF uses an LLM’s local completion skills, rather than its long-term
    reasoning skills, to focus on reporting incorrectness inconsistencies. In our ablation study, LCEF reduces DocCo’s inconsistency
    flag rate from 98% to 14%, and increases F1 score from 0.22 to 0.77, compared to standard prompting techniques. On a broad
    evaluation across Python, TypeScript, C++, and Java, DocCo maintains a low flag rate of 17%, and achieves a precision
    of 0.63 without performing any fine-tuning. We also establish a conservative lower bound across four programming languages
    showing that inconsistency errors are present in 11% of code-documentation pairs.'
