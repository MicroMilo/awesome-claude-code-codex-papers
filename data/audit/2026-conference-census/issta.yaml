- title: 'Scitix: Scalable Constraint-Based Type Inference for Code Snippets with Missing Types'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 8f9d9287-410a-4899-a03f-ac5dc51e6665
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Code snippets are commonly used in online developer communities to help communicate ideas and algorithms. However,
    contextual information, like dependencies and the exact types, are often missing in code snippets, which makes their reuse
    difficult. Some of the most successful automated techniques use logical constraints to infer the types and dependencies,
    but they do not work in practice because they require an exact knowledge base that contains all possible dependencies
    and exact types. However, such a knowledge base is both computationally expensive for constraint solving and impossible
    to achieve in the presence of missing types (e.g., user-defined types) in code snippets. To this end, this paper proposes
    a novel, scalable technique named Scitix. Our insight is two-fold. First, inspired by gradual typing, we represent certain
    missing types as Any, ignoring such types during constraint solving, improving performance and scalability. Second, our
    novel, iterative constraint-solving approach saves on computation and skips constraints involving these missing types.
    Our extensive evaluations show that our insights improve both performance and scalability compared to SnR (the state of
    the art). Specifically, Scitix achieves F1-scores of 94.8% and 86.8% on Stack Overflow and generated code snippets, respectively,
    using a large knowledge base of over 3,000 jars. In contrast, SnR consistently times out, yielding F1-scores close to
    0%. Even with the smallest knowledge base, where SnR does not time out, Scitix reduces the number of errors by 77% and
    45% compared to SnR. Compared to state-of-the-art large language models (LLMs) like GPT-4o and LLM-based ZS4C, Scitix
    achieves up to 78% reduction in error rates. Scitix’s strong performance highlights its potential as a practical technique
    for type inference in real-world code snippets.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/33/Scitix-Scalable-Constraint-Based-Type-Inference-for-Code-Snippets-with-Missing-Types
