- title: 'Lingxi: Repository-Level Issue Resolution Framework Enhanced by Procedural Knowledge Guided Scaling'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 37ec2056-be92-4f3c-87df-7537c954b402
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Driven by the advancements of Large Language Models (LLMs), LLM-powered agents are making significant improvements
    in software engineering tasks, yet struggle with complex, repository-level issue resolution. Existing agent-based methods
    have two key limitations. First, they lack of procedural knowledge (i.e., how an issue is fixed step-by-step and rationales
    behind it) to learn and leverage for issue resolution. Second, they rely on massive computational power to blindly explore
    the solution space. To address those limitations, we propose Lingxi, an issue resolution framework that leverages procedural
    knowledge extracted from historical issue-fixing data to guide agents in solving repository-level issues. Lingxi first
    constructs this knowledge offline through a hierarchical abstraction mechanism, enabling agents to learn the how and why
    behind a fix, not just the final solution. During online application, it employs a knowledge-driven scaling method that
    leverages the procedural knowledge of similar issues to intelligently analyze the target issue from multiple perspectives,
    in sharp contrast to undirected, brute-force exploration. Lingxi successfully resolves 74.6% of bugs on the SWE-bench
    Verified benchmark in Past@1 setting, outperforming five state-of-the-art techniques by a significant margin (5.4% to
    14.9%). Our comprehensive ablation study confirmed that the success of Lingxi comes directly from its use of procedural
    knowledge. Without it, the performance gains from scaling alone is negligible. Our qualitative study further shows that
    the ‘‘design patterns & coding practices’’ is the most critical knowledge aspect, and that the roles of different knowledge
    aspects switch across different stages (i.e., analysis, planning, and fixing).
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/179/Lingxi-Repository-Level-Issue-Resolution-Framework-Enhanced-by-Procedural-Knowledge-
