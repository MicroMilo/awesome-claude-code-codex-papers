- title: 'ScratchNet: A Multi-modal Benchmark for Evaluating and Advancing LLMs on Scratch Programming Tasks'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: e6154318-368a-4be8-aa97-9ba47babfe93
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) have achieved impressive performance on text-based programming tasks, yet they remain
    unreliable for block-based languages like Scratch. Scratch programs feature deeply nested, non-linear structures, event-driven
    concurrency across multiple sprites, and tight coupling between code and multimedia assets, properties that are fundamentally
    different from those of textual code. As a result, LLMs frequently misinterpret Scratch semantics and propose large, invasive
    edits that are syntactically valid yet semantically misaligned when repairing buggy programs. We introduce ScratchNet,
    the first executable benchmark designed to systematically evaluate and advance LLM-based repair methods for Scratch programs,
    spanning program understanding, debugging, analysis, and repair. The benchmark comprises 100 carefully curated Scratch
    projects from the public repository, each chosen for high structural and semantic complexity. Every project is paired
    with executable test suites, bug descriptions and corresponding fixes, block-level edit constraints that define minimal
    semantically correct repairs, and associated multimedia assets. We construct the benchmark via a human-in-the-loop pipeline
    that combines automated project mining with expert validation of trigger mechanism–outcome semantics and representative
    bug patterns, with particular focus on event ordering, concurrency, and state management. To enable rigorous and reproducible
    evaluation, we propose a three-layer, executable protocol that measures functional correctness via VM-level execution,
    repair quality in terms of minimality and semantic fidelity using block-level edit distance and behavioral trajectory
    comparisons, and explanation quality through structured rubrics assessing alignment between the model’s reasoning and
    its patch. Using this benchmark, we investigate fundamental research questions such as the impact of domain-specific fine-tuning
    on repair success, the effectiveness of different training data sources, and the ability of models to generalize to unseen
    bug types. Our benchmark establishes a reproducible foundation and a closed-loop framework for evaluating and post-training
    LLMs on block-based programming tasks.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/40/ScratchNet-A-Multi-modal-Benchmark-for-Evaluating-and-Advancing-LLMs-on-Scratch-Prog
