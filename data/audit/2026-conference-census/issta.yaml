- title: Enhancing LLM-based Bug Reproduction via Code Entity Retrieval and Test Case Repair
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 0e17b439-5508-4411-8767-f1bc58cd2e19
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Automated bug reproduction from bug reports is a critical yet challenging step in software debugging. While LLM-based
    bug reproduction shows promise, its effectiveness is often hampered by insufficient contextual awareness of the relevant
    codebase and a tendency to produce invalid test cases. To address these limitations, we propose a novel approach, called
    LTER, that enhances LLM-based bug reproduction through fine-grained code entity retrieval and a feedback-driven dynamic
    repair loop. LTER first identifies specific code entities within bug reports to automatically extract precise contexts,
    including class definitions, constructors, and method logic. The extracted contexts are then used to guide the LLM in
    generating reproduced test cases. To further ensure executability, LTER employs an iterative repair mechanism to resolve
    complex dependencies. Specifically, upon injecting a generated test case into the project, if a compilation failure occurs,
    the framework forwards the error messages to the LLM for an initial repair. Should this initial repair fail, it empowers
    the LLM to analyze diagnostic messages to recognize missing context and retrieve indispensable dependencies, subsequently
    regenerating the test case with the supplemented data. Finally, LTER employs a hybrid cascade ranking strategy to accurately
    select the most effective reproduction test case from the generated candidates. The experimental results on the widely-used
    Defects4J benchmark show that LTER substantially outperforms the best performance in automated bug reproduction, increasing
    the reproduction success rate to 47.1% with successfully identifying a valid reproduction test as the top candidate in
    39.9% of the cases. Furthermore, LTER demonstrates strong generalization capability, delivering robust performance on
    the GHRB dataset containing recent bugs previously unseen by the LLM.
