- title: 'Insecure Coding Preferences in Long-Term Memory: Security Risks for LLM-based Code Generation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 346139ef-0fff-45ef-b6a4-ad510b49a041
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'LLM-based systems are increasingly incorporating long-term memory to improve cross-session continuity and output
    consistency. However, the persistence of long-term memory may introduce additional risks in security-sensitive code generation:
    once insecure coding preferences are stored, they may silently and persistently influence security-critical choices in
    subsequent generations. In this study, we conduct the first systematic empirical study to evaluate the impact of insecure
    coding preferences stored in long-term memory on the security of LLM-based code generation. We study two widely used commercial
    LLMs (i.e., ChatGPT and Gemini) and examine the impact of long-term memory from multiple perspectives. Our results show
    that insecure coding preferences stored in long-term memory significantly increase the risk of generating vulnerable code
    by 11.3%–13.8%. Moreover, they reduce the likelihood that models proactively issue security warnings when producing vulnerable
    code, leading to a 5.4–14.5 percentage-point decrease. Further analysis reveals that these insecure memory entries are
    difficult to overwrite through normal interactions and can broadly influence model outputs even when prompts are phrased
    differently. Finally, we evaluate a mitigation strategy based on explicit security requirements, which reduces vulnerability
    rates by 19.7%–33.6% but may incur a functional performance drop of up to 15.9%. Based on these findings, we provide actionable
    suggestions to improve the security of long-term memory in LLM-based code generation.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/79/Insecure-Coding-Preferences-in-Long-Term-Memory-Security-Risks-for-LLM-based-Code-Ge
