- title: Understanding and Improving Model Editing for Secure Code Generation
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: fcd198a8-91de-4543-8337-2f7a170bc566
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large language models (LLMs) are widely used for code generation, yet they can reproduce vulnerable code implementations
    learned from insecure patterns in training data. Prior work has primarily explored \emph{inference-time hardening} to
    reduce insecure generations without updating the target model. While effective, this paradigm couples security behavior
    to the auxiliary component and incurs additional runtime overhead. This paper presents the first systematic empirical
    study of applying \emph{model editing} as the \emph{model-level} hardening mechanism for secure code generation. Unlike
    inference-time interventions, model editing updates a small subset of parameters to inject security-relevant knowledge
    directly into the target LLM. We evaluate 3 state-of-the-art editing methods across diverse LLM families and compare them
    with CoSec, a representative inference-time hardening approach, focusing on: (i) security effectiveness and robustness,
    (ii) generalization to unseen vulnerabilities, and (iii) functional correctness on general programming tasks. Our results
    show that model editing yields substantially larger security gains than CoSec on seen vulnerability types, improving security
    ratios by 15%–25% over vanilla models, and these gains remain stable under prompt perturbations. However, security improvements
    do not always transfer reliably to unseen vulnerabilities and induce functional regressions on general programming tasks,
    even for UltraEdit, the best-performing editing method in our evaluation. To mitigate this side effect, we propose SafeEdit,
    an effective post-edit refinement method that combines functional tuning with edit-aware regularization, which improves
    Pass@1 by 44.40%–156.07% over UltraEdit and largely preserves (and even improves) security. Moreover, SafeEdit and CoSec
    are complementary: combining them can further improve security under stochastic decoding while maintaining strong functional
    correctness. Finally, we analyze efficiency and key design factors, showing that model editing is more efficient than
    CoSec and sensitive to editing depth, parameter location, and injected context. Overall, our work provides evidence-backed
    guidance for applying model editing to secure code generation.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/163/Understanding-and-Improving-Model-Editing-for-Secure-Code-Generation
