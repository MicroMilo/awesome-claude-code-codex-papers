- title: Do Large Language Models Understand Code like Humans?
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 679075fd-bd28-45b8-a005-5b5bf03fc44e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code understandability is a critical aspect of software quality. Prior research has largely focused on this attribute
    from a human-centric perspective, while it should be viewed as a relational property arising from the interaction between
    a reader and the code. With the increasing adoption of large language models (LLMs) in software engineering, we posit
    that the notion of “reader” should be generalized to encompass both humans and models. Building on this relational perspective,
    we extend the concept of code understandability to distinguish between human and model code understandability, aiming
    to investigate the alignment between the two. To this end, we use a dataset from a prior study containing human-rated
    judgments of understandability across diverse participant groups, and evaluate multiple open and closed-source LLMs. To
    operationalize model code understandability, we introduce four proxies: P0, based on program comprehension-focused question
    answering; and P1–P3, based on program intent summarization (derived from our proposed semantic self-consistency). Our
    findings show that LLMs exhibit stronger alignment with general human code understandability than previously used shallow
    machine learning baselines. Stratified analyses further reveal that model code understandability aligns most closely with
    professional developers, but significantly less with other student groups. Role-conditioned prompting does not improve
    the alignment for the latter, suggesting that current LLMs cannot accurately mimic the perspectives of human readers with
    varying expertise. Finally, we demonstrate that semantic self-consistency is a reliable and extensible measure for quantifying
    model code understandability, with broad implications in both software engineering research and practice.'
