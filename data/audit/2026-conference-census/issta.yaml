- title: 'LLMutantKiller: Using Large Language Models to Generate Tests that Kill Mutants'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 6a375378-8fd8-4bcf-884c-e07980c1977f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The primary goal of mutation testing is to assess the quality of an application’s test suite. This is accomplished
    by introducing syntactic changes into a program and determining if any test failures occur for the resulting mutated program,
    commonly referred to as a mutant. If so, the mutant is said to be killed, confirming that the test suite is of sufficient
    quality to detect the introduced fault. A problem arises if a mutant does not impact the behavior of any test. Such a
    surviving mutant may occur for two reasons: either it involves a semantics- preserving program transformation or the test
    suite is not strong enough. Determining why a mutant survives often involves complex, non-local reasoning. This paper
    presents an LLM-based test generation technique for killing surviving mutants, implemented in a tool called LLMutantKiller.
    The technique is feedback-directed in the sense that if a test is produced that does not kill a given mutant, the LLM
    is re-prompted up to a specified number of times with scenario-specific feedback such as syntax errors, dependency violations,
    or execution logs (e.g., failing assertions) and asked to try again. We evaluate LLMutantKiller on 915 randomly selected
    surviving mutants that were produced by StrykerJS, a state-of-the-art mutation testing tool, taken from 13 open-source
    JavaScript/TypeScript applications. The results show that LLMutantKiller kills up to 95.3% of the surviving mutants classified
    as inducing behavioral changes and that it rarely produces invalid tests.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/7/LLMutantKiller-Using-Large-Language-Models-to-Generate-Tests-that-Kill-Mutants
