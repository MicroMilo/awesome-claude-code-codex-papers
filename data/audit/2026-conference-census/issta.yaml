- title: Uniting Bounded Verification and Transformer-Based Learning for Proactive IoT Security
  official_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/38/Uniting-Bounded-Verification-and-Transformer-Based-Learning-for-Proactive-IoT-Securit
