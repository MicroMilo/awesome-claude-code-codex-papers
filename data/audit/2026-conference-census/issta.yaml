- title: 'Sifting the Noise: A Comparative Study of LLM Agents in Vulnerability False Positive Filtering'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: ee837fe7-56cb-48d7-92f6-13e84442fa5b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Static Application Security Testing (SAST) tools are essential for identifying software vulnerabilities, but
    they often produce a high volume of false positives (FPs), imposing a substantial manual triage burden on developers.
    Recent advances in Large Language Model (LLM) agents offer a promising direction by enabling iterative reasoning, tool
    use, and environment interaction to refine SAST alerts. However, the comparative effectiveness of different LLM-based
    agent architectures for FP filtering remains poorly understood. In this paper, we present a comparative study of three
    state-of-the-art LLM-based agent frameworks, i.e., \textsc{Aider}, \textsc{OpenHands}, and \textsc{SWE-agent}, for vulnerability
    FP filtering. We evaluate these frameworks using the vulnerabilities from the OWASP Benchmark and real-world open-source
    Java projects. The experimental results show that LLM-based agents can remove the majority of SAST noise, reducing an
    initial FP detection rate of over 92% on the OWASP Benchmark to as low as 6.3% in the best configuration. However, the
    benefits of agents are strongly backbone- and CWE-dependent: agentic frameworks significantly outperform vanilla prompting
    for stronger models such as Claude Sonnet 4 and GPT-5, but yield limited or inconsistent gains for weaker backbones. Moreover,
    aggressive FP reduction can come at the cost of suppressing true vulnerabilities, highlighting important trade-offs. Finally,
    we observe large disparities in computational cost across agent frameworks. Overall, our study demonstrates that LLM-based
    agents are a powerful but non-uniform solution for SAST FP filtering, and that their practical deployment requires careful
    consideration of agent design, backbone model choice, vulnerability category, and operational cost.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/9/Sifting-the-Noise-A-Comparative-Study-of-LLM-Agents-in-Vulnerability-False-Positive-
