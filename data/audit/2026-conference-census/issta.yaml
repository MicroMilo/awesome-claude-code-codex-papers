- title: Defusing Logic Bombs in Symbolic Execution with LLM-Generated Ghost Code
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0cb00c73-249f-4a85-9ad0-cbcf2076f37b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Symbolic execution is a powerful program analysis technique, but its effectiveness is fundamentally limited by
    solver-hostile program fragments, complex numerical reasoning, and unbounded heap structures. Recent work proposed replacing
    constraint solvers with large language models (LLMs) to bypass these limitations, but such approaches struggle to analyze
    real-world codebases, where deep execution paths require globally consistent reasoning across many interacting constraints.
    We present Gordian, a hybrid symbolic execution framework that uses LLMs selectively to generate lightweight ghost code
    that aids an SMT solver in handling solver-hostile code fragments, while preserving its precise, global reasoning capability.
    In particular, we propose three types of ghost code: (1) inversion of difficult code fragments with iterative bidirectional
    constraint propagation, (2) modeling via solver-friendly surrogates while preserving relevant behavior, and (3) semantic
    partitioning of unbounded heap spaces. We implemented Gordian on top of the KLEE symbolic execution engine and evaluated
    it on synthetic “logic bombs” capturing distinct symbolic reasoning challenges, a popular mathematical library FDLibM,
    and three structured-input programs (libexpat, jq, and bc). Across all benchmarks, Gordian improves coverage on average
    by 52-84% over traditional symbolic execution baselines, and by 86-419% over LLM-based techniques, while reducing LLM
    token usage by an average of 90-96%. This highlights the practicality and effectiveness of this approach in real-world
    settings.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/35/Defusing-Logic-Bombs-in-Symbolic-Execution-with-LLM-Generated-Ghost-Code
