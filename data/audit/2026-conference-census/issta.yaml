- title: 'Checked-In Secret Detection: Strings are All You Need'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 1d0ca4e5-3bd0-453d-a0eb-a0bdf18968c0
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Hardcoded secrets in source code pose critical security vulnerabilities which can be easily exploited by malicious
    adversaries. Existing regex-based detection approaches suffer from fundamental limitations, as secrets often lack identifiable
    patterns, resulting in poor precision and recall. Recent studies have explored context-aware detection methods, as surrounding
    code can reveal the purpose of candidate strings. However, these methods confront three key challenges: (1) obfuscation
    robustness where models over-rely on easily obfuscated identifiers, (2) cross-language generalization difficulties due
    to uneven training data distribution, and (3) lengthy and noisy context that introduces excessive irrelevant tokens and
    slows inference. We observe that strings serve as a critical information source for code semantics, offering superior
    contextual density, obfuscation robustness, and language independence. Based on this insight, we propose StringGroup,
    a novel context extraction algorithm that mines strings surrounding potential secrets. With only 33.2% of the original
    context, it preserves over 80% of semantic information and significantly improves the signal-to-noise ratio for secret
    detection. We further design a context-aware secret detection tool, Secretron, based on StringGroup methods and Transformer
    model. Evaluation on the SecretBench dataset demonstrates high accuracy with 98.74% F1-score and strong robustness under
    obfuscation and cross-language scenarios, outperforming state-of-the-art LLM-based baselines. We deploy our tool in real-world
    environments and successfully detect 48 previously unknown secret keys from 26 applications, demonstrating the practical
    effectiveness of our approach.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/116/Checked-In-Secret-Detection-Strings-are-All-You-Need
