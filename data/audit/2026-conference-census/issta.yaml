- title: How Does Killing Surviving Mutants Help Detect Real Bugs with Assertion Generation? A Controlled Experiment
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 260310d3-cbba-4f0a-ba04-fb9963d97a94
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Killing surviving mutants is a central activity of mutation testing. This activity is motivated by the coupling-effect
    hypothesis: tests that expose simple artificial faults can also detect more complex, previously unseen real bugs. Despite
    these claimed benefits, automated studies have not directly measured the causal impact of mutant killing on real-bug detection.
    This limitation stems from open-ended mutant-killing strategies and a fundamental evaluation asymmetry that obscures causal
    attribution. In this work, we present the first large-scale controlled experiment that directly measures whether killing
    surviving mutants, without knowledge of future real bugs, would have enabled their detection. We model mutant killing
    as a selective, incremental process under realistic budget constraints, and we restrict test improvements to assertion
    augmentation. This restriction enables precise attribution of each test augmentation to a specific mutant-killing action.
    To support the experiment, we design a fully automated, fault-based assertion-augmentation technique that operates uniformly
    on mutants and real bugs and integrate it into Defects4J. Our controlled experiment yields several key empirical insights:
    (1) Across 642 Defects4J bugs, we find that 104 bugs would become detectable by adding an additional assertion to an existing
    passing, non-triggering test. (2) When coupling exists, a real bug is, on average, coupled with 21 surviving mutants,
    through which mutant killing can produce triggering tests. This number is substantially higher than the average of two
    mutants reported in prior studies. In those studies, coupling is inferred solely from documented bug-fixing tests rather
    than from tests derived via mutant killing. (3) Among these bugs, 63 of the 104 are detectable through principled mutant-killing
    (test augmentation) process. Notably, killing a randomly selected 30% of relevant surviving mutants, using only one assertion
    per mutant, suffices to detect 84.5% of these bugs. (4) By substituting mutants with real bugs and comparing their resulting
    assertion augmentation outputs, we find that real bugs induce broader behavioral effects than mutants, affecting more
    memory state locations, variables, and tests. (5) When mutation-derived assertions detect real bugs, they validate program
    outputs that overlap with, and are often strict subsets of, those affected by the real bugs. This offers a mechanistic
    explanation for why killing simple mutants can enable the detection of more complex real bugs.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/141/How-Does-Killing-Surviving-Mutants-Help-Detect-Real-Bugs-with-Assertion-Generation-A
