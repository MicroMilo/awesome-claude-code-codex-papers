  official_record_id: 93d772e0-b7f1-4c19-9823-5f67a28fc3d6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The transition from human-centric assistance to Autonomous Software Engineering (ASE) agents has enabled the
    resolution of complex real-world SE tasks. However, the trial-and-error nature of these agents generates lengthy interaction
    trajectories, creating severe bottlenecks in terms of context window limits and cost. While context compression offers
    a potential remedy, prior approaches suffer from static pruning strategies and granularity mismatches, often failing to
    preserve the semantic dependencies and syntactic details crucial for SE tasks. To strictly preserve critical task evidence
    while reducing context length, we introduce AttnCompress, a dynamic attention-guided trajectory compression framework.
    Unlike existing approaches, AttnCompress bridges the gap between semantic integrity and dynamic adaptability through three
    key mechanisms: (1) structure-aware segmentation via perplexity (PPL) spikes to preserve the syntactic structure of code
    and logs; (2) relevance estimation using proxy attention weights to quantify the precise relevance of historical blocks
    to the agent’s current reasoning; and (3) a dynamic rolling window to re-evaluate and recall historical context as the
    task evolves. Extensive evaluation on SWE-Bench-Verified and Multi-SWE-Bench demonstrates that AttnCompress achieves a
    pass rate of 53.17%, outperforming prior state-of-the-art baselines while reducing token consumption by 26.1% and total
    costs by 35.1%. The framework proves to be model-agnostic and generalizes effectively across diverse programming languages.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/58/AttnCompress-Dynamic-Attention-Guided-Trajectory-Compression-for-Software-Engineerin
