- title: 'Beyond Similarity Scores: Evidence-Based Third-Party Library Detection for C/C++ Binaries'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 93bc3932-26c7-43c5-828d-bba78fe75c7a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Detecting third-party libraries (TPLs) in C/C++ binaries is essential for software supply chain security, enabling
    vulnerability identification and license compliance. Existing methods predominantly rely on similaritymatching: extracting
    features from binaries and comparing them against library databases. However, similarityscores alone cannot reliably determine
    library presence. Low similarity causes false negatives when matchablefeatures are limited. More critically, high similarity
    does not guarantee accuracy: libraries often share featuresthrough shared dependencies, forks, or similar functionality,
    causing multiple candidates to match even whenonly one is present. These issues suggest that similarity matching is effective
    for narrowing candidates butinsufficient as the final decision mechanism. Rather than relying solely on similarity scores,
    reliable detectionrequires multi-source evidence to verify each candidate. To this end, we propose BLADE, which reframes
    TPL detection as evidence-based candidate verification.Instead of relying on similarity scores to make final decisions,
    BLADE retrieves candidates broadly to mitigatefalse negatives, and then collects evidence from multiple sources, which
    an LLM analyzes through structuredverification workflows to filter false positives: first confirming candidates with clear
    identity markers, thensystematically checking remaining candidates against common false positive patterns. To evaluate
    BLADE,we build the largest C/C++ binary TPL benchmark to date, comprising 3,403 binaries and 1,016 libraries.Results show
    that BLADE achieves 97.60% precision and 93.74% recall (F1: 95.63%), improving F1-score by 41.83percentage points over
    the best baseline. The average cost is $0.0378 per binary. BLADE has been deployed ina commercial software composition
    analysis product, demonstrating practical feasibility at scale.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/34/Beyond-Similarity-Scores-Evidence-Based-Third-Party-Library-Detection-for-C-C-Bina
