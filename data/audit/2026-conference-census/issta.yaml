- title: 'COEUR : COhesion and Exhaustiveness of User stories Representations'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: a17e5dc2-9f96-464c-974c-04993210ef66
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'User Stories are key artifacts in Requirement and Software Engineering. Despite their wide adoption, their writing
    in industrial contexts tends to diverge from the principles initially stated in Agile methodologies. In this context,
    sets of metrics such as INVEST or QUS emerged to qualify these items. In this paper, we argue that the said sets of metrics
    are only partially efficient at capturing the quality of user stories contextualized in a project, and that their actual
    adoption in business contexts is limited due to multiple aspects: their unfitness to specific contexts, the difficulty
    of implementation requiring human intervention, the absence of reproducibility or their misalignment with actual quality
    of user stories. Such limitations, prevent practitioners from efficiently applying them for downstream tasks such as LLM-based
    user story generation. To address these challenges, we introduce COEUR , a framework comprising two metrics: Cohesion
    and Exhaustiveness . These metrics are designed to mirror core Product Owner responsibilities. Specifically, Cohesion
    evaluates the structural organization and logical grouping of the backlog, while Exhaustiveness monitors the semantic
    alignment between the elicited needs and the proposed technical solutions. Aditionnaly, they are quantitative, reproducible,
    and automatically computable. To evaluate COEUR , we conduct four empirical experiments organized into two validation
    tracks. The first track utilizes two noising-based experiments to assess our metrics sensitivity to requirement degradation.
    The second track evaluates their performance in generative contexts through two standard learning paradigms for LLM: In-Context
    Learning (ICL) and Supervised Fine-Tuning (SFT), both applied to our user story generation task. Subsequently, COEUR provides
    a turnkey measurement of Product Backlog’s quality for both project monitoring by human experts and LLM benchmarking applied
    to automatic user stories generation.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/106/COEUR-COhesion-and-Exhaustiveness-of-User-stories-Representations
