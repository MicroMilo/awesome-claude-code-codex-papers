  abstract_reason: Official abstract fetched.
  abstract: Binary Code Similarity Detection (BCSD) is a foundational capability in software security, underpinning critical
    applications ranging from vulnerability detection to malware analysis. While recent tools based on Machine Learning (ML)
    have achieved significant performance improvements, their efficacy is heavily contingent upon the underlying code representation.
    Through a systematic literature review of ML-based BCSD papers, we find that existing approaches typically leverage linear
    sequences or adopt graph-based representations, with the latter constituting the majority (77%). Despite this prevalence,
    there is no consensus on which graph representation yields superior effectiveness. Existing works usually couple graph
    construction with customized learning backbones and evaluate them on inconsistent benchmarks. This makes isolating the
    representation’s impact difficult. Consequently, \textit{determining which graph topology truly captures the robust semantics
    of binary code remains an unsolved problem}. In this paper, we present the first systematic study of graph representations
    for ML-based BCSD to bridge this gap. Specifically, we implement a modular evaluation framework that decouples graph construction
    from model training. Using this framework, we systematically evaluate seven representative graph representations, finding
    that no single representation is universally dominant, as distinct topologies exhibit unique strengths depending on the
    evaluation scenario. We further investigate their combination effectiveness in N-day vulnerability detection and employ
    a tailored interpretability tool, which demonstrates that models trained on data-centric representations primarily focus
    on sparse semantic cores while those learning from control-centric graphs depend on global connectivity.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/167/Revisiting-Graph-Representations-for-ML-based-Binary-Code-Similarity-Detection-A-Sys
