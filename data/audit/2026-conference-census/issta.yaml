- title: How Much Static Structure Do Code Agents Need? A Study of Deterministic Anchoring
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 41952d85-b69e-43e3-9093-aa03f0335441
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'LLM-based code agents navigate repositories through keyword search but miss the structural relationships, such
    as call graphs, inheritance hierarchies, and configuration dependencies, that define how software actually works. This
    makes agent navigation stochastic and difficult to reproduce across runs. We investigate whether lightweight static analysis
    can provide deterministic anchors for these agents: stable structural facts injected as plain-text comments that constrain
    probabilistic exploration and make navigation more predictable. Starting from a strong baseline, Codex from OpenAI, we
    systematically inject varying granularities of structural annotations and measure their effects on localization, trajectory
    behavior, and run-to-run stability. Our study identifies what we call the deterministic anchoring effect: static structure
    helps less by making agents “smarter” and more by making their navigation disciplined and reproducible. Three observations
    support this finding: ❶ Anchoring works: lightweight call/inheritance topology improves function-level localization (+2.2pp
    Func@5) and shortens trajectories (−1.6 interaction rounds) with minimal overhead (<10% tokens); ❷ Anchoring is scale-sensitive:
    the optimal granularity and directionality depend on repository characteristics, where denser semantics show diminishing
    returns and hub-heavy projects benefit from inverse-only links that expose “who-calls-me” without forward edges; ❸ Anchoring
    stabilizes: tags increase the link-following rate from 0.15–0.18 to 0.21–0.24 and roughly halve run-to-run variance on
    medium-scale repositories. These observations suggest practical guidelines: default to lightweight topology on medium
    projects, prune forward edges in large repositories, and reserve dense tags for implicit-dependency cases. Code and traces
    are available in our repositories: https://anonymous.4open.science/r/CodeAnchor-Impl-8CA2 .'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/24/How-Much-Static-Structure-Do-Code-Agents-Need-A-Study-of-Deterministic-Anchoring
