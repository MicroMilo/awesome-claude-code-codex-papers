- title: 'Beyond the Surface: Towards Feature-Driven Fuzzing on the Chrome Browser'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 60f6010d-4e45-4d5a-83aa-767e380c2a3d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Modern web browsers constitute complex software systems responsible for processing and rendering diverse web content.
    Despite extensive testing and security measures implemented by browser vendors and the community, the inherent complexity
    of these systems makes the complete elimination of vulnerabilities practically infeasible. Existing DOM and API fuzzing
    techniques inadequately address the expanded attack surface introduced by modern browser features and extensions, resulting
    in a substantial number of elusive vulnerabilities remaining undetected. This paper presents Feazzer, an efficient feature-driven
    browser fuzzing framework designed to detect elusive vulnerabilities introduced by browser features. Our approach leverages
    hybrid programs comprising HTML and browser extensions with systematically clustered feature options to explore deep browser
    states that existing fuzzers fail to reach. We introduce a message-guided fuzzing mechanism that reduces feature conflicts
    and enhances the semantic quality of generated test cases. Our comprehensive evaluation across multiple Chromium versions
    demonstrates that Feazzer achieves up to 231.1% improvement in code coverage compared to state-of-the-art fuzzers. Feazzer
    has discovered 39 previously unknown bugs in Chromium, with 6 assigned CVEs and acknowledgment of over $55,000 in bug
    bounties from the vendor. Notably, 2 bugs are rated as critical and 27 as high severity, demonstrating the effectiveness
    of Feazzer in discovering impactful bugs.
