- title: 'Toward Secure Code Generation: Bridging Correctness and Security via Task-Adaptive Vulnerability Modeling and Execution-Based
    Benchmarking'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 6286e725-793f-43dd-ad65-49d5cd319cbf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) are increasingly used for program synthesis, yet they often generate code that is
    functionally plausible but insecure. Progress in secure code generation has been hindered by benchmarks that are small,
    non-executable, leak mitigation details, or rely on noisy analyzers and subjective judgments, making it difficult to measure
    whether security improves without sacrificing correctness. We address these gaps with CodeSecEval, an execution-based
    benchmark for secure code generation, comprising 255 Python tasks spanning 77 CWE categories. Each task provides paired
    insecure and secure implementations together with executable functional and vulnerability-targeted security tests, enabling
    precise and reproducible evaluation of secure code generation and insecure-code repair. Building on CodeSecEval, we propose
    SecAwareCoder, an agent-based framework that shifts code generation toward secure-by-construction synthesis. SecAwareCoder
    performs task-adaptive threat modeling to identify security-sensitive regions and derive task-grounded vulnerability hypotheses,
    uses these hypotheses to guide both constraint-aware code generation and security-aware test synthesis, and leverages
    execution feedback for targeted refinement. Experiments across multiple LLM backbones show that SecAwareCoder consistently
    improves Pass@1 and security robustness over prompting and analyzer-driven baselines, narrowing the security–correctness
    gap in LLM code generation.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/68/Toward-Secure-Code-Generation-Bridging-Correctness-and-Security-via-Task-Adaptive-Vu
