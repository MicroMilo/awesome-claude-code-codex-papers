  abstract_reason: Official abstract fetched.
  abstract: As WebAssembly (Wasm) expands from web applications to high-performance domains, the standard optimizer, wasm-opt,
    is critical but frequently suffers from missed optimizations (MOs). This paper presents an experience report on detecting
    MOs in wasm-opt and understanding their root cause through the lens of Wasm’s tree-structured intermediate representation
    (tree IR). To this end, we adapt an established marker-based technique from C compilers, overcoming the constraints of
    Wasm’s structured control flow via a novel structure-aware instrumentation strategy. Complementing this, we design a cross-optimization
    differential testing strategy leveraging the monotonicity of optimization levels as an oracle. Together, these strategies
    enable the systematic identification of fine-grained MOs that are overlooked by existing cross-architecture methods. Our
    evaluation uncovered 24 distinct MOs (20 fixed), demonstrating the high actionability and effectiveness of our approach.
    Beyond detection, our root cause analysis reveals how wasm-opt’s tree IR and other design choices constrain its optimization
    potential. We conclude with architectural considerations and future directions for wasm-opt and similar optimizers.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/85/Finding-and-Understanding-Missed-Optimizations-in-WebAssembly-Optimizer-Experience-P
