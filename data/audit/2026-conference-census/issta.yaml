- title: 'RICE: Harnessing LLMs and Historical Issues to Discover Internal Rust Compiler Errors'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: bd60da02-efdf-49f9-bac3-3145aed7e87c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Rust is a modern system-level programming language that emphasizes safety, concurrency, and performance. Ensuring
    the reliability of the Rust compiler is critical, as undetected compiler defects, particularly internal compiler errors
    (ICEs), can lead to runtime crashes or undefined behavior in system software. Existing compiler testing methods, including
    generation-based, mutation-based, and recent LLM-driven approaches, are limited in their ability to systematically uncover
    ICEs triggered by advanced language features or complex code interactions. In this paper, we propose RICE, an LLM-assisted
    Rust compiler testing approach that generates test cases by adapting defect-prone patterns extracted from historical ICE
    issues to diverse code contexts in the official test suite. RICE features simplification-guided identification of defect-prone
    patterns and context-aware adaptation of patterns to maintain compilability and meaningful semantic interactions. Applied
    to multiple recent Rust compiler releases, RICE discovered 37 ICEs, including 15 previously unknown zero-day bugs, outperforming
    existing testing tools in code coverage and ICE discovery. Our results demonstrate that systematically leveraging historical
    defect-prone patterns enables more effective testing, accelerates bug fixing, and enhances regression testing in Rust
    compilers.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/186/RICE-Harnessing-LLMs-and-Historical-Issues-to-Discover-Internal-Rust-Compiler-Errors
