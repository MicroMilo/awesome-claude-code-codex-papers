  abstract: 'Standardized token contracts (e.g., ERC-20) form the foundation of digital assets. However, attackers increasingly
    abuse this standardization to disguise malicious trap tokens. Unlike obvious violations, these contracts employ a strategy
    of “deceptive adherence”: they strictly adhere to standard protocols to evade detection, while embedding covert logic
    to defraud users. To address this, we first systematize the trap landscape by proposing a novel taxonomy derived from
    the intrinsic functional lifecycle of tokens (Generation, Circulation, Persistence, and Observation). We then propose
    TrapHunter, an end-to-end framework designed to identify these traps and expose covert pathways within these deceptive
    contracts via intent deviation analysis. Specifically, TrapHunter introduces a unified semantic representation combining
    Abstract Behavior Trees (ABTs) and Augmented Path Graphs (APGs) to normalize intra-procedural syntax and reveal the hidden
    execution paths driven by inter-procedural state dependencies. Crucially, it bridges the semantic gap by leveraging LLMs
    to reason about the behavioral intent of deviations from reference implementations, followed by a fork-based dynamic validation
    to confirm exploitability. Experimental evaluations on 269 real-world contracts with three LLMs (DeepSeek, GPT, and Gemini)
    demonstrate that TrapHunter effectively detects all six categories of traps, achieving an average precision of 81.8% and
    recall of 85.4%, significantly outperforming state-of-the-art tools.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/15/TrapHunter-Exposing-Covert-Pathways-in-Trap-Token-Contracts
