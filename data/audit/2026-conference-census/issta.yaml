  full_text_scan: metadata-filtered
  official_record_id: a05b53a9-96ad-48b0-a8a8-968196e18a0e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Deep learning (DL) techniques are increasingly integrated into traditional software systems, giving rise to hybrid
    AI-enabled systems that combine neural models with program logic. While these systems exhibit remarkable capabilities,
    their complex and heterogeneous architectures pose significant challenges for reliability and testing, particularly in
    safety-critical domains such as autonomous driving. Existing testing approaches either target traditional code or isolate
    neural networks, overlooking failures arising from their interactions. In this paper, we present Neude, a lightweight
    and extensible coverage-guided fuzzing framework specifically designed for hybrid AI-enabled systems. Unlike existing
    tools, Neude combines observations of program execution and neural model coverage to guide input mutations toward unexplored
    state spaces, enabling systematic evaluation of the entire hybrid pipeline. Moreover, Neude employs domain-aware mutation
    operators coupled with metamorphic relations, allowing automated bug detection without manual assertions. We evaluate
    Neude on Pylot, a complex autonomous driving system with tightly coupled neural and program components. Experimental results
    show that Neude uncovers diverse faults, and further analysis reveals how model uncertainty propagates through deterministic
    program logic to trigger downstream module failures. Our findings highlight the fragility of current hybrid architectures,
    calling for a paradigm shift from model-centric testing to system-centric quality assurance that accounts for the intricate
    interplay between neural and procedural components.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/114/Fuzzing-the-Boundary-Between-Models-and-Code-in-Hybrid-AI-enabled-Systems
