- title: 'SWE-PDB: Teaching LLMs to Leverage Debugging Tools via Agentic Training'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: c9b53d39-8f33-4e8b-ae5a-d4d9214250d3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Interaction with debugging tools enables large language models (LLMs) to reason over concrete runtime states,
    rather than relying solely on static analysis of source code. Specifically, with the help of a debugger, an LLM-based
    agent can observe actual program execution by inspecting intermediate variable states and stepping through the control
    flow. These runtime observations enable the model to better understand program behavior and identify the root causes of
    bugs. Despite these advantages, using debuggers correctly and effectively remains challenging for many models because
    debugger interaction is inherently stateful and requires executing complex, long-horizon action sequences. As a result,
    models often exhibit unproductive interactions in which the debugger is underutilized or even disrupts the debugging process.
    To address this challenge, we propose \textbf{SWE-PDB}, the first training-based framework that teaches LLMs to leverage
    debuggers for interactive debugging and program repair. Our approach constructs large-scale buggy Python instances with
    verified failing tests from diverse sources and synthesizes multi-turn interactive debugging trajectories that follow
    structured debugging workflows. To ensure data quality, we apply multi-stage trajectory filtering and refinement, and
    train models using agentic supervised fine-tuning to learn effective debugger behaviors, followed by agentic reinforcement
    learning with rule-based rewards to improve generalization and promote more strategic debugger usage. Extensive evaluations
    across diverse benchmarks demonstrate substantial gains. In particular, \textbf{SWE-PDB-14B achieves 38.0% accuracy on
    SWE-bench Verified} with complete test suites, more than tripling the base model’s performance, while improving interaction
    efficiency and exhibiting robust, meaningful debugger usage.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/26/SWE-PDB-Teaching-LLMs-to-Leverage-Debugging-Tools-via-Agentic-Training
