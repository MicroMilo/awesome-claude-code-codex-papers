- title: 'SEDCoT: Enhancing LLM-Based COBOL Code Translation via Symbolic Execution and Delta Debugging'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: ab9d4ce6-182a-4963-bb86-245c1ff3d451
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: COBOL, as a representative legacy programming language, has been widely adopted in sectors such as banking, insurance,
    and government infrastructure. Maintaining COBOL code has become increasingly challenging due to outdated technologies,
    sparse documentation, and the retirement of original developers, which creates a pressing need to translate COBOL code
    into mainstream programming languages such as C. However, the unique grammar and semantics of COBOL make rule-based translation
    difficult to understand and maintain. Furthermore, translation performance using large language models (LLMs) is suboptimal
    compared to other programming languages, as COBOL is low-resource and exhibits distinct logical and behavioral patterns.
    To address these challenges, we propose a novel COBOL translation framework, SEDCoT. In SEDCoT, we first leverage large
    language models (LLMs) to translate COBOL code into the target programming language. Next, we employ a combination of
    symbolic execution and LLMs to generate test cases for the translated code and to repair any errors detected. Finally,
    we apply delta debugging to simplify test cases that are difficult to fix, thereby guiding LLMs to perform more effective
    code repairs. We conduct a comprehensive evaluation of SEDCoT on a public COBOL-to-C dataset. The experimental results
    show that SEDCoT outperforms state-of-the-art methods by at least 12%, demonstrating its effectiveness. Furthermore, our
    readability evaluation indicates that code translated by SEDCoT exhibits substantially higher readability compared to
    rule-based translation methods.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/168/SEDCoT-Enhancing-LLM-Based-COBOL-Code-Translation-via-Symbolic-Execution-and-Delta-D
