- title: 'BCaLLM: Call Graph-Guided Python Breaking Change Detection with Large Language Models'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 9791bf57-66f5-4e85-8f68-3dd29fbd82cd
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Software libraries frequently evolve, introducing breaking changes that disrupt client applications. Existing
    detection approaches primarily target static programming languages or focus on syntactic changes, leaving behavioral breaking
    changes in dynamic languages such as Python underexplored. This task is particularly challenging due to two critical factors
    often overlooked in existing Python-centric research: side effects and call relationships, which implicitly alter API
    behaviors and propagate change impact. To address these challenges, we propose a generalized taxonomy of function API
    breaking changes. Grounded in Hyrum’s Law, our taxonomy is defined from the client’s perspective of observable behaviors
    and unifies both syntactic and behavioral categories in a multi‑label formulation. Furthermore, we present BCaLLM, a novel
    framework to detect fine-grained \underline{b}reaking \underline{c}hanges in Python packages by leveraging c\underline{a}ll
    graphs and \underline{l}arge \underline{l}anguage \underline{m}odels (LLMs). BCaLLM constructs a fused call graph to scope
    change impact, prunes compatible APIs and code context via memory‑based heuristics, and employs an LLM to detect specific
    breaking changes. We construct PyBCEval, a manually annotated benchmark of 588 APIs from 27 version pairs of 19 widely
    used Python packages. Experiments with diverse LLMs show that BCaLLM outperforms text-based baselines by 3.71%-10.16%
    and LLM-based baselines by 1.60%-4.83% in F1-score.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/104/BCaLLM-Call-Graph-Guided-Python-Breaking-Change-Detection-with-Large-Language-Models
