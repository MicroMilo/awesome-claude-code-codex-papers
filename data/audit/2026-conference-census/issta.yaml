- title: 'Code-MUE: Measuring Code LLM'' Uncertainty through Execution-based Semantic Interaction Graphs'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 8b596313-4b5f-4ca3-867e-f309998f82c9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'As Code Large Language Models (LLMs) become central to modern software engineering, their inherent stochasticity
    poses significant real-world risks, where even minor errors can lead to severe functional, security, or safety consequences.
    Reliable automation, therefore, demands the ability to distinguish between confident, well-supported predictions and stochastic
    guessing. However, existing uncertainty estimation methods face a critical gap: white and grey-box techniques are often
    inapplicable to closed-source models, while standard “black-box” text metrics fail to capture the unique fragility of
    code, where syntactic variation does not always imply semantic divergence. To bridge this syntax-semantics gap, we introduce
    Code-MUE, a purely black-box framework that measures uncertainty through execution-based Semantic Interaction Graphs.
    Unlike prior approaches that rely on superficial textual similarity, Code-MUE grounds uncertainty in observable runtime
    behavior, calculating the Von Neumann entropy of the solution space to quantify global semantic diversity. A large-scale
    empirical study across eight state-of-the-art LLMs demonstrates that Code-MUE achieves a strong negative correlation with
    functional correctness (Spearman’s correlation up to -0.98), significantly outperforming lexical and embedding-based baselines
    while enabling robust risk detection and selective prediction in practical workflows.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/185/Code-MUE-Measuring-Code-LLM-Uncertainty-through-Execution-based-Semantic-Interactio
