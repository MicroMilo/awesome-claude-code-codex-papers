- title: 'AgentInspect: Diagnosing Behavioral Failures in Artificial Intelligence Agents'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0c821c5b-6ed7-4f54-8a69-44e4f4d3f44c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Effectively testing Artificial Intelligence (AI) agents remains a fundamental challenge due to their stochastic
    reasoning, vast and diverse input space, reliance on external tools, and operation in dynamic execution environments;
    factors that demand new testing methodologies explicitly tailored to the complex and interactive nature of agent-based
    systems. This work presents a novel methodology for testing AI agents, with a particular focus on assessing their behavioral
    robustness under varied operational conditions. Our approach relies on following key technical innovations: (1) a coverage-guided
    test input generation strategy based on agent-specific coverage criteria, (2) a capture-and-simulate mechanism that systematically
    emulates abnormal tool behaviors to mimic real-world execution failures, and (3) a deterministic behavioral failure detection
    approach that enables consistent identification of failures across different test inputs. We developed AgentInspect, a
    framework that automatically detects six categories of behavioral failures in LangChain-based AI agents by analyzing their
    execution trajectories across two evaluation settings: a baseline setting using real tool responses and a simulated setting
    incorporating synthetic tool responses. To evaluate our approach, we curated a benchmark of 35 AI agents obtained from
    GitHub. Our results show that AgentInspect consistently identifies different behavioral failures with high precision and
    recall across both baseline and simulated execution settings. In particular, the simulated setting exposes failure modes
    that do not emerge during baseline execution with real tool responses, thereby enabling a more comprehensive assessment
    of agent robustness. Our findings highlight AgentInspect’s effectiveness in revealing critical failures and its practical
    utility for systematic robustness evaluation of AI agents.'
