- title: 'SyzDiversity: Diversity-Guided Linux Kernel Fuzzing'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 09065910-8816-457d-a896-3b7f85d2a40e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Linux kernel vulnerabilities can pose severe security threats to the entire software ecosystem. While coverage-guided
    kernel fuzzers have been proposed to uncover such vulnerabilities, their code coverage and bug-finding capability are
    still limited due to the lack of seed diversity, which is caused by the compounding effect of initial seed generation,
    seed scheduling, and seed mutation. To address this limitation, we propose a diversity-guided kernel fuzzer SyzDiversity.
    Specifically, to mitigate overvaluation of early seeds, SyzDiversity leverages proof-of-concept (PoC) seeds derived from
    real-world vulnerabilities as initial seeds, and further partitions these seeds into multiple communities. Moreover, to
    improve diversity guidance in seed scheduling, it leverages a novel metric, community popularity rate (CPR), to model
    community diversity, and introduces a CPR-aware hierarchical Multi-Armed Bandit (MAB) algorithm that integrates CPR and
    code coverage as reward signals to prioritize the scheduling of diverse seed communities and seeds. Further, to efficiently
    populate sparse communities or break through community boundaries, it adopts a CPR-guided seed mutation strategy that
    adaptively allocates higher mutation frequencies to communities that are more conducive to the diversity evolution of
    the seeds. Our extensive experiments on Linux kernel versions v5.15 and v6.14 has demonstrated that SyzDiversity improves
    code coverage and bug-finding capability by 17.4% and 9.1×, respectively, compared to the state-of-the-art kernel fuzzers.
    It has discovered 32 unique new vulnerabilities, with 12 of them confirmed.
