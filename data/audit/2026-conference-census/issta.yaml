- title: 'SpectraDL: A Historical Issue-Driven, Test Specification-Assisted Transfer Testing Approach for Deep Learning Frameworks
    via LLMs'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 8199e5ab-2f89-40b4-8c06-a94ea79629c5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Deep learning (DL) frameworks provide diverse fundamental algorithmic units as operators, which are critical
    infrastructure for constructing various intelligent software. Due to the fact that open source development paradigm is
    widely adopted by mainstream frameworks, bugs may repeatedly occur across operators and even frameworks. Although some
    efforts have been reported that large language models (LLMs) are leveraged to exploit historical issues to generate test
    cases for cross-framework testing, existing approaches suffer from the following limitations: 1) the generated test cases
    have low fault detection capability since they mainly rely on inputs or contexts from historical issues without considering
    the underlying root causes; 2) an effective mechanism is missing to determine the appropriate scope in a targeted framework
    for applying generated test cases. To overcome these limitations, we propose SpectraDL, a historical issue-driven, test
    specification-assisted transfer testing approach for DL frameworks. SpectraDL first extracts rigorous test specifications
    for each operator from official documentation, and then extracts and transforms historical issues and associated pull
    requests into structured fault representations (i.e., bug patterns). A dual retrieval mechanism based on semantic intent
    and structural input-space features is designed to transfer these bug patterns for testing related operators across frameworks.
    We evaluated SpectraDL with four mainstream DL frameworks, and experimental results have shown that SpectraDL successfully
    detected 125 previously unknown bugs, with 107 confirmed by developers. The results confirm that SpectraDL delivers a
    promising transfer testing approach for DL frameworks.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/103/SpectraDL-A-Historical-Issue-Driven-Test-Specification-Assisted-Transfer-Testing-Ap
