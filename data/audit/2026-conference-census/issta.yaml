- title: 'The Unseen Delta: Characterizing the Compiler Optimization Landscape via Top-Down Differential Analysis'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: a0cf1582-3bc7-4131-a671-2aa6ebedb605
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Compiler optimizations are essential for achieving high performance in modern software. However, recent studies
    highlight the persistence of performance bugs, i.e., subtle defects where the compiler generates functionally correct
    but computationally inefficient code, leading to significant performance degradation. Existing detection and testing methods
    typically employ a bottom-up approach, focusing on specific low-level code properties and remaining confined to known
    optimization rules. Consequently, they struggle to quantify the holistic impact of identified issues and often overlook
    critical microarchitectural inefficiencies. We observe a key indicator of untapped potential: different compilers often
    produce binaries with significant performance differences for identical source code. However, the root causes of these
    discrepancies remain largely unexplored and difficult to pinpoint using current techniques. To bridge this gap, we introduce
    a top-down differential analysis methodology. This approach calibrates compiler optimization differences with fine-grained,
    hierarchical microarchitectural metrics, offering a comprehensive view of runtime behavior. Using a sampling-based approach,
    this method efficiently pinpoints the critical code snippets responsible for performance differences, enabling targeted
    root cause analysis. Our empirical evaluation uncovers substantial and often surprising performance differences between
    binaries generated by GCC and Clang. A categorization of root causes reveals systemic challenges in compiler optimizations.
    To quantitatively validate our findings and demonstrate practical impact, we developed a binary patching framework that
    fixes identified performance issues by transplanting superior code sequences from competing compilers. This work provides
    a novel lens for understanding and analyzing optimization defects.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/73/The-Unseen-Delta-Characterizing-the-Compiler-Optimization-Landscape-via-Top-Down-Dif
