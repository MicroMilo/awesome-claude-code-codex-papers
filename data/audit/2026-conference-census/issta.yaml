- title: 'Compiling Large Multi-Modal Requirement Documents into Runnable Software Systems: From an Agentic Test-Driven Perspective'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 69538a39-5d8f-47e6-93ed-286ce49c2427
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Models (LLMs) have significantly improved programming efficiency by parsing natural language into
    code snippets. However, their performance degrades significantly as requirements scale; when faced with multi-modal documents
    containing hundreds of scenarios, LLMs often produce incorrect implemen- tations or omit crucial constraints. Observing
    LLMs’ ever-evolving capability and their persistent stochastic hallucination, we raise a question, i.e., whether it is
    possible to make LLM-based agentic programming go beyond code generation to requirement compilation, i.e., programmers
    can have a runnable system by only accomplishing (non-trivial) requirement documents? In this work, we make a first step
    by proposing ARC (Agentic Requirement Compilation) technique to parse a multi-modal requirement document, describing hundreds
    of scenarios in a DSL format, to a runnable web system. In addition to the source code, ARC also generates software engineering
    artifacts including (1) a modular design that spans the user interface, API interface, and database, (2) enriched test
    cases for each interface (including unit tests, modular tests, and integration tests), and (3) detailed traceability across
    all artifacts for software maintenance. Our approach employs a bidirectional test-driven agentic loop: (1) a top-down
    architecture phase that decomposes requirements into UI, API, and database interfaces, each of which is equipped with
    verifiable test suites, and (2) a bottom-up implementation phase where agents generate code that must satisfy the generated
    tests. Throughout this process, ARC maintains strict traceability across requirements, design, and code to facilitate
    intelligent asset reuse and follow-up maintenance. We evaluate ARC by generating 6 runnable web systems, from the multi-modal
    documents spanning over 50-200 multi-modal requirement scenarios. Compared to adopting the state-of-the-art LLM-based
    baselines, the generated web system can pass on average 50.6% more GUI tests. In addition, our user study consisting of
    21 participants shows that even novice users can successfully write different DSL-based documents consisting of from 50
    to 174 scenarios, within on average 5.6 hours, to generate a runnable system such as a real-world ticket-booking system
    of around 10K lines of code with maintainable architecture.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/105/Compiling-Large-Multi-Modal-Requirement-Documents-into-Runnable-Software-Systems-Fro
