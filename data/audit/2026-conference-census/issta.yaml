  official_record_id: 6c208ecd-91ca-40e5-ae07-a272b72607dd
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Runtime verification (RV) found many bugs by monitoring passing tests against formal specifications (specs), but
    it is slow. Researchers have recently shown that reinforcement learning (RL) can be used to speed up by RV during testing—by
    up to 551.5x, finding 99.6% of spec violations. We call this approach, “RL-based RV”; it aims to probabilistically monitor
    most unique traces—sequences of events like method calls—and monitor fewer redundant ones. But, there was no detailed
    study to understand remaining challenges in RL-based RV, towards finding insights and opportunities for improvement. We
    conduct the first in-depth study of RL-based RV. In particular, we focus on the only RL-based RV technique, Valg, and
    answer five main questions, using 58 Java projects. (i) How much slower is Valg than two optimal baselines? Up to 323.8x,
    or 3.2 hours (vs. running tests without RV), and up to 9.6x, or 25.3 minutes (vs. a theoretically optimal baseline that
    monitors only unique traces). (ii) Where does Valg spend its time? 48.6% (or 1.9 hours) is spent on monitoring, and 24.1%
    (or, 48.5 minutes) is also spent on signaling events to monitors. (iii) What characterizes code where Valg monitors too
    many redundant traces or misses unique ones? Across 100 code locations, at least 67.8% of redundant traces are due to
    limitations of the convergence heuristic, and 41.3% of missed unique traces occur when Valg’s assumption do not hold.
    (iv) How much do test non-determinism and the stochasticity of RL algorithm affect unique trace preservation? We see up
    to 95.5pp swings in the rate of unique trace preservation on the same project. (v) How do other off-the shelf RL algorithms
    compare with Valg? Only two of 11 RL algorithms that we survey are feasible in continuous integration; both are slower
    than Valg and miss more unique traces. So, custom RL algorithms for RV are needed. Overall, RL-based RV is promising,
    but there is plenty of room to improve it. We highlight several exciting directions for future research on doing so.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/189/A-Closer-Look-at-the-Use-of-Reinforcement-Learning-for-Speeding-Up-Runtime-Verificati
