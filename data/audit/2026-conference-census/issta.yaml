- title: 'Intrusion Models for Security Assessment: Methodology and Case Study on Xen'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2512fdf7-8e83-4793-8f1b-ecc24cacbdfa
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: As cyberattacks become increasingly automated and amplified by emerging technologies, particularly Artificial
    Intelligence (AI), reliably assessing the security resilience of software systems becomes crucial. However, traditional
    methods that rely on known vulnerabilities provide limited insight into the potential impact of attacks. Intrusion Injection
    is an emerging approach that leverages Intrusion Models (IMs) to inject exploitable states, representative of real intrusions,
    providing deeper insight into system resilience beyond known vulnerabilities. This paper contributes to the formalization
    of Intrusion Models (IMs) and proposes a structured methodology for their instantiation and injection into software systems.
    Grounded in fault-injection concepts, IMs define explicit abusive functionalities and the resulting erroneous states,
    which, when injected, enable systematic analysis of software reliability under security threats. To demonstrate feasibility,
    we apply our approach to the Xen hypervisor, targeting memory and virtualization management components with an injector
    prototype that allows security researchers and engineers to assess Xen-based systems against potential security-related
    failures. Our study indicates that intrusion injection driven by IMs can support repeatable, exploit-agnostic security
    assessments across platforms.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/67/Intrusion-Models-for-Security-Assessment-Methodology-and-Case-Study-on-Xen
