- title: 'SimiFuzz: Seed–Worker Scheduling for Parallel Fuzzing via Contextual Bandits'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: ab0b465a-cd6d-4bb5-a106-b7a8b4d2f5de
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Parallel fuzzing is now a standard way to scale vulnerability discovery, yet its efficiency is still limited
    by ineffective task allocation among workers. Existing approaches mainly aim to reduce conflicts, yet none explicitly
    captures the interaction between seeds and workers: the same seed can yield very different gains on different workers
    due to their divergent exploration states. As a result, parallel fuzzing can drift toward over-isolation that wastes shared
    progress, or excessive overlap that duplicates effort. To address this challenge, we present SimiFuzz, a context-aware
    scheduling framework that learns to assign \emph{seed–worker} pairs online. SimiFuzz encodes each assignment with a compact
    context vector that jointly models seed characteristics, worker state, and seed–worker interaction. On top of this representation,
    SimiFuzz employs a LinUCB-based contextual bandit to score candidate pairs, balancing individual worker efficiency against
    group-level redundancy to maximize collective progress. To handle non-stationary fuzzing dynamics, SimiFuzz adopts a time-slice
    feedback mechanism that aggregates coverage gains within fixed intervals, combining globally new edges with cross-learning
    progress to form stable reward signals. We implement SimiFuzz on top of AFL++ and evaluate it on eight real-world targets.
    Across 24-hour campaigns with 10 parallel workers, SimiFuzz improves average edge coverage by 28.84% and achieves the
    best final coverage on all targets, while detecting 29 more unique bugs and 9 more CVEs.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/16/SimiFuzz-Seed-Worker-Scheduling-for-Parallel-Fuzzing-via-Contextual-Bandits
