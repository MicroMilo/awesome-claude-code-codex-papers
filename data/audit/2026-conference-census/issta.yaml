- title: 'Seeing is Coding: On the Effectiveness of Vision Language Models in Code Understanding'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 77c81766-127f-4eb4-9a1f-dde822560e94
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Large Language Models (LLMs) have achieved remarkable success in source code understanding, yet as software systems
    grow in scale, computational efficiency has become a critical bottleneck. Currently, these models rely on a text-based
    paradigm that treats source code as a linear sequence of tokens, which leads to a linear increase in context length and
    associated computational costs. The rapid advancement of Multimodal LLMs (MLLMs) introduces an opportunity to optimize
    efficiency by representing source code as rendered images. Unlike text, which is difficult to compress without losing
    semantic meaning, the image modality is inherently suitable for compression. By adjusting resolution, images can be scaled
    to a fraction of their original token cost while remaining recognizable to vision-capable models. To explore the feasibility
    of this approach, we conduct the first systematic study on the effectiveness of MLLMs for code understanding. Our experiments
    reveal that: (1) MLLMs can effectively understand code with substantial token reduction, achieving up to 8x compression;
    (2) MLLMs can effectively leverage visual cues such as syntax highlighting, improving code completion performance under
    4x compression; and (3) Code-understanding tasks like clone detection exhibit exceptional resilience to visual compression,
    with some compression ratios even slightly outperforming raw text inputs. Our findings highlight both the potential and
    current limitations of MLLMs in code understanding, which points out a shift toward image-modality code representation
    as a pathway to more efficient inference.'
