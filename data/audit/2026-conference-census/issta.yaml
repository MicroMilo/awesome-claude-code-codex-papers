- title: 'MoT: Modularization-of-Thought Prompting for Effective Code Generation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: b9a6c331-f0e0-41ec-b7c5-eecd8926568e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models are transforming software development by automatically generating code. Current prompting
    techniques such as Chain-of-Thought (CoT) suggest tasks step by step and the reasoning process follows a linear structure,
    which hampers the understanding of complex programming problems, particularly those requiring hierarchical solutions.
    Inspired by the principle of modularization in software development, in this work, we propose a novel prompting technique
    called \textbf{MoT} (\textbf{M}odularization \textbf{o}f \textbf{T}hought), to enhance the code generation performance
    of LLMs. First, MoT exploits modularization principles to decompose complex programming problems into smaller, independent
    reasoning steps, enabling a more structured and interpretable problem-solving process. This hierarchical structure improves
    the LLMs‘ ability to comprehend complex programming problems. Then, it structures the reasoning process using an MLR Graph
    (\textbf{M}ulti-\textbf{L}evel \textbf{R}easoning Graph), which hierarchically organizes reasoning steps. This approach
    enhances modular understanding and ensures better alignment between reasoning steps and the generated code, significantly
    improving code generation performance. Our experiments on two advanced LLMs (GPT-4o-mini and DeepSeek-R1), comparing MoT
    to six baseline prompting techniques across six widely used datasets, demonstrate that MoT significantly outperforms existing
    baselines (e.g., CoT and SCoT), achieving Pass@1 scores ranging from 58.1% to 95.1%.
