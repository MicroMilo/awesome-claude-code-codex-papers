- title: Efficient Predictive Monitoring of Message Passing Interface Programs
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 1aa779c5-185f-4be4-97a2-aac0abb4fc19
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The Message Passing Interface (MPI) is the standard programming model for high-performance computing, yet nondeterministic
    scheduling in concurrent executions makes reliability assurance highly challenging. Beyond deadlocks, property-related
    bugs such as modifying a send buffer before a nonblocking send completes or accessing a freed RMA window are often hard
    to reproduce and validate, as they typically manifest only under rare event interleavings and can be both latent and catastrophic.
    Existing dynamic checkers usually cover only the observed schedule of a single execution; dynamic verification largely
    focuses on deadlocks; and static techniques scale poorly to medium-to-large programs, often timing out or running out
    of memory. Overall, existing techniques do not support scalable analysis of temporal properties in large MPI programs.
    To address these limitations, we propose the first efficient predictive monitoring approach for temporal properties in
    MPI programs. From a single execution, we collect an event trace and use trace equivalence to predict the set of legal
    equivalent executions under the same input. We then check whether any predicted execution satisfies the target property.
    To make this process sound, we formalize three correctness criteria for MPI trace reordering and enforce them through
    MPI-semantics-driven dependency extraction, tracked with vector clocks. To improve efficiency, we exploit the bounded
    length of a pattern language and reduce long-trace reordering to reordering short patterns. We implement our approach
    in MPI-PRV, instantiate ten representative MPI bug properties, and evaluate it on 13 real-world MPI applications with
    38 configurations. MPI-PRV successfully and correctly analyzes all $38$ tasks, whereas MPI-SV and MUST analyze only $14$
    and $11$ tasks, respectively. MPI-PRV also achieves orders-of-magnitude reductions in runtime and memory usage, demonstrating
    strong efficiency and scalability for large MPI programs.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/187/Efficient-Predictive-Monitoring-of-Message-Passing-Interface-Programs
