  official_record_id: cb7b3798-1e28-4036-aca0-077f89c07af6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Robust scenario generation is essential for systematically testing Autonomous Driving Systems (ADS) under rare
    and safety-critical conditions. However, existing methods face a dilemma: search-based approaches often lack semantic
    guidance, while specification-based methods rely on unscalable manual rules. Current LLM-driven techniques, meanwhile,
    primarily act as surface-level scene translators without explicit behavioral grounding. We present \textbf{InvarGen},
    a framework that bridges these gaps by utilizing multi-modal LLMs as \textbf{parametric specification generators}. Central
    to \textbf{InvarGen} is the concept of \textit{Scenario Fixed Points}—dynamic safety invariants (e.g., context-aware headway
    thresholds) automatically extracted and formalized from unstructured accident videos. Unlike static templates, these fixed
    points adaptively constrain the search space, guiding a hybrid evolutionary process: \textit{Intelligent Fuzzing} exploits
    boundary parameters to trigger specific violations, while \textit{Structural Mutation} ensures the global exploration
    of diverse environmental contexts. Evaluation across 1,400 synthesized scenarios based on 200 real-world accidents demonstrates
    that \textbf{InvarGen} outperforms LLM-driven and traditional search-based baselines in multiple dimensions. It discovers
    up to \textbf{37.5% more unique violation types} than the best baseline, achieves a \textbf{30% fixed-point violation
    rate}, and improves semantic diversity by \textbf{25%}. It also maintains \textbf{100% compatibility} with OpenX standards,
    ensuring cross-platform simulation on Carla and Panosim. Ablation studies confirm that all components are statistically
    essential. These results highlight the promise of fixed-point semantics as a principled bridge between unstructured LLM
    reasoning and rigorous robustness testing.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/174/Fixed-Point-Guided-ADS-Scenario-Generation-via-Multi-Modal-LLM-Reasoning-and-Software
