- title: 'Test vs Mutant: Adversarial LLM Agents for Robust Unit Test Generation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: b5462e92-74ef-43f1-b9eb-e408e15d7532
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Software testing is a critical, yet resource-intensive phase of the software development lifecycle. Over the
    years, various automated tools have been developed to aid in this process: Search-based approaches typically achieve high
    coverage but produce tests with low readability, whereas large language model (LLM)-based methods generate more human-readable
    tests but often suffer from low coverage and compilability. While the majority of research efforts have focused on improving
    test coverage and readability, little attention has been paid to enhancing the robustness of bug detection, particularly
    in exposing corner cases and vulnerable execution paths. To address this gap, we propose \ourmethod, a novel adversarial
    framework for LLM-powered test case generation. \ourmethod comprises two interacting agents: a test case generation agent
    ($\mathcal{T}$) and a mutant generation agent ($\mathcal{M}$). These agents engage in an adversarial loop, where $\mathcal{M}$
    persistently creates new mutants “hacking” the blind spots of $\mathcal{T}$’s current test suite, while $\mathcal{T}$
    iteratively refines its test cases to “kill” the challenging mutants produced by $\mathcal{M}$. This interaction loop
    is guided by both coverage and mutation scores, enabling the system to co-evolve toward both high test coverage and bug
    detection capability. Experimental results in the Defects4J dataset show that our approach improves fault detection rates
    by 8.56% over the best existing LLM-based methods and by 63.30% over EvoSuite, while also improving line and branch coverage.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/31/Test-vs-Mutant-Adversarial-LLM-Agents-for-Robust-Unit-Test-Generation
