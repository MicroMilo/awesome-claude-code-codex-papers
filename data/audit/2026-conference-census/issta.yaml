  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Verifying the serializability of transaction histories is essential for assessing whether a database management
    system (DBMS) correctly enforces the claimed serializable isolation level. Black-box serializability verification provides
    a practical means for such validation without relying on internal system details. Existing approaches often suffer from
    limitations including incomplete anomaly detection, high verification overhead, excessive memory consumption, or dependence
    on specific concurrency control protocols. This paper presents \textsf{Vbox}, a black-box serializability verification
    method that incorporates support for predicate database operations, systematic use of transaction timing information,
    and a satisfiability (SAT)-based formulation with an efficient solver. Both theoretical analysis and experimental evaluation
    show that \textsf{Vbox} is correct and efficient, detects a broader range of data anomalies, and does not rely on any
    particular concurrency control protocol.
