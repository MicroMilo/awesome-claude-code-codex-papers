  abstract: Asynchronous programming has become a core execution model in modern Java software, powering server-side processing,
    network I/O, reactive streams, task scheduling, and RPC communication. In such asynchronous executions, resource creation
    and release are no longer confined to a single call stack; instead, they are distributed across heterogeneous execution
    contexts such as callbacks, Future/Promise chains, and scheduler boundaries. As a result, a resource lifecycle can be
    determined non-deterministically by events such as execution ordering, races, cancellation, and timeouts, making resource
    leaks a critical source of performance degradation and failures. However, prior research and public datasets on resource
    leaks have largely focused on synchronous settings, where defects typically manifest as missing \texttt{close} calls or
    omitted exceptional paths. In synchronous programs, release logic is often located within the same thread and call stack,
    allowing leaks to be defined and analyzed by tracking \texttt{close} invocations along normal and exceptional control-flow
    paths. In contrast, in asynchronous environments, resource release depends on the execution of callbacks on different
    threads, Future completion events, or scheduler decisions, and the release path itself may vary under cancellation, timeouts,
    or changes in execution order. Therefore, existing synchronous leak datasets fail to adequately represent the conditions
    and repair strategies of asynchronous resource leaks, hindering quantitative and fair evaluation of detection and automated
    repair techniques. To bridge this gap, we present \textbf{AsyncLeakBench}, a public benchmark that systematically curates
    real-world asynchronous resource leak defects that have been fixed in open-source Java projects. We collect \textbf{572}
    defect–patch pairs from \textbf{18} representative projects via a semi-automatic workflow, and refine them into high-quality
    ground truth through iterative filtering and manual validation. We further categorize the collected cases into \textbf{11}
    categories, summarizing key triggers and repair strategies driven by asynchronous events such as cancellation, timeouts,
    and scheduler boundaries. Moreover, an initial evaluation on existing resource leak detectors confirms that their detection
    performance is limited, particularly for leak patterns activated by asynchronous events such as cancellation and timeouts,
    highlighting the need for a dedicated benchmark for this defect class. AsyncLeakBench provides a realistic and reproducible
    evaluation basis for asynchronous resource leak detection and automated repair, static and dynamic analysis, fault localization,
    and LLM-based debugging. By establishing asynchronous resource leaks as a distinct defect class and offering a standardized
    benchmark for systematic study, this work contributes to advancing future research in software analysis and testing.
