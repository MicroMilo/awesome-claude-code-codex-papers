- title: Hidden Licensing Risks in the PTMware Ecosystem
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: cb1e15d5-e0f6-422e-9145-8d55a762428a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) have been increasingly integrated into software systems, giving rise to a new class
    of software referred to as LLMware. In addition to traditional software components composed solely of source code, LLMware
    also embeds or interacts with LLMs that depend on other models and datasets, forming complex supply chains involving open-source
    software (OSS) libraries, LLMs, and datasets. However, the licensing issues arising from these intertwined dependencies
    remain largely unexplored. Leveraging GitHub and Hugging Face, two premier hubs for code and models, we curate a large-
    scale dataset capturing the supply chains of LLMware. Our dataset comprises 12,180 OSS repositories from GitHub, 3,988
    LLMs, and 708 datasets from Hugging Face. We analyze license distributions in the LLMware ecosystem and find that licensing
    practices differ markedly from those in traditional OSS communities. We further examine license-related issues and identify
    license selection and maintenance as the primary pain points, with 84% of cases involving discussions about adding appropriate
    licenses or resolving conflicts in existing ones. We then study license incompatibility in LLMware and evaluate the state-of-the-art
    approaches, finding that they perform poorly in this setting and achieve only 58% and 76% F1 scores, respectively. These
    results motivate us to propose LiAgent, which explores the potential of LLM-based agents for ecosystem-level license compatibility
    analysis, achieves an F1 score of 87%, and improves performance by 14 percentage points over prior approaches. We submit
    60 license incompatibility issues detected by LiAgent, of which 11 have been confirmed by developers. Two LLMs with license
    conflicts have more than 107 million and 5 million downloads on Hugging Face, respectively, suggesting the issues may
    impact a large number of downstream applications. We conclude by discussing implications and providing recommendations
    to support the healthy growth of the LLMware ecosystem.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/84/Hidden-Licensing-Risks-in-the-PTMware-Ecosystem
