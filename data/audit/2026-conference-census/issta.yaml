- title: 'From Greedy Steps to Global Optimization: Learning Sequential Test Suite Generation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 406d08de-0d97-4d2a-a121-07dee1eee773
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'With the rapid evolution of Large Language Models (LLMs), automated software testing is witnessing a paradigm
    shift. While proprietary models like GPT-4o demonstrate impressive capabilities, their high deployment costs and data
    privacy concerns make open-source LLMs the practical imperative for many academic and industrial scenarios. In the field
    of automated test generation, it has evolved to iterative workflows to construct test suites based on LLMs. When utilizing
    open-source LLMs, we empirically observe they lack a suite-level perspective, suffering from \textit{structural myopia}—failing
    to generate new tests with large marginal gain based on the current covered status. In this paper, from the perspective
    of sequences, we formalize test suite generation as a Markov Decision Process (MDP) and demonstrate that its objective
    exhibits \textbf{monotone submodularity}, which enables an effective relaxation of this NP-hard global optimization into
    a tractable step-wise greedy procedure. Guided by this insight, we propose \textbf{TestDecision}, which transforms LLMs
    into neural greedy experts. TestDecision consists of two synergistic components: (1) an inference framework which implements
    test suite construction following a step-wise greedy strategy; and (2) a training pipeline of reinforcement learning which
    equips the base LLM with sequential test generation ability to maximize marginal gain. Comprehensive evaluations on the
    ULT benchmark demonstrate that TestDecision significantly outperforms existing advanced methods. It brings an improvement
    between 38.15-52.37% in branch coverage and 298.22-558.88% in execution pass rate over all base models, achieving a comparable
    performance on 7B backbone with a much larger proprietary LLM GPT-5.2. Furthermore, TestDecision can find 58.43-95.45%
    more bugs than vanilla base LLMs and exhibit superior generalization on LiveCodeBench, proving its capability to construct
    high-quality test suites.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/71/From-Greedy-Steps-to-Global-Optimization-Learning-Sequential-Test-Suite-Generation
