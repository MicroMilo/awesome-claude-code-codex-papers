- title: 'CAM: A Causality-based Analysis Framework for Multi-Agent Code Generation Systems'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 69d92e87-8363-4a96-b112-4ffbec22bf86
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Despite the remarkable success that Multi-Agent Code Generation Systems (MACGS) have achieved, the inherent complexity
    of multi-agent architectures produces substantial volumes of intermediate outputs. To date, the individual importance
    of these intermediate outputs to the system correctness remains opaque, which impedes targeted optimization of MACGS designs.
    To address this challenge, we propose CAM, the first \textbf{C}ausality-based \textbf{A}nalysis framework for \textbf{M}ACGS
    that systematically quantifies the contribution of different intermediate features for system correctness. By comprehensively
    categorizing intermediate outputs and systematically simulating realistic errors on intermediate features, we identify
    the important features for system correctness and aggregate their importance rankings, facilitating comprehensive analysis
    of MACGS. We instantiate CAM on representative MACGS across multiple backend LLMs and datasets and conduct extensive empirical
    analysis on the identified importance rankings. Our analysis reveals intriguing findings: first, we uncover context-dependent
    features\textemdash features whose importance emerges mainly through interactions with other features, revealing that
    quality assurance for MACGS should move beyond module-level validation to incorporate cross-feature consistency checks;
    second, we reveal that hybrid backend MACGS with different backend LLMs assigned according to their relative strength
    achieves up to 7.2% Pass@1 improvement, underscoring hybrid architectures as a promising direction for future MACGS design.
    We further demonstrate CAM’s practical utility through two applications: (1) failure repair which achieves a 73.3% success
    rate by optimizing top-3 importance-ranked features and (2) feature pruning that reduces up to 66.8% intermediate token
    consumption while maintaining generation performance by pruning low-importance features. Our work provides actionable
    insights for MACGS design and deployment, establishing causality analysis as a powerful approach for understanding and
    improving MACGS.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/147/CAM-A-Causality-based-Analysis-Framework-for-Multi-Agent-Code-Generation-Systems
