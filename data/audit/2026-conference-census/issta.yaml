- title: 'Towards Iterative End-to-End Software Development: A Feature-Driven Multi-Agent Framework'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: included
  disposition_reason: Exact official conference record and reviewed product-level evidence imported into the main catalog.
  full_text_scan: scanned
  official_record_id: 8b86569c-0c0a-44e1-8735-b4cee0776a90
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Recent advances in large language model agents offer the promise of automating end-to-end software development
    from natural language requirements. However, existing approaches largely adopt linear, waterfall-style pipelines, which
    oversimplify the iterative nature of real-world development and struggle with complex, larger-scale projects. To address
    these limitations, we propose EvoDev, an iterative software development framework inspired by feature-driven development.
    EvoDev decomposes user requirements into a set of user-valued features and constructs a Feature Map, a directed acyclic
    graph that explicitly models dependencies between features. Each feature node in the feature map maintains multi-layer
    contexts, including business logic, software design, and code implementation, which are propagated along dependencies
    to provide context for subsequent development iterations. We evaluate EvoDev on challenging Android development tasks
    and show that it outperforms the best-performing baseline, Claude Code, by 57.3%, while improving single-agent performance
    by 16.0%–58.5% across different base LLMs, highlighting the importance of feature decomposition, dependency modeling,
    context propagation, and workflow-aware agent design for end-to-end software development. Moreover, our work summarizes
    practical insights for designing iterative, LLM-driven development frameworks and informs future training of base LLMs
    to better support iterative software development.
