- title: Systematically Cover SQL Syntactic Structures via k-Sequence
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 1145d546-dbf1-4d9f-a9c3-c13f4ef6986f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Testing Relational Database Management Systems (RDBMSs) is inherently challenging because SQL, the primary language
    for interacting with RDBMSs, exhibits a vast and highly complex grammar with hundreds of interdependent production rules
    in the Extended Backus–Naur Form. While existing grammar-based testing techniques have made progress in covering SQL syntactic
    structures, they predominantly focus on \textit{parent-child relationships} in derivation paths, which capture \textit{vertical}
    expansions from a non-terminal to its alternatives. However, they overlook an equally critical dimension, \textit{sibling-like
    relationships}, which capture co-occurring alternatives across derivation paths. This oversight results in insufficient
    coverage of intricate syntactic interactions that may trigger unique behaviors or latent bugs in RDBMSs. In this work,
    we propose \textit{k-sequence}, a novel coverage criterion that characterizes syntactic structures as ordered sequences
    of $k$ alternatives encountered during derivation. By simultaneously capturing both \textit{vertical parent-child} and
    \textit{horizontal sibling-like} relationships in the SQL syntactic structures, \textit{k-sequence} provides a unified
    framework for comprehensive SQL syntactic coverage. Based on this criterion, we develop KSeqFuzz, a directed fuzzing approach
    that systematically generates SQL statements to explore previously unseen \textit{k-sequence}s, achieving deeper and broader
    testing coverage. We implement and evaluate KSeqFuzz on four widely-deployed RDBMSs, i.e., MySQL, MariaDB, TiDB, and OceanBase.
    In total, KSeqFuzz detects 58 new unique bugs, including 6 critical crashes. Evaluation results demonstrate that KSeqFuzz
    outperforms state-of-the-art baselines, detecting 26% more unique bugs during 24-hour testing campaigns.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/198/Systematically-Cover-SQL-Syntactic-Structures-via-k-Sequence
