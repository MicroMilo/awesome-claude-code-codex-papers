- title: 'Ghosts in the Memory: Detecting Unintended Sensitive Data in Android Apps'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e84f2a94-ca2f-4ef0-97ce-1d1168909e0c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Android apps often retain sensitive information such as co-users’ data, authentication tokens, and encryption
    keys in memory, leaving them vulnerable to unauthorized access. Existing dynamic analysis tools struggle to detect such
    memory-resident leaks because of three fundamental challenges: \textit{(i)} runtime application self-protection (RASP)
    and other anti-analysis mechanisms actively detect and block conventional instrumentation; \textit{(ii)} the semantic
    gap between high-level data types and their raw memory representations obscures sensitive content; and \textit{(iii)}
    the transient nature of memory-resident data causes snapshot-based methods to miss critical exposures. We present ANDROID-MRI,
    an OS-level analysis tool that embeds tracing directly into the Android kernel to detect unintended sensitive data leakage
    through memory while remaining invisible to application-layer defenses. ANDROID-MRI provides instruction-granular monitoring
    to track the propagation of sensitive data in memory, surfacing the full context of unintended persistence. In an evaluation
    of 50 popular apps (≥1M installs), ANDROID-MRI bypassed 97.6% of RASP protections (vs. 52.4% for Frida) and revealed 17
    previously unknown memory disclosures. These included leaks of profile PINs, subscription-only content, and cryptographic
    keys. 12 vendors confirmed the issues; 4 have patched them, and 3 (Netflix, Smule, and Delivery Express) acknowledged
    them via bug bounty programs.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/107/Ghosts-in-the-Memory-Detecting-Unintended-Sensitive-Data-in-Android-Apps
