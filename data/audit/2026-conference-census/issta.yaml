- title: 'BashCoder-R1: Towards Robust and Explainable Bash Script Generation with Robustness-Aware Group Relative Policy
    Optimization'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2c67b90b-1fbf-40d1-aab2-9112f3ee8338
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Bash scripts underpin system administration, DevOps automation, and Continuous Integration/Continuous Deployment
    (CI/CD), where code quality directly determines system stability and security. Yet when Large Language Models (LLMs) are
    tasked with generating such scripts, two problems compound each other: models produce code without any accompanying justification
    for their design choices, and this absence of scrutiny correlates with scripts that silently harbor robustness flaws,
    including mishandled edge cases, unchecked failure modes, and fragile assumptions about the execution environment. We
    present BashCoder-R1, a framework that tackles both problems jointly, treating explainability as a design goal rather
    than a byproduct of correctness. The training pipeline proceeds in three stages. Continual Pre-training (CPT) first adapts
    the base model to the syntactic conventions and idioms specific to Bash. We then curate thousands of expert-validated
    reasoning-and-code samples and use them for Long Chain-of-Thought Supervised Fine-Tuning (L-CoT SFT), training the model
    to reproduce the deliberative, risk-averse thinking pattern of an experienced system administrator before it writes any
    code. Finally, Robustness-Aware Group Relative Policy Optimization (R-GRPO) directly refines the generation policy against
    a weighted reward combining syntax correctness, robustness as verified by the static analyzer shellcheck, and adherence
    to the required reasoning format. We evaluate BashCoder-R1 on BashBench, a benchmark we construct from 952 real-world
    automation tasks (773 single-line commands and 179 multi-line scripts), against a wide range of state-of-the-art baselines.
    BashCoder-R1 attains SyntaxPass of 100.00%/94.97%, RobustWarnRate of 4.01%/16.47%, RobustPass of 95.99%/79.33%, FuncRate
    of 93.01%/93.85%, and FullRate of 90.04%/73.18% on single-line/multi-line tasks respectively, a relative FullRate improvement
    of 37.82% and 20.18% over the strongest baseline, DeepSeek-V3.2 (Reasoning). Human evaluation across Functionality, Robustness,
    and Clarity further confirms that BashCoder-R1’s reasoning chains are rated highest in quality among all compared systems.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/3/BashCoder-R1-Towards-Robust-and-Explainable-Bash-Script-Generation-with-Robustness-A
