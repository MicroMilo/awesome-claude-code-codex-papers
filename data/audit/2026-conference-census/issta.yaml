- title: Mathematically-Guided Detection of Floating-Point Errors
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: a3368a85-88e2-406d-9431-72dfd2bfadc2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Floating-point computations are important for modern scientific and engineering software, especially for safety-critical
    systems, yet only a small subset of inputs typically trigger substantial numerical errors. Detecting such error-inducing
    inputs and the underlying bugs is therefore essential for improving their security and reliability. Existing techniques
    commonly rely on either oracle-driven exploration that repeatedly compares against high-precision references or search-driven
    heuristics. Despite the improvements made, they remain limited by \textbf{(1) Expensive computation of high-precision
    oracles} and \textbf{(2) Lack of long-range convergence}, which often requires dense probing near narrow error-inducing
    regions and expensive computation. We propose MGDE (\textbf{M}athematically-\textbf{G}uided \textbf{D}etection of floating-point
    \textbf{E}rrors), a method that replaces trial-and-error exploration with mathematically defined targets and directed
    convergence. MGDE first uses condition-number theory to identify numerically unstable atomic operations without invoking
    expensive high-precision oracles during exploration. MDGE exploits the observation that extreme condition numbers occur
    near structured boundaries (e.g., cancellation points and singularities), reformulating detection as a numerical root-finding
    problem. By solving the resulting objectives with the Newton–Raphson method, MGDE can steer inputs toward error-prone
    regions from far-away initializations. We evaluate MGDE on GNU Scientific Library (GSL) functions and compare against
    two state-of-the-art baselines, ATOMU and FPCC, using triggered bugs as the primary metric. On 88 single-input functions,
    MGDE triggers 80 bugs across 47 functions, outperforming ATOMU (70 bugs in 46 functions) and FPCC (53 bugs in 42 functions).
    MGDE is also faster: ATOMU and FPCC require 41.71$\times$ and 10.17$\times$ more time, respectively. The advantage is
    even more significant for multi-input functions, where MGDE triggers nine bugs while FPCC triggers none, and achieves
    an average runtime of 0.6443 seconds per function compared to FPCC’s 100-second budget. Overall, MGDE substantially advances
    the state of the art in both effectiveness and efficiency, and we report 16 previously unknown GSL bugs, which have been
    confirmed by the GSL community.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/200/Mathematically-Guided-Detection-of-Floating-Point-Errors
