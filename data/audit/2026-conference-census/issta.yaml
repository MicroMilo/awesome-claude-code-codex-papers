- title: Are We Stuck? Modeling and Detecting Deadlocks in Multi-Autonomous Vehicle Systems
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: b706edb6-cfdd-47fc-85cd-f4ee32c1826c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Autonomous driving system (ADS) testing is essential to ensure the safety and reliability of autonomous vehicles
    (AVs) prior to deployment. As ADSs are increasingly deployed in multi-AV traffic environments, it becomes crucial to assess
    their cooperative performance, particularly with respect to deadlock, a fundamental liveness issue in concurrent systems
    that can lead to traffic congestion and prolonged stalling. However, the analysis and testing of ADSs’ cooperative capabilities
    with respect to deadlock remain largely underexplored. In this work, we present the first systematic study of deadlock
    in multi-AV systems. We formalize deadlock in autonomous driving using a time-indexed wait-for relation grounded in vehicles’
    planned trajectories and road-region occupancy. Building on this formalization, we propose WaitWatch, a wait-for–oriented
    testing framework that steers scenario generation via spatio-temporal intersection alignment of executed trajectories
    to induce circular wait patterns. WaitWatch integrates a Deadlock Judge, Intersection Alignment Feedback, and Intersection
    Oriented Mutation to efficiently uncover latent deadlock scenarios. We conduct an extensive evaluation on three representative
    ADSs. Experimental results show that, on average, WaitWatch generates 2.28×more deadlock scenarios (DLSs) than the best-performing
    baseline. By shifting the focus from single-AV evaluation to multi-AV cooperation, our approach identifies a range of
    previously unknown deadlock behaviors, revealing significant limitations in the cooperative and liveness capabilities
    of current ADSs. Our findings highlight a fundamental safety–liveness trade-off in deadlock resolution and emonstrate
    the need for systematic deadlock-aware testing in the development and validation of autonomous driving systems.
