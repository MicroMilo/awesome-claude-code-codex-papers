- title: Industrial Practice of LLM-based Test Case Carving and Assertion Generation (Experience Paper)
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e0ae4fa1-8794-446c-bd55-e1f9f78908ce
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Enterprise regression testing for microservice systems is often constrained by incomplete or outdated documentation.
    In practice, QA engineers frequently rely on real execution traffic to reconstruct business scenarios; however, turning
    raw traffic into replayable regression tests with stable validation logic remains labor-intensive and error-prone. This
    paper presents NL2Test, an end-to-end approach and tool that generates executable API regression tests from (i) a natural-language
    scenario description and (ii) a traffic capture recorded while executing the scenario. NL2Test addresses two coupled tasks:
    test case carving, which extracts a minimal replayable request sequence and reconstructs data dependencies so that dynamic
    values are bound from their responses rather than hard-coded; and assertion generation, which produces assertions aligned
    with business intent while avoiding non-deterministic fields and hallucinated paths. To improve reliability, NL2Test uses
    LLMs for semantic interpretation and constrained code synthesis, and uses deterministic algorithms for request filtering,
    dependency confirmation via value consistency, and assertion-path validation. We evaluate NL2Test on 51 industrial regression
    scenarios extracted from a large consumer-facing Internet company. NL2Test achieves an exact-match rate of 82.4% (42/51),
    and produces a functionally usable draft in 98.0% (50/51) of scenarios when allowing minor post-edits. In a 9-month production
    deployment starting in March 2025, NL2Test generated 3,196 test cases with an overall code adoption rate of 85.4%. These
    results indicate that traffic-grounded generation with deterministic guardrails can substantially reduce manual effort
    while improving regression automation in complex microservice environments.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/8/Industrial-Practice-of-LLM-based-Test-Case-Carving-and-Assertion-Generation-Experien
