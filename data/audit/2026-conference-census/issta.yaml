- title: 'When Optimizations Backfire: The Paradox of Plaintext Optimizations in Privacy-Preserving ML Compilers'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: a6bd5663-70a9-4bd5-b9f8-ec4e56e73ae0
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Growing concerns about data security and privacy have fueled the widespread adoption of Privacy-Preserving Machine
    Learning (PPML). Cryptography-based PPML, which allows computation directly on encrypted data, significantly mitigates
    data leakage risks. To facilitate its adoption, Ciphertext Machine Learning Compilers (CMLCs) automate the translation
    of high-level ML procedures into low-level circuits for encrypted data. Recently, CMLCs have increasingly adopted infrastructure
    from Plaintext Machine Learning Compilers (PMLCs). While integrating Plaintext-Domain Optimization Passes (PDOPs) into
    CMLCs offers potential performance, usability, and extensibility benefits, our study shows it can also lead to severe
    performance regressions — a risk that has been largely overlooked. To address this, we introduce Hopta, a hybrid domain
    optimization defects tester and analyzer, aiming to find optimization bugs that can degrade the performance of compiled
    circuits from CMLCs. We carefully design two core components: (1) an optimization pipeline mutation mechanism to detect
    optimization defects by selectively enabling/disabling PDOPs, and (2) a profile-guided code reduction tool that efficiently
    simplifies defect-triggering programs to isolate optimization defects and facilitate debugging. Applying Hopta to SecretFlow-SPU,
    a production-grade CMLC, we identified 11 optimization defects (spanning matrix indexing, arithmetic/boolean conversion,
    and cost model deviation) that led to substantial performance regressions, with compiled circuits incurring up to 310.2%
    increased cost. Our comprehensive analysis provides empirical insights into fundamental differences between plaintext
    and ciphertext domain optimization strategies, offering crucial guidance for future CMLC development. We conclude with
    a brief discussion of extensions to other hybrid ML compilers, underscoring the methodology’s compiler-agnostic nature.
    This work establishes a new research direction for enhancing CMLC performance and the practical deployment of privacy-preserving
    ML systems.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/144/When-Optimizations-Backfire-The-Paradox-of-Plaintext-Optimizations-in-Privacy-Preser
