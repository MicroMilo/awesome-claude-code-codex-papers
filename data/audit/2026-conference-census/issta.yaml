- title: 'SAGE: Signal-Amplified Guided Embeddings for Vulnerability Detection'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 7352e01c-65e8-4706-ad99-cd3de7763653
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: While Large Language Models (LLMs) have achieved milestones in automated software engineering, their application
    to vulnerability detection remains constrained by a notable sensitivity barrier. Despite advancements in graph-based analysis
    and supervised fine-tuning, existing paradigms frequently struggle to isolate the fine-grained, sparse semantic deviations
    characteristic of vulnerabilities from the dominant background of functional logic. We argue that this limitation stems
    from a notable architectural phenomenon we term \textbf{Signal Submersion}. Our analysis reveals that while vulnerability-relevant
    features are activated in intermediate layers, these sparse signals occupy a disproportionately small magnitude and are
    substantially diminished by global semantic representations. To address this, we propose \textbf{SAGE} (\textbf{S}ignal-\textbf{A}mplified
    \textbf{G}uided \textbf{E}mbeddings), a framework that transitions from passive inference to active signal amplification.
    SAGE employs a task-conditional Sparse Autoencoder (SAE) to project entangled representations onto a high-dimensional
    sparse manifold, mechanistically decoupling and resurfacing faint vulnerability signals. Extensive evaluations on BigVul,
    PrimeVul, and the zero-day benchmark PreciseBugs demonstrate that SAGE establishes new state-of-the-art performance. Notably,
    SAGE achieves relative MCC gains of up to 318% on unseen distributions and enables a 7B model to outperform 34B generalist
    baselines, validating that mechanistic disentanglement is a more efficient path to security than simply increasing model
    size.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/50/SAGE-Signal-Amplified-Guided-Embeddings-for-Vulnerability-Detection
