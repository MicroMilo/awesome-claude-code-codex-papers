- title: 'Function Calling as a Flexible LLM Defense Add-On: Capability and Application Exploration'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: aec3fc5d-49ac-48cf-83ff-a4ac51b4dfce
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) exhibit impressive capabilities but are susceptible to adversarial attacks that induce
    harmful outputs. Although various defenses have been proposed, their practicality is restricted by substantial runtime
    overhead or degraded model helpfulness. Moreover, LLM applications typically have diverse and evolving security requirements
    that cannot be fully anticipated during the design of static defenses. These limitations call for a flexible, low-overhead
    defense mechanism that can be easily customized to meet task-specific needs. In this paper, we explore function calling
    (FC)—a built-in mechanism in modern LLMs for invoking custom tools—as a lightweight and adaptable defense add-on. We show
    that by defining functions representing malicious actions, LLMs equipped with FC can intercept harmful prompts by triggering
    these function calls instead of generating unsafe content. Extensive experiments across mainstream LLMs demonstrate that
    FC substantially improves defense effectiveness with minimal impact on model helpfulness. To further assess FC’s practical
    utility, we also introduce DSPEC, a new dataset reflecting real-world LLM applications with specific defense requirements.
    Our evaluations on DSPEC show that FC substantially outperforms existing defenses in this realistic setting. Besides,
    we also explore the practical applications of FC in various scenarios, including universal defense frameworks and multi-agent
    systems, further demonstrating its versatility and effectiveness in enhancing LLM security.
