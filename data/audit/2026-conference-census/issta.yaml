  official_record_id: c2ca0fa4-8051-4f95-908b-d065132e1fee
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) have recently shown promising potential in automating unit test updates for evolving
    software systems. However, the effectiveness of LLMs in unit test evolution remains insufficiently understood, particularly
    with respect to prompt design choices, in-context learning (ICL) strategies, and different types of test evolution. In
    this paper, we present the first comprehensive empirical study to evaluate LLMs for unit test evolution. We systematically
    assess nine open-source code LLMs with parameter sizes ranging from 3B to 34B, along with three state-of-the-art commercial
    models, under diverse prompt designs and ICL methods. To support robust and execution-based evaluation, we construct a
    new benchmark consisting of 530 real-world focal method–test co-evolution instances collected from seven actively maintained
    open-source projects. Our evaluation employs a suite of compilation, execution, and coverage-based metrics. Extensive
    experimental results reveal that prompt design and ICL methods play a critical role. However, different LLMs and evolution
    types should adopt different prompt design strategies and ICL methods in the unit test evolution. Based on our findings,
    we derive actionable insights to guide future research and practical adoption of LLM-based techniques for unit test evolution.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/191/On-the-Evaluation-of-Large-Language-Models-in-Unit-Test-Evolution-Experience-Paper-
