- title: 'You are deceived in the pocket: Intrusive Advertisements in Mobile Applications: An Exploratory Study'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: eb849ca1-5ffa-49e9-8cf6-7bf412432668
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Mobile advertising has become the primary monetization module for the Android ecosystem. However, this growth
    is accompanied by increasingly complex intrusive advertisements that undermine user agency through sophisticated behavioral
    interference. Current detection research remains confined to the web context, failing to address the unique in-app characteristics
    of mobile intrusive ads. Existing ad analysis tools struggle to distinguish voluntary human actions from forced interactions
    due to the absence of intent-aware modeling. Furthermore, existing marketplace policies and legal frameworks lack unified
    terminology and enforceable rules, leading to inconsistent oversight. In this paper, we conduct an exploratory study to
    systematically investigate and model these behaviors. We propose a formal taxonomy grounded in state-transition logic
    and develop an automated tool to identify intrusive patterns. Our analysis of more than 6,000 apps confirms the prevalence
    of mobile intrusive ads. Additionally, we perform a comparative analysis of mainstream regulations, uncovering significant
    misalignments in policy standards across different jurisdictions. Our study establishes a critical theoretical and practical
    foundation for ecosystem governance, enabling more effective detection and evidence-based policy refinement.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/95/You-are-deceived-in-the-pocket-Intrusive-Advertisements-in-Mobile-Applications-An-E
