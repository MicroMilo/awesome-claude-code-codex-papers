- title: 'SemantiX: A Compatibility Checker between Applications and Compositions of Distributed Systems'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 20914662-75dc-43dc-833f-19a00af583e4
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Modern distributed applications compose multiple services with different consistency guarantees. Mismatches between
    application requirements and chosen system semantics can introduce subtle bugs, but verifying compatibility across complex
    applications is both challenging and time-consuming. In particular, existing approaches on testing or rigorous formal
    verification lack flexibility and cannot promptly provide correctness guarantees on multi-semantic compositions. We present
    SemantiX, a framework for checking semantic compatibility between applications and compositions of distributed systems
    with heterogeneous consistency models. SemantiX embeds formally defined distributed system modules of consistency semantics
    which include the first formal definition of visibility constraints. SemantiX introduces the AppGraph approach for systematically
    modeling complex applications. Applications modeled using AppGraphs can be checked for their compatibility against a combination
    of distributed system modules. Alternatively, SemantiX can search for combinations of modules compatible to the application.
    We present three case studies on a movie streaming service, an e-commerce platform, and a cross-service causal distributed
    storage service. We demonstrate that SemantiX can capture complex service compositions with minimal encoding effort and
    quickly check compositional compatibility with underlying systems or find the compatible system sets. SemantiX enables
    developers to efficiently verify distributed application designs and explore alternative consistency configurations, supporting
    more agile development.
