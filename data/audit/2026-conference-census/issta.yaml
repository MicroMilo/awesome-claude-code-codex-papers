- title: 'CONCUR: Benchmarking LLMs for Concurrent Code Generation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 45565af4-5635-435b-8136-26d32ffcae73
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Leveraging Large Language Models (LLMs) for code generation has increasingly emerged as a common practice in the
    domain of software engineering. Relevant benchmarks have been established to evaluate the code generation capabilities
    of LLMs. However, existing benchmarks focus primarily on sequential code, lacking the ability to effectively evaluate
    LLMs on concurrent code generation. Compared to sequential code, concurrent code exhibits greater complexity and possesses
    unique types of bugs, such as deadlocks and race conditions, that do not occur in sequential code. Therefore, a benchmark
    for evaluating sequential code generation cannot be useful for evaluating concurrent code generation with LLMs. To address
    this gap, we designed a benchmark CONCUR specifically aimed at evaluating the capability of LLMs to generate concurrent
    code. CONCUR consists of a base set of 43 concurrency problems derived from a standard concurrency textbook, together
    with 72 validated mutant variants, resulting in 115 total problems. The base problems serve as the semantic core of the
    benchmark, while the mutants expand linguistic and structural diversity. We conducted an evaluation of a range of LLMs
    on CONCUR, highlighting limitations of current models. Overall, our work provides a novel direction for evaluating the
    capability of LLMs to generate code with focus on concurrency.
