- title: 'CLIR: Liveness-Driven and Structure-Aware Fuzzing for the Cranelift Compiler'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e1b36bbd-eb30-4b6c-8fc1-ce43e172a857
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Modern compilers are complex software systems that must correctly translate high-level programming languages into
    machine code across multiple architectures. Cranelift, a fast and modern compiler backend originally developed for WebAssembly
    and recently adopted as an experimental backend for Rust, has gained increasing importance due to its superior compilation
    speed compared to LLVM and comprehensive multi-architecture support, including x86-64, AArch64, s390x, and RISCV64. However,
    despite decades of development in compiler testing, testing Cranelift still illustrates unique challenges, i.e., (1) constructing
    valid IR under the strict enforcement of SSA form, (2) generating sequences with sufficient computational density to stress
    backend components, and (3) balancing broad backend coverage with efficient root cause analysis across heterogeneous architectures.
    To address these challenges, we propose CLIR, a differential testing framework that integrates a syntax-preserving hierarchical
    generation strategy to guarantee SSA validity, a liveness-guided instruction refinement mechanism to maximize computational
    density, and a diagnosis-guided cross-architecture adaptation scheme to facilitate efficient root cause analysis across
    heterogeneous backends. Our comprehensive evaluation demonstrates that CLIR significantly outperforms existing state-of-the-art
    baselines, detecting 8×, 24×, and 8× more unique bugs than them, i.e., cranelift-fuzzgen, wasm-smith, and WASMaker, respectively,
    while RustSmith even uncovered zero bugs. Consequently, within 72 hours of testing, CLIR discovered 24 bugs, with 21 confirmed
    and 9 fixed spanning all target architectures.
