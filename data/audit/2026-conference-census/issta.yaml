- title: Is "Knowing It's Malicious'' Enough? Evaluating LLMs for Fine-Grained Malware Behavior Auditing
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f394942f-5a68-4b5f-8d17-722df61d43bc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Automated malware classifiers achieve strong detection performance, but auditing requires more than flagging
    a sample: analysts must explain malicious behaviors and justify them with concrete code evidence, a requirement that traditional
    signature-based methods and learning-based XAI often fail to satisfy in a human-interpretable manner. Large Language Models
    (LLMs) appear well-suited for this task due to their code reasoning and summarization ability, yet it is unclear whether
    their reasoning capabilities are up to the auditing. In particular, evaluating them faces three hurdles: (1) the lack
    of detailed, human-written behavior ground truth for reliable benchmarking; (2) the scale of real-world applications’
    codebases typically exceed the context limits of current models, which cannot be fully processed at once; and (3) the
    absence of reliable mechanisms to verify whether LLM-generated behavioral claims are faithfully supported by concrete
    code evidence. Together, these obstacles make benchmarking LLM-based auditing non-trivial, leaving their true capabilities
    and failure modes opaque. To bridge this gap, we introduce MalEval, an evaluation framework for systematically measuring
    the reasoning fidelity of LLMs in malware auditing. We pair real-world application codebases with expert-written audit
    reports to obtain fine-grained, behavior-level ground truth. Large codebases are compressed into unified behavior-relevant
    program contexts via a context-driven intermediate representation that preserves essential call relations. Both expert
    reports and model outputs are then mapped, through constrained reasoning, into structured evidence chains linking code-level
    facts to high-level behaviors in a common, comparable space. Built on this foundation, MalEval decomposes auditing into
    4 stage-wise auditing tasks, allowing each intermediate judgment to be independently verified under limited context windows.
    We leverage MalEval to evaluate seven widely used LLMs and uncover clear capability boundaries: models rely on surface
    cues over verifiable evidence, struggle to compose dispersed facts into coherent attack chains, and are highly sensitive
    to context formulation. These findings shift the focus from optimizing isolated outputs to designing LLM and agentic workflows
    that can reliably support malware auditing.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/96/Is-Knowing-It-s-Malicious-Enough-Evaluating-LLMs-for-Fine-Grained-Malware-Behavio
