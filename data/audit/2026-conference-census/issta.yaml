- title: Empowering Lightweight Language Models for Security Code Review via Context-Aware Distillation
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: a6cc0da1-e77e-497a-b6b8-938d399e34df
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Security code review, which specifically examines software from a security perspective, is indispensable for preempting
    vulnerabilities and bolstering software reliability. However, existing automated approaches face a dilemma. They either
    rely on large language models with prohibitive deployment costs, or employ lightweight models that struggle with complex
    reasoning and global contextual understanding. In this paper, we propose \textbf{LSCR}, a context-aware distillation framework
    that empowers lightweight language models for security code review by distilling static-analysis–style security rationale
    from powerful teacher models. Rather than directly transferring final review outputs, LSCR guides student models to internalize
    how high-level security judgments are systematically derived from low-level code evidence, leveraging repository-level
    context during training. By embedding this evidence-driven analysis paradigm into lightweight models, LSCR enables more
    reliable security code reviews under constrained model capacity. When compared with competitive lightweight baselines,
    LSCR attains an average improvement of over \textbf{12%} in security issue classification accuracy and more than \textbf{13.3%}
    gains in BLEU score for review generation. Human evaluation reveals that LSCR increases the proportion of instrumental
    reviews by \textbf{52.6%} on average over state-of-the-art baselines, while reducing misleading feedback by \textbf{22.6%}.
    LSCR effectively narrows the performance gap between small-scale and large-scale models, making on-premise security code
    review more feasible in practice.
