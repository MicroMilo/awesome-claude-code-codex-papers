- title: 'Tracing the Shadows: Automatic Tracking and Analysis of Crypto Money Laundering via Transaction Semantic Analysis'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fc09870f-098e-449d-9e87-bc2104ebbdbf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: With the rapid advancement of decentralized finance (DeFi), security incidents related to cryptocurrency have
    become increasingly prevalent. After such incidents, attackers typically attempt to rapidly move stolen assets, concealing
    the origin of illicit funds and ultimately converting them into fiat currency. However, existing anti-money laundering
    (AML) methods struggle to cope with the semantic complexity of DeFi transactions. They either rely heavily on low-level
    token transfers, or perform protocol-agnostic money flow analysis, failing to capture the high-level intent of transactions.
    This limitation results in misleading tracing paths with substantial noise and fails when laundering activities span multiple
    blockchains. In this paper, we propose AMLGuard, a semantic-aware AML framework for account-based blockchains. AMLGuard
    tracks illicit fund flows from known malicious addresses by performing semantic analysis on complex DeFi transactions,
    enabling accurate and continuous laundering tracking. Given a complex transaction, AMLGuard combines static rule-based
    analysis with retrieval-augmented large language model (LLM) reasoning to infer implicit DeFi semantics, transforming
    raw transaction data into high-level semantic representations. Furthermore, for cross-chain transactions where laundering
    intent is not explicitly exposed, AMLGuard parses transaction parameters and performs argument parsing to recover cross-chain
    semantics, enabling seamless tracking across ledgers. Based on the inferred semantics, AMLGuard abstracts each transaction
    into a DeFi Semantic Unit (DSU). These DSUs are analyzed and composed iteratively to update account states, expand the
    tracing frontier, and ultimately construct the illicit fund-flow topology. We evaluate the effectiveness of AMLGuard on
    82 real-world laundering cases, involving illicit assets worth over $1 billion. Specifically, AMLGuard reconstructs compact
    illicit fund-flow topologies with destination precision of 94.4% and 87.6%, while achieving the highest address recall
    of 98.4% and 95.8% and destination recall of 94.1% and 93.8% on single-chain and cross-chain datasets. Furthermore, a
    case study demonstrates that AMLGuard can assist real-world AML investigation, substantially reducing analysis time and
    effort.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/36/Tracing-the-Shadows-Automatic-Tracking-and-Analysis-of-Crypto-Money-Laundering-via-T
