- title: Integrating Multiple Features for Weakly-Supervised False-Passing Products Detection in Software Product Lines
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6f8ba8e6-c701-4264-aa7f-d8e7d0a8bb01
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Software Product Lines (SPL) enable the efficient development of configurable systems through feature modularization.
    However, the inherent configurability of software introduces significant challenges for fault localization within these
    systems. A key challenge among these is the problem of false-passing products, configurable products that contain faulty
    code yet coincidentally pass all their associated tests, thereby masking faults and misleading diagnosis efforts. To mitigate
    the negative impact of false-passing products. Supervised detection approaches are often impractical due to their reliance
    on complete labels, which are unavailable during early testing phases. To address this, we propose PULP, a label-agnostic
    detection approach that exploits the execution similarity between failing and false-passing products. PULP extracts five
    categories of features and employs a weakly-supervised learning algorithm to identify false-passing products without pre-labeled
    data. Evaluated on 823 buggy versions from six real-world SPL systems, PULP achieves superior detection performance, with
    best accuracy of 90.33% and precision of 94.93% for false-passing products and consistently enhances fault localization
    rankings after eliminating the negative impact of false-passing product. This method offers a practical tool for SPL testing
    and debugging in label-incomplete environments.
