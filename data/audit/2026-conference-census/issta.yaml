- title: 'TensorLock: Recovering Model Dependency for Model Supply Chain'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 4a7fa1f3-f096-42d0-8aa4-21d06843a602
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The public models on the model hosting platforms have undergone exponential growth, allowing developers to build
    upon existing models rather than training from scratch. These models are continuously reused, modified, and re-distributed
    similar to traditional software components, breeding a dense and rapidly evolving model supply chain. However, while enjoying
    the benefits of model reuse, developers also inherit supply risks ranging from legal liabilities to security threats.
    To mitigate these risks, a well-established model dependency graph can significantly benefit supply chain risk governance.
    Unfortunately, although model hosting platforms offer mechanisms for dependency disclosure, such declarations are optional
    and frequently missing. To address this challenge, we propose a novel model dependency recovering framework TensorLock.
    It works in two phases; i.e., (1) model clustering, and (2) type-aware dependency identification within theseclusters.
    In the first phase, TensorLock performs connectivity-based clustering to accommodate the open-ended dependency topology,
    grouping models with dependency relations. In the second phase, TensorLock employs a divide-and-conquer strategy, leveraging
    distinct type-specific fingerprints to first identify data-free dependencies (Quantization and Merging), and then resolve
    data-driven Fine-Tuning dependencies. Our evaluation demonstrates that TensorLock substantially outperforms state-of-the-art
    approaches, achieving an ARI of 0.96 in clustering and a DF1 of 0.82 in dependency identification, improving over the
    best baselines by at least 39% and 193%, respectively. Additionally, we apply TensorLock to 289 supposedly isolated models
    and recover 189 previously missing model dependencies, with 42 model authors confirming our findings.
