- title: 'CAST: A Compiler-Based Framework for Systematically Testing LLM Compositional Safety'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 65a85e12-6896-4cb1-b0ec-4f096f671c71
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language models (LLMs) are increasingly used in software pipelines, raising concerns about harmful behaviors
    in security-critical domains. Existing safety evaluations predominantly probe models with single prompts or short interactions,
    and therefore do not capture how safety behaves under multi-step workflows where individual requests are composed into
    complex behavior. This paper introduces compositional safety, the property that an LLM remains safe not only against isolated
    malicious prompts, but also under structured, long-horizon decompositions of harmful intents. we propose CAST, a systematic
    testing framework designed to evaluate the compositional safety of LLMs in the domain of malicious code. Drawing inspiration
    from modern compiler infrastructures, CAST decouples test case generation from test execution using a novel intermediate
    representation, CAIR. This architecture allows the framework to automatically refine high-level testing intents into granular
    sub-tasks that serve as unit tests for the model’s alignment. These components are subsequently instantiated by the System
    Under Test (SUT) and reassembled to verify if the model can be driven to realize the original harmful goal. We evaluate
    CAST on four state-of-the-art LLMs across three security-critical testbeds. Our results demonstrate that CAST systematically
    exposes severe safety violations in strongly aligned models that resist conventional red-teaming, achieving up to a 365%
    increase in successful test cases compared to baseline testing strategies.
