- title: Test Case Prioritization for DNNs via Neural Collapse Instability
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 2c2caf0a-b266-4782-b638-1f5e5248bd88
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: With the widespread deployment of deep neural networks (DNNs) in safety-critical domains, reducing the cost of
    model validation under limited testing budgets has become increasingly important. Existing test case prioritization techniques
    often rely on single-checkpoint confidence signals derived from output probabilities. However, DNNs can be confidently
    wrong, and the confidence margin between the predicted and competing classes is frequently small, which weakens early
    fault discovery. To address this limitation, we propose a \textbf{N}eural-\textbf{C}ollapse-\textbf{I}nspired \textbf{P}rioritization
    (\textbf{NCIP}) framework that replaces absolute confidence with cross-checkpoint consistency in the terminal training
    regime, where model geometry becomes highly structured. NCIP introduces two key components. First, it selects a coherent
    set of late training checkpoints by measuring the equiangularity of classifier weights, quantified as the standard deviation
    of pairwise cosine similarities among class weight vectors. Second, it prioritizes test inputs by their prediction variability
    across the selected checkpoints, surfacing boundary-adjacent and failure-prone samples that are unstable under checkpoint-induced
    decision boundary shifts. Extensive experiments across multiple datasets and architectures show that NCIP consistently
    improves early fault discovery over strong baselines, achieving \textbf{2.34%–13.57%} RAUC gains and \textbf{4.61%–31.77%}
    RAUC-$500$ gains under the same testing budget. NCIP further attains the best average performance across all dataset model
    pairs.
