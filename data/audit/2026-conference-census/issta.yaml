- title: 'E4R-Reviewer: Effective and Explainable Automated Code Review via End-to-End Reasoning-Guided Alignment'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 00e0bb6a-dfdf-4fa0-903f-64750785d876
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code review is a key practice for ensuring software quality and maintainability. Despite progress in Automated
    Code Review (ACR), existing methods face two core challenges: \textbf{(1) Isolated Task Modeling.} Current approaches
    often model and optimize subtasks in ACR independently, ignoring the inherent logical order and internal dependencies
    among them which affects the effectiveness of ACR. \textbf{(2) Lack of Explainability.} At the task level, the absence
    of explanatory information in review comments increases developers’ cognitive load; at the model level, the black-box
    nature fundamentally undermines developer trust. To address these challenges, we propose \textbf{\textsc{E4R-Reviewer}},
    improving the \textbf{\underline{E}}ffectiveness and \textbf{\underline{E}}xplainability of ACR via \textbf{\underline{E}}nd-to-\textbf{\underline{E}}nd
    \textbf{\underline{R}}easoning-guided alignment. \textit{For effectiveness}, \textsc{E4R-Reviewer} unifies multiple fine-grained
    ACR subtasks into a single end-to-end reasoning process, enabling cross-task knowledge sharing and allowing the model
    to explicitly complete a reasoning chain of “quality estimation–issue localization–issue classification–issue description–fix
    suggestion–code refinement” in one generation. Meanwhile, we adopt a Group Relative Policy Optimization (GRPO)-based reinforcement-learning
    alignment, treating the reasoning steps as optimizable intermediate objectives. We design subtask-specific rewards and
    integrate them via curriculum-inspired, multi-stage reward fusion that follows the real-world review workflow. \textit{For
    explainability}, \textsc{E4R-Reviewer} produces reasoning process and generates structured review results covering all
    fine-grained ACR subtasks, improving the transparency and explainability of the review results. Extensive evaluations
    on public, real-world datasets demonstrate that \textsc{E4R-Reviewer} significantly outperforms existing methods and achieves
    state-of-the-art performance: a 74.61% F1-score in quality estimation and +22.96% CodeBLEU in code refinement. Furthermore,
    Large Language Model (LLM) and human evaluation further confirm the superiority of \textsc{E4R-Reviewer} in terms of effectiveness
    and explainability.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/5/E4R-Reviewer-Effective-and-Explainable-Automated-Code-Review-via-End-to-End-Reasonin
