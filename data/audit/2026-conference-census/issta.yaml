- title: 'HELO-APR: Enhancing Low-Resource Program Repair through Cross-Lingual Knowledge Transfer'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: f9baaedc-ff41-42c1-b163-e9977dc84793
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) perform well on automatic program repair (APR) for high-resource programming languages
    (HRPLs), but their effectiveness drops sharply in low-resource programming languages (LRPLs), due to a lack of sufficient
    verified buggy-fixed pairs for APR training. To address this challenge, we propose \emph{HELO-APR} (\emph{H}igh-resource
    \emph{E}nabled \emph{LO}w-resource APR), a two-stage APR framework that enables cross-lingual transfer of repair knowledge
    from HRPLs to LRPLs. \emph{HELO-APR} (1) constructs high-quality LRPL training data by synthesizing LRPL buggy-fixed pairs
    from HRPL counterparts, preserving defect type consistency while ensuring the synthesized code is idiomatic, and then
    (2) adopts a curriculum learning strategy that progressively performs HRPL repair learning, cross-lingual repair alignment,
    and LRPL repair adaptation, improving repair effectiveness in LRPLs. Using C++ as the source HRPL and Ruby and Rust as
    the target LRPLs, experiments on xCodeEval show that \emph{HELO-APR} achieves the best macro-average Pass@k results and
    outperforms strong baselines in most settings, increasing Pass@1 from 31.17% to 48.65% on DeepSeek-Coder-6.7B and from
    1.67% to 11.97% on CodeLlama-7B, while improving syntactic validity by raising the macro-average target compilation rate
    on CodeLlama from 49.77% to 91.98%. On Defects4Ruby, \emph{HELO-APR} increases BLEU-4 from 61.20 to 66.79 and ROUGE-1
    from 76.76 to 83.59 on CodeLlama-7B, indicating higher similarity to developer patches in real-world settings. Finally,
    we conduct ablation studies to assess the necessity of each core component. These results suggest that verified cross-lingual
    supervision provides a reusable approach for improving LLM-based repair in low-resource languages.
