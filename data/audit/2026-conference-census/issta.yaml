- title: 'The Fix is Right at Hand: Fixing Incompatibility Errors Guided by Library Knowledge for Automatic Library Upgrade'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: bf8cb8aa-170c-43dd-9f20-4998a6308695
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Third-party libraries (TPLs) play critical roles in modern software development. Upgrading them is crucial for
    enhanced security and functionality, but often introduces incompatibility errors, caused by breaking changes in library
    APIs, in client code. Existing approaches rely on predefined migration patterns or API recommendation heuristics, which
    suffer from limited pattern coverage and ignore the usage context of broken API, leading to incorrect or incomplete fixes.
    To address these limitations, we propose Librarian, a novel LLM-based approach to automatically fix incompatibility errors
    when upgrading a dependent library in a client project. The core idea of Librarian is to extract context-aware fix hints
    from the library codebase, serving as semantic few-shot examples, enabling LLM to generate fixes without relying on predefined
    patterns. Since LLM may generate an incorrect or incomplete fix, Librarian performs fix refinement based on compilation
    feedback from the client project. Our evaluation has demonstrated that Librarian achieves a fixing success rate of 84.2%,
    outperforming the state-of-the-arts by at least 45.3%. Our evaluation has also indicated the practical usefulness of Librarian
    in fixing incompatibility errors in 32 real-world projects.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/25/The-Fix-is-Right-at-Hand-Fixing-Incompatibility-Errors-Guided-by-Library-Knowledge-f
