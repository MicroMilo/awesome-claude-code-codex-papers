- title: 'CausalRepair: Bridging the Causality Gap in Large Language Model-based Automated Program Repair via Dual-Slicing'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 2ac27f0b-5a03-40f6-8f73-3e546445425f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Automated Program Repair (APR) aims to automatically fix buggy programs. In recent years, with the rapid advancement
    of Large Language Models (LLMs), LLM-based APR techniques have achieved significant progress. Despite their potential,
    the effectiveness of LLMs relies heavily on the quality of the provided repair context. However, existing LLM-based APR
    approaches suffer from a causality gap when constructing such contexts. Specifically, on the test side, existing methods
    struggle with test context ambiguity arising from noise interference or dependency absence; meanwhile, on the source side,
    existing retrieval-augmented methods primarily rely on static analysis inevitably introduce static over-approximation,
    resulting in contexts filled with unexecuted code and noise. Consequently, these contexts mislead LLMs, hindering them
    from identifying the true root cause and leading to incorrect fixes. To bridge this gap, we introduce the concept of minimal
    causal context, defined as the essential set of dependencies required to explain a specific failure. Based on this, we
    propose CausalRepair, a novel conversation-driven APR framework that instantiates this concept through a synergistic dual-slicing
    strategy. Specifically, CausalRepair employs context-aware static slicing on the test side to purify test semantics, and
    utilizes execution-trace-based dynamic slicing on the source side to capture precise runtime dependencies. This constructs
    a high-quality context causally relevant to the bug, which filters out irrelevant code and guides the iterative repair
    process. We evaluate CausalRepair on the widely used Defects4J (V1.2 and V2.0) and the latest Defects4J-Trans benchmarks.
    To ensure a fair comparison, we unify the backbone model as DeepSeek-V3 in all experiments. The results demonstrate that
    CausalRepair correctly fixes 313 bugs on Defects4J, significantly outperforming state-of-the-art approaches such as ReinFix
    and TSAPR, while reducing the average repair cost to $0.029 per bug, achieving a dual optimization of effectiveness and
    efficiency.
