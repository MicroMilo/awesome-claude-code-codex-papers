  full_text_scan: metadata-filtered
  official_record_id: eeb4ab64-0fda-492e-9b9f-7d6d26ce87f2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Graphical user interface (GUI) tests are widely used in regression testing of mobile applications (apps) to validate
    app behavior from the user’s perspective. However, frequent app evolution, such as UI redesigns and feature updates, often
    renders existing GUI tests obsolete, even when underlying functionality remains unchanged. Automatically repairing such
    tests is critical for maintaining test suites and reducing substantial manual effort. Despite the practical importance,
    there is still a lack of a systematic understanding of the characteristics of obsolete GUI tests and a publicly available
    benchmark to support their study. To fill this gap, we construct a benchmark comprising 736 obsolete GUI tests collected
    from 36 real-world mobile apps across 668 historical versions. We then conduct a large-scale empirical study that reveals
    two major challenges in repairing obsolete GUI tests: First, identifying the intended target widget is difficult because
    widget attributes are frequently missing or unstable, and visually similar widgets may correspond to different functionalities.
    Second, the target widget is often no longer directly reachable from the failure state, as it may be hidden behind additional
    UI interactions or relocated to another screen. To address these challenges, we further propose GUIRevive, an automated
    GUI test repair approach that addresses semantic ambiguity in widget identification and target unreachability under UI
    evolution by integrating semantic-aware reasoning, functionality-preserving validation, and goal-guided UI exploration.
    Our evaluation shows that GUIRevive successfully repairs 86.4% of obsolete GUI tests and significantly outperforms state-of-the-art
    repair techniques by up to 220%. Moreover, GUIRevive has been deployed in industrial settings, achieving a 93% repair
    success rate on industrial mobile apps.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/209/Characterizing-and-Repairing-Obsolete-Android-GUI-Tests-under-UI-Evolution
