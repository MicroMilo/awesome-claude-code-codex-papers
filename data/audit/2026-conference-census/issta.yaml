- title: 'E2WR: An Effective and Efficient Reduction Framework for WebAssembly Binaries'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: e11dfea2-9ea0-465e-bdd2-c8367afaeca9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'WebAssembly (Wasm) is a prominent programming language enabling high-performance execution across diverse computing
    environments. However, bugs in Wasm runtimes, which execute Wasm binaries, can lead to severe security breaches and system
    failures. Manually debugging Wasm binaries that trigger such runtime bugs is exceedingly difficult due to their poor human
    readability, stemming from low-level stack-based instructions, complex control flow structures, and extraordinary length,
    often containing millions of instructions. Thus, there is a critical need for automated reduction techniques that minimize
    Wasm binaries while preserving the ability to trigger the original bug. However, existing reducers often suffer from significant
    limitations in effectiveness and efficiency: language-agnostic reducers frequently generate invalid variants without Wasm
    validation awareness, while Wasm-specific reducers still lack efficient delta-debugging-style intra-function instruction-sequence
    reduction and reduce non-function definitions inefficiently. To address these challenges, we propose E$^2$WR, an effective
    and efficient reduction framework for Wasm binaries. E$^2$WR introduces a two-stage approach for intra-function instruction-sequence
    reduction, consisting of operand-dependency guided instruction reduction and combinational redundancy elimination to enable
    efficient delta debugging while avoiding unnecessary padding instructions, and a non-function-oriented reduction approach
    that combines static analysis with delta-debugging-guided trials to remove property-irrelevant non-function definitions
    efficiently. Compared with Wasm-Shrink and Wasm-Reduce, E$^2$WR produces binaries that are 95.4% and 63.9% smaller, respectively,
    and achieves reduction speed improvement of 11.1$\times$ and 5.1$\times$, respectively.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/171/E2WR-An-Effective-and-Efficient-Reduction-Framework-for-WebAssembly-Binaries
