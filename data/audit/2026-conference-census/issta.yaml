- title: 'Deprecated but Not Abandoned: A Large-Scale Empirical Study on Growing-user-demand Deprecated NPM Packages'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 5f5afd8a-2ff0-48f9-8cb2-1c2b7098b800
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Package deprecation in ecosystems like NPM signals the termination of maintenance, and continued use of such packages
    poses potential sustainability and security risks to dependent projects. We observe a counter-intuitive phenomenon from
    widely-used deprecated packages whose user demand continues to grow after deprecation; we define these as Growing-user-demand
    Deprecated NPM Packages (GDNPs). Despite this clear contradiction between deprecation and growing user demand, the community
    engagement, reasons, and challenges of GDNPs have not been systematically examined. To bridge this gap, we conduct a mixed‑method
    empirical study that identifies and analyzes 825 GDNPs from 4,011 widely‑used deprecated packages, alongside surveys of
    76 maintainers and 67 users. We find that GDNPs grow on average by 82,811 download counts per month after deprecation,
    yet repository‑level community engagement declines significantly, revealing an expanding maintenance gap. Quantitatively,
    GDNPs contribute to over 126 million monthly exposures to high-severity vulnerabilities. Surveys indicate that continued
    reliance stems primarily from the complexity of the dependency tree and user inertia, leading to reactive maintenance
    and the accumulation of technical debt. Furthermore, topic modeling of post-deprecation discussions of GDNP repositories
    shows that community discussions heavily prioritize functional errors while seldom discussing security vulnerabilities,
    highlighting a misalignment between perceived and actual risk. Based on the results, we provide actionable implications
    that can facilitate future research and assist stakeholders in improving the maintenance of GDNP.
