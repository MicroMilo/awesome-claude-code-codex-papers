- title: 'CID: Clean-Seed-Free Backdoor Defense via Counterfactual Invariance for Neural Code Models'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: c6238397-7144-47b8-a919-e382ae4eb2df
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Neural code models, which automate foundational software engineering tasks such as code classification and generation,
    are critically vulnerable to backdoor attacks. Yet, existing defenses face a dual failure: they struggle with sophisticated
    threats spanning injection-based and semantically-equivalent transformation (\textit{SET-based}) backdoor attacks, and
    they rely on a restrictive assumption—a trusted, pre-verified \emph{in-distribution} clean seed set—that can be costly
    and difficult to obtain and audit in practice. This paper introduces Counterfactual Invariance-based Defense (CID), a
    clean-seed-free backdoor defense—requiring no \emph{a priori} trusted \emph{in-distribution} clean data—grounded in \emph{operational}
    counterfactual invariance tests. CID’s core insight is that clean and poisoned samples exhibit \emph{asymmetric counterfactual
    behavior}: clean predictions degrade under semantic context corruption (semantic sufficiency), whereas backdoor predictions
    change when a localized trigger is neutralized (trigger necessity). Accordingly, CID applies two orthogonal probes—a contextual
    intervention to test semantic sufficiency and a structural neutralization test guided by a gradient-based probe to test
    trigger necessity—to extract a high-purity clean seed set directly from a mixed dataset. This seed set then enables Mahalanobis-based
    clustering in representation space to partition the full dataset. Evaluated across four software engineering tasks and
    three model architectures, and further validated on multilingual code summarization, CID achieves strong poison detection
    performance among evaluated baselines while keeping false positives low in most settings. By eliminating reliance on \emph{a
    priori} trusted \emph{in-distribution} clean seed data, CID provides a practical pathway toward more secure deployment
    of neural code models.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/160/CID-Clean-Seed-Free-Backdoor-Defense-via-Counterfactual-Invariance-for-Neural-Code-M
