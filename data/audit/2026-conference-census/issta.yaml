- title: 'AutoCodeSherpa: Symbolic Explanations in AI Coding Agents'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 2e020ecf-b173-49f3-894d-e3f50566085d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large language model (LLM) agents integrate external tools with one or more LLMs to accomplish specific tasks.
    Agents have rapidly been adopted by developers, and they are starting to be deployed in industrial workflows, such as
    their use to fix static analysis issues from the widely used SonarQube static analyzer. However, the growing importance
    of agents means their actions carry greater impact and potential risk. Thus, to use them at scale, an additional layer
    of trust and evidence is necessary. This work presents AutoCodeSherpa, a technique that provides explanations of software
    issues in the form of symbolic formulae. Inspired by the reachability, infection, and propagation model of software faults,
    the explanations are composed of input, infection, and output conditions, collectively providing a specification of the
    issue. In practice, the symbolic explanation is implemented as a combination of a property-based test (PBT) and program-internal
    symbolic expressions. Critically, this means our symbolic explanations are executable and can be automatically evaluated,
    unlike natural language explanations. Experiments show the generated conditions are highly accurate. For example, input
    conditions from AutoCodeSherpa had an accuracy of 85.7%. This high accuracy makes symbolic explanations particularly useful
    in two scenarios. First, the explanations can be used in automated issue resolution environments to decide whether to
    accept or reject patches from issue resolution agents; AutoCodeSherpa could reject 2x as many incorrect patches as baselines
    did. Secondly, as agentic AI approaches continue to develop, program analysis driven explanations like ours can be provided
    to other LLM-based repair techniques which do not employ analysis to improve their output. In our experiments, our symbolic
    explanations could improve the plausible patch generation rate of the Agentless technique by 60%.
