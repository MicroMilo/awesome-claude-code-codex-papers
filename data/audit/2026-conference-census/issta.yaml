- title: On the Role of Large Language Models in Robustness-Guided Requirement Falsification
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: f699be3f-3c9a-4305-af5e-5f83cfc37201
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Robustness-guided falsification supports the validation of cyber-physical systems by searching for system traces
    that violate formal temporal requirements. Existing falsification methods typically treat candidate generation as numerical
    search over an input space, guided by quantitative robustness feedback. This paper studies a different mechanism: a guarded
    advisory proposer that uses a Large Language Model to generate candidate inputs. The LLM-based proposer suggests candidates
    inputs using the following information: the requirement to validate, the interface of the system under test, and previously
    evaluated robustness history. Admission gates ensure that only valid candidate inputs are considered for execution. We
    evaluate this approach on 19 falsification requirements from the ARCH-COMP 2024 CPS benchmark and on five synthetic problems.
    The results show that LLM-based proposing is sensitive to model choice and context representation. Among the tested variants,
    GPT-P, which uses a GPT model with the plain context representation, is the most reliable representative variant. On ARCH-COMP,
    GPT-P reaches perfect falsification on 16 of 19 requirements, obtains at least one falsification on all 19 requirements,
    and, on 8 requirements, uses the fewest executions among the reported tools that also achieve perfect falsification. However,
    its performance is heterogeneous. We explain this behavior through three classes of falsification problems: informative
    context cues, ambiguous context cues with strong robustness gradient, and ambiguous context cues with weak robustness
    gradient. Synthetic benchmark problems reproduce these classes under controlled mechanisms. Overall, GPT-P performs best
    on the informative-context-cue class, where the requirement and SUT interface expose useful candidate hypotheses that
    the LLM can exploit before extensive robustness-feedback search is needed. To our knowledge, this use of semantic context
    cues for candidate input proposal is not supported by existing robustness-guided falsification methods.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/48/On-the-Role-of-Large-Language-Models-in-Robustness-Guided-Requirement-Falsification
