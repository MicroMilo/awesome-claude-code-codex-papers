  abstract_reason: Official abstract fetched.
  abstract: As software systems grow in complexity, ensuring maintainability is essential, but often hindered by various quality
    issues. Among them, code smells and test smells are widely recognized indicators of technical debt that degrade system
    quality. While production code and test suites are intrinsically coupled and evolve together, existing research predominantly
    studies code smells and test smells in isolation, ignoring their underlying connection over time. To bridge this gap,
    this paper presents a fine-grained longitudinal study on the co-evolutionary dynamics of “paired smells”, which refer
    to cases where code and test smells exist concurrently in linked production and test code. By analyzing 128,417 commits
    across 19 long-lived open-source Java repositories, we investigate the statistical associations, survival lifespans, and
    removal motivations of these paired flaws. As a result, we identify 30 statistically significant rules where specific
    test smells imply the presence of underlying production code smells and our survival analysis reveals that in most of
    repositories, paired smells have relatively shorter lifespans than unpaired ones. To explain this phenomenon, our manual
    inspection reveals that paired smells often signal deeper structural issues, prompting explicit risk-driven refactoring.
    Finally, we discuss the implications of these results for code quality analysis and continuous integration tools, suggesting
    that they should link related smell findings between production and test code and guide synchronized refactoring.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/173/Paired-Code-Smells-and-Test-Smells-A-Fine-Grained-Longitudinal-Empirical-Study
