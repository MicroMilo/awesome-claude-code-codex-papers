- title: 'IssueExec: A Test-Driven Approach for Localizing Software Engineering Issues'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: ef39d180-599e-49be-b638-a2755de42fdf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Issue localization, which identifies code locations requiring modification from issue descriptions, is a critical
    step in automated software maintenance. Existing approaches predominantly attempt to directly align issue descriptions
    with code elements, yet often struggle due to the inherent abstraction gap between the issue description and code implementation.
    Seeking alternative signals, our theoretical analysis suggests that test suites can serve as executable proxies for requirements,
    reducing localization uncertainty by 2.01 bits on average. A large-scale empirical study on 18 repositories validates
    this premise: existing tests cover 96.98% of ground-truth files, and the two-hop pathway yields stronger semantic connectivity
    than direct matching in 82.4% of cases. Despite their potential, leveraging tests for localization faces two key challenges:
    the semantic gap separating issue descriptions from test identifiers, and the substantial noise in execution traces from
    infrastructure code. To address these, we propose IssueExec, which bridges the semantic gap through domain-knowledge-enhanced
    test representations and filters noise via hierarchical trace analysis. Experiments on SWE-bench Lite show that IssueExec
    achieves state-of-the-art performance, improving function-level Recall@1 by 41.57% over the strongest baseline. When integrated
    into the Agentless pipeline, IssueExec resolves 17.72% more issues, demonstrating practical downstream benefits.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/199/IssueExec-A-Test-Driven-Approach-for-Localizing-Software-Engineering-Issues
