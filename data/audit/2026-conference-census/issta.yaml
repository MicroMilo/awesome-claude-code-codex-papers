- title: 'Context Matters: Improving the Practical Reliability of LLM-Based Unit Test Generation (Experience Paper)'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 369eafa1-6a0a-430e-9f86-c80572955bcc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Automated unit test generation has recently benefited from advances in large language models (LLMs), yet our industrial
    deployments reveal a persistent gap between promising research results and practical usability. In real-world projects
    with complex frameworks and cross-file dependencies, LLM-generated tests frequently fail to compile, require costly manual
    repair, or provide unstable coverage improvements. This paper reports our experience in designing, deploying, and evaluating
    \textbf{CATGen}, a context-aware workflow for LLM-based unit test generation, informed by repeated industrial failures
    and refinements. Rather than relying on LLMs to infer incomplete project context, we found that compilation robustness
    critically depends on making project-level dependencies explicit, stabilizing test class scaffolding, and replacing iterative
    LLM-based repair with lightweight static analysis. These experience-driven insights shaped CATGen’s multi-stage design,
    which combines structured context retrieval, deterministic test skeleton construction, and program analytics–based post-processing.
    We evaluate CATGen on real-world complex focal methods from proprietary industrial projects and additionally on the Defects4J
    benchmark to assess generalizability. Across both settings, CATGen substantially improves compilation success and structural
    coverage while significantly reducing generation time and token consumption compared to existing LLM-based approaches.
    Our results demonstrate that reliable LLM-based unit test generation in practice depends less on prompt engineering alone
    and more on systematic engineering support grounded in real-world development constraints.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/151/Context-Matters-Improving-the-Practical-Reliability-of-LLM-Based-Unit-Test-Generatio
