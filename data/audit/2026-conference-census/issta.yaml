- title: Testing Computation Pushdown in Distributed Database Systems
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 4cbd34bb-59c2-401f-a4b7-e6e6dcd40d68
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Computation pushdown is a critical technique in distributed database management systems (DBMSs), enabling certain
    operations to be executed closer to the data to reduce network overhead and improve performance. However, its behavior
    depends on multiple factors beyond the input query itself, such as data distribution and resource utilization. This makes
    it difficult to validate correctness using only input queries in a black-box manner. Existing testing methods that rely
    solely on query manipulation cannot effectively control or predict pushdown behavior, and are therefore insufficient.
    In this paper, we introduce \emph{Controlled Pushdown Execution (CPE)}, a white-box method that enables systematic validation
    of computation pushdown. CPE modifies the source code of DBMSs to forbid a specific pushdown operator and compares the
    results. Any discrepancy reveals a bug. Our study shows that CPE can control all supported operators across different
    systems. We applied CPE to three production-grade distributed DBMSs: CockroachDB, TiDB, and YugabyteDB. CPE found 25 previously
    unknown and unique bugs, 14 of which are logic bugs—incorrect results. CPE finds 3$\times$ more bugs than historical bugs
    and can reproduce all historical bugs. Beyond computation pushdown, the core insight of controllable execution can generalize
    to other contexts (\emph{e.g.}, transaction schedule), providing a systematic way to uncover subtle logic bugs.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/1/Testing-Computation-Pushdown-in-Distributed-Database-Systems
