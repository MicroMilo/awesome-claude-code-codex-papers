  official_record_id: 14d79c90-dba4-42e9-bf2a-c762ea3f1f79
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Software refactoring is essential for maintaining code quality. However, API replacement refactoring, which replaces
    custom logic with API calls, remains less underexplored. Existing refactoring tools often fail to detect such opportunities
    due to their reliance on rigid templates and their inability to capture complex, multi-statement semantic equivalents.
    To bridge this gap, we conduct the first empirical study of API replacement refactorings, analyzing 166,299 commits across
    six open-source Java projects to quantify their occurrence and to characterize their scope, categories, and recurring
    patterns. Based on these insights, we propose AKIRA (Adaptive Knowledge Discovery and Retrieval), a hybrid framework that
    integrates pattern-deterministic heuristics with a refactoring-aware knowledge base to assess the practical feasibility
    of recommending API replacement refactorings. Our evaluation shows that AKIRA achieves 90% recall and 88% precision on
    a manually curated dataset. Furthermore, on the external RETIWA dataset, AKIRA significantly improves the state of the
    art by increasing recall from 21% to 81% and precision from 40% to 78%. These results demonstrate the effectiveness of
    combining static pattern matching with semantic reasoning to support the automation of recommending complex API replacement
    refactorings.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/119/From-Custom-Logic-to-APIs-Understanding-and-Recommending-API-Replacement-Refactoring
