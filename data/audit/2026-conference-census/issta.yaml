- title: Signal Denoising based Kill Matrix Refinement for Mutation-based Fault Localization
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 7337aa8d-cf92-4953-853e-60723f4d891b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Software debugging is a critical and time-consuming aspect of software development, with fault localization being
    a fundamental step that significantly impacts debugging efficiency. Mutation-Based Fault Localization (MBFL) has gained
    prominence due to its robust theoretical foundations and fine-grained analysis capabilities. However, recent studies have
    identified a critical challenge: noise phenomena, specifically the false kill relationships between mutants and tests,
    which significantly degrade localization effectiveness. While several approaches have been proposed to rectify the final
    localization results, they do not directly address the underlying noise. In this paper, we propose a novel approach to
    refine the kill matrix, a core data structure capturing mutant-test relationships in MBFL, by treating it as a signal
    that contains both meaningful fault-related patterns and high-frequency noise. Inspired by signal processing theory, we
    introduce DKMR (Denoising-based Kill Matrix Refinement), which employs two key stages: (1) signal enhancement through
    hybrid matrix construction to improve the signal-to-noise ratio for better denoising, and (2) signal denoising via frequency
    domain filtering to suppress noise while preserving fault-related patterns. Building on this foundation, we develop MBFL-DKMR,
    a fault localization framework that utilizes the refined matrix with continuous values for suspiciousness calculation.
    Our evaluation on Defects4J v2.0.0 demonstrates that MBFL-DKMR effectively mitigates the noise and outperforms the state-of-the-art
    MBFL techniques. Specifically, MBFL-DKMR achieves 129 faults localized at Top-1 compared to 85 for BLMu and 103 for Delta4Ms,
    with negligible additional computational overhead (0.11 seconds, 0.001% of total time). This work highlights the potential
    of signal processing techniques to enhance the effectiveness of MBFL by refining the kill matrix.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/63/Signal-Denoising-based-Kill-Matrix-Refinement-for-Mutation-based-Fault-Localization
