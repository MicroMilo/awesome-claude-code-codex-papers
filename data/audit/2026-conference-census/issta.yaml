- title: 'Re-evaluating Detection of Equivalent Mutants Using LLMs: We Should Properly Measure How Far We Are'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: fd911d5d-a3e7-4bc0-855c-8b00e73308c2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Mutation testing is a widely used approach for measuring quality of test suites. Equivalent mutant detection (EMD),
    i.e., determining if a mutant semantically behaves the same as the original code despite some syntactic differences, is
    a critical problem in mutation testing. A recent study has shown the great promise of LLM-based EMD techniques, reporting
    substantial improvements over traditional compiler- and machine-learning–based approaches. In this work, we revisit prior
    results and evaluate the generalization capabilities of LLM-based EMD techniques across two new datasets that differ from
    the original dataset in mutation operators, programming languages, and source projects. Contrary to prior findings, all
    studied LLM-based EMD techniques suffer substantial performance degradation on the new datasets. Through extensive analysis,
    we identify original-method–level data leakage in the original dataset as a key factor inflating earlier results and show
    that LLMs often rely on a method-wise majority-voting shortcut rather than reasoning about the semantic effects of individual
    mutations. Based on these findings, we call for the adoption of realistic cross-method evaluation settings and the development
    of mutation-centric semantic reasoning in future LLM-based EMD research.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/159/Re-evaluating-Detection-of-Equivalent-Mutants-Using-LLMs-We-Should-Properly-Measure-
