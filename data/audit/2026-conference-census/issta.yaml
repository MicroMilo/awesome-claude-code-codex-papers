  official_record_id: ff76dd16-69e1-430f-973e-77861a650a90
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Network services like FTP and DNS are critical components of modern dependable cyberspace infrastructure. Software
    fuzzing, especially network protocol fuzzing, is widely used to uncover flaws in these systems. However, conventional
    fuzzers focus on network messages, overlook one critical dimension, service configurations. Incorporating configurations
    into fuzzing is challenging due to complex semantics, trigger conditions, and resulting enlarged search space. We tackle
    the problem of finding bugs under non-default configurations, termed ConfBug, by designing a new fuzzer called NCFuzz.
    NCFuzz leverages two key observations: 1) software documentation contains rich information about configurations; 2) interactions
    between configuration and network messages can be tracked through code instrumentation and data-flow analysis. Using these
    insights, NCFuzz uses configuration knowledge and configuration-network-message relation to guide fuzzer towards new software
    states. Evaluations on six network service implementations show NCFuzz achieves higher coverage than baseline fuzzers.
    Five ConfBug were discovered during fuzzing.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/158/NCFuzz-Configuration-guided-Network-Service-Fuzzing
