- title: 'Belobog: Move Language Fuzzing Framework For Real-World Smart Contracts'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d3eaac14-2a20-4c51-9b2e-e7103621821a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Move is a research-oriented programming language designed for secure and verifiable smart contract development
    and has been widely used in managing billions of digital assets in blockchains, such as Sui and Aptos. Move features a
    strong static type system and explicit resource semantics to enforce safety properties such as the prevention of data
    races, invalid asset transfers, and entry vulnerabilities. However, smart contracts written in Move may still contain
    certain vulnerabilities that are beyond the reach of its type system. It is thus essential to validate Move smart contracts.
    Unfortunately, due to its strong type system, existing smart contract fuzzers are ineffective in producing syntactically
    or semantically valid transactions to test Move smart contracts. This paper introduces the first fuzzing framework, Belobog,
    for Move smart contracts. Belobog is type-aware and ensures that all generated and mutated transactions are well-typed.
    More specifically, for a target Move smart contract, Belobog first constructs a type graph based on Move’s type system,
    and then generates or mutates a transaction based on the graph trace derived from the type graph. In order to overcome
    the complex checks in Move smart contracts, we further design and implement a concolic executor in Belobog. We evaluated
    Belobog on 109 real-world Move smart contract projects. The experimental results show that Belobog is able to detect 100%
    critical and 79% major vulnerabilities manually audited by human experts. We further selected two recent notorious incidents
    in the Move ecosystem, i.e., Cetus and Nemo. Belobog successfully reproduced full exploits for both of them, without any
    prior knowledge. Moreover, we applied Belobog on three ongoing auditing projects and found 2 critical, 2 major, and 3
    medium new vulnerabilities, all acknowledged by the project developers.
