- title: 'Sakura: An Approach for Generating Complex Tests from Natural Language Test Descriptions'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: aae49847-9325-4a4c-ac73-b9586af53363
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Testing is a core activity in software development workflows, and research on its automation has spanned several
    decades. Most existing approaches focus on generating unit tests for individual methods, validating isolated API endpoints,
    or targeting user interface (UI) layers. However, for non-API and non-UI tests, automated test generators typically exercise
    a single focal method. Recent empirical evidence shows a substantial gap between such generated tests and developer-written
    tests, which often span multiple focal classes and methods, involve complex call sequences, and contain elaborate assertion
    chains—characteristics that current automated approaches fail to capture. To address this gap, we propose to drive test
    generation from developer intent expressed as natural language (NL) descriptions. NL provides an expressive and accessible
    medium for specifying complex test scenarios and functional intent. We present Sakura, the first agent-based framework
    for generating structurally complex test cases from NL descriptions of test scenarios. Sakura decomposes NL descriptions
    into structured blocks and processes them using a multi-agent system consisting of a localization agent that grounds test
    steps in concrete application code via static analysis, a composition agent that synthesizes compilable test code and
    iteratively refines it using execution feedback, and a supervisor agent that coordinates agent interactions. The framework
    is tightly grounded in static analysis to ensure correctness and executability. To evaluate Sakura, we curate a novel
    dataset of NL test descriptions at three levels of abstraction, reflecting different end-user personas, systematically
    generated from developer-written tests mined from Apache Commons projects. Across 20 applications and 1,464 test scenarios,
    Sakura significantly outperforms off-the-shelf agentic tools such as Gemini CLI instantiated with multiple LLMs. Specifically,
    Sakura achieves 50–78% higher test compilability and 38–66% higher coverage overlap (overlap between the ground-truth
    test and the generated test) compared to baselines using the same models. Moreover, Sakura paired with small open-source
    models such as Devstral Small 2 and Qwen3-Coder outperforms Gemini CLI using large proprietary models, while also being
    more cost-effective.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/21/Sakura-An-Approach-for-Generating-Complex-Tests-from-Natural-Language-Test-Descripti
