- title: 'XSearch: Explainable Code Search via Concept-to-Code Alignment'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 4ff654f8-67cb-4ba8-9522-52e7ff3d731e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: With the emergence of deep learning, semantic code search has been widely adopted in both academia and industry.
    These approaches embed natural-language queries and code snippets into a shared embedding space and retrieve results based
    on vector similarity. Despite their strong performance on benchmark datasets, they often suffer from poor explainability
    and generalization. Retrieved code may appear semantically similar yet miss critical functional requirements of the query,
    while providing no explanation of why the result was retrieved. Moreover, such failures become more severe under distribution
    shift, where models struggle to generalize to unseen benchmarks. In this work, we propose XSearch, an intrinsically explainable
    code search framework. Our key insight is that, by relying on global embedding similarity, all existing retrievers inherently
    take an inductive view. They learn statistical patterns, rather than truly understand the query’s functional requirements.
    Therefore, we address the problem by reformulating code search as a deductive concept alignment problem. At a high level,
    XSearch (i) identifies functional concepts in the query and (ii) explicitly aligns them with corresponding code statements.
    This explain-then-predict design not only produces inherent concept-level explanations, but also mitigates shortcut learning
    that harms out-of-distribution generalization. We train an encoder with explicit concept-alignment objectives and perform
    retrieval through explicit matching between query concepts and code statements. Experiments show that, when trained on
    CodeSearchNet with a small model size (GraphCodeBERT with 125M parameters), XSearch improves performance on out-of-distribution
    benchmarks from 0.02 to 0.33 (15×) over eight state-of-the-art retrievers, and consistently outperforms both encoder-based
    and decoder-based baselines with up to 7B parameters. A controlled user study further demonstrates that concept-alignment
    explanations enable users to accept or reject retrieved results both faster and more accurately.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/4/XSearch-Explainable-Code-Search-via-Concept-to-Code-Alignment
