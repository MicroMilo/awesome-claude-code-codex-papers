- title: 'LogicHunter: Testing LLM Agent Frameworks with an Agentic Oracle'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 5e39f5de-1da5-42bf-84e5-04f4e17a7cdc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Model (LLM) agent frameworks such as LangChain, LlamaIndex, and CrewAI have become critical infrastructure
    powering production AI systems, yet they remain severely under-tested due to fundamental challenges in automated testing.
    Unlike traditional software, where crashes serve as reliable oracles, defects in these pure Python frameworks manifest
    as ordinary exceptions or silent semantic failures, creating profound oracle ambiguity. This problem is exacerbated by
    strict type governance through Pydantic schemas and complex protocol requirements that cause existing fuzzers to generate
    overwhelming invalid inputs, while traditional test generators produce only trivial cases with weak regression assertions.
    We present LogicHunter, a fuzzing framework that addresses both the generation and oracle challenges through active specification-aware
    testing. LogicHunter employs specification-driven generation that systematically fuses formal type constraints with authentic
    usage patterns from real-world repositories, synthesizing inputs that are valid by construction yet semantically extreme,
    equipped with behavioral probes to expose silent failures. To resolve oracle ambiguity, we introduce the Agentic Oracle,
    which transcends passive classification by actively retrieving documentation, navigating source code, and inspecting runtime
    states through a ReAct-based architecture with Dual-Layer State Management and Dual-Stream Memory. Evaluated on three
    widely deployed frameworks, LogicHunter discovered 40 previously unknown bugs with 30 confirmed and 26 fixed by developers,
    while state-of-the-art baselines found none. The Agentic Oracle achieves 90.9% precision, surpassing the best passive
    approach at 27.9% by 63 percentage points.
