- title: 'From Draft to Precision: Iterative Agentic Framework for Intent-Aware Code Summarization'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 021c7bd6-487c-4b6e-a87b-27267d603ed8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Code summarization aims to generate natural language (NL) descriptions for code snippets to assist de- velopers
    in understanding and maintaining programs. Recent advances in large language models (LLMs) have substantially improved
    the quality of automatic code summarization. In real-world projects, code com- ments are written to serve different developer
    intents, which has motivated the development of intent-aware summarization methods. However, existing intent-aware methods
    still struggle to fully capture developer intent, often producing incomplete or misaligned summaries. Our empirical study
    reveals that real-world comments are typically refined through multiple rounds of developer revision, which we believe
    is key to achieving high quality. However, current methods typically overlook this iterative refinement. To bridge this
    gap, we propose an agentic framework that improves code summarization through iterative revision. It integrates two collaborating
    agents: a Generator that produces and revises summaries, and a Reviewer that assesses the generated summary and drafts
    targeted revision plans to guide subsequent edits using available contextual information. By iteratively refining summaries
    with revision plans and contextual information, our framework yields summaries that are more accurate, complete, and better
    aligned with developer intent. Extensive experiments on an intent-annotated CSN-Java benchmark demonstrate the effectiveness
    of our method. On automatic metrics, our method achieves a 28.75% improvement over the state-of-the-art baseline methods
    across all intents. Besides, in human studies, our framework yields average gains of over 20% in usefulness, adequacy,
    and intent alignment. It also achieves the highest Top-1 preference (over 40% across all intents), underscoring its practical
    advantage for developers.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/59/From-Draft-to-Precision-Iterative-Agentic-Framework-for-Intent-Aware-Code-Summarizat
