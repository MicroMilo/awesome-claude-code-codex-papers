- title: An Empirical Study of Speculative Decoding on Software Engineering Tasks
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 368cd7a6-468f-4607-bc9e-7aaaa6fe9ef6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Large Language Models (LLMs) have become widely used for Software Engineering (SE) tasks, spanning from function-level
    code generation to complex repository-level workflows. However, the high latency of autoregressive inference remains a
    significant bottleneck, hindering their deployment in interactive environments. While Speculative Decoding (SD) offers
    a promising technique for lossless acceleration, prior research on long-context repository-level tasks and complex agentic
    interactions remains limited. To bridge this gap, we present the first systematic empirical study to evaluate the effectiveness
    of SD in SE tasks. We systematically benchmark a comprehensive spectrum of strategies, encompassing both model-based and
    model-free methods, across representative generation, editing, and repair scenarios. Our empirical results indicate that
    SD demonstrates clear potential for accelerating inference, particularly for smaller models that achieve higher speedups
    than those of their larger counterparts. We find that the effectiveness of SD methods varies across different task scenarios.
    Model-based approaches are well-suited for code generation, whereas model-free methods are better adapted to repository-level
    repair and editing scenarios. Furthermore, we observe that the repetitiveness of SE tasks improves the performance of
    model-free methods. In contrast to natural language tasks, the higher predictability of SE tasks allows for more aggressive
    hyperparameters. Our findings are summarized as guidelines to help increase inference efficiency for SE scenarios.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/54/An-Empirical-Study-of-Speculative-Decoding-on-Software-Engineering-Tasks
