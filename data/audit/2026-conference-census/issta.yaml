- title: 'Datura: Progressive Red Teaming Testing for Tool Invocation Chain in LLM Agents'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d9f9598b-aaf9-44c1-9f85-23bb0bb8769d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: LLM agents that invoke external tools face critical safety vulnerabilities when malicious manipulations exploit
    their implicit trust in tool outputs and metadata. However, identifying these vulnerabilities through testing is challenging
    due to the need to bypass safety guardrails with semantically legitimate inputs, the difficulty in characterizing successful
    attacks amid implicit tool trust, and the requirement to maintain logical consistency across fragile state-dependent execution
    chains. In this paper, we first conduct an empirical study to investigate how external tools influence the reasoning of
    agents. Guided by the findings, we propose Datura, an automated red teaming testing framework that exposes safety vulnerabilities
    through chained tool manipulation. Through a five-stage workflow, Datura dynamically generates test cases where each individual
    step appears legitimate yet collectively achieves harmful outcomes. We evaluate Datura across five LLMs and 740 safety-critical
    tasks under five defense including real-world safety mechanisms. Datura achieves 94.86–99.59% attack success rate, outperforming
    the strongest baseline by 7.56–24.32 percentage points, and maintains 78.78–95.54% effectiveness across defenses where
    baselines drop to near-zero. The artifact is available on Anonymous GitHub.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/10/Datura-Progressive-Red-Teaming-Testing-for-Tool-Invocation-Chain-in-LLM-Agents
