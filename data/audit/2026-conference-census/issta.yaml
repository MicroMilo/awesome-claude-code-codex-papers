- title: 'PoCE: Automated Proof-of-Concept Synthesis using Large Language Models for Robust Validation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 0d37006b-8fb8-42ca-989f-cee9ff082c8d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Vulnerability reports play a critical role in software repair, with Proof-of-Concept (PoC) exploits serving as
    one of their most essential components. PoC exploits enable software developers to reliably reproduce reported vulnerabilities
    and subsequently deploy patches. However, generating effective PoCs is costly, expertise-intensive, and increasingly challenging
    due to the diversity of modern software ecosystems and their complex dependencies. Inadequate or incorrect PoCs can significantly
    delay patch deployment, thereby increasing the window of exposure to attacks. Prior work on automated PoC generation struggles
    to produce comprehensive and reliable exploits. In this work, we present an automated PoC generation framework, PoCE,
    capable of generating PoCs across diverse software systems by handling varied input formats and complex execution contexts
    using large language models. PoCE integrates structured in-context learning, retrieval-augmented generation, and iterative
    chain-of-thought reasoning to expand an initial exploitable PoC into multiple validated variants. These variants are executed
    in controlled environments to confirm exploitability. We evaluate PoCE on eleven widely used software projects, including
    TensorFlow, Yasm, Zlib, Liblouis, Cflow, TCPDUMP, Fig2dev, Binutils, libsndfile, LibTIFF, and libsixel. Our approach achieves
    an exploitation success rate of 78.1% and generates multiple exploit variants for most vulnerable cases, uncovering alternative
    exploit paths and edge conditions. We discover 57 zero-day PoCs and identify 26 previously unknown zero-day vulnerabilities
    in cross-layer software.
