  official_record_id: fc0cb63c-ed5e-4e72-8e88-93ede9ad884b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In-Context Learning (ICL) has emerged as a promising solution to enhance the code generation capabilities of Large
    Language Models (LLMs) by incorporating code examples inside the prompt to let LLMs learn from demonstrations. However,
    despite their effectiveness gains, it remains unclear which specific properties of ICL-provided code examples (e.g., solution
    insight, essential contextual information, identifier naming styles, code formatting) drive these gains. This paper systematically
    investigates the impact of different sources and internal features of code examples on ICL for code generation through
    controlled experiments on contest-style programming questions and repository-level tasks. Our results show that while
    LLMs struggle to extract generalizable problem-solving insights from provided solutions to similar questions or repository
    snippets, their retrieval-augmented ICL performance can significantly benefit from explicit contextual information, such
    as input/output demonstrations, required helper functions, and namespace information. Through targeted mutation operators,
    we further find that identifier naming is substantially more critical than code formatting or low-level implementation
    details, with the elimination of descriptive variable names causing performance drops of up to 30 percentage points. Finally,
    we demonstrate that LLMs significantly prefer semantically meaningful identifier names and that adherence to surface-level
    naming conventions is far less important than semantic clarity. These findings provide practical guidelines for constructing
    effective ICL code examples and highlight challenges in reflection-based learning for code generation.
