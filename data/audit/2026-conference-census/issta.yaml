  official_record_id: bd12c0fa-5e93-4f00-b78c-6b34631de317
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Tile-based programming frameworks are increasingly adopted to write high-performance GPU kernels in domains such
    as deep learning and scientific computing. While these frameworks enhance productivity and hardware utilization, their
    multi-stage compilation pipelines introduce distinct code generation bugs that are tightly coupled to input shapes, data
    types, and backend targets. These bugs often manifest as silent correctness or performance issues, making them difficult
    to detect using existing compiler testing tools. Additionally, the unique programming conventions of tile domain specific
    languages complicate root cause identification, while fixing such bugs demands specialized knowledge of tile abstractions
    and compilation pipelines. Despite the growing adoption of tile-based systems, their code generation bugs remain largely
    unexplored. This paper presents the first systematic study of tile-program code generation bugs. We analyze 301 real-world
    bug reports from GitHub and categorize their root causes, symptoms, input patterns, test oracles that trigger these bugs
    and the strategies used to fix them. Our study provides foundational insights for building debugging, testing, and repair
    tools tailored to tile-based compiler infrastructures.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/180/Characterizing-Real-World-Bugs-in-Tile-Programs-for-Automated-Bug-Detection
