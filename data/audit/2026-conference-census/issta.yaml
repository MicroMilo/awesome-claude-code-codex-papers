- title: Testing Retrieval-Augmented Generation Systems with Chunk Coverage
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6fead045-a4d4-4d72-94d3-aed170635bae
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Retrieval-Augmented Generation (RAG)-based systems are increasingly deployed in high-stakes settings where correct
    behaviour depends not only on the language model but also on the retrieval component that selects external documents at
    inference time. While existing RAG evaluation metrics assess retrieval and generation quality on a per-query basis, typically
    relying on query-level test oracles such as reference answers or relevance annotations, they provide limited insight into
    whether a test suite adequately exercises the retrieval behaviour of the system as a whole. In this paper, we introduce
    Chunk Coverage (CC), an oracle-independent test adequacy criterion for testing the retrieval component of RAG systems.
    CC measures the fraction of corpus chunks that are retrieved at least once across a test suite, providing a structural
    view of which parts of the retrieval space have been exercised. We further show how CC can be used to guide test selection
    and generation by prioritising queries that expand coverage of previously unexercised retrieval regions. We evaluate CC
    on clinical and financial RAG system scenarios. CC-guided testing reaches 50% of attainable coverage up to 1.9 times faster
    than random selection and up to 6.9 times faster than redundancy-biased strategies. Moreover, CC improves fault detection
    effectiveness (APFD) by 10% to 25% over random, indicating earlier discovery of distinct retrieval faults. These results
    show that CC captures retrieval diversity relevant to effective testing without requiring test oracles.
