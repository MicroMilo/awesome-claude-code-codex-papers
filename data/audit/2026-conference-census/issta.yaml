- title: Branch-Level Fault Localization in ADS Planning via Temporal Coverage Analysis
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d1293b31-f297-4f9b-a37e-fe2f691a3350
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Planning failures in Automated Driving Systems (ADS) are increasingly detected through simulation-based testing,
    yet localizing their root causes within planning code remains a major challenge. Planning modules execute complex rule-based
    decision logic over hundreds of frames in a closed-loop interaction with the environment, where faults trigger observable
    failures only after temporal gaps and under specific execution contexts. These characteristics make traditional spectrum-based
    fault localization ineffective, as faulty behavior is obscured by execution-level coverage aggregation and limited test
    diversity. In this paper, we study the problem of debugging planning failures and present a temporal coverage analysis
    approach for localizing faults in rule-based planning modules. Our key insight is that, while execution-aggregated coverage
    masks fault behavior, frame-level execution dynamics reveal distinctive temporal signatures that indicate when and how
    faulty branches activate. Leveraging this insight, our approach first identifies a suspicious frame using planning semantics,
    and then ranks candidate branches by analyzing their execution behavior within a localized temporal window. We evaluate
    our approach on 221 reproducible planning failures drawn from a publicly available Apollo planning failure dataset. Our
    results show that temporal coverage analysis enables accurate suspicious-frame identification and substantially reduces
    branch inspection effort compared to baseline heuristics, effectively localizing faults from a single failing execution.
    We further analyze failure cases that lack observable execution signals to clarify the fundamental limits of execution-based
    localization. Overall, this work demonstrates that temporal execution analysis provides a practical and effective foundation
    for debugging planning failures in rule-based ADS planning modules.
