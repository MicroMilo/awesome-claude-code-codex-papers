- title: Evaluating and Mitigating the Misguidance Effect of Buggy Code in LLM-Generated Unit Tests
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: d661ac0c-e722-44e3-95b1-f3e771f6a987
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'While Large Language Models (LLMs) show great promise for automating unit test generation, recent studies suggest
    that the quality of generated tests can be negatively impacted when models are prompted with buggy code. This paper presents
    a new metric to quantitatively measure the “misguidance effect,” a phenomenon where buggy code steers LLMs toward generating
    tests that validate its erroneous behavior rather than expose it. Our analysis reveals that prompting LLMs with buggy
    code has a severe, twofold impact: it significantly increases “misguided tests” that assert incorrect behavior while simultaneously
    suppressing the generation of effective, bug-finding tests. We further corroborate this effect from a model-internal perspective,
    showing that buggy code skews LLMs’ preference toward tests that assert the same erroneous behavior. To counter this,
    we introduce and validate a specification-based unit test generation paradigm that replaces the code under test in the
    prompt with an LLM-generated specification docstring. Our results show that this paradigm effectively reduces misguided
    tests while substantially increasing effective tests, improves multi-round, feedback-driven test generation pipelines,
    and remains applicable to both buggy and bug-free code. Overall, these results suggest that specification-based prompting
    is a promising strategy for mitigating misguidance from buggy code in LLM-generated unit tests.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/113/Evaluating-and-Mitigating-the-Misguidance-Effect-of-Buggy-Code-in-LLM-Generated-Unit-
