  official_record_id: 4d6e95a9-a2d3-4a88-b83d-ae94929d4e5e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Engineers utilize test scripts to conduct testing on mobile applications to ensure software reliability. In industrial
    settings, failures in mobile application testing stem not only from faults in the program or scripts but also from other
    aspects, such as the testing environment, making it challenging to apply existing automated analysis methods in such settings.
    Furthermore, mobile testing in industrial contexts generates a large volume of artifacts, such as screenshots and logs,
    and involves diverse device models, varied test environments, and complex functionalities. All these factors make the
    manual analysis of failed mobile tests a process that is typically time-consuming, costly, and labor-intensive. Large
    language models (LLMs) with strong logical reasoning capabilities offer a novel perspective for automated analysis of
    failed mobile tests. However, due to their limited knowledge of mobile testing, general LLMs can only achieve sub-optimal
    effectiveness in these tasks. To address these challenges, we propose AnaDroid, a novel LLM training framework specifically
    tailored for analyzing failed mobile tests. AnaDroid performs feature preprocessing for failed mobile tests and trains
    the large language model through two novel, tailored training procedures. Specifically, AnaDroid first leverages bidirectional
    pre-training to instill the domain-specific knowledge and reasoning capabilities required for failed test analysis into
    the model. AnaDroid further employs preference optimization to enhance the model’s capacity to capture critical information
    within the input context, thereby further improving its analytical effectiveness. Through extensive evaluations across
    six open-source LLMs of diverse architectures and scales on a large-scale industrial dataset of 284k failed mobile testing
    scripts, AnaDroid outperformed all 4 baselines across three analysis tasks. Furthermore, during a month-long deployment
    within a global company’s testing system, \tool demonstrated its practical utility by successfully providing root cause
    and repair recommendations for 78% and 81% of the 11,304 failed tests, respectively.
