- title: A Dataset of Reproducible Flaky-Test Failures
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 6a6d2437-ffd8-42de-b517-462df933e9bc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Flaky tests pass and fail non-deterministically when run on the same version of code. Although many techniques
    have been proposed to detect, debug, and repair flaky tests, reproducing their failures remains a major challenge due
    to their inherent nondeterminism. Many datasets related to flaky tests exist to help researchers study them, but these
    datasets are often composed of disjoint sets of flaky tests, where each dataset provides some unique information over
    the others, such as flaky tests of many different categories, failure logs of flaky tests, or flaky tests reported by
    developers vs. flaky tests found by automated tools. In this work, we aim to create a reproducible dataset of flaky tests,
    which are curated from both developer issue reports and a popular dataset of flaky tests. Compared to prior flaky test
    datasets, our dataset is the first to provide (1) a reproducible environment to compile the flaky tests, (2) scripts to
    run the tests to reproduce the failure, (3) scripts to automatically apply the flaky test fixes and ensure that the test
    is no longer flaky, and (4) execution logs of the flaky test passing and failing. We present ReproFlake, a dataset of
    1115 reproducible flaky tests, spread across four different flaky test categories. We create guidelines to help others
    contribute to this reproducible dataset, as well as demonstrate how to use our dataset to understand the challenges with
    reproducing flaky test failures (i.e., challenges that researchers may face when using any of the prior flaky test datasets),
    the characteristics (e.g., location of the fix and its correlation with the flaky test category, as well as the difficulties
    researchers may face in using our dataset to collect additional information (e.g., code coverage) about flaky tests. Our
    findings show that error information helps identify flaky test categories and guide repairs, that unresolved compilation
    failures highlight challenges in building legacy projects, and that knowing typical fix locations helps prioritize repair
    efforts.
