- title: 'Lookahead-then-Verify: Reliable Constrained Decoding for Diffusion LLMs under Context-Free Grammars'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 49281b13-d446-4196-821f-429caf073d3e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Diffusion Large Language Models (dLLMs) have demonstrated promising generative capabilities and are increasingly
    used to produce formal languages defined by context-free grammars, such as source code and chemical expressions. However,
    as probabilistic models, they still struggle to generate syntactically valid outputs reliably. A natural and promising
    direction to address this issue is to adapt constrained decoding techniques to enforce grammatical correctness during
    generation. However, applying these techniques faces two primary obstacles. On the one hand, the non-autoregressive nature
    of dLLMs renders most existing constrained decoding approaches inapplicable. On the other hand, current approaches specifically
    designed for dLLMs may allow intermediate outputs that are impossible to complete into valid sentences, which significantly
    limits their reliability in practice. To address these challenges, we present LAVE, a constrained decoding approach specifically
    designed for dLLMs. Our approach leverages a key property of dLLMs, namely their ability to predict token distributions
    for all positions in parallel during each forward pass. Whenever a new token is proposed by model, LAVE performs lookahead
    using these distributions to efficiently and reliably verify the validity of the proposed token. This design ensures reliable
    constraints by reliably preserving the potential for intermediate outputs to be extended into valid sentences. Extensive
    experiments across four widely used dLLMs and three representative benchmarks demonstrate that LAVE consistently outperforms
    existing baselines and achieves substantial improvements in syntactic correctness, while incurring negligible runtime
    overhead.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/55/Lookahead-then-Verify-Reliable-Constrained-Decoding-for-Diffusion-LLMs-under-Context
