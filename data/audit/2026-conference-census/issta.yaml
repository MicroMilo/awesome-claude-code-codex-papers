- title: 'ProgSCA: Software Composition Analysis via Program-Level Modeling'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: d18189e3-c192-4457-bce4-82c8e7b1c137
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Software composition analysis (SCA) aims to identify third-party dependencies in programs, which plays a critical
    role in ensuring software supply chain security. Existing approaches largely follow a rule-based paradigm: they first
    compute function-level similarities, then aggregate these results using handcrafted heuristics to determine which third-party
    libraries (TPLs) the target program depends on. However, such rules require substantial manual effort and expert knowledge
    to design, tune, and maintain. To address this, we present ProgSCA, an SCA framework based on a two-stage strategy and
    program-level rather than function-level modeling. ProgSCA formulates SCA as a retrieval problem, first employing lightweight
    methods to quickly filter out irrelevant libraries from numerous candidate TPLs, then using a model trained at the program
    level to directly predict dependency between programs. Comprehensive evaluations show that ProgSCA achieves state-of-the-art
    performance in SCA tasks, improving F1 scores over existing methods by 174% and 100% in two mainstream scenarios, respectively.
    Moreover, ProgSCA proves effective in the downstream task of function similarity matching, further demonstrating the practical
    value of our approach.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/165/ProgSCA-Software-Composition-Analysis-via-Program-Level-Modeling
