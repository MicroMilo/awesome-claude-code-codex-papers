- title: Applying System Call Filtering to Real-World Binaries (Experience Paper)
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 996daa0a-d057-48ae-9699-0971969f70d8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'System call filtering restricts applications to the system calls they require, but inferring accurate syscall
    sets for binary-only programs remains challenging. A central difficulty lies in recovering precise control-flow information
    from binaries: over-approximation leads to overly permissive syscall filters, while missed control-flow edges result in
    unsound policies. Although many techniques have been proposed to improve control-flow recovery in binaries, their practical
    impact on syscall inference remains poorly understood. In this work, we conduct an empirical study of syscall inference
    from binaries using multiple off-the-shelf binary analysis tools. We evaluate how different control-flow refinement techniques
    affect inferred syscall sets in practice. Our experiments on real-world applications show that refinements targeting individual
    control- flow transfers (e.g., call-site and callee argument matching) substantially improve per-call target precision
    but often do not reduce the overall syscall set. In contrast, techniques that reduce the global set of address-taken functions—such
    as leveraging relocation information to accurately identify code pointers—yield the most significant syscall reductions.
    Finally, we identify a practical lower bound on syscall reduction achievable via sound static binary analysis alone, and
    show that further improvements are likely to require configuration or workload-aware specialization.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/122/Applying-System-Call-Filtering-to-Real-World-Binaries-Experience-Paper-
