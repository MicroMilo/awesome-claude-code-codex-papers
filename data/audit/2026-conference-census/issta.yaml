- title: A Temporal Reasoning Benchmarking Framework for LRMs via Difficulty-controlled and Dynamic Test Generation
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: ebe419eb-446f-4a51-b247-c2796cbaf3d3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Defining the reasoning boundaries and ensuring the reliability of Large Reasoning Models (LRMs) remains a critical
    challenge. Current benchmarks primarily rely on static datasets susceptible to data contamination or synthetic tasks lacking
    fine-grained difficulty control. Furthermore, standard outcome-based evaluations often conceal reasoning flaws by neglecting
    the reasoning process. To address these limitations, we introduce TRACE, a testing framework that models temporal reasoning
    as constraint satisfaction problems via Allen’s Interval Algebra. This approach enables precise regulation of logical
    complexity and incorporates a Trace-Based Verification Oracle to validate reasoning faithfulness. Using this framework,
    we construct TRACEBench, an extensive benchmark comprising 1,200 synthesized test instances across graded difficulty levels.
    We employ TRACE to evaluate six widely used LRMs on TRACEBench. The results confirm a strong negative correlation between
    model performance and our difficulty metric (Pearson’s 𝑟 ≈ −0.97), validating the effectiveness of our difficulty control
    mechanism. Moreover, our trace-based analysis exposes significant discrepancies between reasoning validity and final answers,
    revealing a high spurious guessing rate of approximately 28% in mid-sized models. In addition, we diagnose scale-dependent
    failure modes, ranging from Degenerative Loops in small models to Reasoning Explosion in advanced architectures. TRACE
    thus provides a robust, automated platform for benchmarking the true temporal reasoning capabilities of LRMs.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/52/A-Temporal-Reasoning-Benchmarking-Framework-for-LRMs-via-Difficulty-controlled-and-Dy
