- title: 'SEER: Self-Enhancing Chain-of-Thought Compression for Reasoning Models'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: a7b75461-b387-462d-a762-970c91e144b5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Chain-of-Thought (CoT) prompting can substantially improve the reasoning ability of large language models (LLMs),
    but it often comes with high inference cost due to long and poorly controlled reasoning traces. This overhead is particularly
    problematic in software engineering tasks (e.g., code generation), where both latency and output reliability matter. To
    better understand this trade-off, we conduct an empirical study on widely used code generation benchmarks and observe
    that many modern reasoning models produce excessively verbose CoTs (often thousands of tokens), which frequently leads
    to truncation and unstable generation. Using a strict n-gram repetition detector, we find that the vast majority of truncations
    are associated with degenerate looping behaviors. Moreover, longer CoT does not necessarily yield better outcomes: failed
    generations tend to be longer than successful ones, indicating diminishing or even negative returns from overlong reasoning.
    Motivated by these findings, we propose SEER (Self-Enhancing Efficient Reasoning), a self-enhancing framework for adaptive
    CoT compression. SEER improves the conciseness of reasoning while preserving output quality, without relying on external
    compression tools. SEER refines self-generated CoT data via Best-of-N sampling to suppress looping and redundant traces,
    then applies a lightweight, data-driven filter to encourage concise yet correct reasoning. It then fine-tunes the model
    on the filtered data to internalize concise reasoning behaviors. Across three software engineering tasks, SEER reduces
    CoT length by 41.6% on average while improving task performance, largely by reducing truncation and mitigating reasoning
    loops.'
