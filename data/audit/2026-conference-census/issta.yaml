  official_record_id: dcf71615-323a-4700-ac7f-646713762070
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Mobile apps frequently embed sensitive secrets, such as API keys, access tokens, client secrets, and private
    keys that support internal functionality or enable integration with external systems and third-party services. Developers
    frequently embed these secrets into Android apps, which allows attackers to extract them through reverse engineering.
    Once exposed, attackers can exploit them to access sensitive data, manipulate resources, or abuse APIs, resulting in severe
    security and potential financial risks. In this paper, we present the first large-scale empirical evidence that off-the-shelf
    large language models (LLMs) can automatically identify secrets in Android apps without any domain-specific prior knowledge,
    thereby substantially lowering the barrier for attackers. On a benchmark of 5135 Android apps from prior work, LLMs rediscovered
    93% of previously known secrets and identified 4361 additional valid credentials (+195%). Extending our analysis to 50
    000 Google Play apps collected between August and October 2025, we conducted the largest-scale study to date on secret
    detection in Android apps, identifying secrets in 17 590 apps (35%). Among the 18 908 detected secrets, 1802 remained
    active at discovery, including, among others, critical credentials such as Stripe payment keys, OpenAI API keys, and GitHub
    personal access tokens. We responsibly contacted all the affected developers, of whom 170 confirmed the issues and updated
    their apps accordingly. Our findings empirically demonstrate the reality of vibe hacking: anyone can now leverage publicly
    accessible AI models to perform complex offensive security tasks with minimal expertise.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/49/Secrets-Unlocked-Evaluating-LLMs-for-Secrets-Detection-in-Android-Apps
