  full_text_scan: metadata-filtered
  official_record_id: 1661a4ac-c549-44e1-869f-e4af43a76202
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Regression testing is essential for maintaining software quality but often incurs substantial time costs. Prior
    work has demonstrated that tuning Java Virtual Machine (JVM) configuration flags can reduce test execution time, yet finding
    effective flag combinations remains challenging due to the vast configuration space and complex interactions between flags.
    Random search and direct modeling approaches that map flags to testing time have shown limited effectiveness in navigating
    this complex optimization landscape. We present PROBO (PROfiling-Guided Bayesian Optimization), an iterative approach
    that leverages JVM runtime metrics (such as garbage collection frequency, just-in-time (JIT) compilation rates, and memory
    allocation) to guide Bayesian optimization for testing time reduction. Unlike prior work that directly models the relationship
    from flags to testing time, PROBO decomposes the prediction problem through observable runtime behaviors: a metrics model
    predicts how flag configurations affect runtime metrics, and a performance model predicts how those metrics affect testing
    time. PROBO collects 44 runtime metrics using a profiler during test execution, and propagates feature importance scores
    through both models to identify which flags most strongly influence testing time-predictive metrics. Finally, PROBO generates
    candidate flag configurations through three complementary strategies guided by expected testing time improvement. We evaluate
    PROBO on 16 open-source Java projects, comparing against random search and BOCA (a Bayesian optimization baseline). PROBO
    achieves an average testing time reduction of 10.7% across all projects, outperforming random search (5.8%) by 1.85× and
    BOCA (4.3%) by 2.49×. PROBO successfully generates configurations that substantially reduce testing time for all 16 projects,
    with reductions ranging up to 27.4%. With a one-hour time budget for search, PROBO maintains its advantage with 8.0% average
    reduction, demonstrating practical applicability. Moreover, PROBO-generated configurations remain effective across software
    evolution, maintaining 8.8% average reduction over 88 future commits per project. Our analysis reveals that JIT compilation
    metrics, particularly Total Compilation Rate (methods compiled per second) and C1 Compilation Rate (first-tier JIT compilation
    rate), are the strongest predictors of testing time, accounting for 67.2% of consistently important metrics across projects.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/162/Profiling-Guided-Bayesian-Optimization-of-JVM-Configurations
  abstract_sha256: 908b06845d0fd434df6b110c4b7000872f0f4c2648ec0307ea1a1362f74af2f8
