- title: 'KaPilot: LLM-Assisted Generation of Kani Specifications for Unsafe Rust Verification'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: fef3107d-1452-4f5f-8da6-6420b492b401
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Rust’s ownership and type system provide strong memory safety guarantees, but unsafe code still presents memory
    safety risks. Formal verification is crucial for ensuring memory safety, but writing precise specifications for unsafe
    Rust is challenging and largely manual. Large language models (LLMs) have shown promise in generating formal specifications
    but are often code-centric, prone to inheriting implementation flaws, and lack systematic quality assessment. In this
    paper, we present KaPilot, a multi-agent framework for automatically generating specifications to verify unsafe Rust memory
    safety using Kani. The process begins with lightweight program analysis and proof harness generation. The SafetyReq agent
    extracts a concise, refined list of safety requirements from the target Rust function’s documentation, which guides the
    SpecGen agent in producing initial specifications that specify memory safety concerns. Then, the specifications are iteratively
    refined through a generate–precheck–verify loop involving SpecGen, SpecPrecheck, and SpecVerify agents, which assess quality
    and feed errors back. By executing this loop multiple times, KaPilot generates a set of candidate specifications. Finally,
    the shuffle-and-implication strategy is applied to systematically determine the best specification from these candidates.
    We evaluated KaPilot on 54 unsafe Rust functions with ground truth and 44 without. KaPilot achieved 88.9% and 69.2% specification
    generation success, respectively, with 57.4% of generated specifications equivalent to or stronger than the ground truth.
    Compared with AutoSpec, KaPilot produces 14.8% more verifiable specifications and 25.9% more equivalent-or-better specifications.
