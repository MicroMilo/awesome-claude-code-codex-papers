- title: 'AutoHIL: LLM-Based ECU Functional Test Generation through Domain Knowledge Augmentation'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: a063bd7b-6581-4b6a-b1d3-b72186e2db8d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: System functional testing is a critical step before the production release of automotive electronic control units
    (ECUs), especially for safety-critical functions. It is typically performed on hardware-in-the-loop (HIL) benches, and
    engineers translate functional requirements in natural language into executable test scripts using bench-specific APIs
    (or test harness primitives (THPs)). Existing research either focuses on generating abstract test cases that lack execution
    capability, or relies on bench-specific solutions that cannot be generalized. Consequently, industrial practice remains
    labor-intensive, and is hindered by three main challenges, i.e., the high learning cost of THPs, the incompleteness of
    functional requirements due to missing tacit domain knowledge (e.g., power management dependencies or system wake-up sequences),
    and the limited automation. To address these challenges, we propose AUTOHIL, an LLM-based, domain-knowledge-augmented
    framework for requirement-driven ECU functional test generation on HIL benches. AUTOHIL automatically constructs a THP
    knowledge base to understand bench operations, extracts tacit domain knowledge from AUTOSAR ECU source code and configuration
    to augment requirements, and generates test scripts for the augmented requirements based on the THP knowledge base. We
    evaluate AUTOHIL on two industrial ECUs, i.e., an Airbag Control Unit (ACU) on an in-house bench and an Active Safety
    Domain Master (ASDM) on a dSPACE platform. AUTOHIL achieves test script executability of 90.33% on ACU and 81.31% on ASDM.
    We also manually evaluate the functional equivalence between generated scripts and manual scripts, and AUTOHIL reaches
    a functional correctness of 89.69% on ACU and 84.00% on ASDM. We discover 39 and 25 new functional defects in ACU and
    ASDM, which have been patched by technicians from the supplier.
