- title: Metamorphic Coverage
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: cd212493-a3f9-401b-b432-7e1e34485d70
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Metamorphic testing is a widely used methodology that examines an expected relation between pairs of executions
    to automatically find bugs, such as correctness bugs. We found that code coverage cannot accurately measure the extent
    to which code is validated and mutation testing is computationally expensive for evaluating metamorphic testing methods.
    In this work, we propose Metamorphic Coverage (MC), a coverage metric that examines the distinct code executed by pairs
    of test inputs within metamorphic testing. Our intuition is that, typically, a bug can be observed if the corresponding
    code is executed when executing either test input but not the other one, so covering more differential code covered by
    pairs of test inputs might be more likely to expose bugs. While most metamorphic testing methods have been based on this
    general intuition, our work defines and systematically evaluates MC on five widely used metamorphic testing methods for
    testing database engines, compilers, and constraint solvers. The code measured by MC overlaps with the bug-fix locations
    of 50 of 64 bugs found by metamorphic testing methods, and MC has a stronger positive correlation with bug numbers than
    line coverage. MC is 4x more sensitive than line coverage in distinguishing testing methods’ effectiveness, and the average
    value of MC is 6x smaller than line coverage while still capturing the part of the program that is being tested. MC required
    359x less time than mutation testing. Based on a case study for an automated database system testing approach, we demonstrate
    that when used for feedback guidance, MC significantly outperforms code coverage, by finding 41% more bugs. Consequently,
    this work might have broad applications for assessing metamorphic testing methods and improving test-case generation.
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/13/Metamorphic-Coverage
