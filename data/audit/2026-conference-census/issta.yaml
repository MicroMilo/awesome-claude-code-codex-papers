- title: Do Coverage and Mutation Scores of LLM-Generated Test Suites Correlate With Their Effectiveness? (Replicability Study)
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 73ec6259-eb47-4dde-9bd6-5314a12491c3
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Recent advances in large language models (LLMs) have driven growing interest in using LLMs to automate test generation.
    Prior work commonly evaluates generated test suites using proxy metrics such as code coverage and mutation score. However,
    studies by Inozemtseva et al. and Papadakis et al. show that, for human-written tests, correlations among coverage, mutation,
    and real-bug detection can largely vanish once test suite size is controlled, raising concerns about the validity of evaluations
    based on proxy metrics. It also remains unclear whether these conclusions carry over to LLM-generated tests, given that
    prevailing LLM-based test-generation workflows differ substantially from traditional approaches. In this paper, we conduct
    a large-scale replication study of these two prior works using a wide range of test suites generated by a diverse set
    of LLMs, and re-examine the relationships among coverage, mutation, and real-bug detection effectiveness. Our findings
    diverge substantially from prior results. We show that the usefulness of coverage and mutation is highly context-dependent:
    in regression-style settings where the code provided to the LLM can be reasonably assumed bug-free, these metrics can
    provide meaningful signals when comparing across models; in another common scenario where the code-under-test may already
    be buggy and the goal is to expose the bug within code-under-test, they no longer serve as reliable indicators. We also
    find little evidence that test suite size is a dominant confounder for correlations among coverage, mutation, and real-bug
    detection for LLM-generated tests. Based on these findings, we discuss how to interpret results from prior studies and
    provide actionable guidance for evaluating LLM-based test generation.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/2/Do-Coverage-and-Mutation-Scores-of-LLM-Generated-Test-Suites-Correlate-With-Their-Eff
