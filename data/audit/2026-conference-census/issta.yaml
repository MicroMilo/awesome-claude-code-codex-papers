  official_record_id: c89ef95d-9961-4408-a5fe-decd4fc9d304
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Decompiling stripped binaries to assist human reverse engineers remains a critical yet highly challenging task
    in software security. Prior work has developed various neural networks and even dedicated large language models (LLMs)
    to improve function and variable name recovery in decompiled code. Nonetheless, these approaches alone fall short of enabling
    a generic LLM-based decompilation pipeline that can reliably enhance the readability and semantic clarity of decompiled
    outputs. In this paper, we propose BinRAG, a retrieval-augmented generation (RAG) based decompilation framework designed
    to enhance the decompilation of stripped binaries. Building upon name prediction models, BinRAG features three novel designs:
    (1) it first utilizes name prediction models to transform raw decompiled outputs into enriched, source-like queries for
    RAG retrieval; (2) it further enhances these queries by fine-tuning a specialized LLM that jointly considers predicted
    variable names and binary optimization levels, enabling more accurate retrieval from a curated example database; (3) it
    then integrates these retrieved examples with the target’s calling context, employing a general-purpose LLM to synthesize
    high-fidelity, human-readable decompiled code. Evaluation on 3,200 functions from real-world software repositories demonstrates
    that BinRAG achieves 9% and 16% improvements in semantic precision and readability compared to state-of-the-art approaches.
    Our results show that BinRAG effectively scales to large codebases and significantly reduces manual effort in reverse
    engineering tasks.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/154/BinRAG-An-RAG-Based-Decompilation-Framework-Fusing-Name-Prediction-and-Calling-Conte
