- title: 'Test Case Selection for Deep Neural Networks: A Replication Study on LLMs for Code (Replicability Study)'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 80ae344d-b991-4d66-b316-a64fcd613b88
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Test case selection (TCS) techniques have been widely studied to support the operational evaluation of deep neural
    networks (DNNs) under limited testing budgets, where labeling cost is a primary concern and uncovering model failures
    early is a key objective. Although prior studies report promising results, existing empirical evaluations focus almost
    exclusively on vision-based DNNs and datasets. As observed in recent surveys, models and datasets specifically designed
    for software engineering tasks have not been considered, leaving it unclear whether prior findings generalize to LLM code
    models. This paper presents a large-scale replication study of TCS techniques in the context of LLM code models. We re-examine
    established TCS strategies originally proposed for DNNs and complement them with statistical sampling strategies that
    have not previously been evaluated for TCS. We assess their effectiveness on three code-related classification tasks:
    clone detection, vulnerability detection, and technical debt prediction. The study spans 17 fine-tuned language models,
    7 predictive features, and 13 selection strategies, and evaluates performance along two dimensions: operational accuracy
    estimation and early failure discovery. The results indicate that only a subset of findings reported for vision-based
    DNNs generalize when TCS is applied to LLMs for code. In particular, feature-driven uncertainty measures consistently
    outperform entropy-based baselines, and statistical sampling strategies improve robustness without sacrificing accuracy
    estimation or failure discovery. At the same time, performance varies substantially across tasks and models, indicating
    that the effectiveness of TCS techniques is context-dependent. Overall, this study provides empirical evidence on the
    replicability of TCS techniques beyond vision-based deep learning and offers insights into their use for the operational
    evaluation of LLMs for code.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/145/Test-Case-Selection-for-Deep-Neural-Networks-A-Replication-Study-on-LLMs-for-Code-R
