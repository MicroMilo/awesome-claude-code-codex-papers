- title: 'Don’t Use a Cannon to Kill a Fly: Lightweight Model Editing for LLMs to Correct Deprecated API Recommendations'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: pending
  disposition_reason: Official page did not expose a first-party PDF, ACM DOI, or OpenReview full-text link.
  full_text_scan: pending
  official_record_id: 47d85179-33c2-4fac-bc18-299ed30af443
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Pre-trained or fine-tuned on large code corpora, Large Language Models (LLMs) have demonstrated strong performance
    in code completion tasks. However, their embedded knowledge is constrained by the timeliness of training data, which often
    includes code using deprecated APIs. Consequently, LLMs frequently generate deprecated APIs that will no longer be supported
    in future versions of third-party libraries. While retraining LLMs on updated codebases could refresh their API knowledge,
    this approach is computationally expensive. Recently, lightweight model editing methods have emerged to efficiently correct
    specific knowledge in LLMs. However, it remains unclear whether these methods can effectively update deprecated API knowledge
    and enable edited models to generate up-to-date APIs. To address this gap, we conduct the first systematic study applying
    10 state-of-the-art model editing techniques to update deprecated API knowledge in three LLMs: Qwen2.5-Coder, CodeGemma,
    and DeepSeek-Coder. We introduce EDAPIBench, a dedicated benchmark featuring over 70 deprecated APIs from 8 popular Python
    libraries, with more than 3,000 editing instances. Our results show that the parameter-efficient fine-tuning method AdaLoRA
    achieves the best performance in enabling edited models to generate correct, up-to-date APIs, but falls short in Specificity
    (i.e., the editing influences untargeted knowledge). To resolve this, we propose AdaLoRA-L, which defines Common API Layers''''
    (layers within the LLMs with high importance across all APIs, storing general knowledge and excluded from editing) and
    restricts edits exclusively to Specific API Layers'''' (layers with high importance only for the target API, storing the
    API-specific knowledge). Experimental results demonstrate that AdaLoRA-L significantly improves Specificity while maintaining
    comparable performance across other evaluation metrics.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/39/Don-t-Use-a-Cannon-to-Kill-a-Fly-Lightweight-Model-Editing-for-LLMs-to-Correct-Depre
