- title: Testing Method Relocation Algorithms via Template-Based Systematic Structural Traversal and Precondition Filtering
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: bbf07731-ef11-46f8-a79d-bc4e8d12f039
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Method relocation refactorings, primarily Move Method and Pull Up/Push Down Method, are indispensable for reducing
    coupling and enhancing cohesion. Despite their widespread automation in modern refactoring engines, these algorithms remain
    notoriously error-prone, posing significant risks to software reliability. A primary challenge in testing them lies in
    the vast search space of complex program structures and the intricate preconditions required for safe method relocation.
    To address this, we propose \textsc{RelocTest}, a comprehensive testing framework that combines template-driven structural
    traversal with automated precondition filtering. \textsc{RelocTest} systematically explores the input space by populating
    program templates specially designed for method relocation through a two-stage generation process: (1) \textit{Skeleton
    Synthesis}, which systematically traverses diverse syntactic structures, and (2) \textit{LLM-Guided Completion}, which
    leverages Large Language Models to inject diverse, executable code into these skeletons. This hybrid strategy ensures
    high structural coverage while maintaining test case validity. Furthermore, to optimize testing efficiency, we introduce
    an \textit{LLM-based Precondition Extractor} that analyzes the implementation of method relocation algorithms to identify
    and prune test cases destined for rejection. We evaluated \textsc{RelocTest} on 7 mainstream refactoring engines. Our
    approach successfully uncovered 56 previously unknown bugs, with 19 already confirmed by tool vendors, demonstrating its
    effectiveness in hardening industrial-strength refactoring tools.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/170/Testing-Method-Relocation-Algorithms-via-Template-Based-Systematic-Structural-Travers
