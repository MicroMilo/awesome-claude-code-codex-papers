- title: Inferring 1-Minimal Trigger Configurations for Assessing Linux Kernel CVE Triggerability
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: 396a67ed-5879-4499-8755-e9da2cf9aa50
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Vendors assessing Linux kernel CVEs need to know whether a bug is triggerable under production-tailored configurations,
    not merely whether a version is affected, yet upstream reproducers and vulnerability databases rarely provide configuration-level
    context. We study minimal trigger-configuration inference: given a CVE entry and a target kernel version (optionally a
    baseline .config), we synthesize a Kconfig-satisfiable option set that remains effective after make olddefconfig and,
    when a reproducer is available, still triggers under a specified evaluation protocol; we then prune it to a 1-minimal
    (subset-minimal) boundary for evaluation. Our framework FCC links vulnerability cues to build-system symbols to mine candidates,
    completes implicit prerequisites under olddefconfig feedback to avoid silent rollback, and performs runtime-validated
    minimization guided by the inferred dependency topology. We evaluate on KernJC (32 CVEs) and KernelCTF (56 CVEs), totaling
    88 CVEs across multiple kernel versions. On the 88-CVE set, FCC improves the post-make olddefconfig configuration success
    rate from 62.5% (55/88) to 96.6% (85/88) over an olddef-only injection baseline; on the KernJC set, FCC reduces the average
    candidate set size by 78.7% compared to KernJC (Avg.14.72 vs. 69.00 options per CVE). By returning an effective and auditable
    1-minimal configuration boundary, FCC helps vendors scope triggerability against their deployment configurations with
    a clear, tool-supported decision line.'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/152/Inferring-1-Minimal-Trigger-Configurations-for-Assessing-Linux-Kernel-CVE-Triggerabil
