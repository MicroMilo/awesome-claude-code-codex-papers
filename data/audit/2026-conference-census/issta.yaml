  full_text_scan: metadata-filtered
  official_record_id: f51f550b-37bc-44d2-9a12-fb33696f9f52
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Many ISSTA papers present automated tools to find bugs in software, including in open-source projects. Some researchers
    create public bug reports for the bugs they deem worth reporting, e.g., new bugs found by the tools. We focus on studying
    bug reports created by researchers and coin the term Bugeoisie to refer to such bug reports. We collect the Bugeoisie
    for ISSTA 2025 by reading the papers, examining the artifacts, and contacting the authors, while trying to “chase” bug
    report links. This process turns out to be surprisingly challenging because only a few authors make such links readily
    available. We then analyze the Bugeoisie to understand when the bug reports were created and how they were resolved up
    until now. For most papers that make claims about the number of bugs found, reported, or confirmed, independently checking
    those claims is again surprisingly challenging. Our findings point out to the important changes that conference organizers
    and reviewers may want to require for the Bugeoisie. We also provide some suggestions for paper authors to prepare and
    describe their Bugeoisie in their papers and artifacts.
