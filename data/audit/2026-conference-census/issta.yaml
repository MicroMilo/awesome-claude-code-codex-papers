  official_record_id: 7759d38a-5271-49ae-a40e-2ad7679f519c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Mixed precision quantization has become an important technique for optimizing the execution of deep neural networks
    (DNNs). Certified robustness, which provides provable guarantees about a model’s ability to withstand different adversarial
    perturbations, has rarely been addressed in quantization due to the unacceptably high cost of certifying robustness. This
    paper introduces ARQ, an innovative mixed-precision quantization method that not only preserves the clean accuracy of
    the smoothed classifiers, but also maintains their certified robustness. ARQ uses reinforcement learning to find accurate
    and robust DNN quantization, while efficiently leveraging randomized smoothing, a popular class of statistical DNN verification
    algorithms. ARQ consistently performs better than multiple state-of-the-art quantization techniques across all the benchmarks
    and the input perturbation levels. The performance of ARQ quantized networks reaches that of the original DNN with floating-point
    weights, while with only$~1.5%$ instructions and the highest certified radius. ARQ code is available at https://anonymous.4open.science/r/ARQ-35CB
    .
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/175/ARQ-A-Mixed-Precision-Quantization-Framework-for-Accurate-and-Certifiably-Robust-DNN
