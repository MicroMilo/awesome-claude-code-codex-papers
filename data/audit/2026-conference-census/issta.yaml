  official_record_id: f9c6507a-2b52-4639-9aa3-8b9a99d07eb8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Decentralized Applications (DApps) serve as a critical technical underpinning for business logic and user interaction
    within the blockchain-powered Web3 ecosystem. However, DApps are prone to faults, and localizing these faults within their
    intricate and often interconnected logic is a particularly time-consuming process, frequently taking tens of hours and
    leading to substantial economic losses for developers. Existing state-of- the-art DApp fault localization methods, e.g.,
    FaultSeeker, cannot capture cross-transaction fault logic and produce verifiable diagnostic reports. Therefore, the security
    experts have to spend substantial time manually verifying results and devising fixes. In this paper, we present TracePilot,
    an large language models(LLMs)-based framework that automates DApp fault localization in two phases: distilling global
    fault insights from transaction sequences and then performing focused trace exploration to isolate the faulty logic. Crucially,
    we propose a novel patch verification technique, which allows for verifying the correctness of DApp fault localization
    reports, rather than relying on expert verification. Evaluated on a dataset of 149 real-world cases, TracePilot achieves
    a 71.14% Top-1 Recall, 128.9% higher than the state-of-the-art methods. Moreover, to facilitate further research, our
    code and dataset are publicly available online: https://anonymous.4open.science/r/TracePilot-F8A6/ .'
  abstract_source_url: https://conf.researchr.org/details/issta-2026/issta-2026-research-papers/201/TracePilot-Self-verifiable-Framework-for-Decentralized-Applications-Fault-Localizati
