  official_record_id: 2cb0eade-9be9-4a71-92a2-d94238d22872
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The widespread adoption of open source software (OSS) has revolutionized modern application development, but has
    also introduced significant security challenges. Malicious code poisoning attacks have escalated in both frequency and
    sophistication, targeting public package registries and open-source platforms like GitHub. Existing detection methods,
    including heuristic-based, learning-based, and LLM-based approaches, face key limitations such as reliance on language-specific
    designs, poor generalization, and high computational costs, which make them unsuitable for large-scale and multi-language
    analysis. To address these gaps, we propose MalTotal, a scalable and cost-effective framework for language-agnostic malicious
    code detection. By leveraging LLM-assisted semantic reasoning, MalTotal identifies sensitive API in built-in and third-party
    libraries, performs hybrid semantic slicing to reconstruct malicious behavior contexts, and significantly reduces token
    consumption for large-scale analysis. Extensive evaluations demonstrate that MalTotal outperforms 8 state-of-the-art baselines,
    achieving an average F1-score of 93.1% across 5 mainstream programming languages. Furthermore, MalTotal’s hybrid slicing
    strategy reduces LLM token consumption by 94.0%, lowering the cost of analysis from $86.25 to $5.19 on 2,168 repositories.
    In a large-scale study of 120K GitHub repositories containing over 7.3 million files, MalTotal identified 564 previously
    unknown malicious repositories across multiple languages at a total cost of just $338. These results demonstrate MalTotal’s
    effectiveness, scalability, and cost-efficiency, highlighting its potential to mitigate code poisoning attacks in large-scale
    codebases.
