- title: 'WITFuzz: Validity-Preserving Greybox Fuzzing for WebAssembly Interface Type Binding Generators'
  official_url: https://conf.researchr.org/track/issta-2026/issta-2026-research-papers
  track: Research papers
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  official_record_id: dece749d-c312-478f-ab64-af8d468e2589
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In the WebAssembly component model, interfaces written in WebAssembly Interface Types (WIT) are packaged and consumed
    as build-time dependencies, and binding generators (bindgens) translate them into language-specific bindings. Although
    a WIT package can be spec-valid, it can still break builds—by crashing or timing out during bindgen execution (Phase I),
    or by causing downstream toolchains to reject the generated bindings after generation appears to succeed (Phase II). Testing
    bindgens at scale is challenging because WIT is strongly typed and constraint-rich, and Phase II failures require language-specific
    checking. We present WITFuzz, a validity-preserving greybox fuzzer for WIT bindgens. WITFuzz mutates resolved WIT abstract
    syntax trees via structure-aware rewrites expressed in a small domain-specific language, and propagates correlated updates
    to maintain WIT validity. To overcome coverage plateaus, WITFuzz expands its strategy pool online using coverage-guided,
    LLM-assisted synthesis, admitting only strategies that pass local validation. WITFuzz further uses a build-aware, multi-layer
    oracle that combines in-loop checks with selective asynchronous compilation/typechecking of generated bindings to capture
    non-crashing build breakers. Across 12 bindgens, WITFuzz achieves the highest coverage and uncovers 40 previously unknown
    Phase I and Phase II build-breaking bugs, including 35 missed by all baselines.
