- title: 'Hyperfunctions: Communicating Continuations'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776649
  official_record_id: 128d1fa5-51d4-452a-897f-b88a45f7d491
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'A hyperfunction is a continuation-like construction that can be used to implement communication in the context
    of concurrency. Though it has been reinvented many times, it remains somewhat obscure: since its definition by Launchbury
    et al., hyperfunctions have been used to implement certain algebraic effect handlers, coroutines, and breadth-first traversals;
    however, in each of these examples, the hyperfunction type went unrecognised. We identify the hyperfunctions hidden in
    all of these algorithms, and we exposit the common pattern between them, building a framework for working with and reasoning
    about hyperfunctions. We use this framework to solve a long-standing problem: giving a fully-abstract continuation-based
    semantics for a concurrent calculus, the Calculus of Communicating Systems. Finally, we use hyperfunctions to build a
    monadic Haskell library for efficient first-class coroutines.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/9/Hyperfunctions-Communicating-Continuations
