- title: Context-Free-Language Reachability for Almost-Commuting Transition Systems
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776686
  official_record_id: e5c8084b-5c11-41e2-9243-f738dceaeb71
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We extend the scope of context-free-language (CFL) reachability to a new class of infinite-state systems. Parikh's
    Theorem is a useful tool for solving CFL-reachability problems for transition systems that consist of commuting transition
    relations. It implies that the image of a context-free language under a homomorphism into a commutative monoid is semi-linear,
    and that there is a linear-time algorithm for constructing a Presburger arithmetic formula that represents it. However,
    for many transition systems of interest, transitions do not commute. In this paper, we introduce almost-commuting transition
    systems, which pair finite-state control with commutative components, but which are in general not commutative. We extend
    Parikh's theorem to show that the image of a context-free language under a homomorphism into an \textit{almost-commuting
    monoid is semi-linear and that there is a polynomial-time algorithm for constructing a Presburger arithmetic formula that
    represents it. This result yields a general framework for solving CFL-reachability problems over \textit{almost-commuting
    transition systems}. We describe several examples of systems within this class. Finally, we examine closure properties
    of almost-commuting monoids that can be used to modularly compose almost-commuting transition systems while remaining
    in the class.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/46/Context-Free-Language-Reachability-for-Almost-Commuting-Transition-Systems
