- title: 'Handling Scope Checks: A Comparative Framework for Dynamic Scope Extrusion Checks'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776681
  official_record_id: 88b615f0-2318-4799-9588-45994691109e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Metaprogramming and effect handlers interact in unexpected, and sometimes undesirable, ways. One example is scope
    extrusion: the generation of ill-scoped code. Scope extrusion can either be preemptively prevented, via static type systems,
    or retroactively detected, via dynamic checks. Static type systems exist in theory, but struggle with a range of implementation
    and usability problems in practice. In contrast, dynamic checks exist in practice (e.g. in MetaOCaml), but are understudied
    in theory. Designers of metalanguages are thus given little guidance regarding the design and implementation of checks.
    We present the first formal study of dynamic scope extrusion checks, introducing a calculus ($\lambda_{\langle\langle\text{op}\rangle\rangle}$)
    for describing and evaluating checks. Further, we introduce a novel dynamic check — the “Cause-for-Concern” check — which
    we prove correct, characterise without reference to its implementation, and argue combines the advantages of existing
    dynamic checks. Finally, we extend our framework with refined environment classifiers, which statically prevent scope
    extrusion, and compare their expressivity with the dynamic checks.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/41/Handling-Scope-Checks-A-Comparative-Framework-for-Dynamic-Scope-Extrusion-Checks
