- title: Bounded Sort Polymorphism with Elimination Constraints
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776732
  official_record_id: 1521f2d4-473d-4f6b-8098-4f45b150b35a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Proof assistants based on dependent type theory—such as Agda, Lean, and Rocq—employ different universes to classify
    types, typically combining a predicative tower for computationally relevant types with a possibly impredicative universe
    for proof-irrelevant propositions. Several other universes with specific logical and computational principles have been
    explored in the literature. In general, a universe is characterized by its sort (e.g., Type, Prop, or SProp) and, in the
    predicative case, by its level. To improve modularity and better avoid code duplication, sort polymorphism has recently
    been introduced and integrated in the Rocq prover. However, we observe that, due to its unbounded formulation, sort polymorphism
    is currently insufficiently expressive to abstract over valid definitions with a single polymorphic schema. Indeed, to
    ensure soundness of a multi-sorted type theory, the interaction between different sorts must be carefully controlled,
    as exemplified by the forbidden elimination of irrelevant terms to produce relevant ones. As a result, generic functions
    that eliminate values of inductive types from one sort to another cannot be made polymorphic; dually, polymorphic records
    that encapsulate attributes of different sorts cannot be defined. This lack of expressiveness also breaks the possibility
    to infer principal types, which is highly desirable for both metatheoretical and practical reasons. To address these issues,
    we extend sort polymorphism with bounds that reflect the required elimination constraints on sort variables. We present
    the metatheory of bounded sort polymorphism, paying particular attention to the consistency of the resulting constraint
    graph. We implement bounded sort polymorphism in Rocq and illustrate its benefits through concrete examples. Bounded sort
    polymorphism with elimination constraints is a natural and general solution that effectively addresses current limitations
    and fosters the development of, and practical experimentation with, multi-sorted type theories.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/92/Bounded-Sort-Polymorphism-with-Elimination-Constraints
