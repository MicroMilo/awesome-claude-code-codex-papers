- title: 'TypeDis: A Type System for Disentanglement'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776655
  official_record_id: 42e5929c-8e8f-4b1c-a049-51ca6d71426b
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Disentanglement is a runtime property of parallel programs guaranteeing that parallel tasks remain oblivious to
    each other's allocations. As demonstrated in the MaPLe compiler and run-time system, disentanglement can be exploited
    for fast automatic memory management, especially task-local garbage collection with no synchronization between parallel
    tasks. However, as a low-level property, disentanglement can be difficult to reason about for programmers. The only means
    of statically verifying disentanglement so far has been DisLog, an Iris-fueled variant of separation logic, mechanized
    in the Rocq proof assistant. DisLog is a fully-featured program logic, allowing for proof of functional correctness as
    well as verification of disentanglement. Yet its employment requires significant expertise and per-program proof effort.
    This paper explores the route of automatic verification via a type system, ensuring that any well-typed program is disentangled
    and lifting the burden of carrying out manual proofs from the programmer. It contributes TypeDis, a type system inspired
    by region types, where each type is annotated with a timestamp, identifying the task that allocated it. TypeDis supports
    iso-recursive types as well as polymorphism over both types and timestamps. Crucially, timestamps are allowed to change
    during type-checking, at join points as well as via a form of subtyping, dubbed subtiming. The paper illustrates TypeDis
    and its features on a range of examples. The soundness of TypeDis and the examples are mechanized in the Rocq proof assistant,
    using an improved version of DisLog, dubbed DisLog2.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/15/TypeDis-A-Type-System-for-Disentanglement
