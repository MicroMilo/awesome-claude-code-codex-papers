- title: 'DafnyMPI: A Dafny Library for Verifying Message-Passing Concurrent Programs'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776705
  official_record_id: 984bafe8-6a3a-4a5a-8765-9259c98d6eab
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The Message Passing Interface (MPI) is widely used in parallel, high-performance programming, yet writing bug-free
    software that uses MPI remains difficult. We introduce DafnyMPI, a novel, scalable approach to formally verifying MPI
    software. DafnyMPI allows proving deadlock freedom, termination, and functional equivalence with simpler sequential implementations.
    In contrast to existing specialized frameworks, DafnyMPI avoids custom concurrency logics and instead relies on Dafny,
    a verification-ready programming language used for sequential programs, extending it with concurrent reasoning abilities.
    DafnyMPI is implemented as a library that enables safe MPI programming by requiring users to specify the communication
    topology upfront and to verify that calls to communication primitives such as MPI_ISEND and MPI_WAIT meet their preconditions.
    We formalize DafnyMPI using a core calculus and prove that the preconditions suffice to guarantee deadlock freedom. Functional
    equivalence is proved via rely-guarantee reasoning over message payloads and a system that guarantees safe use of read
    and write buffers. Termination and the absence of runtime errors are proved using standard Dafny techniques. To further
    demonstrate the applicability of DafnyMPI, we verify numerical solutions to three canonical partial differential equations.
    We believe DafnyMPI demonstrates how to make formal verification viable for a broader class of programs and provides proof
    engineers with additional tools for software verification of parallel and concurrent systems.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/65/DafnyMPI-A-Dafny-Library-for-Verifying-Message-Passing-Concurrent-Programs
