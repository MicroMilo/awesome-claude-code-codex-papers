- title: General Decidability Results for Systems with Continuous Counters
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776661
  official_record_id: 0b7ad9b7-3a30-4088-bdea-7875ab8efdfc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: <p>Counters that hold natural numbers are ubiquitous in modeling and verifying software systems; for example,
    they model dynamic creation and use of resources in concurrent programs. Unfortunately, such discrete counters often lead
    to extremely high complexity. Continuous counters are an efficient over-approximation of discrete counters. They are obtained
    by relaxing the original counters to hold values over the non-negative <i>rational</i> numbers.</p> <p>This work shows
    that continuous counters are extraordinarily well-behaved in terms of decidability. Our main result is that, despite continuous
    counters being infinite-state, the language of sequences of counter instructions that can arrive in a given target configuration,
    is regular. Moreover, a finite automaton for this language can be computed effectively. This implies that a wide variety
    of transition systems can be equipped with continuous counters, while maintaining decidability of reachability properties.
    Examples include higher-order recursion schemes, well-structured transition systems, and decidable extensions of discrete
    counter systems.</p> <p>We also prove a non-elementary lower bound for the size of the resulting finite automaton.</p>
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/21/General-Decidability-Results-for-Systems-with-Continuous-Counters
