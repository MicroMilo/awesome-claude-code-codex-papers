  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776696
  official_record_id: d72301f3-ce73-4838-aeda-1b70b34d728e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Bayesian probabilistic programming languages (BPPLs) let users denote statistical models as code while the interpreter
    infers the posterior distribution. The semantics of BPPLs are usually mathematically complex and unable to reason about
    desirable properties such as expected values and independence of random variables. To reason about these properties in
    a non-Bayesian setting, probabilistic separation logics such as PSL and Lilac interpret separating conjunction as probabilistic
    independence of random variables. However, no existing separation logic can handle Bayesian updating, which is the key
    distinguishing feature of BPPLs. To close this gap, we introduce Bayesian separation logic (BaSL), a probabilistic separation
    logic that gives semantics to BPPL. We prove an internal version of Bayes’ theorem using a result in measure theory known
    as the Rokhlin-Simmons disintegration theorem. Consequently, BaSL can model probabilistic programming concepts such as
    Bayesian updating, unnormalised distribution, conditional distribution, soft constraint, conjugate prior and improper
    prior while maintaining modularity via the frame rule. The model of BaSL is based on a novel instantiation of Kripke resource
    monoid via σ-finite measure spaces over the Hilbert cube, and the semantics of Hoare triple is compatible with an existing
    denotational semantics of BPPL based on the category of s-finite kernels. Using BaSL, we then prove properties of statistical
    models such as the expected value of Bayesian coin flip, correlation of random variables in the collider Bayesian network,
    the posterior distributions of the burglar alarm model, a parameter estimation algorithm, and the Gaussian mixture model.
