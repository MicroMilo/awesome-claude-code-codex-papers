- title: 'Nice to Meet You: Synthesizing Practical MLIR Abstract Transformers'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776722
  official_record_id: 0eb99938-a0eb-45ba-93fd-e3df3fae46a7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Static analyses play a fundamental role during compilation: they discover facts that are true in all executions
    of the code being compiled, and then these facts are used to justify optimizations and diagnostics. Each static analysis
    is based on a collection of abstract transformers that provide abstract semantics for the concrete instructions that make
    up a program. It can be challenging to implement abstract transformers that are sound, precise, and efficient—and in fact
    both LLVM and GCC have suffered from miscompilations caused by unsound abstract transformers. Moreover, even after more
    than 20 years of development, LLVM lacks abstract transformers for hundreds of instructions in its intermediate representation
    (IR). We developed NiceToMeetYou: a program synthesis framework for abstract transformers that are aimed at the kinds
    of non-relational integer abstract domains that are heavily used by today’s production compilers. It exploits a simple
    but novel technique for breaking the synthesis problem into parts: each of our transformers is the meet of a collection
    of simpler, sound transformers that are synthesized such that each new piece fills a gap in the precision of the final
    transformer. Our design point is bulk automation: no sketches are required. Transformers are verified by lowering to a
    previously-created SMT dialect of MLIR. Each of our synthesized transformers is provably sound and some (17 %) are more
    precise than those provided by LLVM.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/82/Nice-to-Meet-You-Synthesizing-Practical-MLIR-Abstract-Transformers
