  doi_url: https://doi.org/10.1145/3776654
  official_record_id: 7730ec63-9d77-4ff7-ad97-2a560abfffb2
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: JAX Autodiff refers to the core of the automatic differentiation (AD) systems developed in projects like JAX and
    Dex. JAX Autodiff has recently been formalised in a linear typed calculus by Radul et al in POPL 2023. Although this formalisation
    suffices to express the main program transformations of AD, the calculus is very specific to this task, and it is not
    clear whether the type system yields a substructural logic that has interest on its own. We propose an encoding of JAX
    Autodiff into a linear $\lambda$-calculus that enjoys a Curry-Howard correspondence with Girard's linear logic. We prove
    that the encoding is sound both qualitatively (the encoded terms are extensionally equivalent to the original ones) and
    quantitatively (the encoding preserves the original work cost as described in Radul et al). As a byproduct, we show that
    unzipping, one of the transformations used to implement backpropagation in JAX Autodiff, is, in fact, optional.
