- title: Verifying Almost-Sure Termination for Randomized Distributed Algorithms
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776691
  official_record_id: 355438fc-73a5-426d-8b2e-fbd47ffed1ec
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We present a technique for the verification of liveness properties of randomized distributed algorithms. Our technique
    gives SMT-based proofs for many common consensus algorithms, both for crash faults and for Byzantine faults. It is based
    on a sound proof rule for fair almost-sure termination of distributed systems that combines martingale-based techniques
    for almost-sure termination with reasoning about weak fairness. Our proof rule is able to handle parametrized protocols
    where the state grows unboundedly and every variant function is unbounded. These protocols were out of scope for previous
    approaches, which either relied on bounded variant functions or on reductions to (non-probabilistic) fairness. We have
    implemented our proof rules on top of Caesar, a program verifier for probabilistic programs. We use our proof rule to
    give SMT-based proofs for termination properties of randomized asynchronous consensus protocols, including Ben-Or's protocol
    and graded binary consensus, for both crash and Byzantine faults. These protocols have notoriously difficult proofs of
    termination but fall within the scope of our proof rule.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/51/Verifying-Almost-Sure-Termination-for-Randomized-Distributed-Algorithms
