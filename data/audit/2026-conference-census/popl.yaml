  official_record_id: 1883bbfa-1337-4e54-921c-b19eb5789541
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Recent research has demonstrated the effectiveness of extending the Hindley-Milner (HM) type system with Boolean
    kinds to support type inference for a wide variety of features. However, the means to support classic type system provisions
    such as local let generalization and polymorphic recursion is either limited or unknown for such extensions. This paper
    contributes procedures for equational generalization and semiunification in arbitrary Boolean rings, enabling let generalization
    and polymorphic recursion in Boolean-kinded type inference. Additionally, methods to minimize the number of bound Boolean
    type variables are developed to keep types small in these systems. Boolean-kinded HM extensions are exemplified with \textit{nullable
    reference types}, and how to use the developed procedures to support let generalization and polymorphic recursion is outlined.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/4/Let-Generalization-Polymorphic-Recursion-and-Variable-Minimization-in-Boolean-Kinde
