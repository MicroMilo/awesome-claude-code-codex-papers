- title: 'Zoo: A Framework for the Verification of Concurrent OCaml 5 Programs using Separation Logic'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776701
  official_record_id: cf0a9726-09c8-46ed-803d-4868b8d0e661
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The release of Ocaml 5, which introduced parallelism in the OCaml runtime, drove the need for safe and efficient
    concurrent data structures. New libraries like Saturn address this need. This is an opportunity to apply and further state-of-the-art
    program verification techniques. We present Zoo, a framework for verifying fine-grained concurrent OCaml 5 algorithms.
    Following a pragmatic approach, we defined a limited but sufficient fragment of the language to faithfully express these
    algorithms: ZooLang. We formalized its semantics carefully via a deep embedding in the Rocq proof assistant, uncovering
    subtle aspects of physical equality. We provide a tool to translate source OCaml programs into ZooLang syntax embedded
    inside Rocq, where they can be specified and verified using the Iris concurrent separation logic. To illustrate the applicability
    of Zoo, we verified a subset of the standard library and a collection of fined-grained concurrent data structures from
    the Saturn and Eio libraries. In the process, we also extended OCaml to more efficiently express certain concurrent programs.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/61/Zoo-A-Framework-for-the-Verification-of-Concurrent-OCaml-5-Programs-using-Separation
