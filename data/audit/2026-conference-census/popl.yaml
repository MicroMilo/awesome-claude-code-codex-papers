- title: Let Generalization, Polymorphic Recursion, and Variable Minimization in Boolean-Kinded Type Systems
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
