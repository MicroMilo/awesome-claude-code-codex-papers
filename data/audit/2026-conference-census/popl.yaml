- title: Classical Notions of Computation and the Hasegawa-Thielecke Theorem
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776715
  official_record_id: 02ae03c5-d9cd-49d8-907a-1167f965cf90
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'In the spirit of the Curry-Howard correspondence between proofs and programs, we define and study a syntax and
    semantics for classical logic equipped with a computationally involutive negation, using a polarised effect calculus,
    the linear classical L-calculus. A main challenge in designing a denotational semantics for the calculus is to accommodate
    both call-by-value and call-by-name evaluation strategies, which leads to a failure of associativity of composition. In
    order to tackle this issue, we define a notion of adjunction between graph morphisms on non-associative categories, which
    we use to formulate polarized and non-associative notions of symmetric monoidal closed duploid and of dialogue duploid.
    We show that they provide a direct style counterpart to adjunction models: linear effect adjunctions for the (linear)
    call-by-push-value calculus and dialogue chiralities for linear continuations, respectively. In particular, we show that
    the syntax of the linear classical L-calculus can be interpreted in any dialogue duploid, and that it defines in fact
    a syntactic dialogue duploid. As an application, we establish, by semantic as well as syntactic means, the Hasegawa-Thielecke
    theorem, which states that the notions of central map and of thunkable map coincide in any dialogue duploid (in particular,
    for any double negation monad on a symmetric monoidal category).'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/75/Classical-Notions-of-Computation-and-the-Hasegawa-Thielecke-Theorem
