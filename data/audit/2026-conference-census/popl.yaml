- title: 'ChopChop: A Programmable Framework for Semantically Constraining the Output of Language Models'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776708
  official_record_id: fe5d9453-4bd9-4d8d-aa93-7dc3166a5d19
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Language models (LMs) can generate code but cannot guarantee its correctness—often producing outputs that violate
    type safety, program invariants, or other semantic properties. Constrained decoding offers a solution by restricting generation
    to only produce programs that satisfy user-defined properties. However, existing methods are either limited to syntactic
    constraints or rely on brittle, ad hoc encodings of semantic properties over token sequences rather than program structure.
    We present ChopChop, the first programmable framework for constraining the output of LMs with respect to semantic properties.
    ChopChop introduces a principled way to construct constrained decoders based on analyzing the space of programs a prefix
    represents. It formulates this analysis as a realizability problem which is solved via coinduction, connecting token-level
    generation with structural reasoning over programs. We demonstrate ChopChop's generality by using it to enforce (1) equivalence
    to a reference program and (2) type safety. Across a range of models and tasks, ChopChop improves success rates while
    maintaining practical decoding latency.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/68/ChopChop-A-Programmable-Framework-for-Semantically-Constraining-the-Output-of-Langua
