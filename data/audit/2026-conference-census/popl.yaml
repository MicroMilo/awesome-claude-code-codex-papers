- title: 'Welterweight Go: Boxing, Structural Subtyping, and Generics'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776721
  official_record_id: 5a08bc61-b9fd-4a5d-b289-dc40c6195b3d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Go’s unique combination of structural subtyping between generics and types with non-uniform runtime representations
    presents significant challenges for formalising the language. We introduce WG (Welterweight Go), a core model of Go that
    captures key features excluded by prior work, including underlying types, type constraints and type sets, and proposed
    new features, such as generic methods. We also develop LWG, a lower-level language that models Go’s runtime mechanisms,
    notably the distinction between raw struct values and interface values that carry runtime type information (RTTI). We
    give a type-directed compilation from WG to LWG that demonstrates how the proposed features can be implemented while observing
    important design and implementation goals for Go: compatibility with separate compilation, and no runtime code generation.
    Unlike existing approaches based on static monomorphisation, our compilation strategy uses runtime type conversions and
    adaptor methods to handle the complex interactions between structural subtyping, generics, and Go’s runtime infrastructure.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/81/Welterweight-Go-Boxing-Structural-Subtyping-and-Generics
