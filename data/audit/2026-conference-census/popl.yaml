  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776685
  official_record_id: fabc5297-40f1-4470-b3d4-0d22a6f186cf
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We prove canonicity for a Martin-Löf type theory with a countable universe hierarchy where each universe supports
    indexed inductive-recursive (IIR) types. We proceed in two steps. First, we construct IIR types from inductive-recursive
    (IR) types and other basic type formers, in order to simplify the subsequent canonicity proof. The constructed IIR types
    support the same definitional computation rules that are available in Agda's native IIR implementation. Second, we give
    a canonicity proof for IR types, building on the established method of gluing along the global sections functor. The main
