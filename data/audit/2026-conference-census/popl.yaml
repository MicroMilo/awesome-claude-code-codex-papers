- title: Compiling to Linear Neurons
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776677
  official_record_id: 409b44b6-c79a-449c-a104-59ab33eb196c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We don’t program neural networks directly. Instead, we rely on an indirect style where learning algorithms, like
    gradient descent, determine a neural network’s function by learning from data. This indirect style is often a virtue;
    it empowers us to solve problems that were previously impossible. But it lacks discrete structure. We can’t compile most
    algorithms into a neural network—even if these algorithms could help the network learn. This limitation occurs because
    discrete algorithms are not obviously differentiable, making them incompatible with the gradient-based learning algorithms
    that determine a neural network’s function. To address this, we introduce Cajal: a typed, higher-order and linear programming
    language intended to be a minimal vehicle for exploring a direct style of programming neural networks. We prove Cajal
    programs compile to linear neurons, allowing discrete algorithms to be expressed in a differentiable form compatible with
    gradient-based learning. With our implementation of Cajal, we conduct several experiments where we link these linear neurons
    against other neural networks to determine part of their function prior to learning. Linking with these neurons allows
    networks to learn faster, with greater data-efficiency, and in a way that’s easier to debug. A key lesson is that linear
    programming languages provide a path towards directly programming neural networks, enabling a rich interplay between learning
    and the discrete structures of ordinary programming.'
