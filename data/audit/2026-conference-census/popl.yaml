- title: 'Algorithmic Conversion with Surjective Pairing: A Syntactic and Untyped Approach'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776672
  official_record_id: 1e91da51-35a0-4cd6-846d-57ce8ef17e13
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In a dependent type theory with $\beta$-equivalence as its equational theory, the confluence of untyped reduction
    and termination immediately give us a proof of the decidability of type conversion, where the decision procedure for convertibility
    simply checks the equality of the $\beta$-normal forms of its inputs. This technique is not available in the presence
    of surjective pairing (i.e. the $\eta$-law for pairs) because $\beta\eta$-reduction is not confluent. In this work, we
    show that by adopting established syntactic techniques, we can resolve the issue with confluence caused by surjective
    pairing, and recover a confluence-based proof of decidability of type conversion. Compared to existing proof developments,
    which rely on semantic tools such as Kripke-style logical relations, our proof modularly composes a minimal semantic proof
    of untyped normalization and a syntactic proof of decidability. This modularity enables us to explore algorithmic conversion
    through syntactic methods without modifying the minimal semantic proof. We have fully mechanized our results using the
    Rocq theorem prover.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/32/Algorithmic-Conversion-with-Surjective-Pairing-A-Syntactic-and-Untyped-Approach
