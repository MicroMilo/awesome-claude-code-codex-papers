- title: The Complexity of Testing Message-Passing Concurrency
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776643
  official_record_id: f0aa186f-7ad5-4c8f-bb48-8e03bffa5e1e
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: A key computational question underpinning the automated testing and verification of concurrent programs is the
    \emph{consistency question} — \emph{given a partial execution history, can it be completed in a consistent manner?} Due
    to its importance, consistency testing has been studied extensively for memory models, as well as for database isolation
    levels. A common theme in all these settings is the use of shared-memory as the primal mode of interthread communication.
    On the other hand, modern programming languages, such as Go, Rust and Kotlin, advocate a paradigm shift towards channel-based
    (i.e., message-passing) communication. However, the consistency question for channel-based concurrency is currently poorly
    understood. In this paper we lift the study of fundamental consistency problems to channels, taking into account various
    input parameters, such as the number of threads executing, the number of channels, and the channel capacities. We draw
    a rich complexity landscape, including upper bounds that become polynomial when certain input parameters are fixed, as
    well as hardness lower bounds. Our upper bounds are based on algorithms that can drive the verification of channel consistency
    in automated verification tools. Our lower bounds characterize minimal input parameters that are sufficient for hardness
    to arise, and thus shed light on the intricacies of testing channel-based concurrency. In combination, our upper and lower
    bounds characterize the boundary of \emph{tractability/intractability} of verifying channel consistency, and imply that
    our algorithms are often (nearly) optimal. We have also implemented our main consistency checking algorithm and designed
    optimizations to enhance its performance. We evaluated the performance of our implementation over a set of 103 instances
    obtained from open source Go projects, and compared it against a constraint-solving based algorithm. Our experimental
    results demonstrate the power of our consistency-checking algorithm; it scales to around 1M events, and is significantly
    faster in running-time performance, compared to a constraint-solving approach.
