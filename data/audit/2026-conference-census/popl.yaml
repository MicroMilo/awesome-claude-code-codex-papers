  official_record_id: c9b7bd39-8a3b-45d7-ba4b-f14b0851b5ad
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Syntax-guided program synthesis relies on domain-specific languages (DSLs) to constrain the search space and improve
    efficiency. However, manually designing optimal DSLs is challenging and often results in suboptimal performance. In this
    paper, we propose AMaze, a novel framework that automatically optimizes DSLs to accelerate synthesis. AMaze iteratively
    refines a DSL by identifying key program fragments, termed feature components, whose enumeration ranks correlate with
    synthesis time. Using a dynamic-programming-based algorithm to calculate enumeration ranks of feature components and a
    machine learning model based on them, AMaze estimates synthesis cost instead of directly invoking the synthesizer, which
    is impractical due to high computational cost. We evaluate AMaze on state-of-the-art synthesizers, including DryadSynth,
    Duet, Polygen, and EUsolver, across multiple domains. Empirical results demonstrate that AMaze achieves up to 4.35X speedup,
    effectively reducing synthesis time while maintaining expressiveness.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/39/Accelerating-Syntax-Guided-Program-Synthesis-by-Optimizing-Domain-Specific-Languages
