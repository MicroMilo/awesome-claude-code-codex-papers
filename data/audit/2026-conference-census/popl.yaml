- title: 'Encode the Cake and Eat It Too: Controlling Computation in Type Theory, Locally Distinguished Paper'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776704
  official_record_id: 463ca3b5-39e0-4838-a451-7ff706921d1f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Proof assistants based on dependent type theory such as Agda, Lean and Rocq identify objects up to computation
    during proof checking. This takes away some of the proof burden from the user and even provides a way to get very efficient
    automation. Recently, Agda and Rocq have been extended to support user-defined computation. While they already prove very
    useful, user-defined computation rules are global : once they are added, they are here to stay. Importing a development
    that makes use of those rules then means relying on them, whether we want it or not, which can lead to unwanted incompatibilities.
    We design LRTT, a type theory with support for local abstraction over user-defined computation rules. This takes the form
    of a prenex quantification at the definition level. This quantification is supplemented with the possibility to provide
    one or several instantiations that verify the equations definitionally. We show that a procedure inlining definitions
    abstracting over definitional equality is possible, in the style of monomorphisation or of C++ templates. In the process
    we get a conservativity result over more conventional Martin-Löf type theories. There are several benefits to such a system.
    First, it provides encapsulation for user-defined computation rules, which is important to avoid unwanted bad interactions
    and limits the scope in which invariants of type theory (such as termination, confluence, type preservation and consistency)
    are broken. Second, abstraction lets users factorise code that crucially relies on definitional equality, as well as hide
    implementation details that are irrelevant in some settings. Finally, it gives a way to encode certain features without
    paying the price of the encoding. We showcase such examples in a prototype implementation as an extension of the Rocq
    Prover. Additionally, all the results in this have been formalised in Rocq.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/64/Encode-the-Cake-and-Eat-It-Too-Controlling-Computation-in-Type-Theory-Locally
