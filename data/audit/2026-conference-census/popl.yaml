- title: 'AdapTT: Functoriality for Dependent Type Casts'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776664
  official_record_id: 9cf71a7c-0160-4bc1-89e5-0c0355c15c8d
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: The ability to cast values between related types is a leitmotiv of many flavors of dependent type theory, such
    as observational type theories, subtyping, or cast calculi for gradual typing. These casts all exhibit a common structural
    behavior that boils down to the pervasive functoriality of type formers. We propose and extensively study a type theory,
    called AdapTT, which makes systematic and precise this idea of functorial type formers, with respect to an abstract notion
    of adapters relating types. Leveraging descriptions for functorial inductive types in AdapTT, we derive structural laws
    for type casts on general inductive type formers.
