- title: What Is a Monoid?
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776727
  official_record_id: f7fd20e4-a55b-4e2a-a675-22689aa49268
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In many situations one encounters an entity that resembles a monoid. It consists of a carrier and two operations
    that resemble a unit and a multiplication, subject to three equations that resemble associativity and left and right unital
    laws. The question then arises whether this entity is, in fact, a monoid in a suitable sense. Category theorists have
    answered this question by providing a notion of monoid in a monoidal category, or more generally in a multicategory. While
    these encompass many examples, there remain cases which do not fit into these frameworks, such as the notion of relative
    monad and the modelling of call-by-push-value sequencing. In each of these examples, the leftmost and/or the rightmost
    factor of a multiplication or associativity law seems to be distinguished. To include such examples, we generalize the
    multicategorical framework in two stages. Firstly, we move to the framework of a left-skew multicategory (due to Bourke
    and Lack), which generalizes both multicategory and left-skew monoidal category. The notion of monoid in this framework
    encompasses examples where only the leftmost factor is distinguished, such as the notion of relative monad. Secondly,
    we consider monoids in the novel framework of a bi-skew multicategory. This encompasses examples where both the leftmost
    and the rightmost factor are distinguished, such as the notion of a category on a span, and the modelling of call-by-push-value
    sequencing. In the bi-skew framework (which is the most general), we give a coherence result saying that a monoid corresponds
    to an unbiased monoid, i.e. a map from the terminal bi-skew multicategory.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/87/What-Is-a-Monoid-
