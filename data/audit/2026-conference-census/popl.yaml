- title: Generating Compilers for Qubit Mapping and Routing
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776720
  official_record_id: 52b9eb53-566b-4156-acdf-9ac211b597af
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'To evaluate a quantum circuit on a quantum processor, one must find a mapping from circuit qubits to processor
    qubits and plan the instruction execution while satisfying the processor''s constraints. This is known as the qubit mapping
    and routing (QMR) problem. High-quality QMR solutions are key to maximizing the utility of scarce quantum resources and
    minimizing the probability of logical errors affecting computation. The challenge is that the landscape of quantum processors
    is incredibly diverse and fast-evolving. Given this diversity, dozens of papers have addressed the QMR problem for different
    qubit hardware, connectivity constraints, and quantum error correction schemes by a developing a new algorithm for a particular
    context. We present an alternative approach: automatically generating qubit mapping and routing compilers for arbitrary
    quantum processors. Though each QMR problem is different, we identify a common core structure—device state machine—that
    we use to formulate an abstract QMR problem. Our formulation naturally leads to a compact domain-specific language for
    specifying QMR problems and a powerful parametric algorithm that can be instantiated for any QMR specification. Our thorough
    evaluation on case studies of important QMR problems shows that generated compilers are competitive with handwritten,
    specialized compilers in terms of runtime and solution quality.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/80/Generating-Compilers-for-Qubit-Mapping-and-Routing
