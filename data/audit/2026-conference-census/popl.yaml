- title: Lazy Linearity for a Core Functional Language
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776711
  official_record_id: 21486435-03d9-4dfe-b1a9-3e859e1057df
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Traditionally, in linearly typed languages, consuming a linear resource is synonymous with its syntactic occurrence
    in the program. However, under the lens of non-strict evaluation, linearity can be further understood semantically, where
    a syntactic occurrence of a resource does not necessarily entail using that resource when the program is executed. While
    this distinction has been largely unexplored, it turns out to be inescapable in Haskell's optimising compiler, which heavily
    rewrites the source program in ways that break syntactic linearity but preserve the program's semantics. We introduce
    Linear Core, a novel system which accepts the lazy semantics of linearity statically and is suitable for lazy languages
    such as the Core intermediate language of the Glasgow Haskell Compiler. We prove that Linear Core is sound, guaranteeing
    linear resource usage, and that multiple optimising transformations preserve linearity in Linear Core while failing to
    do so in Core. We have implemented Linear Core as a compiler plugin to validate the system against linearity-heavy libraries,
    including linear-base.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/71/Lazy-Linearity-for-a-Core-Functional-Language
