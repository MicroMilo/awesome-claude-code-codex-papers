- title: A Synthetic Reconstruction of Multiparty Session Types
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776692
  official_record_id: 796ca2da-9853-419c-a42a-c612a47409e6
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Multiparty session types (MPST) provide a rigorous foundation for verifying the safety and liveness of concurrent
    systems. However, existing approaches often force a difficult trade-off: classical, projection-based techniques are compositional
    but limited in expressiveness, while more recent techniques achieve higher expressiveness by relying on non-compositional,
    whole-system model checking, which scales poorly. This paper introduces a new approach to MPST that delivers both expressiveness
    and compositionality, called the synthetic approach. Our key innovation is a type system that verifies each process directly
    against a global protocol specification, represented as a labelled transition system (LTS) in general, with global types
    as a special case. This approach uniquely avoids the need for intermediate local types and projection. We demonstrate
    that our approach, while conceptually simpler, supports a benchmark of challenging protocols that were previously beyond
    the reach of compositional techniques in the MPST literature. We generalise our type system, showing that it can validate
    processes against any specification that constitutes a ``well-behaved'''' LTS, supporting protocols not expressible with
    the standard global type syntax. The entire framework, including all theorems and many examples, has been formalised and
    mechanised in Agda, and we have developed a prototype implementation as an extension to VS Code.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/52/A-Synthetic-Reconstruction-of-Multiparty-Session-Types
