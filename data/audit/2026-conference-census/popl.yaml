- title: A Relational Separation Logic for Effect Handlers
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776676
  official_record_id: 875bfcbe-007c-4bd5-8539-38bbd4646937
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Effect handlers offer a powerful and relatively simple mechanism for controlling a program''s flow of execution.
    Since their introduction, an impressive array of verification tools for effect handlers has been developed. However, to
    this day, no framework can express and prove relational properties about programs that use effect handlers in languages
    such as OCaml and Links, where programming features like mutable state and concurrency are readily available. To this
    end, we introduce blaze, the first relational separation logic for effect handlers. We build blaze on top of the Rocq
    implementation of the Iris separation logic, thereby enjoying the rigour of a mechanised theory and all the reasoning
    properties of a modern fully-fledged concurrent separation logic, such as modular reasoning about stateful concurrent
    programs and the ability to introduce user-defined ghost state. In addition to familiar reasoning rules, such as the bind
    rule and the frame rule, blaze offers rules to reason modularly about programs that perform and handle effects. Significantly,
    when verifying that two programs are related, blaze does not require that effects and handlers from one program be in
    correspondence with effects and handlers from the other. To assess this flexibility, we conduct a number of case studies:
    most noticeably, we show how different implementations of an asynchronous-programming library using effects are related
    to truly concurrent implementations. As side contributions, we introduce two new, simple, and general reasoning rules
    for concurrent relational separation logic that are independent of effects: a logical-fork rule that allows one to reason
    about an arbitrary program phrase as if it had been spawned as a thread and a thread-swap rule that allows one to reason
    about how threads are scheduled.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/36/A-Relational-Separation-Logic-for-Effect-Handlers
