- title: Parameterized Infinite-State Reactive Synthesis
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776726
  official_record_id: 3bd25a3d-6eaa-4167-ba1f-823f43dbcfa7
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We propose a method to synthesize a parameterized infinite-state system that can be instantiated for different
    parameter values. The specification is given in a parameterized temporal logic that allows for data variables as well
    as parameters that encode properties of the environment. Our synthesis method runs in a counterexample-guided loop consisting
    of four steps: (1) we synthesize concrete systems for some small parameter instantiations using existing techniques. (2)
    We generalize the concrete systems into a parameterized program. (3) We create a proof candidate consisting of an invariant
    and a ranking function. (4) We check the proof candidate for consistency with the program. If the proof succeeds, the
    parameterized program is valid. Otherwise, we identify a parameter value for which it fails and add a new concrete instance
    to step one. To generalize programs and create proof candidates, we use a combination of anti-unification and syntax-guided
    synthesis to express the differences between the programs as a function of the parameters. We evaluate our approach on
    new examples and examples from the literature that are manually parameterized.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/86/Parameterized-Infinite-State-Reactive-Synthesis
