- title: A Family of Sims with Diverging Interests
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776714
  official_record_id: fb2b7d6e-135c-4f75-83a3-643654d7b1e8
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Simulations are widely-used notions of program refinement. This paper discusses and compares several of them,
    in particular notions of simulation that are both weak and sensitive to divergence. Complex simulation proofs performed
    in proof assistants, for instance in a verified compilation setting, often rely on variants of normed simulation, which
    is not complete with respect to divergence-sensitive weak simulation. We propose to bridge this gap with µdiv-simulation,
    a novel notion of simulation that is equivalent to classical divergence-sensitive weak simulation, and designed to be
    as comfortable to use as modern characterizations of normed simulation. We then define a parameterized notion of simulation
    that covers strong simulation, weak simulation, µdiv-simulation, and 9 more notions of simulation, and jointly establish
    various "up-to" reasoning techniques for these 12 notions. Our results are formalized in Rocq and instantiated on two
    case studies: Choice Trees and a CompCert pass. Verified compilation is a major motivation for our study, but because
    we work with an abstract LTS setting, our results are also relevant to other fields that make use of divergence-sensitive
    weak simulation, such as model checking.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/74/A-Family-of-Sims-with-Diverging-Interests
