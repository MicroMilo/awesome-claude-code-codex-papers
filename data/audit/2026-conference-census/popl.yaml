- title: 'Probabilistic Concurrent Reasoning in Outcome Logic: Independence, Conditioning, and Invariants Distinguished Paper'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776651
  official_record_id: 521f72c5-dd9a-40f1-b347-66e5f3aa1d7a
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Although randomization has long been used in distributed computing, formal methods for reasoning about probabilistic
    concurrent programs have lagged behind. No existing program logics can express specifications about the full distributions
    of outcomes resulting from programs that are both probabilistic and concurrent. To address this, we introduce Probabilistic
    Concurrent Outcome Logic (pcOL), which incorporates ideas from concurrent and probabilistic separation logics into Outcome
    Logic to introduce new compositional reasoning principles. At its core, pcOL reinterprets the rules of Concurrent Separation
    Logic in a setting where separation models probabilistic independence, so as to compositionally describe joint distributions
    over variables in concurrent threads. Reasoning about outcomes also proves crucial, as case analysis is often necessary
    to derive precise information about threads that rely on randomized shared state. We demonstrate pcOL on a variety of
    examples, including to prove almost sure termination of unbounded loops.
