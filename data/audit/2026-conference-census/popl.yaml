  official_record_id: b39ae613-7640-4115-b3f1-8fa31215d031
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Differential operators map input changes to output changes and form the building blocks of efficient incremental
    computations. For example, differential operators for relational algebra are used to perform live view maintenance in
    database systems. However, few differential operators are known and it is unclear how to develop and verify new efficient
    operators. In particular, we found that differential operators often need to use internal state to selectively cache relevant
    information, which is not supported by prior work. To this end, we designed a specification for \emph{stateful differential
    operators} that allows custom state, yet places sufficient constraints to ensure correctness. We model our specification
    in Rocq and show that the specification not only guides the design of novel differential operators, but also can capture
    some of the most sophisticated existing differential operators: database join and Datalog aggregation. We show how to
    describe complex incremental computations in OCaml by composing stateful differential operators, which we have extracted
    from Rocq.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/88/Stateful-Differential-Operators-for-Incremental-Computing
