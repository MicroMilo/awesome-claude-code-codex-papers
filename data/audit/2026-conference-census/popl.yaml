- title: Consistent Updates for Scalable Microservices
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776700
  official_record_id: 312b8429-2602-4638-8875-6ab34b41664f
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Online services are commonly implemented with a scalable microservice architecture, where isomorphic workers process
    client requests, recording persistent state in a backend data store. To maintain service, modifications to service functionality
    must be made on the fly – i.e., as the service continues to process client requests – but doing so is challenging. The
    central difficulty is that of avoiding inconsistencies from mixed-mode operation, caused by workers of current and new
    versions interacting via the data store. Some update methods avoid mixed-mode altogether, but only at the cost of substantial
    inefficiency – by doubling resources (memory and compute), or by halving throughput. The alternative is an uncontrolled
    ``rolling'' update, which runs the risk of serious service failures arising from inconsistent mixed-mode behavior. Ideally,
    it should appear to every client that a service update takes effect atomically; this ensures that a client is not exposed
    to inconsistent mixed-mode behavior. In this paper, we introduce a framework that formalizes this intuition and develop
    foundational theory for reasoning about update consistency. We apply this theory to derive the first algorithms that guarantee
    consistency for mixed-mode updates. The algorithms rely on semantic properties of service actions, such as commutativity.
    We show that this is unavoidable, by proving that any semantically oblivious mixed-mode update method must allow inconsistencies.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/60/Consistent-Updates-for-Scalable-Microservices
