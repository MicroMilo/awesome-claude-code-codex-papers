- title: Parametrised Verification of Intel-x86 Programs
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. PDF download was not requested by the metadata-first policy.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776680
  official_record_id: 26db70f5-6247-4071-a49a-a08e1176de6c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We address the reachability problem for concurrent programs with an arbitrary number of threads running over the
    Intel x-86 architecture. We consider the formal model eTSO for Intel x-86 defined by Raad et al. in POPL 2022. This model
    takes into account multiple memory types and non-temporal writes, combining in a complex way features in the TSO and PSO
    weak memory models. In PLDI 2024, Abdulla et al. proved that this problem is undecidable for eTSO in general, but that
    it is decidable under $k$-alternation bounding when computations have, for some fixed bound $k$, at most $k$ alternations
    of TSO segments (with TSO writes only) and PSO segments (with PSO writes only) for each thread. The proof of this result
    assumes that the number of threads is fixed, and relies crucially on referring to thread identities. In this paper, we
    prove the decidability of the $k$-alternation bounded reachability problem of eTSO in the parametrized setting when the
    number of threads is a parameter that can be arbitrarily high. The proof is nontrivial as it cannot refer to thread identities,
    their number being unbounded. We show that it is possible to overcome this difficulty using a novel and quite complex
    reduction to reachability in well-structured systems on domains that are BQOs (Better Quasi Orders). This is the first
    time that BQO-based well-structured systems are used to prove the decidability of verification of infinite state programs.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/40/Parametrised-Verification-of-Intel-x86-Programs
