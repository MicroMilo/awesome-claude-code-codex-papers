- title: Local Contextual Type Inference
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776653
  official_record_id: 6d3eb79b-1590-4e15-812f-ad4598128769
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Type inference is essential for programming languages, yet complete and global inference quickly becomes undecidable
    in the presence of rich type systems like System~F. Pierce and Turner proposed local type inference (LTI) as a scalable,
    partially annotated alternative by relying on information local to applications. While LTI has been widely adopted in
    practice, there are significant gaps between theory and practice, with its theory being underdeveloped and specifications
    for LTI being complex and restrictive. We propose \emph{Local Contextual Type Inference}, a principled redesign of LTI
    grounded in contextual typing—a recent formalism which captures type information flow. We present \emph{Contextual System~F}
    (Fc), a variant of System~F with implicit and first-class polymorphism. We formalize Fc using a declarative type system,
    prove soundness, completeness, and decidability, and introduce matching subtyping as a bridge between declarative and
    algorithmic inference. This work offers the first mechanized treatment of LTI, while at the same time removing important
    practical restrictions and also demonstrating the power of contextual typing in designing robust, extensible and simple
    to implement type inference algorithms.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/13/Local-Contextual-Type-Inference
