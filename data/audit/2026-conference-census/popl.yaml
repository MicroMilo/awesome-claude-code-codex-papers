- title: A Modular Static Cost Analysis for GPU Warp-Level Parallelism
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776693
  official_record_id: 4b7e9f23-707d-4da7-b3af-646bbc2de879
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Graphics Processing Units (GPUs) are the accelerator of choice for performance-critical applications, yet optimizing
    for performance requires mastery of the complex interactions between its memory architecture and its execution model.
    Existing static analysis tools for GPU kernels either identify performance bugs without quantifying costs or cannot handle
    thread-divergent control flow, leading to significant over-approximations. We present the first static relational-cost
    analysis for GPU warp-level parallelism that can give exact bounds even in the presence of thread divergence. Our analysis
    is general and flexible, as it is parametric on the resource metric (uncoalesced accesses, bank conflicts) and on the
    cost relation (=, ≤, ≥). We establish a soundness theorem for our technique, provide mechanized proofs in Rocq and implement
    our theory in a tool called Pico. In a reproducibility experiment, Pico produced the tightest bounds in every input, outperforming
    the state-of-the-art tool RaCUDA in 10 kernels (1.7×better), while RaCUDA produced 4 incorrect bounds and crashed on 2
    kernels. In an experiment to measure the accuracy of Pico, we studied the impact of thread-divergence in control-flow
    in a dataset of 226 kernels. We found that at least 75.3% of conditionals and 85.4% of loops can be captured exactly,
    without introducing approximation.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/53/A-Modular-Static-Cost-Analysis-for-GPU-Warp-Level-Parallelism
