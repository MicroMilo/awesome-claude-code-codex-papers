- title: Piecewise Analysis of Probabilistic Programs via k-Induction
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776709
  official_record_id: e2992794-e9cd-4672-a890-047677c80f94
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In probabilistic program analysis, quantitative analysis aims at deriving tight numerical bounds for probabilistic
    properties such as expectation and assertion probability. Most previous works consider numerical bounds over the whole
    program state space monolithically and do not consider piecewise bounds. Not surprisingly, monolithic bounds are either
    conservative, or not expressive and succinct enough in general. To derive better bounds, we propose a novel approach for
    synthesizing piecewise bounds over probabilistic programs. First, we show how to extract useful piecewise information
    from latticed $k$-induction operators, and combine the piecewise information with Optional Stopping Theorem to obtain
    a general approach to derive piecewise bounds over probabilistic programs. Second, we develop algorithms to synthesize
    piecewise polynomial bounds, and show that the synthesis can be reduced to bilinear programming in the linear case, and
    soundly relaxed to semidefinite programming in the polynomial case. Experimental results show that our approach generates
    tight piecewise bounds for a wide range of benchmarks when compared with the state of the art.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/69/Piecewise-Analysis-of-Probabilistic-Programs-via-k-Induction
