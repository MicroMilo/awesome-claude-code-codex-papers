- title: 'An Equational Axiomatization of Dynamic Threads via Algebraic Effects: Presheaves on Finite Relations, Labelled
    Posets, and Parameterized Algebraic Theories Distinguished Paper'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776706
  official_record_id: 99a9280c-ac30-4c05-9173-b7dd1c9e6ffc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We use the theory of algebraic effects to give a complete equational axiomatization for dynamic threads. Our
    method is based on parameterized algebraic theories, which give a concrete syntax for strong monads on functor categories,
    and are a convenient framework for names and binding. Our programs are built from the key primitives fork&#39; and wait''.
    Fork&#39; creates a child thread and passes its name (thread ID) to the parent thread. Wait'' allows us to wait for given
    child threads to finish. We provide a parameterized algebraic theory built from fork and wait, together with basic atomic
    actions and laws such as associativity of `fork''. Our equational axiomatization is complete in two senses. First, for
    closed expressions, it completely captures equality of labelled posets (pomsets), an established model of concurrency:
    model complete. Second, any two open expressions are provably equal if they are equal under all closing substitutions:
    syntactically complete. The benefit of algebraic effects is that the semantic analysis can focus on the algebraic operations
    of fork and wait. We then extend the analysis to a simple concurrent programming language by giving operational and denotational
    semantics. The denotational semantics is built using the methods of parameterized algebraic theories and we show that
    it is sound, adequate, and fully abstract at first order for labelled-poset observations.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/66/An-Equational-Axiomatization-of-Dynamic-Threads-via-Algebraic-Effects-Presheaves-on-
