  official_record_id: 51944f57-a46f-439c-974c-a76a8faaf7b5
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Quantum Separation Logic (QSL) has been proposed as an effective tool to improve the scalability of deductive
    reasoning for quantum programs. In QSL, separation is interpreted as disentanglement, and the frame rule brings a notion
    of entanglement-local specification (one that only talks about the qubits entangled with those acted upon by the program).
    In this paper, we identify two notions of locality unique to the quantum domain, and we construct a novel quantum separation
    logic, RapunSL, which is able to soundly reduce reasoning about superposition states to reasoning about pure states (basis-locality),
    and reasoning about mixed states arising from measurement to reasoning about pure states (outcome-locality). To do so,
    we introduce two connectives, linear combination and mixing, which together with separation provide a dramatic improvement
    in the scalability of reasoning, as we demonstrate on a series of challenging case studies.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/8/RapunSL-Untangling-Quantum-Computing-with-Separation-Linear-Combination-and-Mixing
