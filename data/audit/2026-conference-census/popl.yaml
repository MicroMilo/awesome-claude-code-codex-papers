- title: Handling Higher-Order Effectful Operations with Judgemental Monadic Laws
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776678
  official_record_id: a60cd4d6-0bbf-4d5d-988f-9ee08efa7307
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: This paper studies the design of programming languages with handlers of higher-order effectful operations – effectful
    operations that may take in computations as arguments or return computations as output. We present and analyse a core
    calculus with higher-kinded impredicative polymorphism, handlers of higher-order effectful operations, and optionally
    general recursion. The distinctive design choice of this calculus is that handlers are carried by lawless raw monads,
    while the computation judgements still satisfy the monadic laws judgementally. We present the calculus with a logical
    framework and give denotational models of the calculus using realizability semantics. We prove closed-term canonicity
    and parametricity for the recursion-free fragment of the language using synthetic Tait computability and a novel form
    of the $\top\top$-lifting technique.
