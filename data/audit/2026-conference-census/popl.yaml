- title: 'Di- is for Directed: First-Order Directed Type Theory via Dinaturality'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776703
  official_record_id: a6d2e7c5-261b-4ba6-81e1-31e744668479
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We show how dinaturality plays a central role in the interpretation of directed type theory where types are given
    by (1-)categories and directed equality by hom-functors. We introduce a first-order directed type theory where types are
    semantically interpreted as categories, terms as functors, predicates as dipresheaves, and proof-relevant entailments
    as dinatural transformation. This type theory is equipped with an elimination principle for directed equality, motivated
    by dinaturality, which closely resembles the J-rule used in Martin-Löf type theory. This directed J-rule comes with a
    simple syntactic restriction which recovers all theorems about symmetric equality, except for symmetry. Dinaturality is
    used to prove properties about transitivity (composition), congruence (functoriality), and transport (coYoneda) in exactly
    the same way as in Martin-Löf type theory, and allows us to obtain an internal "naturality for free". We then argue that
    the quantifiers of directed type theory should be ends and coends, which dinaturality allows us to capture formally. Our
    type theory provides a formal treatment to (co)end calculus and Yoneda reductions, which we use to give distinctly logical
    proofs to the (co)Yoneda lemma, the adjointness property of Kan extensions via (co)ends, exponential objects of presheaves,
    and the Fubini rule for quantifier exchange. Our main theorems are formalized in Agda.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/63/Di-is-for-Directed-First-Order-Directed-Type-Theory-via-Dinaturality
