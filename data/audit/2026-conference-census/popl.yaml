  official_record_id: 5c3ae101-8b79-4b79-a8a2-e8a5b7cf57ba
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'Differential privacy is a formal definition of privacy that bounds the maximum acceptable information leakage
    when a query is performed on sensitive data. To ensure this property, a key technique involves bounding the query’s sensitivity
    (how much input variations affect the output) and adding noise to the result according to this quantity. While prior work
    like the Fuzz type system focuses on global sensitivity, many useful queries have infinite global sensitivity, restricting
    the scope of such approaches. This limitation can be addressed by considering a more fine-grained measure: local sensitivity,
    which quantifies output change for inputs adjacent to a specific dataset. In this article, we introduce Local Fuzz, a
    type system with dependent coeffects designed to bound the local sensitivity of programs written in a simple functional
    language. We provide a denotational semantics for this system in the category of extended premetric spaces, leveraging
    the recently introduced construction of a dependently graded comonad. Finally, we illustrate how Local Fuzz can lead to
    better differential privacy guarantees than Fuzz, both for mechanisms that rely on global sensitivity and for those that
    leverage local sensitivity, such as the Propose-Test-Release framework.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/30/Dependent-Coeffects-for-Local-Sensitivity-Analysis
