- title: Abstraction Functions as Types
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776673
  official_record_id: db100bb8-5d05-4ef8-a677-fca9601865d9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Software development depends on the use of libraries whose public specifications inform client code and impose
    obligations on private implementations; it follows that verification at scale must also be modular, preserving such abstraction.
    Hoare's influential methodology uses abstraction functions to demonstrate the coherence between such concrete implementations
    and their abstract specifications. However, the Hoare methodology relies on a conventional separation between implementation
    and specification, providing no linguistic support for ensuring that this convention is obeyed. This paper proposes a
    synthetic account of Hoare's methodology within univalent dependent type theory by encoding the data of abstraction functions
    within types themselves. This is achieved via a phase distinction, which gives rise to a gluing construction that renders
    an abstraction function as a type and a pair of modalities that fracture a type into its concrete and abstract parts.
    A noninterference theorem governing the phase distinction characterizes the modularity guarantees provided by the theory.
    This approach scales to verification of cost, allowing the analysis of client cost relative to a cost-aware specification.
    A monadic sealing effect facilitates modularity of cost, permitting an implementation to be upper-bounded by its specification
    in cases where private details influence observable cost. The resulting theory supports modular development of programs
    and proofs in a manner that hides private details of no concern to clients while permitting precise specifications of
    both the cost and behavior of programs.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/33/Abstraction-Functions-as-Types
