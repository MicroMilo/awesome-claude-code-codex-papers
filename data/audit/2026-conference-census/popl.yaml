- title: A Logic for the Imprecision of Abstract Interpretations
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776707
  official_record_id: ffe1b01b-4aba-4fad-b710-6854d5475276
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: In numerical analysis, error propagation refers to how small inaccuracies in input data or intermediate computations
    accumulate and affect the final result, typically governed by the stability and sensitivity of the algorithm with respect
    to some perturbations. The definition of a similar concept in approximated program analysis is still a challenge. In abstract
    interpretation, inaccuracy arises from the abstraction itself, and the propagation of this error is dictated by the abstract
    interpreter. In most cases, such imprecision is inevitable. In this paper we introduce a logic for deriving (upper) bounds
    on the inaccuracy of an abstract interpretation. We are able to derive a function that bounds the imprecision of the result
    of an abstract interpreter from the imprecision of its input data. When this holds we have what we call partial local
    completeness of the abstract interpreter, a weaker form of completeness known in the literature. To this end, we introduce
    the notion of a \emph{generator} for a property represented in the abstract domain. Generators allow us to restrict the
    search space when verifying whether the bounding function holds for a given program and input. We then introduce a program
    logic, called \emph{Error Propagation Logic} (\emph{EPL}), for propagating the error bounds produced by an abstract interpretation.
    This logic is a combination of correctness and incorrectness logics and a logic for \emph{program $\omega$-continuity}
    that is also introduced in this paper.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/67/A-Logic-for-the-Imprecision-of-Abstract-Interpretations
