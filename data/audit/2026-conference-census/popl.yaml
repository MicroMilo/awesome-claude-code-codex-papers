- title: Fuzzing Guided by Bayesian Program Analysis
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776659
  official_record_id: d1a35ffc-207a-46d0-9a35-d9a50f112780
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: We propose a novel approach that leverages Bayesian program analysis to guide large-scale target-guided greybox
    fuzzing (LTGF). LTGF prioritizes program locations (targets) that are likely to contain bugs and applies directed mutation
    towards high-priority targets. However, existing LTGF approaches suffer from coarse and heuristic target prioritization
    strategies, and lack a systematic design to fully exploit feedback from the fuzzing process. We systematically define
    this prioritization process as the reachable fuzzing targets problem. Bayesian program analysis attaches probabilities
    to analysis rules and transforms the analysis results into a Bayesian model. By redefining the semantics of Bayesian program
    analysis, we enable the prediction of whether each target is reachable by the fuzzer, and dynamically adjust the predictions
    based on fuzzer feedback. On the one hand, Bayesian program analysis builds Bayesian models based on program semantics,
    enabling systematic and fine-grained prioritization. On the other hand, Bayesian program analysis systematically learns
    feedback from the fuzzing process, making its guidance adaptive. Moreover, this combination extends the application of
    Bayesian program analysis from alarm ranking to fully automated bug discovery. We implement our approach and evaluate
    it against several state-of-the-art fuzzers. On a suite of real-world programs, our approach discovers $3.25 \times$ to
    $13 \times$ more unique bugs compared to baselines. In addition, our approach identifies 39 previously unknown bugs in
    well-tested programs, 30 of which have been assigned CVEs.
