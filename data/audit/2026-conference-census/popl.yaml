- title: Recurrence Sets for Proving Fair Non-termination under Axiomatic Memory Consistency Models
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776687
  official_record_id: 4b365656-1970-4362-b4c2-ed48c7e352c9
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Recurrence sets characterize non-termination in sequential programs. We present a generalization of recurrence
    sets to concurrent programs that run on weak memory models. Sequential programs have operational semantics in terms of
    states and transitions, and classical recurrence sets are defined as sets of states that are existentially closed under
    transitions. Concurrent programs have axiomatic semantics in terms of executions, and our new recurrence sets are defined
    as sets of executions that are existentially closed under extensions. The semantics of concurrent programs is not only
    affected by the memory model, but also by fairness assumptions about its environment, be it the scheduler or the memory
    subsystems. Our new recurrence sets are formulated relative to such fairness assumptions. We show that our recurrence
    sets are sound for proving fair non-termination on all practical memory models, and even complete on many. To turn our
    theory into practice, we develop a new automated technique for proving fair non-termination in concurrent programs on
    weak memory models. At the heart of this technique is a finite representation of recurrence sets in terms of execution-based
    lassos. We implemented a lasso-finding algorithm in Dartagnan, and evaluated it on a number of programs running under
    CPU and GPU memory models.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/47/Recurrence-Sets-for-Proving-Fair-Non-termination-under-Axiomatic-Memory-Consistency-M
