- title: A Verified High-Performance Composable Object Library for Remote Direct Memory Access
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776713
  official_record_id: 14ce8f12-9267-43c6-b257-4d8d708aeefc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Remote Direct Memory Access (RDMA) is a memory technology that allows remote devices to directly write to and
    read from each other's memory, bypassing components such as the CPU and operating system. This enables low-latency high-throughput
    networking, as required for many modern data centres, HPC applications and AI/ML workloads. However, baseline RDMA comprises
    a highly permissive weak memory model that is difficult to use in practice and has only recently been formalised. In this
    paper, we introduce the Library of Composable Objects (LOCO), a formally verified library for building multi-node objects
    on RDMA, filling the gap between shared memory and distributed system programming. LOCO objects are well-encapsulated
    and take advantage of the strong locality and the weak consistency characteristics of RDMA. They have performance comparable
    to custom RDMA systems (e.g. distributed maps), but with a far simpler programming model amenable to formal proofs of
    correctness. To support verification, we develop a novel modular declarative verification framework, called Mowgli, that
    is flexible enough to model multinode objects and is independent of a memory consistency model. We instantiate Mowgli
    with the RDMA memory model, and use it to verify correctness of LOCO libraries.
