- title: Quantum Circuits Are Just a Phase
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776731
  official_record_id: cb8ca94e-2002-4498-8dcc-7de4edfd26fe
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Quantum programs today are written at a low level of abstraction - quantum circuits akin to assembly languages
    - and the unitary parts of even advanced quantum programming languages essentially function as circuit description languages.
    This state of affairs impedes scalability, clarity, and support for higher-level reasoning. More abstract and expressive
    quantum programming constructs are needed. To this end, we introduce a simple syntax for generating unitaries from "just
    a phase"; we combine a (global) phase operation that captures phase shifts with a quantum analogue of the "if let" construct
    that captures subspace selection via pattern matching. This minimal language lifts the focus from gates to eigendecomposition,
    conjugation, and controlled unitaries; common building blocks in quantum algorithm design. We demonstrate several aspects
    of the expressive power of our language in several ways. Firstly, we establish that our representation is universal by
    deriving a universal quantum gate set. Secondly, we show that important quantum algorithms can be expressed naturally
    and concisely, including Grover's search algorithm, Hamiltonian simulation, Quantum Fourier Transform, Quantum Signal
    Processing, and the Quantum Eigenvalue Transformation. Furthermore, we give clean denotational semantics grounded in categorical
    quantum mechanics. Finally, we implement a prototype compiler that efficiently translates terms of our language to quantum
    circuits, and prove that it is sound with respect to these semantics. Collectively, these contributions show that this
    construct offers a principled and practical step toward more abstract and structured quantum programming.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/91/Quantum-Circuits-Are-Just-a-Phase
