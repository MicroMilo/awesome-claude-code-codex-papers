- title: Inductive Program Synthesis by Meta-Analysis-Guided Hole Filling
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776694
  official_record_id: e10e5320-08e6-44a2-bfc8-e96b4cadf2bc
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'A popular approach to inductive program synthesis is to construct a target program via top-down search, starting
    from an incomplete program with holes and gradually filling these holes until a solution is found. During the search,
    abstraction-based pruning is used to eliminate infeasible candidate programs, significantly reducing the search space.
    Because of this pruning, the order in which holes are filled can drastically affect search efficiency: a wise choice can
    prune large swaths of the search space early, while a poor choice might explore many dead-ends. However, the choice of
    hole-filling order is largely unattended in program synthesis literature. In this paper, we propose a novel hole-filling
    strategy that leverages abstract interpretation to guide the order of hole-filling in program synthesis. Our approach
    overapproximates the behavior of the underlying abstract interpreter for pruning, enabling it to predict the most promising
    hole to fill next. We instantiate our approach to the domains of bitvectors and strings, which are commonly used in program
    synthesis tasks. We evaluate our approach on a set of benchmarks from the prior work, including SyGuS benchmarks, and
    show that it significantly outperforms the state-of-the-art approaches in terms of efficiency thanks to the abstract abstract
    interpretation techniques.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/54/Inductive-Program-Synthesis-by-Meta-Analysis-Guided-Hole-Filling
