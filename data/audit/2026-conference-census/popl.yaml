- title: 'U-Turn: Enhancing Incorrectness Analysis by Reversing Direction'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776688
  official_record_id: aaf8c33f-4f37-4e3d-be61-347d6ecbc005
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'O''Hearn''s Incorrectness Logic (IL) has sparked renewed interest in static analyses that aim to detect program
    errors rather than prove their absence, thereby avoiding false alarms—a critical factor for practical adoption in industrial
    settings. As new incorrectness logics emerge to capture diverse error-related properties, a key question arises: can combining
    correctness and incorrectness techniques enhance precision, expressiveness, automation, or scalability? Notable frameworks,
    such as outcome logic, UNTer, local completeness logic, and exact separation logic, unify multiple analyses within a single
    proof system. In this work, we adopt a complementary strategy. Rather than designing a unified logic, we combine IL, which
    identifies reachable error states, with Sufficient Incorrectness Logic (SIL), which finds input states potentially leading
    to those errors. As a result, we get a more informative and effective analysis than either logic in isolation. Rather
    than sequencing them, our key innovation is reusing heuristic choices from the first analysis to steer the second. In
    fact, both IL and SIL rely on under-approximation and thus their automation legitimizes heuristics that avoid exhaustive
    path enumeration (e.g., selective disjunct pruning, loop unrolling). Concretely, we instrument the proof rules of the
    second logic with derivations from the first to inductively guide rule selection and application. To our knowledge, this
    is the first rule format enabling such inter-analysis instrumentation. This combined analysis aids debugging and testing
    by revealing both reachable errors and their causes, and opens new avenues for embedding incorrectness insights into scalable,
    expressive, automated code contracts.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/48/U-Turn-Enhancing-Incorrectness-Analysis-by-Reversing-Direction
