- title: A Lazy, Concurrent Convertibility Checker
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776695
  official_record_id: 3490224e-b91b-4793-94c4-3151923df2cb
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Convertibility checking — determining whether two lambda-terms are equal up to reductions — is a crucial component
    of proof assistants and dependently-typed languages. Practical implementations often use heuristics to quickly conclude
    that two terms are convertible, or are not convertible, without reducing them to normal form. However, these heuristics
    can backfire, triggering huge amounts of unnecessary computation. This paper presents a novel convertibility-checking
    algorithm that relies crucially on laziness and concurrency. Laziness is used to share computations, while concurrency
    is used to explore multiple convertibility subproblems in parallel or via fair interleaving. Unlike heuristics-based approaches,
    our algorithm always finds an easy solution to the convertibility problem, if one exists. The paper describes the algorithm
    in process calculus style, discusses its complexity, and reports on its mechanized proof of partial correctness and its
    lightweight experimental evaluation.
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/55/A-Lazy-Concurrent-Convertibility-Checker
