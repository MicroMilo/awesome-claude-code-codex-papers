- title: 'Separating the Wheat from the Chaff: Understanding (In-)Completeness of Proof Mechanisms for Separation Logic with
    Inductive Definitions'
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776671
  official_record_id: adcc9ef3-cf34-4b66-bf54-cd78df4e5539
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'For over two decades Separation Logic has enjoyed its unique position as arguably the most popular framework
    for reasoning about heap-manipulating programs, as well as reasoning about shared resources and permissions. Separation
    Logic is often extended to include inductively-defined predicates, interpreted as least fixpoints, to form what is known
    as Separation Logic with Inductive Definitions (SLID). These inductive predicates are used to describe unbounded data-structures
    in the heap and to verify key properties thereof. Many theoretical and practical advances have been made in developing
    automated proof mechanisms for SLID, but by their very nature these mechanisms are imperfect, and a deeper understanding
    of their failures is desired. As expressive as Separation Logic is, it is not surprising that it is incomplete: there
    is no procedure that will provide a proof for all valid entailments in Separation Logic. In fact, at its very core, Separation
    Logic contains several sources of incompleteness that defy automated reasoning. In this paper we study these sources of
    incompleteness and how they relate to failures of proof mechanisms of SLID. We contextualize SLID within a larger, relaxed
    logic, that we call Weak Separation Logic (WSL). We prove that unlike SLID, WSL enjoys completeness for a non-trivial
    fragment of quantified entailments with background theories and inductive definitions, via a reduction to first-order
    logic (FOL). Moreover, we show that the ubiquitous fold/unfold proof mechanism, which is unsurprisingly incomplete for
    SLID, does constitute a sound and complete proof mechanism of WSL, for theory-free, quantifier-free entailments with inductive
    definitions. In some sense, this shows that WSL is the natural logic of such proof mechanisms. Through this contextualization
    of SLID within WSL, we understand proof failures as stemming from rogue, nonstandard models, that exist within the class
    of models considered by WSL, but do not adhere to the stricter requirements of SLID. These rogue models are typically
    infinite, and we use the recently proposed formalism of symbolic structures to represent and automatically find them.
    We present a prototype tool that implements the encoding of WSL to FOL and test it on an existing benchmark, which contains
    over 700 quantified entailment problems with inductive definitions, a third of which also contain background theories.
    Our tool is able to find counter-models to many of the examples, and we provide a partial taxonomy of the rogue models,
    shedding some light on real-world proof failures.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/31/Separating-the-Wheat-from-the-Chaff-Understanding-In-Completeness-of-Proof-Mechani
