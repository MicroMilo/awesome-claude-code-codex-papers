- title: (TOPLAS) Will it Fit? Verifying Heap Space Bounds of Concurrent Programs under Garbage Collection
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3716312
  official_record_id: 490ea2b4-1108-4512-8383-d6545dc54463
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'We present IrisFit, a Separation Logic with space credits for reasoning about heap space in a concurrent call-by-value
    language equipped with tracing garbage collection and shared mutable state. We point out a fundamental difficulty in the
    analysis of the worst-case heap space complexity of concurrent programs in the presence of tracing garbage collection:
    If garbage collection phases and program steps can be arbitrarily interleaved, then there exist undesirable scenarios
    where a root held by a sleeping thread prevents a possibly large amount of memory from being freed. To remedy this problem
    and eliminate such undesirable scenarios, we propose several language features, namely possibly-blocking memory allocation,
    polling points, and protected sections. Polling points are meant to be automatically inserted by the compiler; protected
    sections are delimited by the programmer and represent regions where no polling points must be inserted. The heart of
    our contribution is IrisFit, a novel program logic that can establish worst-case heap space complexity bounds and whose
    reasoning rules can take advantage of the presence of protected sections. IrisFit is formalized inside the Coq proof assistant,
    on top of the Iris Separation Logic framework. We prove that IrisFit offers both a safety guarantee—programs cannot crash
    and cannot exceed a heap space limit—and a liveness guarantee—provided enough polling points have been inserted, every
    memory allocation request is satisfied in bounded time. We illustrate the use of IrisFit via several case studies, including
    a version of Treiber’s stack whose worst-case behavior relies on the presence of protected sections.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/94/-TOPLAS-Will-it-Fit-Verifying-Heap-Space-Bounds-of-Concurrent-Programs-under-Garba
