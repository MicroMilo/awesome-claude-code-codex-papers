- title: Optimising Density Computations in Probabilistic Programs via Automatic Loop Vectorisation
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776663
  official_record_id: 24aa2a6c-dfaa-4500-b9e5-b2c538d40135
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Probabilistic programming languages (PPLs) are a popular tool for high-level modelling across many fields. They
    provide a range of algorithms for probabilistic inference, which analyse models by learning their parameters from a dataset
    or estimating their posterior distributions. However, probabilistic inference is known to be very costly. One of the bottlenecks
    of probabilistic inference stems from the iteration over entries of a large dataset or a long series of random samples.
    Vectorisation can mitigate this cost, but manual vectorisation is error-prone, and existing automatic techniques are often
    ad-hoc and limited, unable to handle general repetition structures, such as nested loops and loops with data-dependent
    control flow, without significant user intervention. To address this bottleneck, we propose a sound and effective method
    for automatically vectorising loops in probabilistic programs. Our method achieves high throughput using speculative parallel
    execution of loop iterations, while preserving the semantics of the original loop through a fixed-point check. We formalise
    our method as a translation from an imperative PPL into a lower-level target language with primitives geared towards vectorisation.
    We implemented our method for the Pyro PPL and evaluated it on a range of probabilistic models. Our experiments show significant
    performance gains against an existing vectorisation baseline, achieving $1.1$–$6\times$ speedups and reducing GPU memory
    usage in many cases. Unlike the baseline, which is limited to a subset of models, our method effectively handled all the
    tested models.
