- title: Arbitration-Free Consistency Is Available (and Vice Versa)
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776683
  official_record_id: 9751292e-5d99-47fb-847d-18992a42431c
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: 'The fundamental tension between availability and consistency shapes the design of distributed storage systems.
    Classical results capture extreme points of this trade-off: the CAP theorem shows that strong models like linearizability
    preclude availability under partitions, while weak models like causal consistency remain implementable without coordination.
    These theorems apply to simple read-write interfaces, leaving open a precise explanation of the combinations of object
    semantics and consistency models that admit available implementations. This paper develops a general semantic framework
    in which storage specifications combine operation semantics and consistency models. The framework encompasses a broad
    range of objects (key-value stores, counters, sets, CRDTs, and SQL databases) and consistency models (from causal consistency
    and sequential consistency to snapshot isolation and bounded staleness). Within this framework, we prove the Arbitration-Free
    Consistency (AFC) theorem, showing that an object specification within a consistency model admits an available implementation
    if and only if it is arbitration-free, that is, it does not require a total arbitration order to resolve visibility or
    read dependencies. The AFC theorem unifies and generalizes previous results, revealing arbitration-freedom as the fundamental
    property that delineates coordination-free consistency from inherently synchronized behavior.'
  abstract_source_url: https://popl26.sigplan.org/details/POPL-2026-popl-research-papers/43/Arbitration-Free-Consistency-Is-Available-and-Vice-Versa-
