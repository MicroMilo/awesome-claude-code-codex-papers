- title: Foundational Multi-Modal Program Verifiers
  official_url: https://conf.researchr.org/track/POPL-2026/POPL-2026-popl-research-papers
  track: POPL
  disposition: excluded
  disposition_reason: No high-recall coding-agent, code, software-engineering, or language-model combination found in title
    or abstract. Decision used an identity-verified OpenAlex abstract for the official conference DOI; no PDF was requested.
  full_text_scan: metadata-filtered
  doi_url: https://doi.org/10.1145/3776719
  official_record_id: 69d4f7df-425d-475f-acb4-05b8417d8772
  abstract_status: fetched
  abstract_reason: Official abstract fetched.
  abstract: Multi-modal program verification is a process of validating code against its specification using both dynamic
    and symbolic techniques, and proving its correctness by a combination of automated and interactive machine-assisted tools.
    In order to be trustworthy, such verification tools must themselves come with formal soundness proofs, establishing that
    any program verified in them against a certain specification does not violate the specification's statement when executed.
    Verification tools that are proven sound in a general-purpose proof assistant with a small trusted core are commonly referred
    to as foundational. We present a framework that facilitates and streamlines construction of program verifiers that are
    both foundational and multi-modal. Our approach adopts the well-known idea of monadic shallow embedding of an executable
    program semantics into the programming language of a theorem prover based on higher-order logic, in our case, the Lean
    proof assistant. We provide a library of monad transformers for such semantics, encoding a variety of computational effects,
    including state, divergence, exceptions, and non-determinism. The key theoretical innovation of our work are monad transformer
    algebras that enable automated derivation of the respective sound verification condition generators. We show that proofs
    of the resulting verification conditions enjoy automation using off-the-shelf SMT solvers and allow for an interactive
    proof mode when automation fails. To demonstrate versatility of our framework, we instantiated it to embed two foundational
    multi-modal verifiers into Lean for reasoning about (1) distributed protocol safety and (2) Dafny-style specifications
    of imperative programs, and used them to mechanically verify a number of non-trivial case studies.
