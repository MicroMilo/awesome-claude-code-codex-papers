name: Discover paper candidates

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install catalog dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Discover recent candidates
        id: discover
        run: python scripts/discover_candidates.py --output candidate-report.md --github-output
      - name: Create or update candidate issue
        if: steps.discover.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(gh issue list --state open --label paper-candidate --search 'Weekly paper candidates in:title' --json number --jq '.[0].number')"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file candidate-report.md
          else
            gh issue create --title "Weekly paper candidates" --label paper-candidate --body-file candidate-report.md
          fi
