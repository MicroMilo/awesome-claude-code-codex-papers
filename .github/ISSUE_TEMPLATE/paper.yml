name: Suggest a paper
description: Suggest a paper that evaluates, analyzes, or improves a production coding agent.
title: "[Paper]: "
labels: [paper-candidate]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Primary-source URL
      description: Official conference record, proceedings, DOI, publisher, or conference OpenReview URL. Preprints alone are not eligible.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Proposed system or benchmark name
      description: For example, QLCoder, ZeroRepo, or Terminal-Bench 2.0.
    validations:
      required: true
  - type: dropdown
    id: products
    attributes:
      label: Products studied
      multiple: true
      options:
        - Claude Code
        - Codex CLI
    validations:
      required: true
  - type: dropdown
    id: conference
    attributes:
      label: Conference
      description: Choose the verified 2026 conference series. If acceptance cannot be verified, do not submit the paper yet.
      options:
        - AAAI
        - ASE
        - FSE
        - ICLR
        - ICML
        - ICSE
        - ISSTA
        - NeurIPS
        - IJCAI
        - KDD
        - PLDI
        - POPL
        - OOPSLA
        - Other
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Exact venue or track
      description: For example, ISSTA Research Papers, ICLR Conference, or PLDI Research Papers.
    validations:
      required: true
  - type: dropdown
    id: domains
    attributes:
      label: Research domains
      multiple: true
      options:
        - Software engineering
        - Security
        - Systems and performance
        - Machine learning
        - Scientific computing
        - Formal methods
        - Web and UI
        - Documents
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Suggested evidence class
      options:
        - Direct comparison
        - Related method
        - Evaluation only
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Baseline and result evidence
      description: Give table, figure, section, or appendix locations and paraphrase the result. Include model and budget details when available.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Product configuration
      description: Product/CLI version, model snapshot, reasoning mode, tool permissions, time/turn/token budget, and number of runs. Use "not reported" when needed.
    validations:
      required: true
  - type: input
    id: artifact_url
    attributes:
      label: Artifact URL
      description: Optional official code, data, or reproduction repository.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I linked a primary research source rather than a blog summary.
          required: true
        - label: I verified that this is a formally accepted 2026 conference paper, not an arXiv-only preprint.
          required: true
        - label: The paper studies the product agent, not only a model from the same vendor.
          required: true
